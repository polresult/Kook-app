<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0876e8"><title>Kook</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><style>
:root{--b:#0876e8;--bg:#f4f6f8;--tx:#101828;--mu:#667085;--ln:#e6ebf0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:82px}header{padding:22px 18px 8px;background:#fff;position:sticky;top:0;z-index:4}h1{font-size:27px;margin:0}.sub,.meta{color:var(--mu);font-size:14px}.filters{display:flex;gap:7px;overflow:auto;padding:10px 16px}.filters.toggles{padding-top:0}.chip,.btn{border:0;border-radius:22px;padding:10px 14px;font-weight:650;white-space:nowrap}.chip{background:#eef2f6}.chip.on,.primary{background:var(--b);color:white}.soft{background:#eaf3ff;color:#0563c8}.danger{background:#fff0f0;color:#c73535}main{padding:0 14px}.page{display:none}.page.on{display:block}.card{border:1px solid var(--ln);border-radius:17px;overflow:hidden;margin-bottom:12px;background:#fff;box-shadow:0 3px 10px #1018280a}.pic{height:128px;display:flex;align-items:center;justify-content:center;font-size:62px;background:linear-gradient(135deg,#fff5e8,#edf7ee)}.pad{padding:13px}.title{font-weight:800;font-size:18px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}.small{padding:9px 12px;border-radius:11px}.section{font-size:18px;font-weight:800;margin:19px 0 8px}.day,.item{border-bottom:1px solid var(--ln);padding:13px 2px}.empty{text-align:center;color:var(--mu);padding:42px 16px}.portion{display:flex;align-items:center;gap:10px}.portion button{width:34px;height:34px;border:0;border-radius:50%;font-size:19px}.check{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--ln);align-items:center}.check input{width:21px;height:21px}.done{opacity:.42;text-decoration:line-through}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:70px;background:#fff;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);z-index:8}nav button{border:0;background:#fff;color:#7b8794;font-size:11px}nav span{display:block;font-size:21px}nav .on{color:var(--b)}.recipe{padding:14px}.recipe .pic{height:225px;border-radius:18px}.back{border:0;border-radius:50%;width:38px;height:38px;font-size:18px}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.rating button{border:1px solid var(--ln);background:#fff;border-radius:13px;padding:12px 3px;font-size:22px}.rating small{display:block;font-size:10px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 15px;border-radius:20px;display:none;z-index:20}.prefs{padding:12px;border:1px solid var(--ln);border-radius:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{text-align:center;background:#f5f8fb;padding:10px;border-radius:12px}.stat b{display:block;font-size:20px}
.pic{height:180px;padding:0;position:relative}.photo-caption{position:absolute;left:10px;right:10px;bottom:14px;color:#fff;font:italic 20px Georgia,serif;text-align:center;text-shadow:0 1px 5px #000,0 0 12px #0008;pointer-events:none}.pic img{display:block;width:100%;height:100%;object-fit:cover}.photo-button{display:block;width:100%;border:0;cursor:pointer}.photo-credit{font-size:11px;color:var(--mu);margin:7px 0 12px}.photo-credit a{color:inherit}</style></head><body><div class="app"><header id="head"><h1 id="heading">Kook</h1><div class="sub" id="subtitle">Lekker, makkelijk en gevarieerd</div></header><div id="filters"><div class="filters"><button class="chip" data-f="Vegetarisch">Vegetarisch</button><button class="chip" data-f="Vlees">Vlees</button><button class="chip" data-f="Vis">Vis</button><button class="chip" data-f="Voor">Voor</button><button class="chip" data-f="Hoofd">Hoofd</button><button class="chip" data-f="Na">Na</button></div><div class="filters toggles"><button class="chip" data-t="Snel">≤ 25 min</button><button class="chip" data-t="Seizoen">🍂 Seizoen</button></div></div><main><section id="discover" class="page on"><input id="search" oninput="doSearch()" placeholder="Zoek op gerecht, keuken, ingrediënt of kanaal" style="width:100%;margin:8px 0 4px;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;font-size:16px"><div id="suggest"></div><div id="cards"></div></section><section id="week" class="page"><div class="row" style="margin:10px 0"><button class="btn primary" onclick="makeWeek()">✨ Maak mijn week</button><button class="btn soft" onclick="surprise()">Verras mij</button></div><div class="prefs"><div class="row between"><b>Personen</b><div class="portion"><button onclick="persons(-1)">−</button><b id="pc">2</b><button onclick="persons(1)">+</button></div></div></div><div id="weekList"></div></section><section id="shop" class="page"><div class="row between"><div class="section">Boodschappenlijst</div><button class="btn soft small" onclick="clearChecked()">Wis gekocht</button></div><div id="shopping"></div></section><section id="favorites" class="page"><div id="profile"></div><div id="fav"></div><div class="meta" style="text-align:center;margin:28px 0 8px;font-size:12px">Kook versie 4.8.1</div></section><section id="login" class="page"><div class="recipe" style="padding-top:28px"><h2 style="margin:0 0 6px">Wie ben jij?</h2><div class="meta">Log in met je naam en pincode. Nieuw hier? Kies een naam en een pincode van 4 cijfers en tik op Nieuwe gebruiker.</div><input id="lname" placeholder="Naam" autocomplete="username" autocapitalize="words" style="width:100%;margin:8px 0 4px;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;font-size:16px"><input id="lpin" type="password" inputmode="numeric" pattern="[0-9]*" placeholder="Pincode" autocomplete="current-password" style="width:100%;margin:8px 0 4px;padding:13px 14px;border:1px solid var(--ln);border-radius:14px;font-size:16px" onkeydown="if(event.key==='Enter')login('login')"><div id="lerr" class="meta" style="color:#d92d20;min-height:20px;margin:4px 0 8px"></div><button class="btn primary" style="width:100%" onclick="login('login')">Inloggen</button><button class="btn soft" style="width:100%;margin-top:10px" onclick="login('register')">Nieuwe gebruiker</button></div></section><section id="detail" class="page"></section></main><nav id="nav"><button class="on" data-p="discover"><span>◉</span>Ontdekken</button><button data-p="week"><span>▣</span>Mijn week</button><button data-p="shop"><span>🛒</span>Boodschappen</button><button data-p="favorites"><span>♡</span>Voor jou</button></nav><div id="toast" class="toast"></div></div><script>
const R=[{"id":1,"name":"Romige tomatenpasta met burrata","type":"Vegetarisch","time":25,"emoji":"🍝","cuisine":"Italiaans","ingredients":[["pasta","100","g"],["burrata","0.5","bol"],["cherrytomaten","125","g"],["knoflook","1","teen"],["basilicum","0.5","bosje"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de pasta volgens de verpakking beetgaar (meestal 9 tot 11 minuten). Bewaar een kopje kookvocht.","Halveer intussen de cherrytomaten en snijd de knoflook fijn.","Verhit 2 eetlepels olijfolie in een koekenpan op middelhoog vuur. Bak de knoflook 1 minuut, voeg de tomaten toe en bak 6 tot 8 minuten tot ze zacht worden en openbarsten. Druk ze licht plat met een lepel.","Schep de pasta met een scheutje kookvocht door de tomaten en laat 1 minuut pruttelen tot de saus romig aan de pasta hangt.","Verdeel over de borden, scheur de burrata erboven en maak af met basilicum, peper en zout."]},{"id":2,"name":"Kip teriyaki met broccoli","type":"Vlees","time":30,"emoji":"🍗","cuisine":"Aziatisch","ingredients":[["kipfilet","150","g"],["rijst","80","g"],["broccoli","0.5","stronk"],["paprika","0.5","stuk"],["teriyakisaus","2","el"]],"steps":["Kook de rijst volgens de verpakking (ongeveer 12 minuten) en laat afgedekt staan.","Snijd de kipfilet in blokjes, de broccoli in kleine roosjes en de paprika in reepjes.","Verhit 1 eetlepel olie in een wok op hoog vuur. Bak de kip 5 tot 6 minuten tot hij goudbruin en gaar is. Haal uit de pan.","Voeg de broccoli en paprika toe met een scheutje water en roerbak 5 minuten tot de broccoli beetgaar is.","Doe de kip terug, giet de teriyakisaus erbij en laat 1 tot 2 minuten pruttelen tot de saus glanst en aan de kip hangt.","Serveer op de rijst."]},{"id":3,"name":"Kabeljauw met krieltjes en citroen","type":"Vis","time":35,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["kabeljauwfilet","150","g"],["krieltjes","250","g"],["courgette","0.5","stuk"],["citroen","0.5","stuk"],["dille","0.5","bosje"]],"steps":["Verwarm de oven voor op 200°C.","Halveer de krieltjes, meng ze op een bakplaat met olijfolie, zout en peper en rooster ze 15 minuten.","Snijd de courgette intussen in halve plakken en de citroen in dunne schijfjes. Dep de kabeljauw droog en bestrooi met zout en peper.","Schep de courgette door de krieltjes, leg de kabeljauw erbovenop met de citroenschijfjes erop en besprenkel met olie.","Bak nog 12 tot 15 minuten tot de vis ondoorzichtig is en makkelijk uiteenvalt.","Bestrooi met fijngehakte dille en serveer."]},{"id":4,"name":"Groene curry met tofu","type":"Vegetarisch","time":30,"emoji":"🥘","cuisine":"Aziatisch","ingredients":[["tofu","125","g"],["kokosmelk","200","ml"],["groene currypasta","1","el"],["sperziebonen","100","g"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking.","Dep de tofu droog, snijd in blokjes en bak in 2 eetlepels olie op hoog vuur 8 minuten tot alle kanten goudbruin en krokant zijn. Haal uit de pan.","Maak de sperziebonen schoon en halveer ze.","Bak de currypasta 1 minuut in dezelfde pan tot hij geurt. Giet de kokosmelk erbij en roer glad.","Voeg de sperziebonen toe en laat 10 tot 12 minuten zachtjes koken tot ze beetgaar zijn.","Schep de tofu erdoor, warm 1 minuut mee en serveer met de rijst."]},{"id":5,"name":"Taco's met gekruid gehakt","type":"Vlees","time":25,"emoji":"🌮","cuisine":"Mexicaans","ingredients":[["rundergehakt","150","g"],["tacoschelpen","4","stuk"],["tomaat","1","stuk"],["sla","0.25","krop"],["crème fraîche","60","ml"]],"steps":["Verwarm de oven voor op 180°C.","Verhit een koekenpan op hoog vuur en bak het gehakt 6 tot 8 minuten rul en bruin. Kruid met tacokruiden (of komijn, paprikapoeder, chilipoeder en zout), voeg een scheutje water toe en laat 2 minuten pruttelen.","Verwarm de tacoschelpen intussen 4 tot 5 minuten in de oven.","Snijd de tomaat in blokjes en de sla in reepjes.","Vul de schelpen met gehakt, sla en tomaat en schep er crème fraîche op."]},{"id":6,"name":"Zalm met honing-mosterd","type":"Vis","time":30,"emoji":"🍣","cuisine":"Europees","ingredients":[["zalmfilet","150","g"],["aardappeltjes","250","g"],["broccoli","0.5","stronk"],["honing","0.5","el"],["mosterd","0.5","el"]],"steps":["Verwarm de oven voor op 200°C.","Halveer de aardappeltjes en snijd de broccoli in roosjes. Meng op een bakplaat met olie, zout en peper en rooster 15 minuten.","Roer intussen honing en mosterd met een snuf zout tot een glazuur. Dep de zalm droog en bestrijk hem ermee.","Leg de zalm tussen de groenten op de plaat en bak nog 12 tot 14 minuten tot de zalm net gaar is. In het midden mag hij nog licht roze zijn.","Serveer direct."]},{"id":7,"name":"Paddenstoelenrisotto","type":"Vegetarisch","time":35,"emoji":"🍄","cuisine":"Italiaans","ingredients":[["risottorijst","90","g"],["paddenstoelen","150","g"],["parmezaan","25","g"],["ui","0.5","stuk"],["groentebouillon","350","ml"]],"steps":["Breng de bouillon aan de kook en houd hem tegen de kook aan.","Snipper de ui en snijd de paddenstoelen in plakjes.","Verhit olie of boter in een ruime pan en bak de paddenstoelen op hoog vuur 5 minuten bruin. Schep de helft uit de pan en bewaar.","Zet het vuur lager, voeg de ui toe en fruit 3 minuten glazig. Voeg de rijst toe en roer 1 minuut tot de korrels glanzen.","Voeg steeds een soeplepel hete bouillon toe en roer tot die bijna is opgenomen voordat je de volgende toevoegt. Dit duurt 18 tot 20 minuten. De rijst is klaar als hij romig is met nog een lichte bite.","Haal van het vuur, roer de parmezaan en een klontje boter erdoor en laat 2 minuten afgedekt staan. Serveer met de bewaarde paddenstoelen erop."]},{"id":8,"name":"Kip fajita bowl","type":"Vlees","time":25,"emoji":"🥗","cuisine":"Mexicaans","ingredients":[["kipfilet","150","g"],["rijst","80","g"],["paprika","1","stuk"],["mais","75","g"],["avocado","0.5","stuk"]],"steps":["Kook de rijst volgens de verpakking.","Snijd de kipfilet in reepjes en de paprika in dunne repen. Meng de kip met fajitakruiden (of paprikapoeder, komijn, knoflookpoeder en zout).","Verhit 1 eetlepel olie in een pan op hoog vuur en bak de kip 5 tot 6 minuten tot hij gaar is. Voeg de paprika toe en bak 3 minuten mee tot hij net zacht is.","Verwarm de mais 1 minuut mee in de pan.","Snijd de avocado in plakjes. Verdeel rijst, kip, paprika en mais over kommen en leg de avocado erop. Lekker met een kneep limoen."]},{"id":9,"name":"Pasta pesto met courgette","type":"Vegetarisch","time":20,"emoji":"🌿","cuisine":"Italiaans","ingredients":[["pasta","100","g"],["courgette","0.5","stuk"],["pesto","1.5","el"],["parmezaan","20","g"],["pijnboompitten","10","g"]],"steps":["Kook de pasta beetgaar volgens de verpakking en bewaar een kopje kookvocht.","Snijd de courgette in halve plakjes. Verhit 1 eetlepel olijfolie in een koekenpan op hoog vuur en bak de courgette 5 tot 6 minuten tot hij bruin is maar nog bite heeft. Kruid met zout en peper.","Rooster de pijnboompitten 2 minuten in een droge pan tot ze goudbruin zijn. Let op, ze kleuren snel.","Giet de pasta af en meng met de pesto en een scheutje kookvocht tot de saus mooi hecht.","Schep de courgette erdoor en serveer met parmezaan en pijnboompitten."]},{"id":10,"name":"Garnalen in knoflook met orzo","type":"Vis","time":25,"emoji":"🍤","cuisine":"Mediterraan","ingredients":[["garnalen","150","g"],["orzo","90","g"],["spinazie","100","g"],["knoflook","1","teen"],["citroen","0.25","stuk"]],"steps":["Kook de orzo in gezouten water 8 tot 10 minuten beetgaar en giet af.","Snijd de knoflook fijn en dep de garnalen droog.","Verhit 2 eetlepels olijfolie in een koekenpan op middelhoog vuur. Bak de knoflook 30 seconden, voeg de garnalen toe en bak 2 tot 3 minuten tot ze roze en net gaar zijn.","Voeg de spinazie in delen toe en laat in 2 minuten slinken.","Schep de orzo erdoor, knijp de citroen erboven uit en breng op smaak met zout, peper en eventueel een snuf chilivlokken."]},{"id":11,"name":"Kip in romige pestosaus","type":"Vlees","time":30,"emoji":"🍲","cuisine":"Italiaans","ingredients":[["kipfilet","150","g"],["pasta","90","g"],["spinazie","100","g"],["pesto","1","el"],["kookroom","75","ml"]],"steps":["Kook de pasta beetgaar volgens de verpakking.","Snijd de kipfilet in blokjes en kruid met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de kip 6 tot 7 minuten goudbruin en gaar.","Zet het vuur laag, roer pesto en kookroom erdoor en laat 2 minuten zachtjes pruttelen.","Voeg de spinazie toe en laat in 2 minuten slinken.","Giet de pasta af, schep door de saus en serveer. Lekker met wat extra parmezaan."]},{"id":12,"name":"Nasi met omelet","type":"Vegetarisch","time":25,"emoji":"🍚","cuisine":"Aziatisch","ingredients":[["rijst","80","g"],["ei","1","stuk"],["prei","0.5","stuk"],["wortel","1","stuk"],["ketjap","1","el"]],"steps":["Kook de rijst volgens de verpakking en laat afkoelen op een bord. Rijst van gisteren is nog beter.","Snijd de prei in ringen en de wortel in kleine blokjes.","Klop het ei los met een snuf zout. Verhit een beetje olie in een koekenpan en bak in 2 minuten een dunne omelet. Laat op een bord glijden en snijd in reepjes.","Verhit 1 eetlepel olie in een wok op hoog vuur en bak wortel en prei 4 minuten.","Voeg de rijst toe en roerbak 3 minuten tot alles heet is. Roer de ketjap erdoor en kruid met peper. Serveer met de omeletreepjes erop."]},{"id":13,"name":"Zalm teriyaki bowl","type":"Vis","time":25,"emoji":"🍱","cuisine":"Aziatisch","ingredients":[["zalmfilet","150","g"],["rijst","80","g"],["komkommer","0.5","stuk"],["edamame","75","g"],["teriyakisaus","2","el"]],"steps":["Kook de rijst volgens de verpakking.","Kook de edamame 3 minuten in gezouten water en giet af. Snijd de komkommer in dunne halve plakjes.","Dep de zalm droog. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de zalm 3 minuten op de huidkant en 2 minuten op de andere kant.","Giet de teriyakisaus erbij en laat 1 minuut inkoken terwijl je de zalm ermee bedruipt.","Verdeel de rijst over kommen, leg zalm, komkommer en edamame erop en lepel de saus uit de pan erover. Lekker met sesamzaad."]},{"id":14,"name":"Gehaktballetjes in tomatensaus","type":"Vlees","time":35,"emoji":"🍝","cuisine":"Italiaans","ingredients":[["rundergehakt","150","g"],["spaghetti","100","g"],["passata","200","ml"],["ui","0.5","stuk"],["parmezaan","20","g"]],"steps":["Kneed het gehakt met zout, peper en eventueel wat paneermeel en Italiaanse kruiden. Draai er balletjes van ter grootte van een walnoot.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de balletjes 6 tot 8 minuten rondom bruin. Haal uit de pan.","Snipper de ui en fruit hem 3 minuten in dezelfde pan. Giet de passata erbij en kruid met zout, peper en een snuf suiker.","Leg de balletjes terug in de saus en laat 15 minuten zachtjes pruttelen met de deksel schuin op de pan.","Kook intussen de spaghetti beetgaar volgens de verpakking.","Serveer de spaghetti met de balletjes en saus en bestrooi met parmezaan."]},{"id":15,"name":"Gnocchi met spinazie en tomaat","type":"Vegetarisch","time":20,"emoji":"🥔","cuisine":"Italiaans","ingredients":[["gnocchi","250","g"],["spinazie","100","g"],["cherrytomaten","125","g"],["mozzarella","0.5","bol"],["pesto","1","el"]],"steps":["Halveer de cherrytomaten en scheur de mozzarella in stukken.","Verhit 2 eetlepels olijfolie in een grote koekenpan op middelhoog vuur. Bak de gnocchi zonder ze eerst te koken 8 tot 10 minuten tot ze rondom goudbruin en krokant zijn. Niet te vaak omscheppen.","Voeg de tomaten toe en bak 3 minuten mee tot ze zacht worden.","Voeg de spinazie toe en laat in 2 minuten slinken. Haal van het vuur.","Roer de pesto erdoor, verdeel de mozzarella erover en kruid met peper. Serveer direct."]},{"id":16,"name":"Vis-taco's met limoen","type":"Vis","time":25,"emoji":"🌮","cuisine":"Mexicaans","ingredients":[["witvis","150","g"],["tortilla","2","stuk"],["rode kool","75","g"],["avocado","0.5","stuk"],["limoen","0.5","stuk"]],"steps":["Snijd de rode kool heel fijn en meng met een snuf zout en de helft van het limoensap. Zet apart.","Snijd de witvis in stukken en kruid met zout, paprikapoeder en komijn.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de vis 2 tot 3 minuten per kant tot hij ondoorzichtig is en uiteenvalt.","Verwarm de tortilla's 20 seconden per kant in een droge, hete pan.","Snijd de avocado in plakjes. Beleg de tortilla's met kool, vis en avocado en besprenkel met de rest van het limoensap."]},{"id":17,"name":"Kip kerrie met rijst","type":"Vlees","time":30,"emoji":"🍛","cuisine":"Aziatisch","ingredients":[["kipfilet","150","g"],["rijst","80","g"],["paprika","0.5","stuk"],["kookroom","75","ml"],["kerriepoeder","1","el"]],"steps":["Kook de rijst volgens de verpakking.","Snijd de kipfilet in blokjes en de paprika in stukken.","Verhit 1 eetlepel olie in een pan op middelhoog vuur en bak de kip 5 minuten tot hij rondom bruin is. Voeg de paprika toe en bak 3 minuten mee.","Strooi de kerriepoeder erover en bak 1 minuut mee tot hij geurt.","Giet de kookroom erbij, breng op smaak met zout en laat 8 minuten zachtjes pruttelen tot de saus iets is ingedikt.","Serveer met de rijst."]},{"id":18,"name":"Shakshuka met feta","type":"Vegetarisch","time":30,"emoji":"🍳","cuisine":"Mediterraan","ingredients":[["ei","2","stuk"],["tomatenblokjes","200","g"],["paprika","0.5","stuk"],["feta","50","g"],["brood","100","g"]],"steps":["Snijd de paprika in reepjes. Verhit 2 eetlepels olijfolie in een koekenpan met deksel op middelhoog vuur en bak de paprika 5 minuten zacht.","Voeg de tomatenblokjes toe met komijn, paprikapoeder, zout en peper en laat 10 minuten pruttelen tot de saus iets is ingedikt.","Maak met een lepel kuiltjes in de saus en breek in elk kuiltje een ei.","Leg de deksel op de pan en laat de eieren 6 tot 8 minuten zachtjes garen tot het eiwit gestold is en de dooier nog zacht.","Verkruimel de feta erover en serveer met brood om in de saus te dopen. Rooster het brood eventueel 2 minuten onder de grill."]},{"id":19,"name":"Pokébowl met zalm","type":"Vis","time":25,"emoji":"🥢","cuisine":"Aziatisch","ingredients":[["zalmfilet","150","g"],["sushirijst","80","g"],["komkommer","0.5","stuk"],["avocado","0.5","stuk"],["sojasaus","1","el"]],"steps":["Kook de sushirijst volgens de verpakking en breng op smaak met een scheutje rijstazijn en een snuf zout.","Gebruik zalm van sushikwaliteit en snijd die in blokjes, of bak gewone zalm 3 minuten per kant op middelhoog vuur en breek hem in stukken.","Snijd de komkommer in dunne halve plakjes en de avocado in blokjes.","Verdeel de rijst over kommen en leg zalm, komkommer en avocado er in vakjes bovenop.","Besprenkel met sojasaus en maak af met sesamzaad of lente-ui."]},{"id":20,"name":"Traybake kip en groenten","type":"Vlees","time":40,"emoji":"🍗","cuisine":"Europees","ingredients":[["kippendij","175","g"],["aardappeltjes","250","g"],["paprika","0.5","stuk"],["courgette","0.5","stuk"],["rode ui","0.5","stuk"]],"steps":["Verwarm de oven voor op 200°C.","Halveer de aardappeltjes en snijd paprika, courgette en rode ui in grove stukken. Snijd de kippendij in grote stukken.","Meng alles op een bakplaat met 2 eetlepels olijfolie, paprikapoeder, oregano, zout en peper. Verdeel in één laag.","Rooster 20 minuten, schep om en rooster nog 15 minuten tot de aardappeltjes goudbruin zijn en de kip gaar.","Serveer direct, lekker met een lepel yoghurt of hummus."]},{"id":21,"name":"Ravioli met salieboter","type":"Vegetarisch","time":20,"emoji":"🥟","cuisine":"Italiaans","ingredients":[["ravioli","250","g"],["boter","20","g"],["salie","5","g"],["parmezaan","20","g"],["rucola","50","g"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de ravioli volgens de verpakking (verse ravioli meestal 3 tot 4 minuten). Bewaar een kopje kookvocht.","Smelt intussen de boter in een koekenpan op middelhoog vuur. Voeg de salieblaadjes toe en laat 2 tot 3 minuten bakken tot de boter lichtbruin kleurt en nootachtig ruikt. Haal direct van het vuur.","Schep de ravioli met een scheutje kookvocht door de boter.","Verdeel over de borden, bestrooi met parmezaan en peper en leg de rucola erbovenop."]},{"id":22,"name":"Mediterrane couscous met kip","type":"Vlees","time":25,"emoji":"🥙","cuisine":"Mediterraan","ingredients":[["kipfilet","150","g"],["couscous","80","g"],["courgette","0.5","stuk"],["paprika","0.5","stuk"],["feta","40","g"]],"steps":["Giet kokend water op de couscous volgens de verpakking, met een snuf zout en een scheut olijfolie. Dek af, laat 5 minuten staan en roer los met een vork.","Snijd de kipfilet in blokjes en de courgette en paprika in stukjes.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 5 tot 6 minuten goudbruin en gaar.","Voeg de groenten toe en bak 5 minuten mee tot ze net zacht zijn. Kruid met komijn, paprikapoeder, zout en peper.","Meng alles door de couscous en verkruimel de feta erover. Lekker met citroensap en verse munt of peterselie."]},{"id":23,"name":"Kabeljauw in tomatensaus","type":"Vis","time":30,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["kabeljauwfilet","150","g"],["passata","200","ml"],["olijven","30","g"],["aardappeltjes","250","g"],["peterselie","5","g"]],"steps":["Halveer de aardappeltjes en kook ze 15 minuten in gezouten water, of rooster ze 25 minuten op 200°C met olie.","Verwarm de passata met de olijven in een koekenpan met deksel op middelhoog vuur. Kruid met zout, peper en een snuf chilivlokken en laat 5 minuten pruttelen.","Dep de kabeljauw droog, kruid met zout en leg hem in de saus.","Leg de deksel op de pan en laat 8 tot 10 minuten zachtjes garen tot de vis ondoorzichtig is en makkelijk uiteenvalt.","Bestrooi met gehakte peterselie en serveer met de aardappeltjes."]},{"id":24,"name":"Vegetarische enchilada's","type":"Vegetarisch","time":35,"emoji":"🌯","cuisine":"Mexicaans","ingredients":[["tortilla","2","stuk"],["kidneybonen","100","g"],["mais","75","g"],["passata","150","ml"],["geraspte kaas","50","g"]],"steps":["Verwarm de oven voor op 200°C.","Spoel de kidneybonen af. Verwarm ze 3 minuten in een pan met de mais, een derde van de passata, komijn, paprikapoeder en zout.","Verdeel de vulling over de tortilla's, rol ze op en leg ze met de naad omlaag in een ingevette ovenschaal.","Giet de rest van de passata erover en bestrooi met de geraspte kaas.","Bak 20 minuten tot de kaas gesmolten en goudbruin is. Lekker met crème fraîche of avocado."]},{"id":25,"name":"Biefstukreepjes met noedels","type":"Vlees","time":25,"emoji":"🍜","cuisine":"Aziatisch","ingredients":[["biefstuk","150","g"],["noedels","100","g"],["paksoi","0.5","stuk"],["paprika","0.5","stuk"],["sojasaus","1.5","el"]],"steps":["Kook de noedels volgens de verpakking, giet af en spoel koud zodat ze niet plakken.","Snijd de biefstuk tegen de draad in dunne reepjes en kruid met peper. Snijd de paksoi in stukken en de paprika in reepjes.","Verhit 1 eetlepel olie in een wok op zeer hoog vuur. Roerbak het vlees 1 tot 2 minuten tot het net bruin is en haal uit de pan.","Bak de paprika 2 minuten, voeg de paksoi toe en roerbak nog 2 minuten tot de stelen beetgaar zijn.","Doe vlees en noedels terug in de wok, giet de sojasaus erbij en roerbak 1 minuut tot alles heet is."]},{"id":26,"name":"Garnalencurry met kokos","type":"Vis","time":30,"emoji":"🍤","cuisine":"Aziatisch","ingredients":[["garnalen","150","g"],["rijst","80","g"],["kokosmelk","200","ml"],["groene currypasta","1","el"],["spinazie","100","g"]],"steps":["Kook de rijst volgens de verpakking.","Verhit 1 eetlepel olie in een pan op middelhoog vuur en bak de currypasta 1 minuut tot hij geurt.","Giet de kokosmelk erbij, roer glad en laat 5 minuten zachtjes koken.","Voeg de garnalen toe en laat 3 tot 4 minuten meekoken tot ze roze en gaar zijn.","Roer de spinazie erdoor en laat in 1 tot 2 minuten slinken. Breng op smaak met een kneep limoen en serveer met de rijst."]},{"id":27,"name":"Falafel bowl met hummus","type":"Vegetarisch","time":20,"emoji":"🧆","cuisine":"Mediterraan","ingredients":[["falafel","150","g"],["couscous","80","g"],["komkommer","0.5","stuk"],["tomaat","1","stuk"],["hummus","50","g"]],"steps":["Giet kokend water op de couscous met een snuf zout en een scheut olijfolie. Dek af, laat 5 minuten staan en roer los met een vork.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de falafel 6 tot 8 minuten, regelmatig draaiend, tot ze rondom krokant en heet zijn.","Snijd de komkommer en tomaat in blokjes en kruid met zout, peper en citroensap.","Verdeel de couscous over kommen, leg falafel en groenten erop en schep de hummus erbij."]},{"id":28,"name":"Kip caprese uit de oven","type":"Vlees","time":35,"emoji":"🍅","cuisine":"Italiaans","ingredients":[["kipfilet","150","g"],["mozzarella","0.5","bol"],["tomaat","1","stuk"],["aardappeltjes","250","g"],["basilicum","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C.","Halveer de aardappeltjes, meng ze op een bakplaat met olijfolie, zout en peper en rooster ze 15 minuten.","Kruid de kipfilet met zout, peper en Italiaanse kruiden. Snijd de tomaat en mozzarella in plakken.","Schuif de aardappeltjes opzij, leg de kip ernaast en bak 10 minuten.","Bedek de kip met tomaat en mozzarella en bak nog 10 minuten tot de kaas gesmolten is en de kip gaar. De kerntemperatuur is dan 75°C.","Bestrooi met basilicum en serveer."]},{"id":29,"name":"Tonijnpasta met citroen","type":"Vis","time":20,"emoji":"🍝","cuisine":"Italiaans","ingredients":[["pasta","100","g"],["tonijn","80","g"],["citroen","0.25","stuk"],["spinazie","100","g"],["crème fraîche","50","ml"]],"steps":["Kook de pasta beetgaar volgens de verpakking en bewaar een kopje kookvocht.","Laat de tonijn uitlekken. Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur, voeg de spinazie toe en laat in 2 minuten slinken.","Voeg de tonijn toe en warm 1 minuut mee.","Roer de crème fraîche, het citroensap en wat geraspte citroenschil erdoor. Kruid met zout en flink wat peper.","Schep de pasta erdoor met een scheutje kookvocht tot de saus smeuïg is. Serveer direct."]},{"id":30,"name":"Pompoenpasta met feta","type":"Vegetarisch","time":35,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["pompoen","200","g"],["pasta","100","g"],["feta","50","g"],["rode ui","0.5","stuk"],["salie","5","g"]],"steps":["Verwarm de oven voor op 200°C.","Snijd de pompoen in blokjes van 2 cm en de rode ui in parten. Meng op een bakplaat met olijfolie, zout en peper en rooster 25 minuten tot de pompoen zacht en licht gekarameliseerd is.","Kook intussen de pasta beetgaar en bewaar een kopje kookvocht.","Verhit 1 eetlepel olie in een koekenpan en bak de salieblaadjes 1 minuut krokant.","Meng de pasta met de pompoen, de ui en een scheutje kookvocht. Verkruimel de feta erover en maak af met de krokante salie."]},{"id":31,"name":"Geroosterde bloemkool met tahin en granaatappel","type":"Vegetarisch","time":35,"emoji":"🥦","cuisine":"Midden-Oosters","ingredients":[["bloemkool","0.5","stuk"],["tahin","1","el"],["citroen","0.25","stuk"],["granaatappelpitten","40","g"],["za'atar","1","tl"],["bulgur","70","g"]],"steps":["Verwarm de oven voor op 220°C.","Snijd de bloemkool in plakken van 2 cm of in grote roosjes. Meng met olijfolie, zout, komijn en paprikapoeder en leg in één laag op een bakplaat.","Rooster 25 minuten, keer halverwege, tot de randen donkerbruin en geblakerd zijn. Dat is precies wat je wilt.","Kook intussen de bulgur volgens de verpakking (ongeveer 10 minuten) en laat afgedekt staan.","Roer de tahin los met het citroensap, een snuf zout en koud water, lepel voor lepel, tot een gladde saus met de dikte van yoghurt.","Verdeel de bulgur over de borden, leg de bloemkool erop, sprenkel de tahinsaus erover en maak af met granaatappelpitten en za'atar."]},{"id":32,"name":"Miso-aubergine met sesamrijst","type":"Vegetarisch","time":35,"emoji":"🍆","cuisine":"Japans","ingredients":[["aubergine","1","stuk"],["witte miso","1","el"],["honing","0.5","el"],["sesamzaad","1","el"],["rijst","80","g"],["bosui","1","stuk"]],"steps":["Verwarm de oven voor op 220°C.","Halveer de aubergine in de lengte en snijd het vruchtvlees kruislings in tot bijna op de schil. Bestrijk royaal met olie en leg met de snijkant omhoog op een bakplaat.","Rooster 25 minuten tot het vruchtvlees zacht en goudbruin is.","Kook intussen de rijst volgens de verpakking.","Roer miso, honing en 1 eetlepel water tot een gladde pasta. Bestrijk de hete aubergine ermee en zet nog 5 minuten onder de grill tot het glazuur bubbelt en donker kleurt.","Rooster het sesamzaad 1 minuut in een droge pan. Serveer de aubergine op de rijst met sesam en fijngesneden bosui."]},{"id":33,"name":"Gnocchi met gorgonzola, peer en walnoot","type":"Vegetarisch","time":20,"emoji":"🍐","cuisine":"Italiaans","ingredients":[["gnocchi","250","g"],["gorgonzola","50","g"],["peer","0.5","stuk"],["walnoten","20","g"],["kookroom","50","ml"],["rucola","30","g"]],"steps":["Rooster de walnoten 3 minuten in een droge pan en hak ze grof.","Snijd de peer in dunne parten. Bak ze in een klontje boter op hoog vuur 3 minuten tot ze aan beide kanten goudbruin zijn. Haal uit de pan.","Kook de gnocchi in gezouten water tot ze boven komen drijven (2 tot 3 minuten) en giet af.","Verwarm de kookroom in de pan op laag vuur en laat de gorgonzola er in stukjes in smelten. Kruid met flink wat zwarte peper.","Schep de gnocchi door de saus, leg de peer erop en bestrooi met walnoten en rucola."]},{"id":34,"name":"Halloumi met geroosterde druiven en tijm","type":"Vegetarisch","time":25,"emoji":"🍇","cuisine":"Mediterraan","ingredients":[["halloumi","100","g"],["druiven","100","g"],["tijm","3","g"],["honing","0.5","el"],["bulgur","70","g"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 220°C.","Leg de druiven, aan het trosje of los, op een bakplaat met olijfolie, tijmblaadjes en een snuf zout. Rooster 15 minuten tot ze beginnen te barsten.","Kook intussen de bulgur volgens de verpakking en meng met citroensap, olijfolie, zout en peper.","Snijd de halloumi in plakken van 1 cm en dep droog. Bak ze in een hete, droge koekenpan 2 minuten per kant tot ze goudbruin zijn.","Leg de halloumi op de bulgur, schep de druiven met hun sap erover en sprenkel de honing erover. Eet direct, halloumi wordt taai als hij afkoelt."]},{"id":35,"name":"Courgette-risotto van orzo met citroen","type":"Vegetarisch","time":25,"emoji":"🥒","cuisine":"Italiaans","ingredients":[["orzo","90","g"],["courgette","1","stuk"],["citroen","0.5","stuk"],["parmezaan","30","g"],["boter","15","g"],["basilicum","0.25","bosje"]],"steps":["Schaaf of rasp de courgette flinterdun. Rasp de schil van de citroen en pers het sap uit.","Smelt de boter met een scheut olijfolie in een ruime pan op middelhoog vuur. Bak de courgette met een snuf zout 5 minuten tot hij zacht is en bijna uiteenvalt.","Voeg de orzo toe en roer 1 minuut. Giet er heet water bij tot de orzo net onderstaat en laat zachtjes koken.","Roer regelmatig en voeg steeds een scheutje water toe als het droog wordt, zoals bij risotto. Na 9 tot 10 minuten is de orzo beetgaar en romig.","Haal van het vuur. Roer parmezaan, citroenrasp en de helft van het sap erdoor en proef op zout en peper. Maak af met gescheurde basilicum en een scheut olijfolie."]},{"id":36,"name":"Miso-ramen met shiitake en zacht ei","type":"Vegetarisch","time":30,"emoji":"🍜","cuisine":"Japans","ingredients":[["ramen-noedels","90","g"],["shiitake","100","g"],["ei","1","stuk"],["witte miso","1.5","el"],["paksoi","0.5","stuk"],["gember","10","g"],["bosui","1","stuk"]],"steps":["Kook het ei precies 6,5 minuut in kokend water, schrik af in koud water en pel het.","Snijd de shiitake in plakjes en bak ze in 1 eetlepel olie op hoog vuur 5 minuten tot ze bruin en krokant aan de randen zijn. Kruid met zout.","Breng 500 ml water per persoon aan de kook met de geraspte gember. Laat 5 minuten trekken.","Kook de noedels en de in stukken gesneden paksoi 3 minuten in de bouillon.","Zet het vuur uit. Roer de miso los met een scheutje bouillon en voeg toe, miso mag niet meer koken.","Verdeel over kommen, leg shiitake en het gehalveerde ei erop en bestrooi met bosui. Lekker met een paar druppels sesamolie of chili-olie."]},{"id":37,"name":"Portobello met geitenkaas, honing en walnoot","type":"Vegetarisch","time":30,"emoji":"🍄","cuisine":"Europees","ingredients":[["portobello","2","stuk"],["geitenkaas","60","g"],["walnoten","20","g"],["honing","0.5","el"],["tijm","2","g"],["rucola","40","g"],["brood","80","g"]],"steps":["Verwarm de oven voor op 200°C.","Haal de steeltjes uit de portobello's en bestrijk de hoedjes met olijfolie, zout en peper. Leg ze met de open kant omhoog in een ovenschaal en bak 10 minuten.","Verkruimel de geitenkaas en hak de walnoten grof. Vul de portobello's ermee en strooi de tijmblaadjes erover.","Bak nog 10 minuten tot de kaas gesmolten is en lichtbruin kleurt.","Rooster het brood de laatste 3 minuten mee. Serveer de portobello's op rucola, besprenkeld met honing en een scheut olijfolie."]},{"id":38,"name":"Platgeslagen kip met geitenkaas en prosciutto","type":"Vlees","time":35,"emoji":"🍗","cuisine":"Italiaans","ingredients":[["kipfilet","150","g"],["geitenkaas","40","g"],["prosciutto","2","plak"],["ui","0.5","stuk"],["salie","3","g"],["aardappeltjes","250","g"]],"steps":["Verwarm de oven voor op 200°C. Halveer de aardappeltjes, meng met olie, zout en rozemarijn of tijm en rooster 25 minuten.","Snipper de ui en bak hem in boter op laag vuur 10 minuten tot hij zacht en zoet is. Laat iets afkoelen.","Snijd de kipfilet in de lengte open als een boek, leg er plasticfolie over en sla hem met een pan of deegroller plat tot 1 cm dik.","Bestrijk de kip met de geitenkaas, verdeel de ui en de salieblaadjes erover en rol op. Wikkel de prosciutto strak om de rol.","Bak de rol in 1 eetlepel olie op middelhoog vuur 3 minuten per kant tot de prosciutto krokant is. Zet dan 12 minuten in de oven bij de aardappeltjes tot de kip gaar is.","Laat 3 minuten rusten, snijd in plakken en serveer met de aardappeltjes."]},{"id":39,"name":"Krokante kippendijen met salie, gember en citroen","type":"Vlees","time":40,"emoji":"🍋","cuisine":"Europees","ingredients":[["kippendij","200","g"],["sojasaus","1","el"],["salie","3","g"],["tijm","2","g"],["gember","10","g"],["citroen","0.5","stuk"],["pompoen","200","g"]],"steps":["Meng sojasaus, 1 eetlepel olijfolie, geraspte gember, fijngesneden salie, tijmblaadjes, citroenrasp en citroensap. Snijd de kippendijen bij het bot open zodat ze plat liggen, of gebruik filet. Wrijf ze in met de marinade en laat minstens 15 minuten staan, langer mag.","Verwarm de oven voor op 220°C.","Snijd de pompoen in parten van 2 cm, meng met olie, zout en peper en leg op een bakplaat.","Leg de kip met de huid omhoog tussen de pompoen en rooster 25 tot 30 minuten tot het vel knapperig is en het vocht helder is als je erin prikt.","Serveer met de uitgelekte sappen van de bakplaat en een extra kneep citroen."]},{"id":40,"name":"Lamsköfte met granaatappel en muntyoghurt","type":"Vlees","time":30,"emoji":"🥙","cuisine":"Midden-Oosters","ingredients":[["lamsgehakt","150","g"],["bulgur","70","g"],["yoghurt","75","ml"],["munt","0.25","bosje"],["granaatappelpitten","40","g"],["komkommer","0.25","stuk"],["komijn","1","tl"]],"steps":["Kook de bulgur volgens de verpakking en laat afgedekt staan.","Kneed het lamsgehakt met komijn, een snuf kaneel, zout, peper en de helft van de fijngesneden munt. Vorm er langwerpige rolletjes van, ter grootte van een duim.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de köfte 8 minuten, regelmatig draaiend, tot ze rondom bruin en net gaar zijn.","Roer de yoghurt met de rest van de munt, een snuf zout en een scheutje citroensap of olijfolie.","Snijd de komkommer in blokjes. Serveer de köfte op de bulgur met de yoghurt, komkommer en een royale hand granaatappelpitten."]},{"id":41,"name":"Varkenshaas met appel, mosterd en salie","type":"Vlees","time":30,"emoji":"🍎","cuisine":"Europees","ingredients":[["varkenshaas","150","g"],["appel","0.5","stuk"],["mosterd","0.5","el"],["salie","3","g"],["kookroom","50","ml"],["krieltjes","250","g"]],"steps":["Halveer de krieltjes en kook ze 15 minuten in gezouten water. Giet af en bak ze de laatste 5 minuten in boter goudbruin.","Kruid de varkenshaas met zout en peper. Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak hem 8 minuten, regelmatig draaiend, tot hij rondom bruin is en vanbinnen net rosé. Haal uit de pan en laat afgedekt rusten.","Snijd de appel in parten en bak ze met de salieblaadjes in dezelfde pan 3 minuten tot ze kleuren.","Roer de mosterd en de kookroom erdoor, schraap de aanbaksels los en laat 2 minuten pruttelen. Proef op zout.","Snijd de varkenshaas in plakken en serveer met de appel-saliesaus en de krieltjes."]},{"id":42,"name":"Thaise basilicumkip met gebakken ei","type":"Vlees","time":20,"emoji":"🌶️","cuisine":"Aziatisch","ingredients":[["kipgehakt","150","g"],["Thaise basilicum","0.5","bosje"],["rode peper","1","stuk"],["knoflook","2","teen"],["vissaus","1","el"],["ei","1","stuk"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking.","Hak knoflook en rode peper fijn. Pluk de basilicumblaadjes.","Verhit 1 eetlepel olie in een wok op zeer hoog vuur. Bak knoflook en peper 20 seconden, voeg het kipgehakt toe en bak 5 minuten rul en bruin.","Voeg vissaus, een scheutje sojasaus en een theelepel suiker toe en roerbak 1 minuut. Zet het vuur uit en schep de basilicum erdoor tot hij slinkt.","Bak het ei in een flinke scheut hete olie tot de randen krokant zijn en de dooier nog vloeibaar.","Serveer de kip op de rijst met het ei erbovenop."]},{"id":43,"name":"Chorizo met kikkererwten en gerookte paprika","type":"Vlees","time":25,"emoji":"🫘","cuisine":"Spaans","ingredients":[["chorizo","75","g"],["kikkererwten","120","g"],["spinazie","100","g"],["tomatenblokjes","200","g"],["gerookt paprikapoeder","1","tl"],["brood","80","g"]],"steps":["Snijd de chorizo in plakjes en bak ze in een droge koekenpan op middelhoog vuur 3 minuten tot het rode vet vrijkomt en de plakjes krokant worden.","Voeg het gerookte paprikapoeder en een fijngesneden teen knoflook toe en bak 30 seconden.","Giet de tomatenblokjes erbij met de afgespoelde kikkererwten en laat 10 minuten pruttelen tot de saus dik is.","Roer de spinazie erdoor en laat in 2 minuten slinken. Breng op smaak met zout, peper en een scheutje azijn of citroensap.","Rooster het brood en serveer erbij. Lekker met een lepel yoghurt of een gepocheerd ei erop."]},{"id":44,"name":"Entrecote met chimichurri en zoete aardappel","type":"Vlees","time":30,"emoji":"🥩","cuisine":"Zuid-Amerikaans","ingredients":[["entrecote","180","g"],["zoete aardappel","200","g"],["peterselie","0.5","bosje"],["knoflook","1","teen"],["rode wijnazijn","1","el"],["chilivlokken","0.5","tl"]],"steps":["Verwarm de oven voor op 220°C. Snijd de zoete aardappel in parten, meng met olie, zout en paprikapoeder en rooster 25 minuten tot ze zacht zijn met donkere randen.","Maak de chimichurri: hak peterselie en knoflook heel fijn en meng met de azijn, chilivlokken, 3 eetlepels olijfolie, oregano en zout. Laat staan.","Haal de entrecote 15 minuten voor het bakken uit de koelkast en dep hem droog. Kruid royaal met zout en peper.","Verhit een koekenpan tot hij rookt. Bak de entrecote 2 tot 3 minuten per kant voor medium-rare, langer als je hem doorbakken wilt. Laat 5 minuten rusten onder folie.","Snijd het vlees in plakken tegen de draad in en serveer met de chimichurri en de zoete aardappel."]},{"id":45,"name":"Harissa-kip met abrikoos en amandel","type":"Vlees","time":35,"emoji":"🍑","cuisine":"Marokkaans","ingredients":[["kippendij","200","g"],["harissa","1","el"],["gedroogde abrikozen","40","g"],["amandelen","20","g"],["couscous","80","g"],["rode ui","0.5","stuk"],["koriander","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C.","Meng de kippendijen met de harissa, 1 eetlepel olie, een snuf zout en komijn. Snijd de rode ui in parten en halveer de abrikozen.","Leg kip, ui en abrikozen in een ovenschaal en rooster 25 minuten tot de kip gaar is en de ui zacht.","Rooster de amandelen 3 minuten in een droge pan en hak grof.","Giet kokend water op de couscous met zout en olie, dek af en laat 5 minuten staan. Roer los met een vork.","Serveer de kip met het braadvocht op de couscous, bestrooid met amandelen en koriander."]},{"id":46,"name":"Makreel met gremolata en geroosterde biet","type":"Vis","time":30,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["makreelfilet","150","g"],["rode biet","200","g"],["peterselie","0.25","bosje"],["citroen","0.5","stuk"],["knoflook","1","teen"],["krieltjes","200","g"]],"steps":["Verwarm de oven voor op 200°C. Snijd de biet en de krieltjes in parten, meng met olie, zout en peper en rooster 25 minuten.","Maak de gremolata: hak peterselie en knoflook fijn en meng met de geraspte citroenschil en een snuf zout.","Dep de makreel droog, kerf de huid een paar keer in en kruid met zout.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Bak de makreel 3 minuten op de huid tot die krokant is, keer en bak nog 1 minuut.","Serveer de makreel op de biet en krieltjes, bestrooid met gremolata en met een kneep citroensap. De zure citroen en de frisse peterselie snijden mooi door de vette vis."]},{"id":47,"name":"Mosselen met venkel, knoflook en witte wijn","type":"Vis","time":25,"emoji":"🦪","cuisine":"Europees","ingredients":[["mosselen","1","kg"],["venkel","0.5","stuk"],["knoflook","2","teen"],["witte wijn","100","ml"],["crème fraîche","50","ml"],["brood","100","g"]],"steps":["Spoel de mosselen onder koud water. Gooi kapotte en open exemplaren die niet sluiten als je erop tikt weg.","Snijd de venkel in dunne reepjes en de knoflook fijn. Bewaar het venkelgroen.","Verhit boter in een grote pan met deksel op middelhoog vuur. Bak venkel en knoflook 4 minuten zacht.","Zet het vuur hoog, giet de wijn erbij en voeg de mosselen toe. Deksel erop en 5 tot 6 minuten koken, schud de pan halverwege. Ze zijn klaar als vrijwel alle schelpen open zijn.","Roer de crème fraîche en peper door het vocht. Serveer in diepe borden met het venkelgroen en brood om het vocht op te deppen."]},{"id":48,"name":"Zalm met miso-honingglazuur en paksoi","type":"Vis","time":25,"emoji":"🍯","cuisine":"Japans","ingredients":[["zalmfilet","150","g"],["witte miso","1","el"],["honing","0.5","el"],["paksoi","1","stuk"],["gember","10","g"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking.","Roer miso, honing, een theelepel sojasaus en een scheutje water tot een glad glazuur.","Verwarm de grill van de oven voor op de hoogste stand. Leg de zalm op een met bakpapier beklede plaat, bestrijk hem dik met het glazuur en zet hem 8 tot 10 minuten onder de grill tot het glazuur donkerbruin bubbelt en de zalm net gaar is.","Halveer de paksoi in de lengte. Bak hem in 1 eetlepel olie met de fijngesneden gember op hoog vuur 3 minuten, snijkant omlaag, en voeg een scheutje water toe zodat de stelen gaar stomen.","Serveer de zalm met de paksoi op de rijst."]},{"id":49,"name":"Linguine met garnalen en 'nduja","type":"Vis","time":20,"emoji":"🌶️","cuisine":"Italiaans","ingredients":[["linguine","100","g"],["garnalen","150","g"],["'nduja","30","g"],["cherrytomaten","125","g"],["citroen","0.25","stuk"],["peterselie","5","g"]],"steps":["Kook de linguine beetgaar volgens de verpakking en bewaar een kopje kookvocht.","Halveer de cherrytomaten. Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur en laat de 'nduja er in 2 minuten in smelten tot een rode, pittige olie.","Voeg de tomaten toe en bak 4 minuten tot ze zacht worden.","Voeg de garnalen toe en bak 2 tot 3 minuten tot ze roze zijn.","Schep de pasta met een scheutje kookvocht door de saus tot alles glanst. Maak af met citroensap, citroenrasp en peterselie. Het zuur van de citroen houdt de pittige 'nduja in balans."]},{"id":50,"name":"Ceviche van witvis met mango en limoen","type":"Vis","time":20,"emoji":"🥭","cuisine":"Zuid-Amerikaans","ingredients":[["witvis","150","g"],["limoen","1.5","stuk"],["mango","0.5","stuk"],["rode ui","0.25","stuk"],["koriander","0.25","bosje"],["tortillachips","60","g"]],"steps":["Gebruik heel verse vis van de visboer en zeg dat je ceviche maakt. Snijd de vis in blokjes van 1 cm.","Snijd de rode ui flinterdun en leg hem 5 minuten in ijswater zodat hij milder wordt.","Meng de vis met het limoensap, een flinke snuf zout en de uitgelekte ui. Laat 10 minuten staan in de koelkast. Het zuur gaart de vis, hij wordt ondoorzichtig en stevig.","Snijd de mango in blokjes en hak de koriander. Schep ze door de vis met een fijngesneden stukje rode peper als je van pittig houdt.","Serveer direct, ijskoud, met de tortillachips om te scheppen."]},{"id":51,"name":"Tonijnsteak met sesamkorst en wasabimayo","type":"Vis","time":20,"emoji":"🍣","cuisine":"Japans","ingredients":[["tonijnsteak","150","g"],["sesamzaad","2","el"],["mayonaise","2","el"],["wasabi","0.5","tl"],["komkommer","0.5","stuk"],["sushirijst","80","g"],["sojasaus","1","el"]],"steps":["Kook de sushirijst volgens de verpakking en breng op smaak met een scheutje rijstazijn en een snuf zout.","Snijd de komkommer in dunne plakjes en meng met een scheutje rijstazijn en zout.","Roer de mayonaise met de wasabi en een paar druppels sojasaus.","Dep de tonijn droog, kruid met zout en druk alle kanten in het sesamzaad.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Bak de tonijn 1 minuut per kant. De buitenkant is dan gaar en het midden nog rood. Laat 2 minuten rusten en snijd in plakken.","Serveer de tonijn op de rijst met de komkommer, de wasabimayo en de rest van de sojasaus."]},{"id":52,"name":"Dorade uit de oven met venkel, sinaasappel en olijven","type":"Vis","time":30,"emoji":"🍊","cuisine":"Mediterraan","ingredients":[["doradefilet","150","g"],["venkel","0.5","stuk"],["sinaasappel","0.5","stuk"],["olijven","30","g"],["krieltjes","250","g"],["tijm","2","g"]],"steps":["Verwarm de oven voor op 200°C.","Halveer de krieltjes en snijd de venkel in dunne parten. Meng op een bakplaat met olie, zout, peper en tijm en rooster 20 minuten.","Snijd de sinaasappel in dunne schijven, met schil.","Kruid de dorade met zout en peper. Leg de filets op de groenten met de sinaasappelschijven en de olijven erop en besprenkel met olie.","Bak nog 10 tot 12 minuten tot de vis ondoorzichtig is. Serveer met het sap van de bakplaat erover. De zoete sinaasappel, de anijs van de venkel en de zoute olijven maken samen een heel natuurlijke saus."]},{"id":53,"name":"Romige currypasta met garnalen en courgette","type":"Vis","time":20,"emoji":"🍤","cuisine":"Europees","ingredients":[["pasta","100","g"],["garnalen","125","g"],["courgette","0.5","stuk"],["prei","0.5","stuk"],["kerriepoeder","1","tl"],["crème fraîche","50","g"],["parmezaan","20","g"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de pasta volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Snijd intussen de courgette in halve maantjes en de prei in dunne ringen. Dep de garnalen droog.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur. Bak de prei en courgette 5 minuten tot ze zacht zijn. Roer het kerriepoeder erdoor en bak 30 seconden mee tot het geurt.","Voeg de garnalen toe en bak 2 tot 3 minuten tot ze roze en net gaar zijn. Roer de crème fraîche en een flinke scheut kookvocht erdoor.","Schep de pasta door de saus en laat 1 minuut pruttelen. Maak af met geraspte parmezaan, peper en zout. De milde curry maakt de romige saus net wat spannender."]},{"id":54,"name":"Pasta met biefstukreepjes, paprika en cheddarsaus","type":"Vlees","time":25,"emoji":"🧀","cuisine":"Amerikaans","ingredients":[["biefstuk","150","g"],["pasta","100","g"],["paprika","1","stuk"],["ui","0.5","stuk"],["cheddar","50","g"],["melk","100","ml"],["paprikapoeder","1","tl"]],"steps":["Kook de pasta volgens de verpakking beetgaar en bewaar een kopje kookvocht.","Snijd de biefstuk in dunne reepjes en kruid ze met paprikapoeder, zout en peper. Snijd de paprika in reepjes en de ui in halve ringen.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en schroei de biefstukreepjes 1 tot 2 minuten dicht. Haal ze uit de pan.","Zet het vuur middelhoog en bak de ui en paprika 6 tot 8 minuten tot ze zacht en licht gekleurd zijn.","Giet de melk erbij, laat 1 minuut warm worden en roer de geraspte cheddar erdoor tot een gladde saus. Schep de pasta en het vlees erdoor met een scheutje kookvocht. Proef op zout en peper. Zoete paprika en gesmolten cheddar maken het een echte Philly cheesesteak in pastavorm."]},{"id":55,"name":"Pasta met rode pesto, geroosterde paprika en geitenkaas","type":"Vegetarisch","time":20,"emoji":"🫑","cuisine":"Italiaans","ingredients":[["pasta","100","g"],["rode pesto","2","el"],["paprika","1","stuk"],["geitenkaas","50","g"],["rucola","30","g"],["pompoenpitten","1","el"]],"steps":["Kook de pasta volgens de verpakking beetgaar en bewaar een kopje kookvocht.","Snijd de paprika in reepjes. Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de paprika 6 tot 8 minuten tot de randen donker kleuren.","Rooster de pompoenpitten in een droge pan 2 minuten tot ze beginnen te knappen.","Schep de pasta met de rode pesto en een scheutje kookvocht door de paprika tot alles glanst.","Verdeel over de borden en maak af met verkruimelde geitenkaas, rucola en de pompoenpitten. De zoute geitenkaas en de pittige rucola geven de zoete pesto tegenwicht."]},{"id":56,"name":"Romige spinaziedahl met cashewnoten en gele rijst","type":"Vegetarisch","time":25,"emoji":"🍛","cuisine":"Indiaas","ingredients":[["rode linzen","80","g"],["spinazie","100","g"],["kokosmelk","100","ml"],["ui","0.5","stuk"],["knoflook","1","teen"],["garam masala","1","el"],["rijst","80","g"],["kurkuma","0.5","tl"],["cashewnoten","20","g"]],"steps":["Kook de rijst volgens de verpakking met de kurkuma in het water, zo wordt hij mooi geel.","Snipper de ui en snijd de knoflook fijn. Verhit 1 eetlepel olie in een pan op middelhoog vuur en bak de ui 4 minuten zacht. Voeg de knoflook en garam masala toe en bak 1 minuut mee.","Spoel de linzen af en voeg ze toe met 250 ml water. Breng aan de kook en laat 12 tot 15 minuten zachtjes pruttelen tot de linzen uit elkaar vallen. Roer af en toe en voeg water toe als het te dik wordt.","Roer de kokosmelk en de spinazie erdoor en laat 2 minuten slinken. Breng op smaak met zout.","Rooster de cashewnoten 2 minuten in een droge pan. Serveer de dahl op de gele rijst met de cashews erover. Een lepel yoghurt erbij is lekker fris."]},{"id":57,"name":"Sticky BBQ-tofu met maissalsa en rijst","type":"Vegetarisch","time":20,"emoji":"🌽","cuisine":"Amerikaans","ingredients":[["tofu","150","g"],["bbq-saus","2","el"],["mais","75","g"],["cherrytomaten","100","g"],["limoen","0.5","stuk"],["rijst","80","g"],["koriander","0.25","bosje"],["mayonaise","1","el"],["chilisaus","1","tl"]],"steps":["Kook de rijst volgens de verpakking.","Dep de tofu goed droog, snijd hem in blokjes van 2 cm en bestrooi met wat zout en 1 eetlepel maïzena of bloem voor een krokant korstje.","Verhit 2 eetlepels olie in een koekenpan op hoog vuur en bak de tofu 6 tot 8 minuten tot alle kanten goudbruin zijn. Zet het vuur laag, roer de bbq-saus erdoor en laat 1 minuut karamelliseren.","Maak de salsa: meng de mais met gehalveerde cherrytomaten, het sap van de limoen, gehakte koriander, zout en peper.","Roer de mayonaise met de chilisaus. Serveer de rijst met de sticky tofu, de frisse maissalsa en een lepel chilimayo."]},{"id":58,"name":"Pikante udonnoedels met gehakt en gemberwoksaus","type":"Vlees","time":20,"emoji":"🍜","cuisine":"Aziatisch","ingredients":[["udonnoedels","150","g"],["rundergehakt","125","g"],["roerbakgroente","150","g"],["gember","1","cm"],["sojasaus","2","el"],["sambal","1","tl"],["bosui","1","stuk"],["sesamolie","1","tl"]],"steps":["Kook de udonnoedels volgens de verpakking (meestal 3 tot 4 minuten), giet af en spoel kort af.","Rasp de gember en snijd de bosui in ringen. Meng de sojasaus met de sambal, de gember, de sesamolie en 2 eetlepels water tot een woksaus.","Verhit 1 eetlepel olie in een wok op hoog vuur en bak het gehakt 4 minuten rul en bruin.","Voeg de roerbakgroente toe en wok 3 minuten tot de groente beetgaar is.","Schep de noedels en de woksaus erdoor en wok 1 minuut tot alles glanst. Serveer met de bosui erover. Meer sambal voor wie het pittiger wil."]},{"id":59,"name":"Zalm op de huid met mierikswortelroom en broccolini","type":"Vis","time":25,"emoji":"🐟","cuisine":"Europees","ingredients":[["zalmfilet met huid","150","g"],["aardappels","250","g"],["broccolini","100","g"],["crème fraîche","50","g"],["mierikswortel","1","tl"],["citroen","0.25","stuk"],["boter","10","g"]],"steps":["Schil de aardappels, snijd ze in stukken en kook ze in 15 minuten gaar. Stamp ze met de boter en een scheut melk tot een puree. Breng op smaak met zout en peper.","Roer de crème fraîche met de mierikswortel, een paar druppels citroensap, zout en peper tot een frisse room.","Dep de zalm droog en kruid de huid met zout. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur. Leg de zalm op de huid en bak 5 tot 6 minuten zonder te bewegen tot de huid krokant is en de vis tot driekwart ondoorzichtig. Draai om en bak nog 1 minuut.","Kook of stoom de broccolini intussen 3 tot 4 minuten beetgaar.","Serveer de zalm op de puree met de broccolini en een flinke lepel mierikswortelroom. De scherpe room snijdt mooi door de vette zalm."]},{"id":60,"name":"Tortillapockets met gehakt en cheddar","type":"Vlees","time":25,"emoji":"🌮","cuisine":"Mexicaans","ingredients":[["tortilla","2","stuk"],["rundergehakt","125","g"],["cheddar","40","g"],["tacokruiden","1","el"],["tomaat","1","stuk"],["komkommer","0.25","stuk"],["zure room","2","el"]],"steps":["Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak het gehakt 5 minuten rul. Roer de tacokruiden en 2 eetlepels water erdoor en laat 1 minuut inkoken.","Snijd de tomaat en komkommer in blokjes en meng ze met een scheutje olie, zout en peper tot een frisse salade.","Leg het gehakt op de ene helft van elke tortilla, bestrooi met de geraspte cheddar en vouw de tortilla dicht.","Veeg de pan schoon en bak de pockets 2 tot 3 minuten per kant op middelhoog vuur tot ze goudbruin en krokant zijn en de kaas gesmolten is.","Snijd de pockets doormidden en serveer met de salade en een lepel zure room."]},{"id":61,"name":"Romig champignonpannetje met krieltjes","type":"Vegetarisch","time":25,"emoji":"🍄","cuisine":"Europees","ingredients":[["champignons","200","g"],["krieltjes","250","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["crème fraîche","60","g"],["tijm","2","g"],["sla","50","g"],["peterselie","0.25","bosje"]],"steps":["Halveer de krieltjes en kook ze in 12 minuten gaar. Giet af.","Snijd de champignons in kwarten, snipper de ui en snijd de knoflook fijn.","Verhit 1 eetlepel olie in een grote koekenpan op hoog vuur en bak de champignons 6 minuten tot ze bruin zijn en hun vocht is verdampt. Voeg de ui, knoflook en tijm toe en bak 3 minuten mee.","Zet het vuur laag en roer de crème fraîche en een scheutje water erdoor tot een romige saus. Breng op smaak met zout en flink wat peper.","Schep de krieltjes door de saus en serveer met de sla erbij en gehakte peterselie erover."]},{"id":62,"name":"Kip-sinaasappelsalade met witte kool en amandel","type":"Vlees","time":25,"emoji":"🍊","cuisine":"Aziatisch","ingredients":[["kipfilet","150","g"],["witte kool","150","g"],["sinaasappel","1","stuk"],["amandelen","20","g"],["sojasaus","1","el"],["sesamolie","1","tl"],["rijst","80","g"],["bosui","1","stuk"]],"steps":["Kook de rijst volgens de verpakking.","Snijd de witte kool heel fijn. Pel de sinaasappel en snijd de helft in partjes; pers de andere helft uit.","Maak de dressing: meng het sinaasappelsap met de sojasaus, de sesamolie en een snuf peper. Schep de kool erdoor en laat even staan zodat hij zachter wordt.","Snijd de kipfilet in reepjes, kruid met zout en peper en bak 6 tot 8 minuten goudbruin in 1 eetlepel olie op middelhoog vuur.","Rooster de amandelen 2 minuten in een droge pan. Serveer de rijst met de koolsalade, de kip, de sinaasappelpartjes, de amandelen en ringen bosui. Zoet, zout en knapperig in één bord."]},{"id":63,"name":"Pasta met gerookte zalm, courgette en citroen","type":"Vis","time":20,"emoji":"🍋","cuisine":"Italiaans","ingredients":[["pasta","100","g"],["gerookte zalm","75","g"],["courgette","0.5","stuk"],["crème fraîche","50","g"],["citroen","0.5","stuk"],["dille","0.25","bosje"]],"steps":["Kook de pasta volgens de verpakking beetgaar en bewaar een kopje kookvocht.","Rasp de courgette grof of snijd hem in dunne reepjes. Snijd de gerookte zalm in snippers.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de courgette 3 minuten tot hij net zacht is.","Zet het vuur laag en roer de crème fraîche, de rasp en het sap van een halve citroen en een scheut kookvocht erdoor.","Schep de pasta en de zalmsnippers erdoor en verwarm 1 minuut. Maak af met gehakte dille en flink wat peper. Voorzichtig met zout, de zalm is al zout."]},{"id":64,"name":"Stoofpotje van aubergine en paprika met burrata","type":"Vegetarisch","time":25,"emoji":"🍆","cuisine":"Mediterraan","ingredients":[["aubergine","0.5","stuk"],["paprika","1","stuk"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["burrata","0.5","bol"],["basilicum","0.25","bosje"],["brood","2","sneden"]],"steps":["Snijd de aubergine en paprika in blokjes van 2 cm, snipper de ui en snijd de knoflook fijn.","Verhit 2 eetlepels olijfolie in een pan op middelhoog vuur en bak de aubergine 6 minuten tot hij bruin kleurt. Voeg de paprika en ui toe en bak 4 minuten mee.","Voeg de knoflook toe, bak 30 seconden en giet de tomatenblokjes erbij. Laat 10 minuten zachtjes stoven tot de groenten zacht zijn en de saus is ingedikt. Breng op smaak met zout, peper en een snuf suiker.","Rooster het brood in een droge pan of de broodrooster.","Schep het stoofpotje in een diep bord, scheur de burrata erboven en maak af met basilicum en een scheut olijfolie. Serveer met het brood om te dippen."]},{"id":65,"name":"Rode curry met garnalen en sugarsnaps","type":"Vis","time":20,"emoji":"🍛","cuisine":"Aziatisch","ingredients":[["garnalen","125","g"],["rode currypasta","1","el"],["kokosmelk","200","ml"],["sugarsnaps","100","g"],["paprika","0.5","stuk"],["rijst","80","g"],["limoen","0.25","stuk"],["koriander","0.25","bosje"]],"steps":["Kook de rijst volgens de verpakking.","Snijd de paprika in reepjes. Verhit 1 eetlepel olie in een wok op middelhoog vuur en bak de currypasta 1 minuut tot hij geurt.","Giet de kokosmelk erbij, roer los en laat 3 minuten zachtjes koken.","Voeg de paprika en sugarsnaps toe en kook 3 minuten. Voeg de garnalen toe en laat 2 tot 3 minuten meekoken tot ze roze zijn.","Breng op smaak met limoensap, een snuf zout of een scheutje vissaus. Serveer op de rijst met koriander erover."]},{"id":66,"name":"Snelle Turkse pizza met knoflooksaus","type":"Vlees","time":30,"emoji":"🫓","cuisine":"Midden-Oosters","ingredients":[["wraps","2","stuk"],["rundergehakt","125","g"],["tomatenpuree","1","el"],["ui","0.5","stuk"],["paprika","0.5","stuk"],["komijn","1","tl"],["sla","50","g"],["knoflooksaus","2","el"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 220°C en leg bakpapier op een bakplaat.","Snipper de ui en de paprika heel fijn (of hak ze in de keukenmachine). Meng ze met het gehakt, de tomatenpuree, de komijn, zout, peper en een eetlepel olie tot een smeuïge massa.","Leg de wraps op de bakplaat en smeer het gehaktmengsel in een dunne laag uit tot aan de rand.","Bak 10 tot 12 minuten tot het gehakt gaar is en de randen van de wraps krokant zijn.","Beleg met de sla, een scheut knoflooksaus en citroensap. Oprollen en eten als een echte lahmacun."]},{"id":67,"name":"Snelle bibimbap met gebakken ei","type":"Vegetarisch","time":25,"emoji":"🍳","cuisine":"Aziatisch","ingredients":[["rijst","80","g"],["ei","1","stuk"],["wortel","1","stuk"],["spinazie","100","g"],["champignons","100","g"],["komkommer","0.25","stuk"],["gochujang","1","el"],["sesamolie","1","tl"],["sesamzaad","1","tl"]],"steps":["Kook de rijst volgens de verpakking.","Snijd de wortel in dunne reepjes, de champignons in plakjes en de komkommer in halve maantjes.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Bak de champignons 4 minuten bruin en schep ze op een bord. Bak daarna de wortel 2 minuten en laat tot slot de spinazie 1 minuut slinken met een snuf zout. Houd alle groenten apart.","Roer de gochujang met de sesamolie en een theelepel water tot een saus. Bak het ei in dezelfde pan tot het wit gestold is en de dooier nog zacht.","Schep de rijst in een kom, leg de groenten in vakjes erop, het ei in het midden en de saus en het sesamzaad erover. Alles door elkaar roeren voor het eten."]},{"id":68,"name":"Andijviestamppot met spekjes en jus","type":"Vlees","time":30,"emoji":"🥬","cuisine":"Nederlands","ingredients":[["kruimige aardappelen","250","g"],["andijvie","150","g"],["gerookte spekblokjes","60","g"],["ui","0.5","stuk"],["melk","50","ml"],["runderbouillon","100","ml"],["grove mosterd","1","tl"]],"steps":["Schil de aardappelen, snijd ze in gelijke stukken en kook ze 18 tot 20 minuten in water met zout tot ze zacht zijn. Snijd intussen de andijvie in dunne reepjes en was ze goed. Snipper de ui.","Bak de spekblokjes 5 tot 6 minuten in een droge koekenpan op middelhoog vuur tot ze knapperig zijn. Schep ze uit de pan en laat het vet erin.","Fruit de ui 3 minuten in het spekvet. Strooi er 1 theelepel bloem over, roer 1 minuut en giet de bouillon erbij. Laat 5 minuten zachtjes koken tot een gebonden jus en breng op smaak met peper.","Giet de aardappelen af, voeg de melk en een klontje boter toe en stamp ze grof. Schep de rauwe andijvie er in delen door, zodat ze net slinkt maar nog knapperig blijft. Roer de mosterd erdoor en breng op smaak met zout en peper.","Serveer de stamppot met de spekjes erover en de jus ernaast. De lichte bitterheid van de andijvie, het zoute spek en de hartige jus maken samen een klassiek Hollands bord."]},{"id":69,"name":"Boerenkoolstamppot met rookworst","type":"Vlees","time":35,"emoji":"🌭","cuisine":"Nederlands","ingredients":[["kruimige aardappelen","250","g"],["boerenkool (gesneden)","150","g"],["rookworst","0.5","stuk"],["gerookte spekblokjes","50","g"],["ui","0.5","stuk"],["melk","50","ml"],["grove mosterd","1","tl"]],"steps":["Schil de aardappelen en snijd ze in stukken. Doe ze in een ruime pan, leg de boerenkool erbovenop en giet er water bij tot de aardappelen net onder staan. Voeg een flinke snuf zout toe, breng aan de kook en laat 20 minuten zachtjes koken met het deksel op de pan.","Leg de rookworst de laatste 15 minuten bovenop de boerenkool mee te warmen, of verwarm hem volgens de verpakking in een pannetje heet water.","Snipper intussen de ui. Bak de spekblokjes 5 minuten in een droge koekenpan op middelhoog vuur tot ze knapperig zijn, voeg de ui toe en bak 3 minuten mee tot hij glazig is.","Haal de rookworst uit de pan en giet de aardappelen en boerenkool af, bewaar een kopje kookvocht. Stamp alles grof met de melk, een klontje boter en de mosterd. Voeg een scheut kookvocht toe als de stamppot te droog is en breng op smaak met zout en peper.","Roer het spek met de ui door de stamppot en serveer met de rookworst in plakjes erop. Een extra lik mosterd erbij maakt het af: de pittige mosterd en het gerookte vlees geven de stevige boerenkool precies de smaak die hij nodig heeft."]},{"id":70,"name":"Hutspot met gehaktbal","type":"Vlees","time":40,"emoji":"🥕","cuisine":"Nederlands","ingredients":[["kruimige aardappelen","200","g"],["winterpeen","150","g"],["ui","1","stuk"],["half-om-halfgehakt","125","g"],["paneermeel","1","el"],["ei","0.5","stuk"],["melk","50","ml"],["nootmuskaat","0.25","tl"]],"steps":["Schil de aardappelen, de winterpeen en de ui en snijd alles in grove stukken. Doe ze samen in een pan met water en zout, breng aan de kook en laat 20 tot 25 minuten koken tot de peen zacht is.","Meng intussen het gehakt met het paneermeel, het ei, de nootmuskaat en flink zout en peper. Kneed goed en vorm er met natte handen een stevige bal van.","Verhit een klontje boter in een koekenpan op middelhoog vuur en bak de gehaktbal in 3 tot 4 minuten rondom bruin. Zet het vuur laag, leg het deksel op de pan en laat de bal 15 tot 18 minuten gaar worden; keer hem halverwege.","Haal de gehaktbal uit de pan en giet 100 ml water bij het braadvet. Roer de aanbaksels los en laat 2 minuten inkoken tot een jus.","Giet de aardappelen, peen en ui af en stamp ze grof met de melk en een klontje boter. Breng op smaak met zout en peper.","Serveer de hutspot met de gehaktbal en de jus erover. De zoete peen en ui en het hartige gehakt met jus zijn een combinatie die al eeuwen op Nederlandse tafels staat."]},{"id":71,"name":"Zuurkoolstamppot met ananas en spek","type":"Vlees","time":35,"emoji":"🍍","cuisine":"Nederlands","ingredients":[["kruimige aardappelen","250","g"],["zuurkool","150","g"],["ananasstukjes (blik)","75","g"],["gerookte spekblokjes","60","g"],["ui","0.5","stuk"],["melk","50","ml"],["kerriepoeder","0.5","tl"],["geraspte belegen kaas","25","g"]],"steps":["Schil de aardappelen, snijd ze in stukken en kook ze 20 minuten in water met zout tot ze zacht zijn.","Laat de zuurkool uitlekken en kook hem de laatste 10 minuten in een apart pannetje met een bodempje water, zodat hij iets milder wordt. Laat de ananas uitlekken en snipper de ui.","Bak de spekblokjes 5 minuten in een droge koekenpan op middelhoog vuur tot ze knapperig zijn. Voeg de ui en het kerriepoeder toe en bak 3 minuten. Schep de ananas erbij en bak nog 2 minuten tot de stukjes licht kleuren.","Giet de aardappelen af en stamp ze met de melk en een klontje boter tot een grove puree. Knijp de zuurkool goed uit en roer hem erdoor, samen met het spekmengsel. Breng op smaak met peper en eventueel een snuf zout.","Schep de stamppot op de borden en strooi de kaas erover. Het zuur van de kool, het zoet van de ananas en het zoute spek houden elkaar mooi in balans, en de kerrie geeft er net wat warmte aan."]},{"id":72,"name":"Spitskoolstamppot met kipfilet en ketjap","type":"Vlees","time":30,"emoji":"🥬","cuisine":"Nederlands","ingredients":[["kruimige aardappelen","250","g"],["spitskool","200","g"],["kipfilet","125","g"],["ketjap manis","2","el"],["knoflook","1","teen"],["gember","1","cm"],["sambal oelek","0.5","tl"],["melk","50","ml"],["lente-ui","1","stuk"]],"steps":["Schil de aardappelen, snijd ze in stukken en kook ze 18 tot 20 minuten in water met zout. Snijd intussen de spitskool in dunne reepjes en kook die de laatste 5 minuten mee in dezelfde pan.","Snijd de kipfilet in blokjes, de knoflook en de gember fijn en de lente-ui in ringetjes.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 6 tot 8 minuten goudbruin. Voeg de knoflook en gember toe en bak 1 minuut mee. Roer de ketjap, de sambal en een scheutje water erdoor en laat 2 minuten pruttelen tot de saus stroperig om de kip hangt.","Giet de aardappelen en kool af en stamp ze grof met de melk en een klontje boter. Breng op smaak met zout en peper.","Schep de stamppot op de borden, leg de ketjapkip erop en strooi de lente-ui erover. De zoete, zoute ketjap maakt van de milde spitskool en de aardappel ineens een gerecht met Indische flair."]},{"id":73,"name":"Witlof met ham en kaas uit de oven","type":"Vlees","time":40,"emoji":"🧀","cuisine":"Nederlands","ingredients":[["witlof","2","stuk"],["achterham","2","sneden"],["geraspte belegen kaas","40","g"],["melk","150","ml"],["kruimige aardappelen","200","g"],["nootmuskaat","0.25","tl"],["mosterd","1","tl"]],"steps":["Verwarm de oven voor op 200°C. Snijd het harde kerntje uit de witlof en kook de stronkjes 10 minuten in water met zout. Laat ze goed uitlekken en knijp ze voorzichtig uit, anders wordt de schotel waterig.","Schil intussen de aardappelen, snijd ze in stukken en kook ze 18 tot 20 minuten gaar. Stamp ze met een scheutje melk en een klontje boter tot een smeuïge puree en breng op smaak met zout en peper.","Smelt 1 eetlepel boter in een steelpan op middelhoog vuur, roer 1 eetlepel bloem erdoor en bak 1 minuut. Giet de rest van de melk er in delen bij en blijf roeren tot een gladde saus die 3 tot 4 minuten zachtjes bindt. Roer de helft van de kaas, de mosterd en de nootmuskaat erdoor.","Wikkel elke witlofstronk in een snee ham en leg ze in een ingevette ovenschaal. Giet de saus erover en strooi de rest van de kaas erop. Bak 15 tot 20 minuten in de oven tot de bovenkant goudbruin borrelt.","Serveer de witlof met de puree ernaast en lepel de kaassaus erover. De lichte bitterheid van de witlof, de zoute ham en de romige saus zijn samen een echte klassieker."]},{"id":74,"name":"Ovenschotel met gehakt, prei en aardappelpuree","type":"Vlees","time":40,"emoji":"🥘","cuisine":"Nederlands","ingredients":[["kruimige aardappelen","250","g"],["half-om-halfgehakt","125","g"],["prei","1","stuk"],["ui","0.5","stuk"],["tomatenpuree","1","el"],["runderbouillon","50","ml"],["melk","50","ml"],["geraspte kaas","30","g"],["gedroogde tijm","0.5","tl"]],"steps":["Verwarm de oven voor op 200°C. Schil de aardappelen, snijd ze in stukken en kook ze 20 minuten in water met zout. Stamp ze met de melk en een klontje boter tot een gladde puree en breng op smaak met zout, peper en een snufje nootmuskaat.","Snijd intussen de prei in dunne ringen en was ze goed. Snipper de ui.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak het gehakt 5 minuten rul en bruin. Voeg de ui en prei toe en bak 5 minuten op middelhoog vuur tot de prei zacht is. Roer de tomatenpuree en tijm erdoor, bak 1 minuut en giet de bouillon erbij. Laat 3 minuten inkoken en breng op smaak met zout en peper.","Schep het gehaktmengsel in een ingevette ovenschaal en verdeel de puree erover. Trek er met een vork lijnen in en strooi de kaas erover.","Bak de ovenschotel 15 minuten in de oven tot de kaas goudbruin is. Serveer meteen; de knapperige kaaskorst, de zachte puree en het hartige gehakt met prei maken dit een gerecht waar iedereen van opschept."]},{"id":75,"name":"Rösti-ovenschotel met prei, champignons en kaas","type":"Vegetarisch","time":35,"emoji":"🥔","cuisine":"Europees","ingredients":[["röstirondjes (diepvries)","4","stuk"],["prei","1","stuk"],["champignons","125","g"],["knoflook","1","teen"],["crème fraîche","75","ml"],["geraspte kaas","40","g"],["mosterd","1","tl"],["gedroogde tijm","0.5","tl"]],"steps":["Verwarm de oven voor op 200°C. Snijd de prei in ringen en was ze goed. Snijd de champignons in kwarten en de knoflook fijn.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de champignons 5 minuten tot ze bruin zijn. Voeg de prei, knoflook en tijm toe en bak 4 minuten op middelhoog vuur tot de prei zacht is.","Roer de crème fraîche en de mosterd erdoor en laat 1 minuut warm worden. Breng op smaak met zout en peper.","Schep het groentemengsel in een ingevette ovenschaal. Leg de röstirondjes er dakpansgewijs bovenop en strooi de kaas erover.","Bak 20 tot 25 minuten in de oven tot de rösti krokant en de kaas goudbruin is. Serveer met een groene salade; de knapperige aardappel bovenop de romige prei en champignons is pure troost op een bord."]},{"id":76,"name":"Macaroni met kaas, champignons en spinazie","type":"Vegetarisch","time":25,"emoji":"🧀","cuisine":"Europees","ingredients":[["macaroni","100","g"],["champignons","125","g"],["spinazie","100","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["melk","150","ml"],["geraspte belegen kaas","50","g"],["nootmuskaat","0.25","tl"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de macaroni volgens de verpakking beetgaar (meestal 8 tot 10 minuten). Giet af en bewaar een kopje kookvocht.","Snijd intussen de champignons in plakjes, snipper de ui en snijd de knoflook fijn.","Verhit 1 eetlepel olie in een hapjespan op hoog vuur en bak de champignons 5 minuten bruin. Voeg de ui en knoflook toe en bak 3 minuten op middelhoog vuur.","Voeg een klontje boter toe, strooi er 1 eetlepel bloem over en roer 1 minuut. Giet de melk er in delen bij en blijf roeren tot een gladde saus die 3 minuten zachtjes bindt. Roer de kaas en de nootmuskaat erdoor tot de kaas gesmolten is.","Laat de spinazie in 1 tot 2 minuten in de saus slinken. Schep de macaroni erdoor, voeg een scheutje kookvocht toe als de saus te dik is en breng op smaak met zout en peper.","Serveer direct, eventueel met wat extra geraspte kaas erover. De romige kaassaus, de hartige champignons en de frisse spinazie maken van simpele macaroni een volwaardige maaltijd."]},{"id":77,"name":"Nasi goreng met kip en satésaus","type":"Vlees","time":30,"emoji":"🍚","cuisine":"Indonesisch","ingredients":[["rijst","80","g"],["kipdijfilet","125","g"],["ei","1","stuk"],["prei","0.5","stuk"],["wortel","1","stuk"],["knoflook","1","teen"],["ketjap manis","2","el"],["sambal oelek","1","tl"],["satésaus","50","ml"]],"steps":["Kook de rijst volgens de verpakking en spreid hem uit op een bord om af te koelen en te drogen; rijst van gisteren is nog beter. Snijd de kip in blokjes, de prei in dunne ringen, de wortel in kleine blokjes en de knoflook fijn.","Verhit 1 eetlepel olie in een wok op hoog vuur en bak de kip 6 tot 8 minuten goudbruin. Voeg de wortel en prei toe en wok 3 minuten mee.","Voeg de knoflook en sambal toe en wok 1 minuut. Schep de rijst erbij, giet de ketjap erover en wok 3 minuten op hoog vuur tot alles heet en egaal bruin is. Breng op smaak met zout.","Bak het ei in een aparte koekenpan in een beetje olie 2 tot 3 minuten tot het wit gestold is en de dooier nog zacht. Verwarm de satésaus in een pannetje of kort in de magnetron.","Schep de nasi in een kom, leg het ei erop en lepel de satésaus ernaast. Wie wil, voegt nog wat extra sambal toe; de zoete ketjap, de pittige sambal en de romige pindasaus zijn samen het hart van de Indische keuken."]},{"id":78,"name":"Bami goreng met omelet en kroepoek","type":"Vegetarisch","time":25,"emoji":"🍜","cuisine":"Indonesisch","ingredients":[["mie","80","g"],["ei","1","stuk"],["prei","0.5","stuk"],["wortel","1","stuk"],["taugé","50","g"],["knoflook","1","teen"],["ketjap manis","2","el"],["sambal oelek","0.5","tl"],["kroepoek","4","stuk"]],"steps":["Kook de mie volgens de verpakking (meestal 3 tot 4 minuten), giet af en spoel kort met koud water zodat hij niet plakt.","Klop het ei los met een snuf zout. Verhit een beetje olie in een koekenpan op middelhoog vuur en bak in 2 minuten een dunne omelet. Laat hem op een bord glijden, rol hem op en snijd hem in reepjes.","Snijd de prei in dunne ringen, de wortel in lucifers en de knoflook fijn. Verhit 1 eetlepel olie in een wok op hoog vuur en wok de prei en wortel 4 minuten. Voeg de knoflook en sambal toe en wok 1 minuut mee.","Doe de mie en de ketjap in de wok en wok 2 tot 3 minuten tot alles heet en glanzend bruin is. Schep de taugé er op het laatst door en breng op smaak met zout en peper.","Verdeel de bami over de borden, leg de omeletreepjes erop en serveer met de kroepoek. De knapperige kroepoek en de zachte omelet geven de zoet-pittige bami precies het contrast dat je van een toko-maaltijd verwacht."]},{"id":79,"name":"Babi ketjap met rijst en komkommer","type":"Vlees","time":35,"emoji":"🍖","cuisine":"Indonesisch","ingredients":[["varkenslapjes","150","g"],["ui","1","stuk"],["knoflook","1","teen"],["gember","2","cm"],["ketjap manis","3","el"],["sambal oelek","0.5","tl"],["rijst","80","g"],["komkommer","0.25","stuk"],["limoen","0.25","stuk"]],"steps":["Snijd het vlees in blokjes van 2 centimeter. Snipper de ui en snijd de knoflook en gember fijn.","Verhit 1 eetlepel olie in een hapjespan op hoog vuur en bak het vlees 4 tot 5 minuten rondom bruin. Zet het vuur middelhoog, voeg de ui toe en bak 4 minuten tot hij zacht is. Voeg de knoflook en gember toe en bak 1 minuut mee.","Giet de ketjap, de sambal en 150 ml water erbij. Breng aan de kook, zet het vuur laag en laat 20 minuten met het deksel op de pan sudderen tot het vlees mals is. Haal de laatste 5 minuten het deksel eraf zodat de saus stroperig wordt.","Kook intussen de rijst volgens de v
