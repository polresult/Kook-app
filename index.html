"],["mayonaise","0.5","el"],["griekse yoghurt","0.5","el"],["kerriepoeder","0.25","tl"],["appel","0.25","stuk"],["bieslook","0.25","bosje"]],"steps":["Kook de eieren in 10 minuten hard en spoel ze koud.","Pel de eieren en hak ze fijn.","Meng de eieren met de mayonaise, griekse yoghurt, kerriepoeder en fijngesneden bieslook en wat koriander. Breng op smaak met peper en zout.","Beleg het roggebrood met dunne plakjes groene appel.","Schep er een flinke lepel curry-eiersalade op en leg de haringfilets erbovenop.","Maak af met dille en wat ingelegde rode ui."],"photo":"photos/culy-437.webp"},{"id":438,"name":"Kikkererwten-arrabiata met lasagnereepjes","type":"Vegetarisch","time":15,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/kikkererwten-arrabiata-jamie-oliver/","ingredients":[["knoflook","1","teen"],["rode peper","0.5","stuk"],["passata","150","g"],["kikkererwten","150","g"],["lasagnevellen","60","g"],["rucola","20","g"],["parmezaan","15","g"]],"steps":["Bak de in plakjes gesneden knoflook en de ringetjes rode peper goudbruin in een koekenpan met wat olijfolie.","Giet de passata erbij met de kikkererwten en de helft van hun vocht en roer 2 minuten op middelhoog vuur.","Snijd de lasagnevellen in repen van 2 cm.","Doe de grof gehakte rucola en de reepjes pasta in de pan en giet er zoveel kokend water bij dat de pasta net onderstaat.","Laat 4 minuten zachtjes koken tot de pasta het meeste water heeft opgenomen en je een mooie saus hebt.","Breng op smaak, strooi er wat extra rucola en geraspte parmezaan over en serveer."],"photo":"photos/culy-438.webp"},{"id":439,"name":"Makkelijke pasta met aardpeer en parmezaan","type":"Vegetarisch","time":40,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pasta-aardpeer/","ingredients":[["aardpeer","150","g"],["spaghetti","90","g"],["roomkaas","40","g"],["knoflook","0.5","teen"],["citroen","0.25","stuk"],["parmezaan","20","g"],["peterselie","0.25","bosje"],["roomboter","10","g"]],"steps":["Verwarm de oven voor op 200 graden. Rooster de in blokjes gesneden aardpeer met olijfolie, peper en zout 20 minuten tot hij zacht is.","Stamp de geroosterde aardpeer grof tot een ruwe puree.","Kook de spaghetti al dente en bewaar wat kookvocht.","Bak de knoflook met de citroenrasp in de boter en roer de roomkaas met een scheut kookvocht erdoor tot een gladde saus.","Pureer de aardpeer door de saus en meng met de pasta; voeg kookvocht toe als het te dik is.","Serveer met peterselie, zwarte peper en extra parmezaan."],"photo":"photos/culy-439.webp","season":"winter"},{"id":440,"name":"Pasta alla vodka met rigatoni","type":"Vegetarisch","time":30,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/culy-homemade-de-makkelijkste-pasta-alla-vodka-ooit/","ingredients":[["rigatoni","125","g"],["ui","0.25","stuk"],["knoflook","1","teen"],["tomatenpuree","1.5","el"],["wodka","15","ml"],["room","45","ml"],["parmezaan","30","g"],["basilicum","0.25","bosje"]],"steps":["Bak de gesnipperde ui en knoflook 5 tot 7 minuten zacht in olijfolie op laag vuur.","Voeg de tomatenpuree en een snuf gedroogde chili toe en bak 5 tot 7 minuten tot de puree donkerrood kleurt.","Giet de wodka erbij en zet het vuur laag.","Laat de room wennen met een lepel heet pastawater en roer hem er dan langzaam door tot een gladde saus.","Kook de rigatoni al dente en schep hem met wat pastawater en de helft van de parmezaan door de saus tot alles glanst.","Serveer met extra parmezaan en verse basilicum."],"photo":"photos/culy-440.webp"},{"id":441,"name":"Gnocchi met paddenstoelen, salie en bruine boter","type":"Vegetarisch","time":25,"emoji":"🍄","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/gnocchi-met-paddenstoelen-salie-en-bruine-boter/","ingredients":[["gnocchi","200","g"],["gemengde paddenstoelen","100","g"],["roomboter","20","g"],["salie","0.25","bosje"],["knoflook","0.5","teen"],["parmezaan","12","g"],["citroen","0.25","stuk"],["olijfolie","0.5","el"]],"steps":["Bak de grof gescheurde paddenstoelen in porties hard aan in hete olijfolie tot ze goed bruin zijn. Breng op smaak met peper en zout en schep uit de pan.","Smelt de boter in dezelfde pan en voeg de salie toe. Laat de boter goudbruin en nootachtig worden terwijl de salie krokant wordt.","Voeg de laatste minuut de fijngehakte knoflook toe, let op dat hij niet verbrandt.","Kook intussen de gnocchi volgens de verpakking en bewaar wat kookwater.","Bak de gnocchi 3 tot 4 minuten mee in de bruine boter tot ze hier en daar goudbruin kleuren, en schep de paddenstoelen terug.","Roer de parmezaan, het citroensap en een scheut kookwater erdoor tot een saus en maak af met extra parmezaan."],"photo":"photos/culy-441.webp","season":"herfst"},{"id":442,"name":"Hot chili oil noodles met judasoren en omelet","type":"Vegetarisch","time":30,"emoji":"🍜","cuisine":"Chinees","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/hot-chili-oil-noodles-met-judasoren-en-omelet/","ingredients":[["tarwenoedels","100","g"],["judasoren","7","g"],["ei","1","stuk"],["bosui","1","stuk"],["knoflook","1","teen"],["sojasaus","0.75","el"],["chilivlokken","0.75","el"],["sesamzaad","0.5","el"]],"steps":["Week de gedroogde judasoren 30 tot 45 minuten in lauw water tot ze zacht zijn, spoel ze en snijd in reepjes.","Kook de geweekte judasoren 2 tot 3 minuten en laat uitlekken.","Doe de fijngehakte knoflook, het witte van de bosui, de chilivlokken, sesamzaad en wat zout in een hittebestendige kom.","Verhit neutrale olie tot hij net siddert en schenk die over het chilimengsel zodat het sist. Roer er de sojasaus, wat zwarte azijn, suiker en sesamolie door.","Bak van het losgeklopte ei een dunne omelet, rol hem op en snijd in reepjes.","Kook de noedels, meng ze met de judasoren, de chili-olie en de omeletreepjes en maak af met het groen van de bosui."],"photo":"photos/culy-442.webp"},{"id":443,"name":"Plaattaart met pompoen, ricotta en hazelnoot","type":"Vegetarisch","time":50,"emoji":"🥧","cuisine":"Europees","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/plaattaart-met-pompoen/","ingredients":[["bladerdeeg","1","plak"],["pompoen","100","g"],["ricotta","50","g"],["hazelnoten","20","g"],["salie","0.25","bosje"],["roomboter","10","g"],["eidooier","0.25","stuk"]],"steps":["Verwarm de oven voor op 180 graden en rol het bladerdeeg uit op een bakplaat. Prik gaatjes en bestrooi met wat broodkruim.","Meng de ricotta met wat fijngehakte salie en smeer dit over het deeg.","Leg flinterdunne plakjes pompoen in een mooi patroon erop.","Bestrijk de rand met eidooier en een scheutje melk en besprenkel de pompoen met olijfolie. Bak 30 minuten tot de taart goudbruin is.","Rooster intussen de gehakte hazelnoten en voeg de boter en wat salie toe tot de boter bruin en nootachtig is.","Strooi de hazelnootcrumble over de plaattaart en serveer warm of koud."],"photo":"photos/culy-443.webp","season":"herfst"},{"id":444,"name":"Winterse salade met aardpeer, boerenkool en granaatappel","type":"Vegetarisch","time":45,"emoji":"🥗","cuisine":"Nederlands","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/winterse-salade-met-aardpeer/","ingredients":[["aardpeer","75","g"],["boerenkool","30","g"],["granaatappelpitten","15","g"],["hazelnoten","12","g"],["olijfolie","1","el"],["ahornsiroop","0.25","el"]],"steps":["Verwarm de oven voor op 180 graden. Boen de aardpeer en snijd hem in lange plakjes.","Hussel de aardpeer met olijfolie, peper en zout en rooster 30 tot 35 minuten tot hij gaar en krokant is.","Schuif de aardpeer opzij, verdeel de boerenkool over de plaat en rooster nog 5 tot 10 minuten tot krokante chips.","Rooster de hazelnoten goudbruin en hak ze grof.","Klop de olijfolie met de ahornsiroop, peper en zout tot een dressing.","Meng de aardpeer, granaatappelpitten en hazelnoten met de dressing en schep de boerenkoolchips erdoor."],"photo":"photos/culy-444.webp","season":"winter"},{"id":445,"name":"Orzo met romige pompoen en feta","type":"Vegetarisch","time":35,"emoji":"🍝","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/orzo-gerecht-met-pompoen/","ingredients":[["flespompoen","0.25","stuk"],["orzo","100","g"],["feta","25","g"],["knoflook","0.25","teen"],["tijm","1","takje"],["room","25","ml"],["chilivlokken","0.25","tl"],["olijfolie","1","el"]],"steps":["Schil de pompoen en snijd hem in blokjes.","Bak de blokjes pompoen kort aan in olijfolie en voeg de knoflook, tijm en chilivlokken toe. Bak 1 minuut mee.","Giet er water bij tot de pompoen voor driekwart onderstaat, doe het deksel erop en laat op laag vuur in 15 minuten zacht worden.","Giet het vocht af en bewaar het. Pureer de pompoen met een staafmixer glad en roer de room erdoor.","Kook de orzo volgens de verpakking en meng met de pompoensaus; voeg wat pompoenvocht toe voor een smeuïger geheel.","Verdeel over de borden en strooi er verkruimelde feta en zwarte peper over."],"photo":"photos/culy-445.webp","season":"herfst"},{"id":446,"name":"Broodje gehaktbal met Aziatische saus","type":"Vlees","time":15,"emoji":"🥪","cuisine":"Aziatisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/broodje-gehaktbal/","ingredients":[["briochebol","1","stuk"],["gehaktbal","1","stuk"],["cashewnoten","1","el"],["limoen","0.25","stuk"],["sriracha","1","tl"],["sojasaus","1","tl"],["sesamolie","1","tl"],["mayonaise","1","el"]],"steps":["Roer de mayonaise, sriracha, sojasaus en sesamolie tot een sausje.","Snijd de briochebol doormidden en lepel het sausje op de onderste helft.","Snijd dikke plakken van de warme gehaktbal en leg die erop.","Maal de cashewnoten tot grof kruim en strooi dat over de gehaktbal.","Werk af met verse koriander en wat limoenrasp.","Leg de bovenkant erop en eet het broodje meteen."],"photo":"photos/culy-446.webp"},{"id":447,"name":"Traybake met gehaktballetjes, venkel en bonen","type":"Vlees","time":70,"emoji":"🍖","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/traybake-met-gehaktballetjes-jamie-oliver/","ingredients":[["rundergehakt","100","g"],["venkel","80","g"],["rode ui","0.5","stuk"],["wortel","1","stuk"],["cannellinibonen","100","g"],["pruimtomaten","200","g"],["geroosterde paprika","115","g"],["feta","12","g"]],"steps":["Verwarm de oven voor op 200 graden. Leg de venkel in partjes, rode ui en wortel op een bakplaat, meng met olijfolie, peper en zout en rooster 40 minuten.","Pulseer de uitgelekte bonen kort in een keukenmachine, voeg het gehakt met oregano, peper en zout toe en pulseer net door elkaar.","Draai er balletjes van en bak ze met wat olie rondom goudbruin.","Mix de pruimtomaten en geroosterde paprika met citroensap, peper en zout glad tot een saus.","Giet de saus over de geroosterde groenten, leg de gehaktballetjes erin en bak nog 20 minuten.","Verkruimel de feta erover en maak af met citroenrasp en wat venkelgroen."],"photo":"photos/culy-447.webp"},{"id":448,"name":"Pastaschotel uit de oven met pittige chorizo","type":"Vlees","time":40,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pasta-schotel-uit-de-oven-met-pittige-chorizo/","ingredients":[["penne","125","g"],["chorizo","40","g"],["zongedroogde tomaten","75","g"],["knoflook","1","teen"],["roomboter","15","g"],["bloem","1","el"],["melk","100","ml"],["parmezaan","20","g"]],"steps":["Verwarm de oven voor op 180 graden en kook de penne beetgaar.","Meng de pasta met de blokjes chorizo, fijngehakte knoflook, de zongedroogde tomaten in reepjes en een scheut olijfolie.","Smelt de boter, roer de bloem erdoor en bak kort. Voeg al roerend de melk toe tot een gladde bechamel en breng op smaak met nootmuskaat, peper en zout.","Schep de pasta in een ovenschaal en giet de bechamelsaus erover.","Bestrooi met parmezaan en bak 20 minuten tot de schotel goudbruin is.","Maak af met verse basilicum en serveer met een frisse salade."],"photo":"photos/culy-448.webp"},{"id":449,"name":"Turkse gevulde broodjes met linzen en gehakt","type":"Vlees","time":90,"emoji":"🥟","cuisine":"Turks","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/turkse-gevulde-broodjes/","ingredients":[["bloem","165","g"],["groene linzen","35","g"],["rundergehakt","35","g"],["ui","0.33","stuk"],["melk","25","ml"],["yoghurt","25","ml"],["gist","1","tl"],["maanzaad","0.25","el"]],"steps":["Klop melk, yoghurt, olie, een ei, suiker en de gist los, voeg de bloem toe en kneed tot een soepel deeg. Laat afgedekt rijzen.","Kook de linzen 15 minuten beetgaar en giet af.","Fruit de gesnipperde ui zacht, voeg het gehakt toe en bak het rul en gaar.","Roer de linzen, peterselie, paprikavlokken, peper en zout erdoor en laat even staan.","Rol het deeg uit, verdeel de vulling langs een rand, rol op en snijd er diagonale broodjes van.","Bestrijk met eigeel, bestrooi met maanzaad en bak 30 minuten op 175 graden tot ze goudbruin zijn."],"photo":"photos/culy-449.webp"},{"id":450,"name":"Griekse couscous met kofte, feta en tomaat","type":"Vlees","time":30,"emoji":"🍖","cuisine":"Grieks","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/koken-met-aanbiedingen-griekse-couscous-met-kofte-feta-en-tomaat/","ingredients":[["couscous","70","g"],["kofte","60","g"],["griekse yoghurt","50","g"],["feta","25","g"],["tomaat","50","g"],["courgette","0.25","stuk"],["vijgen","1","stuk"],["munt","0.25","bosje"]],"steps":["Bereid de couscous volgens de verpakking, roer los met een vork en breng op smaak met peper en zout.","Rijg de kofte aan spiesen en bak ze in wat olijfolie in ongeveer 8 minuten rondom gaar.","Snijd de tomaat, courgette, feta en vijgen in blokjes en hak de munt en wat koriander fijn.","Bak de courgette in 8 minuten gaar in een koekenpan.","Meng de courgette, tomaat, vijg, feta en kruiden door de couscous.","Verdeel over de borden en serveer met de kofte en de griekse yoghurt."],"photo":"photos/culy-450.webp"},{"id":451,"name":"Sauzige gnocchi met salsiccia en venkel","type":"Vlees","time":25,"emoji":"🥔","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/sauzige-gnocchi-salsiccia-venkel/","ingredients":[["gnocchi","150","g"],["venkelworst","125","g"],["venkel","0.5","stuk"],["knoflook","0.5","teen"],["witte wijn","50","ml"],["roomboter","15","g"],["parmezaan","15","g"],["chilivlokken","0.25","tl"]],"steps":["Pers de venkelworst uit het vel in een hete pan met olijfolie en bak het vlees rul en goudbruin. Schep uit de pan.","Doe wat venkelzaad en de chilivlokken in de pan, voeg de venkel in reepjes en de knoflook toe en bak 6 tot 8 minuten tot de venkel zacht is.","Blus af met de witte wijn en laat bijna volledig inkoken terwijl je de aanbaksels losschraapt.","Kook de gnocchi in gezouten water en voeg ze met een scheut pastawater toe aan de pan. Laat een paar minuten pruttelen tot een glanzende saus.","Schep het worstvlees terug, zet het vuur laag en roer de boter erdoor tot alles bindt.","Roer de parmezaan erdoor tot romig en breng op smaak met peper."],"photo":"photos/culy-451.webp"},{"id":452,"name":"Felgroene pasta met garnalen, ricotta en pistache","type":"Vis","time":20,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pasta-met-garnalen/","ingredients":[["spaghetti","125","g"],["gamba","5","stuk"],["ricotta","125","g"],["basilicum","0.5","bosje"],["knoflook","1","teen"],["citroen","0.25","stuk"],["pistachenoten","10","g"],["chilivlokken","0.25","tl"]],"steps":["Mix de basilicum met een paar eetlepels ricotta glad tot een felgroene saus.","Kook de spaghetti al dente in ruim gezouten water en bewaar wat kookvocht.","Bak de garnalen een minuut aan in hete olijfolie terwijl je ze in beweging houdt.","Haal van het vuur en roer de geraspte knoflook en chilivlokken erdoor.","Voeg de basilicumsaus en de rest van de ricotta toe met wat kookvocht en schep de pasta erdoor.","Knijp de citroen erover, breng op smaak met zwarte peper en strooi er gehakte pistache over."],"photo":"photos/culy-452.webp","season":"zomer"},{"id":453,"name":"Lentepasta met tonijn, limoenblad en groene peper","type":"Vis","time":20,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/lentepasta-tonijn-limoenblad-groene-peper/","ingredients":[["orecchiette","90","g"],["tonijn uit blik","65","g"],["doperwten","75","g"],["sjalot","0.5","stuk"],["groene peper","0.5","stuk"],["room","25","ml"],["citroen","0.25","stuk"],["munt","0.25","bosje"]],"steps":["Kook de orecchiette beetgaar en bewaar wat pastawater.","Fruit de fijngehakte sjalot, groene peper en een paar limoenblaadjes zacht en geurig in olijfolie.","Voeg de uitgelekte tonijn toe met veel zwarte peper en een deel van de doperwten en laat kort mee warmen. Vis de limoenblaadjes eruit.","Pureer de rest van de doperwten met de room, het citroensap en wat olijfolie tot een romig papje.","Meng de pasta door het tonijnmengsel en roer het doperwtenpapje en wat pastawater erdoor.","Maak af met parmezaan, munt en wat basilicum."],"photo":"photos/culy-453.webp","season":"lente"},{"id":454,"name":"Aardpeersoep met krokante prosciutto en hazelnoot","type":"Vlees","time":50,"emoji":"🥣","cuisine":"Europees","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/soep-van-aardperen-topinamboer/","ingredients":[["aardpeer","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["kippenbouillon","200","ml"],["room","75","ml"],["prosciutto","1.5","plak"],["hazelnoten","12","g"],["tijm","1","takje"]],"steps":["Verwarm de oven voor op 180 graden. Rooster de geschilde aardpeer in stukjes met wat ui, knoflook, zeezout en olijfolie 15 minuten tot ze bruin en zacht zijn.","Bak de plakken prosciutto tussen twee vellen bakpapier in 6 tot 10 minuten krokant in de oven.","Fruit de gesnipperde ui en knoflook in 10 minuten zacht in een soeppan zonder te kleuren.","Voeg de geroosterde aardpeer en de tijm toe en giet er bouillon bij tot de groenten net onderstaan. Kook 10 minuten.","Roer de room erdoor, verwijder de tijm en pureer de soep helemaal glad.","Rooster de hazelnoten en hak ze grof. Serveer de soep met de verkruimelde prosciutto en hazelnoot."],"photo":"photos/culy-454.webp","season":"winter"},{"id":455,"name":"Gegrilde paprikasoep met mascarpone","type":"Vegetarisch","time":30,"emoji":"🥣","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/paprikasoep-met-mascarpone/","ingredients":[["rode paprika","0.5","stuk"],["geroosterde paprika","50","g"],["ui","0.25","stuk"],["gerookt paprikapoeder","0.25","tl"],["groentebouillon","125","ml"],["mascarpone","1","el"],["hazelnoten","10","g"],["oregano","0.25","bosje"]],"steps":["Snijd de ui, de verse paprika en de geroosterde paprika in grove stukken.","Fruit de ui met een snuf zout zacht in olijfolie in een soeppan.","Voeg het gerookte paprikapoeder en een snuf chili toe en bak 1 minuut. Doe de paprika erbij en giet de bouillon erop.","Breng aan de kook en laat 20 minuten zachtjes koken tot alles zacht is.","Rooster intussen de hazelnoten en hak ze grof.","Pureer de soep glad, roer de mascarpone erdoor en garneer met oregano, hazelnoot en olijfolie."],"photo":"photos/culy-455.webp"},{"id":456,"name":"Pindasoep met citroengras, tauge en chili","type":"Vegetarisch","time":30,"emoji":"🥣","cuisine":"Aziatisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pindasoep/","ingredients":[["zoete aardappel","0.5","stuk"],["ui","0.25","stuk"],["pindanoten","60","g"],["pindakaas","0.75","el"],["citroengras","0.25","stuk"],["gember","5","g"],["groentebouillon","300","ml"],["tauge","25","g"]],"steps":["Verwarm de oven voor op 175 graden en rooster de pindanoten 15 minuten.","Fruit de ui, knoflook, gember en het citroengras in wat olie en voeg wat sambal toe.","Doe de zoete aardappel in stukjes en de pindakaas erbij en laat kort meebakken.","Giet de bouillon erbij met het grootste deel van de geroosterde pinda's en kook tot de zoete aardappel gaar is.","Verwijder het citroengras en pureer de soep glad.","Schep in kommen en maak af met tauge, koriander, de rest van de pinda's en een partje limoen."],"photo":"photos/culy-456.webp"},{"id":457,"name":"Sopa de lima: Mexicaanse kippensoep met limoen","type":"Vlees","time":35,"emoji":"🥣","cuisine":"Mexicaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/mexicaanse-limoensoep/","ingredients":[["kipfilet","100","g"],["tortilla","1","stuk"],["ui","0.25","stuk"],["knoflook","0.5","teen"],["tomatenblokjes","100","g"],["kippenbouillon","375","ml"],["limoen","0.75","stuk"],["avocado","0.25","stuk"]],"steps":["Snijd de tortilla in repen en bak ze in delen goudbruin en krokant in olie. Laat uitlekken.","Fruit de gesnipperde ui en wat fijngesneden rode peper 4 minuten zacht. Pers de knoflook erbij en voeg oregano, een kruidnagel en een laurierblad toe.","Schenk de tomatenblokjes erbij, laat 5 minuten koken en giet de hete bouillon erop.","Leg de kipfilet in de soep en gaar hem zachtjes. Haal hem eruit, trek hem in reepjes en roer terug met het limoensap.","Breng op smaak met peper en zout.","Schep in kommen en garneer met avocado, koriander en de krokante tortillareepjes."],"photo":"photos/culy-457.webp"},{"id":458,"name":"Thaise gazpacho met curry en kokosmelk","type":"Vegetarisch","time":20,"emoji":"🥣","cuisine":"Thais","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/gazpacho-thaise-twist/","ingredients":[["groene paprika","0.25","stuk"],["gele paprika","0.25","stuk"],["komkommer","0.25","stuk"],["kokosmelk","100","ml"],["gele currypasta","0.25","tl"],["citroengras","0.5","stuk"],["limoen","0.5","stuk"],["koriander","0.25","bosje"]],"steps":["Doe de paprika's, komkommer, koriander, wat munt, gember en de currypasta in een blender en mix glad.","Voeg het fijngesneden citroengras, de kokosmelk, een scheut water, wat vissaus of zout, rijstazijn, het limoensap en een teentje knoflook toe.","Mix alles tot een gladde, romige soep.","Proef en breng op smaak met zout, peper of extra limoen.","Laat de gazpacho volledig afkoelen in de koelkast.","Serveer koud met croutons en wat druppels chili-olie."],"photo":"photos/culy-458.webp","season":"zomer"},{"id":459,"name":"Winterse salade met roodlof, sinaasappel en walnoot","type":"Vegetarisch","time":60,"emoji":"🥗","cuisine":"Nederlands","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/winterse-salade-scheepskameel/","ingredients":[["rode kool","0.25","stuk"],["roodlof","1","stronk"],["sinaasappel","1","stuk"],["walnoten","12","g"],["walnotenpasta","25","g"],["sjalot","2","stuk"],["sherryazijn","1","el"],["korianderzaad","0.25","el"]],"steps":["Fruit de fijngesneden sjalot zacht, voeg rode wijn toe tot de sjalot onderstaat en laat bijna droog inkoken. Mix met sherryazijn en olie tot een gladde dressing.","Stoof fijngesneden rode kool met wat dressing en water zacht en pureer met de walnotenpasta tot een gladde crème.","Rooster grof gesneden rode kool kort heet in de oven tot hij een donker randje krijgt.","Halveer de roodlof, bak de snijkant donkerbruin en gaar hem met het sap van de sinaasappel in de oven.","Rooster de walnoten en de korianderzaadjes en snijd het vruchtvlees van de sinaasappel in plakjes.","Smeer de rodekoolcrème op het bord, leg de geroosterde kool, de roodlof en de sinaasappel erop en bestrooi met walnoot en korianderzaad."],"photo":"photos/culy-459.webp","season":"winter"},{"id":460,"name":"Geroosterde bloemkoolsalade met mango en limoendressing","type":"Vegetarisch","time":45,"emoji":"🥗","cuisine":"Indiaas","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/bloemkoolsalade/","ingredients":[["bloemkool","0.25","stuk"],["mango","0.25","stuk"],["waterkers","50","g"],["amandelen","8","g"],["komijn","0.25","tl"],["kurkuma","0.25","tl"],["limoen","0.25","el"],["munt","0.25","bosje"]],"steps":["Verwarm de oven voor op 220 graden. Meng de komijn, kurkuma en wat warme specerijen als kaneel en kruidnagel.","Verdeel de bloemkoolroosjes over een bakplaat, druppel er olie over en bestrooi met de specerijen, peper en zout.","Rooster de bloemkool 30 minuten tot hij gaar en krokant is.","Mix voor de dressing het limoensap met wat gember, groene chili, zout, suiker, rijstazijn en olijfolie glad.","Meng de waterkers met koriander en munt en verdeel over een schaal.","Schep de bloemkool erover, leg de mangoslierten ertussen, besprenkel met dressing en strooi geroosterde amandelen erover."],"photo":"photos/culy-460.webp"},{"id":461,"name":"Aardappelsalade met chimichurri","type":"Vegetarisch","time":30,"emoji":"🥔","cuisine":"Zuid-Amerikaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/aardappelsalade-recept-chimichurri/","ingredients":[["krieltjes","240","g"],["peterselie","0.25","bosje"],["bieslook","0.25","bosje"],["oregano","2","takje"],["rode peper","0.25","stuk"],["rodewijnazijn","1","el"],["olijfolie","1","el"],["knoflook","0.25","teen"]],"steps":["Spoel de krieltjes en kook ze in de schil in ongeveer 20 minuten gaar. Giet af en laat uitstomen.","Hak de peterselie, bieslook, oregano en rode peper zo fijn mogelijk.","Meng de kruiden met de rodewijnazijn, een snuf grof zeezout en de olijfolie.","Rasp de knoflook door de chimichurri en meng goed.","Plet de warme aardappels een beetje met de platte kant van een mes zodat de schilletjes barsten.","Giet de chimichurri over de aardappels en meng. Serveer lauwwarm of koud."],"photo":"photos/culy-461.webp","season":"zomer"},{"id":462,"name":"Onze favoriete snelle pasta met cherrytomaat","type":"Vegetarisch","time":15,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/onze-favoriete-snelle-pasta/","ingredients":[["tagliatelle","100","g"],["cherrytomaten","150","g"],["knoflook","0.5","teen"],["tomatenpuree","0.5","el"],["balsamicoazijn","1","el"],["worcestersaus","0.5","el"],["parmezaan","15","g"],["basilicum","0.25","bosje"]],"steps":["Kook de tagliatelle al dente in ruim gezouten water.","Bak de tomatenpuree kort aan in wat olie in een steelpan.","Voeg de gehalveerde cherrytomaten toe en bak even mee. Roer de knoflook, balsamicoazijn en worcestersaus erdoor.","Voeg een snuf suiker en een paar eetlepels pastawater toe en laat 5 tot 7 minuten pruttelen tot je de tomaten fijn kunt stampen.","Giet de pasta af, meng met de saus en de fijngesneden basilicum en warm nog even door.","Serveer met een scheut olijfolie en geraspte parmezaan."],"photo":"photos/culy-462.webp"},{"id":463,"name":"Broodsoep met borlottibonen en krokante salie","type":"Vegetarisch","time":20,"emoji":"🥣","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/broodsoep-borlottibonen-jamie-20-minuten/","ingredients":[["oudbakken brood","75","g"],["borlottibonen","200","g"],["tomatenblokjes","200","g"],["ui","0.25","stuk"],["knoflook","0.5","teen"],["groentebouillon","175","ml"],["mozzarella","30","g"],["salie","0.25","bosje"]],"steps":["Bak de salieblaadjes krokant in olijfolie en schep ze eruit, zodat de geurige olie in de pan blijft.","Fruit de fijngesneden ui, wortel en bleekselderij met de knoflook een paar minuten zacht in de pan.","Zet het vuur hoog, giet de tomatenblokjes erbij en prak ze stuk.","Voeg de bonen met hun vocht, de bouillon en het in stukken gescheurde brood toe en prak alles 5 minuten door elkaar. Rasp er parmezaan bij en breng op smaak.","Scheur de mozzarella erover en zet de pan 5 minuten onder de hete grill tot de kaas smelt en de soep pruttelt.","Strooi de krokante salie erover en serveer met een scheut olijfolie."],"photo":"photos/culy-463.webp"},{"id":464,"name":"Maissoep met kokosmelk en limoen","type":"Vegetarisch","time":35,"emoji":"🌽","cuisine":"Aziatisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/maissoep-met-kokosmelk/","ingredients":[["maiskolf","1","stuk"],["ui","0.25","stuk"],["kokosmelk","100","ml"],["komijnzaad","0.25","tl"],["kurkuma","0.25","tl"],["gerookt paprikapoeder","0.25","tl"],["limoen","0.25","stuk"],["koriander","0.25","bosje"]],"steps":["Snijd de maiskorrels van de kolf. Breek de kale kolf en trek er met wat koriandersteeltjes in 15 minuten een geurige bouillon van. Zeef de bouillon.","Fruit de gesnipperde ui een paar minuten zacht in wat boter of olie.","Rooster het komijnzaad kort in een droge pan en plet het in een vijzel.","Voeg het komijnzaad, de kurkuma en het gerookte paprikapoeder bij de ui en bak kort mee.","Doe de kokosmelk, de maiskorrels, gehakte koriander en een deel van de bouillon erbij en laat 10 minuten pruttelen.","Breng op smaak met zout en limoensap en voeg wat bouillon toe als de soep te dik is."],"photo":"photos/culy-464.webp"},{"id":465,"name":"Goudgele paddenstoelensoep met orzo","type":"Vegetarisch","time":40,"emoji":"🍄","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/paddenstoelensoep-orzo-recept-alison-roman/","ingredients":[["paddenstoelen","90","g"],["orzo","30","g"],["knoflook","1","teen"],["kurkuma","0.25","tl"],["chilivlokken","0.25","tl"],["groentebouillon","375","ml"],["roomboter","12","g"],["olijfolie","0.75","el"]],"steps":["Verhit de olijfolie in een ruime pan en bak de grof gescheurde paddenstoelen in porties 6 tot 8 minuten tot de randjes bruin kleuren. Breng op smaak met peper en zout.","Voeg de dunne plakjes knoflook toe en bak kort mee.","Roer de kurkuma en chilivlokken erdoor en bak een paar minuten tot de smaak loskomt.","Giet de bouillon erbij en breng aan de kook. Doe de orzo erbij en breng op smaak met wat sojasaus, peper en zout.","Laat 15 tot 20 minuten zachtjes sudderen tot de bouillon smaakvol en de orzo gaar is.","Roer de boter erdoor en garneer met extra chilivlokken en zeezout."],"photo":"photos/culy-465.webp","season":"herfst"},{"id":466,"name":"Pastina in bruine boter-misobouillon","type":"Vegetarisch","time":30,"emoji":"🍜","cuisine":"Aziatisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pastina-in-bruine-boter-misobouillon-uit-een-boek-over-soep/","ingredients":[["pastina","50","g"],["roomboter","20","g"],["miso","0.5","el"],["bosui","1","stuk"],["knoflook","1","teen"],["groentebouillon","250","ml"],["sesamolie","0.25","tl"]],"steps":["Smelt de boter met de miso op laag vuur en roer met een garde tot een glad mengsel.","Laat het 3 tot 5 minuten doorgaren tot de boter diepbruin en nootachtig is, zonder te verbranden.","Blus af met een scheut bouillon, roer de klontjes los, voeg de rest van de bouillon toe en houd warm onder een deksel.","Bak het wit van de bosui in wat olie 5 minuten zacht en voeg de knoflook toe. Bak 3 minuten mee.","Voeg de pastina toe en bak 3 minuten tot hij lichtbruin kleurt.","Giet de miso-bruineboterbouillon erbij en kook de pasta gaar. Serveer met het groen van de bosui en een scheutje sesamolie."],"photo":"photos/culy-466.webp"},{"id":467,"name":"Turkse linzensoep met spinazie en gegrild brood","type":"Vegetarisch","time":35,"emoji":"🥣","cuisine":"Turks","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/turkse-linzensoep-met-spinazie-en-gegrild-brood/","ingredients":[["rode linzen","50","g"],["aardappel","60","g"],["rode ui","0.25","stuk"],["groentebouillon","250","ml"],["rode chilipeper","0.25","stuk"],["komijn","0.25","tl"],["spinazie","40","g"],["pita","60","g"]],"steps":["Pel en hak de rode ui fijn en snijd de aardappel met schil in stukken. Hak een deel van de chilipeper fijn.","Bak de ui 2 minuten in olie, voeg de chilipeper, aardappel en komijn toe en bak 2 tot 3 minuten mee.","Giet er water en de bouillon bij en breng aan de kook. Voeg de linzen toe met wat peper en zout en kook 15 tot 20 minuten tot alles gaar is.","Gril het brood intussen in 4 tot 5 minuten lichtbruin onder de hete grill.","Pureer de soep met een staafmixer tot hij romig en glad is.","Roer de spinazie erdoor en laat 1 tot 2 minuten slinken. Serveer met het gegrilde brood en een partje citroen."],"photo":"photos/culy-467.webp"},{"id":468,"name":"Snelle kippensoep met gember, rijst en zoete aardappel","type":"Vlees","time":35,"emoji":"🍲","cuisine":"Aziatisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/snelle-kippensoep-met-gember/","ingredients":[["kippendij","115","g"],["zoete aardappel","0.5","stuk"],["rijst","20","g"],["gember","5","g"],["knoflook","1","teen"],["sojasaus","1","el"],["citroen","0.25","stuk"],["koriander","0.25","bosje"]],"steps":["Doe de kippendijen met ruim water, de dunne plakjes gember, de knoflook en de gewassen rijst in een pan met een snuf zout en breng aan de kook.","Zet het vuur lager en laat 10 tot 12 minuten sudderen tot de kip stevig en de rijst zacht is.","Voeg de plakjes zoete aardappel toe en kook nog 15 tot 20 minuten tot ze gaar zijn.","Schep de kip uit de pan, trek hem in reepjes en hussel met wat sojasaus en peper.","Doe de kip terug en roer het citroensap en de rest van de sojasaus erdoor. Proef en breng op smaak.","Schep in kommen en garneer met koriander en zwarte peper."],"photo":"photos/culy-468.webp"},{"id":469,"name":"Hartige tarte tatin met venkel, druiven en olijven","type":"Vegetarisch","time":85,"emoji":"🥧","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/tarte-tatin-recept-ottolenghi/","ingredients":[["venkel","0.5","stuk"],["bladerdeeg","0.5","plak"],["rode druiven","15","g"],["ahornsiroop","0.5","el"],["roomboter","12","g"],["kalamata olijven","10","g"],["venkelzaad","0.25","tl"]],"steps":["Verwarm de oven voor op 230 graden.","Doe de venkel in parten, het licht gekneusde venkelzaad, de druiven, ahornsiroop, boter, zout en peper op een bakplaat en meng goed.","Bak 40 tot 45 minuten en keer de venkel halverwege, tot alles zacht en gekarameliseerd is.","Verlaag de oven naar 200 graden en roer de olijven door de venkel en druiven.","Leg het bladerdeeg erop, stop de randen in en maak een paar inkepingen voor de stoom.","Bak nog 25 tot 30 minuten tot het deeg goudbruin is en keer de tarte voorzichtig om op een bord."],"photo":"photos/culy-469.webp"},{"id":470,"name":"Smoky jollof rice","type":"Vegetarisch","time":65,"emoji":"🍚","cuisine":"West-Afrikaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/signature-jollof-rice-the-jollof-club/","ingredients":[["jasmijnrijst","125","g"],["tomatenblokjes","200","g"],["rode ui","0.5","stuk"],["rode chilipeper","1","stuk"],["knoflook","1","teen"],["gember","5","g"],["gerookt paprikapoeder","0.25","tl"],["bruine suiker","0.5","tl"]],"steps":["Verwarm de oven voor op 200 graden. Rooster wat kaneel, korianderzaad, zwarte peper en steranijs kort in een droge pan en maal fijn tot een specerijenmix.","Rooster de gehalveerde rode ui en de pepers 20 tot 25 minuten tot ze zwartgeblakerd zijn.","Fruit de knoflook en gember 5 minuten zacht in olie in een pan met dikke bodem.","Voeg de tomatenblokjes, de geroosterde ui en pepers, de specerijenmix, het gerookte paprikapoeder en de suiker toe met wat water. Laat tot een dikke saus inkoken.","Spoel de rijst tot het water helder is, roer hem door de saus en dek de pan goed af.","Gaar de rijst op laag vuur 25 tot 30 minuten tot hij droog en gaar is. Roer voorzichtig los en breng op smaak met zout."],"photo":"photos/culy-470.webp"},{"id":471,"name":"Pasta met burrata, pistache en mortadella","type":"Vlees","time":15,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pasta-met-pistache/","ingredients":[["pasta","100","g"],["burrata","0.5","bol"],["mortadella","2","plak"],["pistachenoten","30","g"],["olijfolie","1","el"]],"steps":["Maak een snelle pesto door de pistachenoten met de olijfolie en wat peper en zout te vijzelen of te mixen.","Kook de pasta volgens de verpakking en bewaar een kopje pastawater.","Meng de hete, afgegoten pasta met de pistachepesto en voeg wat pastawater toe als het te droog is.","Verdeel de pasta over de borden.","Scheur de mortadella en de burrata in stukken en leg die erop.","Maak af met zwarte peper en een scheut olijfolie."],"photo":"photos/culy-471.webp"},{"id":472,"name":"Rode bietensalade met geitenkaas en gekarameliseerde pecan","type":"Vegetarisch","time":25,"emoji":"🥗","cuisine":"Europees","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/bietensalade-met-geitenkaas/","ingredients":[["gekookte bieten","2","stuk"],["geitenkaas","50","g"],["bladsla","75","g"],["sinaasappel","0.5","stuk"],["sjalot","1","stuk"],["pecannoten","50","g"],["ahornsiroop","1","el"],["balsamicoazijn","1","tl"]],"steps":["Karameliseer de pecannoten met de ahornsiroop en een snuf komijn in ongeveer 10 minuten op laag vuur en laat ze afkoelen.","Klop voor de dressing het sinaasappelsap met olijfolie, de balsamicoazijn, wat mosterd, peper en zout glad.","Snijd de bieten in blokjes, schep ze met de ringen sjalot door de dressing en laat 10 minuten trekken.","Verdeel de bladsla over een schaal.","Leg de bieten, sjalot, plakjes sinaasappel en verkruimelde geitenkaas op de sla.","Breek de gekarameliseerde pecannoten erover en druppel de rest van de dressing eroverheen."],"photo":"photos/culy-472.webp"},{"id":473,"name":"Rokerige ovenschotel met halloumi, limabonen en tomaat","type":"Vegetarisch","time":30,"emoji":"🧀","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/ovenschotel-halloumi-tomaat/","ingredients":[["halloumi","125","g"],["tomatenblokjes","200","g"],["limabonen","100","g"],["knoflook","1","teen"],["gerookt paprikapoeder","0.5","tl"],["oregano","0.25","tl"],["peterselie","0.25","bosje"],["bruine suiker","0.25","tl"]],"steps":["Verwarm de oven voor op 200 graden.","Fruit de fijngehakte knoflook in olijfolie tot hij licht kleurt.","Voeg de oregano en het gerookte paprikapoeder toe, dan de tomatenblokjes, de suiker en een snuf rodewijnazijn. Laat de saus 5 minuten pruttelen.","Roer de uitgelekte limabonen erdoor.","Haal van het vuur en schik de plakjes halloumi op de saus.","Bak 15 minuten in de oven en zet nog 5 minuten de grill aan tot de halloumi bruin kleurt. Maak af met peterselie."],"photo":"photos/culy-473.webp"},{"id":474,"name":"Vegetarische tikka masala met zoete aardappel","type":"Vegetarisch","time":60,"emoji":"🍛","cuisine":"Indiaas","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/culy-homemade-vegetarische-tikka-masala-zoete-aardappel/","ingredients":[["bloemkool","80","g"],["zoete aardappel","0.4","stuk"],["kikkererwten","80","g"],["kokosmelk","80","ml"],["rode paprika","0.2","stuk"],["ui","0.2","stuk"],["knoflook","0.5","teen"],["garam masala","0.4","tl"]],"steps":["Verwarm de oven voor op 180 graden. Hussel de bloemkoolroosjes, blokjes zoete aardappel en stukjes paprika met olie en zout en rooster ze 15 minuten gaar en lichtbruin.","Pureer de ui, knoflook, wat gember en een stukje chilipeper met een scheut water tot een gladde kruidenpasta.","Bak de kruidenpasta met de garam masala, wat kerriepoeder en paprikapoeder 4 minuten in olie tot hij geurig en ingedikt is. Roer de tomatenpuree erdoor.","Breng de saus aan de kook en laat 10 tot 15 minuten inkoken tot een dikke saus.","Voeg de geroosterde groenten en de kikkererwten toe, giet de kokosmelk erbij en laat 5 minuten doorkoken.","Serveer met koriander, een klodder yoghurt en naan of basmatirijst."],"photo":"photos/culy-474.webp"},{"id":475,"name":"Supersnelle couscoussalade met rucola, feta en perzik","type":"Vegetarisch","time":15,"emoji":"🥗","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/supersnelle-couscoussalade-met-rucola-feta-en-perzik/","ingredients":[["couscous","100","g"],["rucola","20","g"],["feta","40","g"],["perzik","1","stuk"],["walnoten","20","g"],["olijfolie","0.5","el"]],"steps":["Bereid de couscous volgens de verpakking en roer hem los met een vork.","Meng de olijfolie met flink peper en zout door de couscous.","Schep de rucola en de blokjes feta erdoor.","Snijd de perzik in parten en verdeel die over de salade.","Hak de walnoten grof en strooi ze erover.","Breng op smaak en serveer meteen."],"photo":"photos/culy-475.webp","season":"zomer"},{"id":476,"name":"Tunesische wraps met tonijn, harissa en olijven","type":"Vis","time":20,"emoji":"🌯","cuisine":"Tunesisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/wraps-met-tonijn-gezond/","ingredients":[["volkorenwrap","2","stuk"],["tonijn uit blik","100","g"],["vleestomaat","1","stuk"],["harissa","1","el"],["olijven","30","g"],["ansjovis","2","filet"],["radicchio","50","g"],["peterselie","0.25","bosje"]],"steps":["Rasp de tomaat tot een dikke pulp en breng op smaak met zout, peper en een scheut sherryazijn.","Laat de tonijn goed uitlekken.","Smelt de ansjovis in wat olijfolie, haal de pan van het vuur en roer de harissa en de tonijn erdoor.","Verwarm de wraps en snijd de olijven en peterselie fijn.","Beleg de wrap met radicchio, dan de tonijn, de tomatenpulp, de olijven en peterselie.","Rol de wraps op, snijd ze doormidden en serveer direct."],"photo":"photos/culy-476.webp"},{"id":477,"name":"Spaghetti met romige pompoensaus, pistache en pecorino","type":"Vegetarisch","time":30,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pompoenpasta-met-pompoensaus/","ingredients":[["pompoen","125","g"],["spaghetti","90","g"],["rode ui","0.25","stuk"],["room","20","ml"],["knoflook","0.5","teen"],["mascarpone","0.5","el"],["pecorino","10","g"],["pistachenoten","8","g"]],"steps":["Verwarm de oven voor op 220 graden. Rooster de pompoenblokjes en gesnipperde rode ui met olie, peper en zout in 15 minuten zacht.","Pureer de pompoen en ui met de room glad met een staafmixer.","Fruit de knoflook met een snuf chili in olijfolie, blus af met een scheut witte wijn en laat uitkoken.","Roer de pompoensaus erdoor met de mascarpone en wat tomatenpuree.","Kook de spaghetti al dente en schep hem door de saus; voeg wat pastawater toe als het te dik is.","Maak af met geroosterde pistache, pecorino, basilicum en wat extra chili."],"photo":"photos/culy-477.webp","season":"herfst"}];

function picture(r,eager=false){const src=r.photo||(PHOTOS[r.id]?`photos/${PHOTOS[r.id]}.webp`:null);if(!src)return r.emoji;const alt=r.photo?(r.source==='ODRVA'?`Gerecht uit de oorspronkelijke video: ${r.name}`:`Foto van het gerecht: ${r.name}`):`Voorbeeldfoto bij ${r.name}`;return `<img src="${esc(src)}" alt="${esc(alt)}" loading="${eager?'eager':'lazy'}" decoding="async" onerror="this.hidden=true;this.parentElement.textContent='${r.emoji}'">${r.photoCaption?`<span class="photo-caption" aria-hidden="true">${esc(r.photoCaption)}</span>`:''}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function timeLabel(r){return Number.isFinite(r.time)&&r.time>0?r.time+' min':''}
function amountNumber(v){if(v===null||v===undefined||String(v).trim()==='')return null;let n=Number(v);return Number.isFinite(n)&&n>=0?n:null}
function sourcePortions(r){return r.basePersons===undefined?1:r.basePersons}
function bigMeasure(number,u){let el=u==='el'?number:u==='tl'?number/3:null;if(el===null)return '';let f=x=>String(Math.round(x*2)/2).replace('.',',');if(el>=16){let n=Math.round(el/16*2)/2;return ' (ongeveer '+f(n)+' '+(n===1?'mok':'mokken')+')'}if(el>=8){let n=Math.round(el/8*2)/2;return ' (ongeveer '+f(n)+' '+(n===1?'theekop':'theekoppen')+')'}if(u==='tl'&&number>=6){let n=Math.round(el*2)/2;if(n>=8)return ' (ongeveer 1 theekop)';return ' (ongeveer '+f(n)+' '+(n===1?'eetlepel':'eetlepels')+')'}return ''}
function ingredientLabel(r,[n,q,u]){let number=amountNumber(q),base=sourcePortions(r);if(number===null)return q?esc(q)+(u?' '+esc(u):''):'';let scaled=Math.round(number*(base?S.persons/base:1)*100)/100;return String(scaled).replace('.',',')+' '+esc(u)+bigMeasure(scaled,u)+((r.estimatedIngredients||[]).includes(n)?' (geschat)':'')}

function shoppingIngredients(r){let out=[],citrus={};for(let [n,q,u] of r.ingredients){let name=n.trim().toLowerCase();if(/^(water|pastawater|kookwater|kookvocht|mozzarellavocht|bonenvocht|zout|peper|zwarte peper|olijfolie|olie)$/.test(name))continue;let fruit=/citroen/.test(name)?'citroen':/limoen/.test(name)?'limoen':null;if(fruit&&(/sap|rasp|schil/.test(name)||name===fruit)){let number=amountNumber(q),amount=number;if(/sap/.test(name)&&number!==null){if(u==='ml')amount=number/40;else if(u==='el')amount=number*15/40;else if(u==='tl')amount=number*5/40;}if(number===null){let text=(String(q||'')+' '+name).toLowerCase();amount=/halve|half|½/.test(text)?.5:/\b(hele|één|een|1)\b/.test(text)?1:null;}let key=fruit;if(!citrus[key])citrus[key]={quantity:null,estimated:false};if(amount!==null)citrus[key].quantity=Math.max(citrus[key].quantity||0,amount);if((r.estimatedIngredients||[]).includes(n)||(/sap/.test(name)&&['ml','el','tl'].includes(u)))citrus[key].estimated=true;continue;}out.push([name,q,u]);}for(let [fruit,value] of Object.entries(citrus))out.push([fruit,value.quantity,'stuk',value.estimated]);return out;}
function missingShopping(){let m={};S.week.forEach(id=>{let r=by(id);if(!r)return;shoppingIngredients(r).forEach(ing=>{let [n,q,u]=ing;if(amountNumber(q)!==null&&sourcePortions(r))return;let k=shoppingKey(n,'onbekend');if(!m[k])m[k]={name:n,notes:[]};let note=r.name+': '+(q===null||q===undefined?'hoeveelheid niet genoemd':String(q)+' '+u+(sourcePortions(r)?'':' — aantal bronporties onbekend'));if(!m[k].notes.includes(note))m[k].notes.push(note)})});return m}
function card(r){return `<div class="card"><button type="button" class="pic photo-button" aria-label="Bekijk ${r.name}" onclick="openR(${r.id})">${picture(r)}</button><div class="pad"><div class="row between"><div><div class="title">${r.name}</div><div class="meta">${[r.type,r.cuisine,timeLabel(r)].filter(Boolean).join(' · ')}</div></div><button class="btn soft small" onclick="fav(${r.id})">${S.fav.includes(r.id)?'♥':'♡'}</button></div><div class="actions"><button class="btn primary small" onclick="add(${r.id})">+ Mijn week</button><button class="btn soft small" onclick="openR(${r.id})">Bekijken</button></div></div></div>`}
function currentSeason(r){let m=new Date().getMonth()+1;if(r.season){let s=(m>=9&&m<=11)?'herfst':(m>=12||m<=2)?'winter':(m>=3&&m<=5)?'lente':'zomer';return r.season==='altijd'||r.season===s}let n=r.name.toLowerCase();let K=(m>=9&&m<=11)?['pompoen','paddenstoel','champignon','stamppot','spruit','traybake','stoof','risotto','prei','witlof','hutspot']:(m>=3&&m<=5)?['asperge','doperwt','erwten','citroen','spinazie','munt','radijs','lams']:(m>=6&&m<=8)?['salade','ceviche','taco','bowl','burger','wrap','spies','tonijn','mango','gazpacho','pil pil']:['stamppot','erwtensoep','hutspot','boerenkool','zuurkool','spruit','stoof','soep','ovenschotel','witlof','curry','lasagne'];return r.cuisine==='Seizoensgerecht'||K.some(k=>n.includes(k))} const SOURCE_NAMES={ODRVA:'Onder de rook van Amsterdam',UPK:"Uit Pauline's Keuken"};const TYPES=['Vegetarisch','Vlees','Vis'],COURSES=['Voor','Hoofd','Na'];let FMain=new Set(),FT=new Set();function isQuick(r){return Number.isFinite(r.time)&&r.time>0&&r.time<=25}function courseOf(r){return r.course||'hoofd'}function matchesMain(r){let t=[...FMain].filter(x=>TYPES.includes(x)),c=[...FMain].filter(x=>COURSES.includes(x)).map(x=>x.toLowerCase());return(!t.length||t.includes(r.type))&&(!c.length||c.includes(courseOf(r)))}function filtered(f){let toggles=new Set(FT);if(f==='Snel'||f==='Seizoen')toggles.add(f);let q=(document.getElementById('search')?.value||'').toLowerCase().trim();return R.filter(r=>{let ok=matchesMain(r)&&(!toggles.has('Snel')||isQuick(r))&&(!toggles.has('Seizoen')||currentSeason(r));let hay=(r.name+' '+r.cuisine+' '+r.type+' '+courseOf(r)+' '+(r.source?r.source+' '+(SOURCE_NAMES[r.source]||''):'')+' '+r.ingredients.map(x=>x[0]).join(' ')).toLowerCase();return ok&&(!q||hay.includes(q))}).sort((a,b)=>score(b)-score(a))} function render(){let list=filtered();if(!list.length){suggest.innerHTML='';cards.innerHTML='<div class="empty">Geen gerechten gevonden.</div>';return}let top=list[0];suggest.innerHTML=`<div class="section">Aanrader voor jou</div>${card(top)}`;cards.innerHTML='<div class="section">Meer inspiratie</div>'+list.slice(1).map(card).join('')} function doSearch(){render()}
function fav(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];save();render();renderFav()}
function add(id){if(!S.week.includes(id)){let previous=shoppingTotals();S.week.push(id);refreshChecks(previous);save();toast('Toegevoegd aan Mijn week')}renderWeek();renderShop()}
function removeW(id){let previous=shoppingTotals();S.week=S.week.filter(x=>x!=id);refreshChecks(previous);save();renderWeek();renderShop()}
function persons(n){let previous=shoppingTotals();S.persons=Math.max(1,Math.min(16,S.persons+n));refreshChecks(previous);save();renderWeek();renderShop()}
function makeWeek(){let liked=R.filter(x=>S.ratings[x.id]!='niet').sort((a,b)=>score(b)-score(a));let picks=[],types=['Vegetarisch','Vlees','Vis','Vegetarisch','Vlees'];types.forEach(t=>{let a=liked.filter(x=>x.type===t&&!picks.includes(x.id));if(a.length)picks.push(a[0].id)});let previous=shoppingTotals();S.week=picks;refreshChecks(previous);save();renderWeek();renderShop();toast('Gevarieerd weekmenu gemaakt')}
function swapW(id){let old=by(id),a=R.filter(r=>r.id!==id&&!S.week.includes(r.id)&&S.ratings[r.id]!=='niet'&&r.type===old.type).sort((a,b)=>score(b)-score(a));if(a.length){let previous=shoppingTotals();S.week=S.week.map(x=>x===id?a[0].id:x);refreshChecks(previous);save();renderWeek();renderShop();toast('Gerecht gewisseld')}} function surprise(){let a=R.filter(x=>!S.week.includes(x.id)&&S.ratings[x.id]!='niet').sort((a,b)=>score(b)-score(a));if(a.length)add(a[0].id)}
function renderWeek(){document.getElementById('pc').textContent=S.persons;let el=document.getElementById('weekList');if(!S.week.length)return el.innerHTML='<div class="empty">Nog geen gerechten gekozen.</div>';let days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];el.innerHTML=S.week.map((id,i)=>{let r=by(id);return `<div class="day"><div class="row between"><button type="button" onclick="openR(${id},'week')" style="flex:1;min-width:0;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer"><b>${days[i%7]}${i>=7?` · week ${Math.floor(i/7)+1}`:''}</b><div class="title" style="font-size:16px">${r.emoji} ${r.name}</div><div class="meta">${[r.type,timeLabel(r)].filter(Boolean).join(' · ')}</div></button><div><button class="btn soft small" onclick="swapW(${id})">↻</button><button class="btn danger small" onclick="removeW(${id})">×</button></div></div></div>`}).join('')}
function qty(v){let n=parseFloat(v);return isNaN(n)?v:String(Math.round(n*S.persons*100)/100).replace('.',',')}
const WHOLE=new Set(['stuk','bol','krop','stronk','bosje','sneden','takje','vel','plak','teen','snee','snede','filet']);
function unitName(u){return ({stuks:'stuk',bollen:'bol',stronken:'stronk',tenen:'teen',bosjes:'bosje'})[u]||u}
const RENAMED={"groene pesto":"pesto",currypasta:"groene currypasta","parmezaanse kaas":"parmezaan",kookroom:"room","taco-kruiden":"tacokruiden","half-om-half gehakt":"half-om-halfgehakt"};function shoppingKey(n,u){n=n.trim().toLowerCase();if(RENAMED[n])n=RENAMED[n];return n+'|'+unitName(u)}
function shoppingTotals(){let m={};S.week.forEach(id=>{let r=by(id);if(!r)return;let base=sourcePortions(r);shoppingIngredients(r).forEach(([n,q,u,converted])=>{let number=amountNumber(q);if(number===null||!base)return;let k=shoppingKey(n,u);m[k]=(m[k]||0)+number*S.persons/base})});Object.entries(missingShopping()).forEach(([k,v])=>m[k]=v.notes.join(' / '));return m}
function refreshChecks(previous){let next=shoppingTotals();Object.keys(S.checked).forEach(k=>{if(next[k]!==previous[k])delete S.checked[k]})}
function normalizeKeys(){for(const field of ['checked','pantry']){let normalized={};Object.entries(S[field]||{}).forEach(([k,v])=>{let [n,u]=k.split('|');let key=shoppingKey(n,u);normalized[key]=normalized[key]||v});S[field]=normalized}} normalizeKeys();
function estimatedShopping(){let m={};S.week.forEach(id=>{let r=by(id);if(!r)return;shoppingIngredients(r).forEach(([n,q,u,converted])=>{if(converted||(r.estimatedIngredients||[]).includes(n)||r.portionsEstimated)m[shoppingKey(n,u)]=true})});return m}
function renderShop(){let m=shoppingTotals(),missing=missingShopping(),estimates=estimatedShopping();let keys=Object.keys(m).filter(k=>!missing[k]||!Object.keys(m).some(other=>other!==k&&!missing[other]&&other.split('|')[0]===k.split('|')[0])),el=document.getElementById('shopping');if(!keys.length)return el.innerHTML='<div class="empty">Je boodschappen verschijnen zodra je gerechten kiest.</div>';el.innerHTML=keys.sort().map(k=>{let [n,u]=k.split('|'),unknown=missing[k],q=unknown?null:(WHOLE.has(u)?Math.ceil(m[k]-1e-9):Math.round(m[k]*100)/100),extra=missing[n+'|onbekend'],label=unknown?esc(unknown.notes.join(' · ')):String(q).replace('.',',')+' '+esc(u)+bigMeasure(q,u)+(estimates[k]?' (geschat)':'')+(extra?' + extra hoeveelheid niet vermeld':'');return `<label class="check ${(S.checked[k]||S.pantry[k])?'done':''}"><input type="checkbox" data-k="${esc(k)}" ${S.checked[k]?'checked':''} onchange="ck(this.dataset.k,this.checked)"><div style="flex:1"><b>${esc(n)}</b><div class="meta">${label}</div></div><button type="button" class="btn soft small" data-k="${esc(k)}" onclick="event.preventDefault();pantry(this.dataset.k)">${S.pantry[k]?'In huis ✓':'In huis'}</button></label>`}).join('')}
function ck(k,v){S.checked[k]=v;save();renderShop()} function pantry(k){S.pantry[k]=!S.pantry[k];save();renderShop();toast(S.pantry[k]?'Staat al in huis':'Terug op lijst')}function clearChecked(){Object.keys(S.checked).forEach(k=>{if(S.checked[k])delete S.checked[k]});save();renderShop()}
function renderFav(){let good=Object.values(S.ratings).filter(x=>x==='lekker').length,bad=Object.values(S.ratings).filter(x=>x==='niet').length;document.getElementById('profile').innerHTML=`<div class="section">Jouw smaakprofiel</div><div class="stats"><div class="stat"><b>${good}</b>lekker</div><div class="stat"><b>${bad}</b>niet</div><div class="stat"><b>${S.fav.length}</b>favoriet</div></div><div class="meta">Je beoordelingen worden gebruikt om Ontdekken en Maak mijn week beter bij je smaak te laten passen.</div>`;let rs=R.filter(x=>S.fav.includes(x.id));document.getElementById('fav').innerHTML='<div class="section">Favorieten</div>'+(rs.length?rs.map(card).join(''):'<div class="empty">Nog geen favorieten.</div>')+(SERVER?`<div class="section">Account</div><div class="row between"><div class="meta">Ingelogd als <b style="color:var(--tx)">${esc(USER)}</b></div><button class="btn soft small" onclick="logout()">Wisselen</button></div>`:'')}
function rate(id,v){S.ratings[id]=v;if(v==='lekker'&&!S.fav.includes(id))S.fav.push(id);save();toast('Smaak onthouden');renderFav()}
function openR(id,origin='discover'){let r=by(id);show('detail');document.getElementById('detail').innerHTML=`<div class="recipe"><button class="back" onclick="show('${origin}')">←</button><div class="pic" style="margin-top:10px">${picture(r,true)}</div>${r.photo&&r.source==='Culy'?`<div class="photo-credit">Foto · <a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">Culy</a></div>`:(!r.photo&&PHOTOS[r.id]?`<div class="photo-credit">Voorbeeldfoto van een vergelijkbaar gerecht · <a href="https://www.pexels.com/photo/${PHOTOS[r.id]}/" target="_blank" rel="noopener noreferrer">Pexels</a></div>`:'')}<h2>${r.name}</h2><div class="meta">${[r.type,r.cuisine,timeLabel(r),S.persons+' personen'].filter(Boolean).join(' · ')}</div>${r.sourceUrl?`<p class="meta"><a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">${r.source==='ODRVA'?'Bekijk originele video':'Bekijk origineel recept'}</a></p>`:''}${r.timeNote?`<div class="meta">${esc(r.timeNote)}</div>`:''}<button class="btn primary" style="width:100%;margin-top:14px" onclick="add(${id})">Toevoegen aan Mijn week</button><div class="section">Ingrediënten</div><ul>${r.ingredients.map(x=>`<li style="margin:9px 0"><b>${esc(x[0])}</b>${ingredientLabel(r,x)?' — '+ingredientLabel(r,x):''}</li>`).join('')}</ul><div class="section">Bereiding</div><ol>${r.steps.map(x=>`<li style="margin:10px 0;line-height:1.45">${x}</li>`).join('')}</ol><div class="section">Wat vond je ervan?</div><div class="rating"><button onclick="rate(${id},'lekker')">😍<small>Heerlijk</small></button><button onclick="rate(${id},'neutraal')">😐<small>Neutraal</small></button><button onclick="rate(${id},'niet')">👎<small>Niet meer</small></button></div></div>`}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(p).classList.add('on');let d=p==='detail'||p==='login';head.style.display=d?'none':'block';nav.style.display=d?'none':'grid';filters.style.display=p==='discover'?'block':'none';let T={discover:['Kook','Lekker, makkelijk en gevarieerd'],week:['Mijn week','Stel je weekmenu samen'],shop:['Boodschappen','Automatisch samengevoegd'],favorites:['Voor jou','De app leert je smaak kennen']};if(T[p]){heading.textContent=T[p][0];subtitle.textContent=T[p][1]}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='week')renderWeek();if(p==='shop')renderShop();if(p==='favorites')renderFav();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');if(b.classList.contains('on'))FMain.add(b.dataset.f);else FMain.delete(b.dataset.f);render()});document.querySelectorAll('.chip[data-t]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');if(b.classList.contains('on'))FT.add(b.dataset.t);else FT.delete(b.dataset.t);render()});function boot(){render();renderWeek();renderShop();renderFav();show('discover')}
function applyState(state,name){S=state||{};sanitizeState();normalizeKeys();USER=name;localStorage.setItem('kookUser',name);localStorage.setItem('kookV3',JSON.stringify(S));localStorage.setItem('kookV2',JSON.stringify(S));boot()}
function logoutLocal(){TOKEN='';USER='';['kookToken','kookUser','kookV3','kookV2'].forEach(k=>localStorage.removeItem(k));S=JSON.parse(DEF)}
function logout(){api('logout','POST').catch(()=>{});logoutLocal();show('login')}
async function login(kind){let name=document.getElementById('lname').value.trim(),pin=document.getElementById('lpin').value.trim(),err=document.getElementById('lerr');err.textContent='';if(!name||!pin){err.textContent='Vul je naam en pincode in.';return}
let body={name,pin};if(kind==='register'&&!TOKEN&&(S.week.length||S.fav.length||Object.keys(S.ratings).length))body.state=S;
try{let r=await api(kind,'POST',body);TOKEN=r.token;localStorage.setItem('kookToken',TOKEN);document.getElementById('lpin').value='';applyState(r.state,r.name);toast('Welkom, '+r.name)}catch(e){err.textContent=e.message}}
async function init(){try{let p=await fetch('/api/ping',{cache:'no-store'});SERVER=p.ok&&(p.headers.get('content-type')||'').includes('json')}catch(e){SERVER=!!TOKEN}
if(!SERVER)return boot();if(!TOKEN)return show('login');
try{let r=await api('state');applyState(r.state,r.name)}catch(e){if(e.message==='Niet ingelogd.'){logoutLocal();show('login')}else boot()}}
init();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
