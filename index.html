erpakking. Snijd de komkommer in dunne plakjes en meng ze met het limoensap en een snufje zout.","Serveer de babi ketjap op de rijst met de komkommer ernaast. De zoete, donkere ketjapsaus vraagt om precies zo'n frisse, zure hap komkommer ertussendoor."]},{"id":80,"name":"Kipsaté met pindasaus en atjar","type":"Vlees","time":30,"emoji":"🍢","cuisine":"Indonesisch","ingredients":[["kipdijfilet","150","g"],["ketjap manis","3","el"],["knoflook","1","teen"],["pindakaas","2","el"],["kokosmelk","75","ml"],["sambal oelek","0.5","tl"],["rijst","80","g"],["atjar tjampoer","50","g"],["satéprikkers","3","stuk"]],"steps":["Snijd de kip in blokjes van 2 tot 3 centimeter en snijd de knoflook fijn. Meng de kip met 2 eetlepels ketjap, de helft van de knoflook en wat peper en laat 10 minuten marineren. Leg houten prikkers intussen in water zodat ze niet verbranden.","Kook de rijst volgens de verpakking.","Maak de pindasaus: verwarm de kokosmelk in een steelpannetje op laag vuur en roer de pindakaas, de rest van de knoflook, 1 eetlepel ketjap en de sambal erdoor. Laat 3 tot 4 minuten zachtjes pruttelen tot een gladde saus en voeg een scheutje water toe als hij te dik wordt.","Rijg de kip aan de prikkers. Verhit een grillpan op hoog vuur met een beetje olie en gril de saté 8 tot 10 minuten; keer ze regelmatig tot ze rondom bruin en gaar zijn.","Serveer de saté op de rijst met de pindasaus erover en de atjar ernaast. De zoetzure atjar is precies wat de rijke pindasaus en het gekarameliseerde kippenvlees nodig hebben."]},{"id":81,"name":"Sambal goreng boontjes met gehakt","type":"Vlees","time":25,"emoji":"🫘","cuisine":"Indonesisch","ingredients":[["sperziebonen","150","g"],["rundergehakt","100","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["sambal oelek","1","tl"],["ketjap manis","1","el"],["kokosmelk","100","ml"],["rijst","80","g"],["laurierblad","1","stuk"]],"steps":["Kook de rijst volgens de verpakking. Haal de sperziebonen af, halveer ze en kook ze 5 minuten in water met zout tot ze beetgaar zijn. Giet af.","Snipper de ui en snijd de knoflook fijn. Verhit 1 eetlepel olie in een hapjespan op hoog vuur en bak het gehakt 4 tot 5 minuten rul en bruin.","Voeg de ui toe en bak 3 minuten op middelhoog vuur. Roer de knoflook, de sambal en het laurierblad erdoor en bak 1 minuut tot het begint te geuren.","Giet de ketjap en de kokosmelk erbij, voeg de bonen toe en laat 5 minuten zachtjes pruttelen tot de saus iets indikt en de bonen zacht zijn. Breng op smaak met zout.","Verwijder het laurierblad en serveer de boontjes op de rijst. De romige kokos tempert de pit van de sambal, zodat het gerecht wel warm maar niet scherp smaakt."]},{"id":82,"name":"Erwtensoep met rookworst en roggebrood","type":"Vlees","time":40,"emoji":"🍲","cuisine":"Nederlands","ingredients":[["spliterwten","100","g"],["rookworst","0.5","stuk"],["prei","0.5","stuk"],["wortel","1","stuk"],["knolselderij","75","g"],["aardappel","1","stuk"],["runderbouillonblokje","0.5","stuk"],["roggebrood","2","sneden"],["katenspek","2","sneden"]],"steps":["Spoel de spliterwten af en doe ze met 500 ml water en het bouillonblokje in een ruime pan. Breng aan de kook, schep het schuim eraf en laat 20 minuten zachtjes koken met het deksel schuin op de pan. Is er tijd, laat de erwten dan vooraf een uur weken, dan worden ze extra zacht.","Snijd intussen de prei in ringen en was ze goed. Schil de wortel, de knolselderij en de aardappel en snijd ze in kleine blokjes.","Voeg alle groenten toe aan de erwten en laat nog 15 minuten koken tot alles zacht is en de soep dik wordt. Leg de rookworst de laatste 10 minuten mee in de pan.","Haal de rookworst eruit en stamp de soep met een pureestamper grof door, zodat hij lekker stevig bindt. Breng op smaak met zout en flink wat peper.","Snijd de rookworst in plakjes en roer ze door de soep. Serveer met het roggebrood belegd met katenspek. De stevige, aardse soep en het zoutige spek op zoet roggebrood zijn samen de ultieme winterkost."]},{"id":83,"name":"Tomatensoep met gehaktballetjes en vermicelli","type":"Vlees","time":30,"emoji":"🍅","cuisine":"Nederlands","ingredients":[["rundergehakt","75","g"],["tomatenblokjes (blik)","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["tomatenpuree","1","el"],["runderbouillon","300","ml"],["vermicelli","20","g"],["basilicum","0.25","bosje"],["crème fraîche","1","el"]],"steps":["Kneed het gehakt met zout en peper en draai er kleine balletjes van, ongeveer zo groot als een knikker. Snipper de ui en snijd de knoflook fijn.","Verhit 1 eetlepel olie in een soeppan op middelhoog vuur en bak de balletjes 4 tot 5 minuten rondom bruin. Schep ze uit de pan.","Fruit de ui 4 minuten in dezelfde pan. Voeg de knoflook en tomatenpuree toe en bak 1 minuut. Giet de tomatenblokjes en de bouillon erbij, breng aan de kook en laat 10 minuten zachtjes koken.","Pureer de soep glad met een staafmixer en breng op smaak met zout, peper en een snufje suiker als hij te zuur is. Voeg de balletjes en de vermicelli toe en kook nog 3 tot 4 minuten tot de vermicelli gaar is.","Schep de soep in kommen en maak af met een lepel crème fraîche en gescheurde basilicum. De zachte zuurheid van de tomaat, de hartige balletjes en de frisse basilicum maken dit de tomatensoep waar iedereen van houdt."]},{"id":84,"name":"Kippensoep met vermicelli en groenten","type":"Vlees","time":35,"emoji":"🍲","cuisine":"Nederlands","ingredients":[["kipdijfilet","125","g"],["kippenbouillon","400","ml"],["prei","0.5","stuk"],["wortel","1","stuk"],["bleekselderij","1","stuk"],["knoflook","1","teen"],["laurierblad","1","stuk"],["vermicelli","25","g"],["peterselie","0.25","bosje"]],"steps":["Breng de bouillon met het laurierblad en de fijngesneden knoflook aan de kook in een soeppan. Leg de kipdijfilet erin, zet het vuur laag en laat 15 minuten zachtjes trekken tot de kip gaar is.","Snijd intussen de prei in dunne ringen en was ze goed. Schil de wortel en snijd hem met de bleekselderij in kleine blokjes.","Haal de kip uit de bouillon, trek het vlees met twee vorken uit elkaar en houd het apart. Voeg de groenten toe aan de bouillon en kook ze 8 minuten tot ze zacht zijn.","Doe de vermicelli en de kip terug in de pan en kook nog 3 minuten. Verwijder het laurierblad en breng op smaak met zout en peper.","Serveer de soep met veel fijngesneden peterselie erover. Een heldere, zachte bouillon met zoete wortel en malse kip: eenvoudiger troostvoer bestaat niet."]},{"id":85,"name":"Mosterdsoep met prei en croutons","type":"Vegetarisch","time":25,"emoji":"🥣","cuisine":"Nederlands","ingredients":[["prei","1","stuk"],["ui","0.5","stuk"],["groentebouillon","300","ml"],["kookroom","75","ml"],["grove mosterd","2","el"],["wit brood","1","sneden"],["knoflook","1","teen"],["bieslook","0.25","bosje"]],"steps":["Snijd de prei in dunne ringen en was ze goed. Snipper de ui en snijd de knoflook fijn.","Smelt 1 eetlepel boter in een soeppan op middelhoog vuur en bak de prei, ui en knoflook 5 minuten tot ze zacht zijn zonder te kleuren. Strooi er 1 eetlepel bloem over en roer 1 minuut.","Giet de bouillon er al roerend in delen bij, breng aan de kook en laat 10 minuten zachtjes koken.","Snijd intussen het brood in blokjes. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de blokjes 4 tot 5 minuten goudbruin en knapperig; bestrooi met zout.","Roer de room en de mosterd door de soep en verwarm nog 1 minuut zonder te koken. Breng op smaak met zout en peper. Serveer met de croutons en fijngeknipte bieslook erover; de pittige mosterd en de zoete prei vormen samen een romige soep die in vijf minuten de kou verdrijft."]},{"id":86,"name":"Bloemkoolsoep met Marokkaanse topping","type":"Vegetarisch","time":30,"emoji":"🥦","cuisine":"Marokkaans","ingredients":[["bloemkool","250","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["groentebouillon","300","ml"],["kookroom","50","ml"],["kikkererwten (blik)","75","g"],["ras el hanout","1","tl"],["harissa","0.5","tl"],["koriander","0.25","bosje"]],"steps":["Snijd de bloemkool in kleine roosjes. Snipper de ui en snijd de knoflook fijn.","Verhit 1 eetlepel olie in een soeppan op middelhoog vuur en fruit de ui en knoflook 3 minuten. Voeg de bloemkool en de bouillon toe, breng aan de kook en laat 15 minuten zachtjes koken tot de bloemkool zacht is.","Laat intussen de kikkererwten uitlekken en dep ze droog. Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kikkererwten met de ras el hanout 6 tot 8 minuten tot ze knapperig zijn. Bestrooi met zout.","Pureer de soep glad met een staafmixer, roer de room erdoor en breng op smaak met zout en peper.","Roer de harissa los met 1 eetlepel olijfolie. Schep de soep in kommen, verdeel de kikkererwten erover, druppel de harissa-olie erbij en maak af met koriander. De fluweelzachte soep en de kruidige, knapperige topping maken dit veel spannender dan een gewone bloemkoolsoep."]},{"id":87,"name":"Pompoensoep met kokos en gember","type":"Vegetarisch","time":30,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["flespompoen","300","g"],["ui","0.5","stuk"],["gember","2","cm"],["knoflook","1","teen"],["rode peper","0.25","stuk"],["groentebouillon","250","ml"],["kokosmelk","100","ml"],["limoen","0.25","stuk"],["pompoenpitten","1","el"]],"steps":["Schil de pompoen, verwijder de pitten en snijd het vruchtvlees in blokjes van 2 centimeter. Snipper de ui en snijd de gember, knoflook en rode peper fijn.","Verhit 1 eetlepel olie in een soeppan op middelhoog vuur en fruit de ui 4 minuten. Voeg de gember, knoflook en peper toe en bak 1 minuut tot het geurt.","Voeg de pompoen toe, bak 2 minuten mee en giet de bouillon erbij. Breng aan de kook en laat 15 minuten zachtjes koken tot de pompoen zacht is.","Rooster intussen de pompoenpitten 2 tot 3 minuten in een droge koekenpan tot ze beginnen te knappen.","Pureer de soep glad met een staafmixer en roer de kokosmelk erdoor. Breng op smaak met limoensap, zout en peper. Serveer met de pompoenpitten erover; de zoete pompoen, de romige kokos en de frisse gember met limoen maken dit een herfstsoep met een Thaise knipoog."]},{"id":88,"name":"Linzensoep met wortel en komijn","type":"Vegetarisch","time":30,"emoji":"🥣","cuisine":"Midden-Oosters","ingredients":[["rode linzen","80","g"],["wortel","1","stuk"],["ui","0.5","stuk"],["knoflook","1","teen"],["gemalen komijn","1","tl"],["tomatenpuree","1","el"],["groentebouillon","400","ml"],["citroen","0.25","stuk"],["platbrood","1","stuk"]],"steps":["Snipper de ui, snijd de knoflook fijn en snijd de wortel in kleine blokjes. Spoel de linzen af in een zeef.","Verhit 1 eetlepel olijfolie in een soeppan op middelhoog vuur en bak de ui en wortel 5 minuten tot ze zacht worden. Voeg de knoflook, komijn en tomatenpuree toe en bak 1 minuut mee.","Voeg de linzen en de bouillon toe, breng aan de kook en laat 15 tot 18 minuten zachtjes koken tot de linzen helemaal uit elkaar vallen. Roer af en toe.","Pureer de soep grof met een staafmixer, zodat hij dik en smeuïg wordt. Breng op smaak met citroensap, zout en peper.","Verwarm het platbrood kort in een droge koekenpan en serveer het bij de soep, met een extra partje citroen. De aardse linzen, de warme komijn en het frisse zuur van citroen zijn de klassieke combinatie van de Turkse mercimek çorbası."]},{"id":89,"name":"Minestrone met witte bonen en pasta","type":"Vegetarisch","time":35,"emoji":"🍲","cuisine":"Italiaans","ingredients":[["witte bonen (blik)","100","g"],["kleine pasta (ditalini)","40","g"],["ui","0.5","stuk"],["wortel","1","stuk"],["bleekselderij","1","stuk"],["courgette","0.25","stuk"],["tomatenblokjes (blik)","200","g"],["groentebouillon","300","ml"],["parmezaanse kaas","15","g"]],"steps":["Snipper de ui en snijd de wortel, bleekselderij en courgette in kleine blokjes. Laat de bonen uitlekken en spoel ze af.","Verhit 2 eetlepels olijfolie in een soeppan op middelhoog vuur en bak de ui, wortel en bleekselderij 6 tot 8 minuten tot ze zacht en zoet zijn. Voeg de courgette toe en bak 2 minuten mee.","Giet de tomatenblokjes en de bouillon erbij, breng aan de kook en laat 10 minuten zachtjes koken.","Voeg de pasta en de bonen toe en kook nog 8 tot 10 minuten tot de pasta gaar is. Voeg een scheut water toe als de soep te dik wordt en breng op smaak met zout en peper.","Schep de minestrone in diepe borden en maak af met geraspte parmezaan en een scheutje goede olijfolie. Elke lepel heeft iets van groente, bonen en pasta, en juist die eenvoud maakt deze Italiaanse huissoep zo lekker."]},{"id":90,"name":"Broccolisoep met blauwe kaas","type":"Vegetarisch","time":25,"emoji":"🥦","cuisine":"Europees","ingredients":[["broccoli","250","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["aardappel","1","stuk"],["groentebouillon","300","ml"],["blauwe kaas","30","g"],["kookroom","50","ml"],["walnoten","15","g"]],"steps":["Snijd de broccoli in roosjes en snijd ook de steel in stukjes. Snipper de ui, snijd de knoflook fijn en schil de aardappel en snijd hem in kleine blokjes.","Verhit 1 eetlepel olie in een soeppan op middelhoog vuur en fruit de ui en knoflook 3 minuten. Voeg de aardappel en de bouillon toe, breng aan de kook en kook 8 minuten.","Voeg de broccoli toe en kook nog 6 minuten tot de broccoli net zacht is maar nog mooi groen.","Hak intussen de walnoten grof en rooster ze 2 minuten in een droge koekenpan.","Pureer de soep glad met een staafmixer. Roer de room en de helft van de blauwe kaas erdoor tot de kaas gesmolten is en breng op smaak met zout en peper. Serveer met de rest van de kaas verkruimeld erover en de walnoten erbij; de pittige kaas en de aardse broccoli zijn een klassiek sterk koppel."]},{"id":91,"name":"Italiaanse groentesoep met linzen en kikkererwten","type":"Vegetarisch","time":30,"emoji":"🍲","cuisine":"Italiaans","ingredients":[["linzen (blik)","75","g"],["kikkererwten (blik)","75","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["wortel","1","stuk"],["tomatenblokjes (blik)","200","g"],["groentebouillon","300","ml"],["spinazie","50","g"],["rozemarijn","1","tl"]],"steps":["Snipper de ui, snijd de knoflook fijn en snijd de wortel in kleine blokjes. Laat de linzen en kikkererwten uitlekken en spoel ze af. Hak de rozemarijn fijn.","Verhit 2 eetlepels olijfolie in een soeppan op middelhoog vuur en bak de ui en wortel 5 minuten tot ze zacht zijn. Voeg de knoflook en rozemarijn toe en bak 1 minuut mee.","Giet de tomatenblokjes en de bouillon erbij, breng aan de kook en laat 10 minuten zachtjes koken.","Voeg de linzen en kikkererwten toe en laat 5 minuten meewarmen. Pureer met een staafmixer een klein deel van de soep, zodat hij wat dikker wordt, maar laat de meeste groenten heel.","Roer de spinazie erdoor en laat 1 minuut slinken. Breng op smaak met zout en peper en serveer met een scheutje olijfolie en eventueel geroosterd brood. De peulvruchten maken de soep stevig genoeg voor een hele maaltijd, en de rozemarijn geeft hem die typisch Toscaanse geur."]},{"id":92,"name":"Vissoep met venkel en boterbonen","type":"Vis","time":25,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["schelvisfilet","125","g"],["venkel","0.5","stuk"],["boterbonen (blik)","100","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["gerookt paprikapoeder","0.5","tl"],["tomatenblokjes (blik)","200","g"],["visbouillon","200","ml"],["peterselie","0.25","bosje"]],"steps":["Snijd de venkel in dunne reepjes en bewaar het groen. Snipper de ui en snijd de knoflook fijn. Laat de boterbonen uitlekken en snijd de vis in stukken van 3 centimeter.","Verhit 2 eetlepels olijfolie in een soeppan op middelhoog vuur en bak de venkel en ui 6 minuten tot ze zacht zijn. Voeg de knoflook en het paprikapoeder toe en bak 1 minuut mee.","Giet de tomatenblokjes en de bouillon erbij, breng aan de kook en laat 8 minuten zachtjes koken. Voeg de boterbonen toe en laat 2 minuten meewarmen.","Leg de stukken vis in de soep, zet het vuur laag en laat ze 4 tot 5 minuten zachtjes garen tot ze net uit elkaar vallen. Roer zo min mogelijk zodat de vis heel blijft. Breng op smaak met zout en peper.","Schep de soep in diepe borden en bestrooi met peterselie en het venkelgroen. Serveer met brood om te dopen; de anijsachtige venkel, de romige bonen en de zachte vis zijn samen een zuidelijke maaltijdsoep in een kwartier."]},{"id":93,"name":"Chowder met koolvis en maïs","type":"Vis","time":20,"emoji":"🌽","cuisine":"Amerikaans","ingredients":[["koolvisfilet","125","g"],["maïs (blik)","100","g"],["aardappel","1","stuk"],["ui","0.5","stuk"],["visbouillon","150","ml"],["melk","150","ml"],["bosui","1","stuk"],["gedroogde tijm","0.5","tl"]],"steps":["Snipper de ui, schil de aardappel en snijd hem in blokjes van 1 centimeter. Laat de maïs uitlekken en snijd de vis in stukken van 3 centimeter.","Smelt 1 eetlepel boter in een soeppan op middelhoog vuur en fruit de ui 3 minuten. Strooi er 1 eetlepel bloem over, roer 1 minuut en giet al roerend de bouillon en de melk erbij.","Voeg de aardappel en de tijm toe, breng aan de kook en laat 8 tot 10 minuten zachtjes koken tot de aardappel zacht is en de soep licht bindt.","Voeg de maïs en de vis toe en laat 4 tot 5 minuten zachtjes garen tot de vis wit en gaar is. Breng op smaak met zout en peper.","Snijd de bosui in ringetjes en strooi ze over de soep. Serveer met crackers of brood; de romige, zoete maïs en de milde vis maken deze snelle chowder tot een complete maaltijd in een kom."]},{"id":94,"name":"Tom kha kai met kip en kokosmelk","type":"Vlees","time":25,"emoji":"🥥","cuisine":"Thais","ingredients":[["kipdijfilet","125","g"],["kokosmelk","250","ml"],["champignons","75","g"],["gember","2","cm"],["citroengras","1","stuk"],["rode peper","0.5","stuk"],["vissaus","1","el"],["limoen","0.5","stuk"],["koriander","0.25","bosje"]],"steps":["Snijd de kip in dunne reepjes en de champignons in kwarten. Snijd de gember in plakjes, kneus het citroengras met de platte kant van een mes en snijd het in stukken van 5 centimeter. Snijd de rode peper in ringetjes.","Doe de kokosmelk met 150 ml water, de gember en het citroengras in een pan. Breng zachtjes aan de kook en laat 5 minuten trekken op laag vuur, zodat de smaken loskomen.","Voeg de kip toe en laat 8 minuten zachtjes garen; de soep mag net tegen de kook aan zitten maar niet hard koken, anders schift de kokosmelk.","Voeg de champignons en de rode peper toe en kook nog 3 minuten. Breng op smaak met de vissaus en het sap van de limoen; de soep moet zout, zuur en een tikje zoet tegelijk zijn.","Schep de soep in kommen, laat de stukken gember en citroengras liggen voor de smaak, en strooi er grof gehakte koriander over. Serveer eventueel met rijst; de romige kokos, het frisse limoensap en de geurige kruiden maken dit de zachtste van alle Thaise soepen."]},{"id":95,"name":"Mexicaanse tortillasoep met zwarte bonen","type":"Vegetarisch","time":30,"emoji":"🌮","cuisine":"Mexicaans","ingredients":[["zwarte bonen (blik)","100","g"],["tortilla (wrap)","1","stuk"],["tomatenblokjes (blik)","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["groentebouillon","250","ml"],["taco-kruiden","1","tl"],["avocado","0.5","stuk"],["limoen","0.25","stuk"]],"steps":["Verwarm de oven voor op 200°C. Snijd de tortilla in dunne reepjes, meng ze met 1 theelepel olie en een snuf zout en spreid ze uit op een bakplaat. Bak 8 tot 10 minuten tot ze goudbruin en knapperig zijn.","Snipper intussen de ui en snijd de knoflook fijn. Laat de bonen uitlekken en spoel ze af.","Verhit 1 eetlepel olie in een soeppan op middelhoog vuur en fruit de ui 4 minuten. Voeg de knoflook en de taco-kruiden toe en bak 1 minuut tot het geurt.","Giet de tomatenblokjes en de bouillon erbij, voeg de bonen toe en breng aan de kook. Laat 12 minuten zachtjes koken en breng op smaak met zout, peper en het limoensap.","Snijd de avocado in blokjes. Schep de soep in kommen en leg de avocado en de knapperige tortillareepjes erop. De pittige tomatensoep, de romige avocado en de krokante tortilla zijn samen een Mexicaanse klassieker die elke lepel anders smaakt."]},{"id":96,"name":"Dumplingsoep met paksoi en gember","type":"Vegetarisch","time":25,"emoji":"🥟","cuisine":"Aziatisch","ingredients":[["vegetarische dumplings (diepvries)","6","stuk"],["paksoi","1","stuk"],["gember","2","cm"],["knoflook","1","teen"],["groentebouillon","400","ml"],["sojasaus","1","el"],["sesamolie","1","tl"],["bosui","1","stuk"],["shiitake","50","g"]],"steps":["Snijd de gember in dunne plakjes en de knoflook fijn. Snijd de paksoi in de lengte in kwarten, de shiitake in plakjes en de bosui in ringetjes.","Verhit 1 theelepel olie in een soeppan op middelhoog vuur en bak de gember, knoflook en shiitake 2 minuten. Giet de bouillon en de sojasaus erbij en laat 8 minuten zachtjes trekken.","Leg de bevroren dumplings in de soep en kook ze 5 tot 6 minuten, of volgens de verpakking, tot ze gaar zijn en boven komen drijven.","Voeg de paksoi toe en kook nog 2 minuten, zodat de stelen beetgaar zijn en het blad net slinkt. Proef en voeg eventueel wat extra sojasaus toe.","Schep de soep in diepe kommen, druppel de sesamolie erover en strooi de bosui erop. De heldere gemberbouillon, de zachte dumplings en de knapperige paksoi zijn samen licht en toch verzadigend."]},{"id":97,"name":"Pho met biefstukreepjes en verse kruiden","type":"Vlees","time":30,"emoji":"🍜","cuisine":"Vietnamees","ingredients":[["biefstuk","125","g"],["rijstnoedels","80","g"],["runderbouillon","500","ml"],["ui","0.5","stuk"],["gember","3","cm"],["steranijs","1","stuk"],["vissaus","1","el"],["taugé","50","g"],["koriander","0.25","bosje"]],"steps":["Leg de biefstuk 15 minuten in de vriezer; zo kan hij straks flinterdun gesneden worden. Halveer de ui en snijd de gember in dikke plakken.","Leg de ui en gember met de snijkant naar beneden in een droge koekenpan op hoog vuur en laat ze 4 tot 5 minuten zwart blakeren; dat geeft de bouillon zijn diepe smaak.","Doe de ui, gember en steranijs met de bouillon en de vissaus in een pan en laat 15 minuten zachtjes trekken. Zeef de bouillon daarna en breng hem opnieuw aan de kook.","Bereid intussen de rijstnoedels volgens de verpakking en spoel ze af. Snijd de biefstuk tegen de draad in zo dun mogelijke plakjes.","Verdeel de noedels over een grote kom en leg het rauwe vlees erop. Giet de kokende bouillon erover, zodat het vlees in 1 minuut gaart. Maak af met de taugé en de grof gehakte koriander; de kruidige bouillon, het malse vlees en de frisse kruiden vormen samen de bekendste soep van Vietnam."]},{"id":98,"name":"Laksa met garnalen en kokos","type":"Vis","time":30,"emoji":"🍜","cuisine":"Aziatisch","ingredients":[["garnalen","125","g"],["rode currypasta","1.5","el"],["kokosmelk","200","ml"],["visbouillon","200","ml"],["eiernoedels","80","g"],["ei","1","stuk"],["taugé","50","g"],["limoen","0.25","stuk"],["koriander","0.25","bosje"]],"steps":["Kook het ei 7 minuten in zachtjes kokend water, laat het schrikken onder koud water, pel het en halveer het.","Kook de noedels volgens de verpakking, giet af en spoel ze kort met koud water.","Verhit 1 eetlepel olie in een soeppan op middelhoog vuur en bak de currypasta 1 minuut tot hij geurt. Giet de kokosmelk en de bouillon erbij, breng aan de kook en laat 8 minuten zachtjes pruttelen.","Voeg de garnalen toe en laat ze 3 minuten garen tot ze roze zijn. Breng de soep op smaak met het limoensap en zout.","Verdeel de noedels over een grote kom en giet de hete soep met de garnalen erover. Leg het ei en de taugé erop en strooi de koriander erover. De pittige, romige kokosbouillon rond de zachte noedels en zoete garnalen is een Maleisische straatklassieker die je zo thuis op tafel zet."]},{"id":99,"name":"Spaghetti bolognese","type":"Vlees","time":35,"emoji":"🍝","cuisine":"Italiaans","ingredients":[["spaghetti","100","g"],["rundergehakt","125","g"],["ui","0.5","stuk"],["wortel","0.5","stuk"],["knoflook","1","teen"],["tomatenblokjes","200","g"],["tomatenpuree","1","el"],["gedroogde oregano","0.5","tl"],["parmezaanse kaas","20","g"]],"steps":["Snipper de ui, snijd de wortel in heel kleine blokjes en hak de knoflook fijn. Verhit 1 eetlepel olijfolie in een hapjespan op middelhoog vuur en bak de ui en wortel 5 minuten zacht.","Zet het vuur hoog, voeg het gehakt toe en bak het 5 minuten rul en bruin. Roer de knoflook, de tomatenpuree en de oregano erdoor en bak 1 minuut mee.","Voeg de tomatenblokjes toe met een scheut water, breng op smaak met zout en peper en laat de saus 15 minuten zachtjes pruttelen met de deksel schuin op de pan. Roer af en toe.","Kook intussen de spaghetti in ruim water met zout volgens de verpakking beetgaar en giet af. Bewaar een beetje kookvocht.","Schep de spaghetti met een scheutje kookvocht door de saus. Serveer met de geraspte parmezaan en versgemalen peper; de kaas maakt de saus net wat voller en hartiger."]},{"id":100,"name":"Spaghetti carbonara","type":"Vlees","time":20,"emoji":"🥓","cuisine":"Italiaans","ingredients":[["spaghetti","100","g"],["pancetta","50","g"],["ei","1","stuk"],["eidooier","1","stuk"],["pecorino","25","g"],["knoflook","1","teen"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de spaghetti volgens de verpakking beetgaar. Bewaar een kopje kookvocht voor het afgieten.","Snijd de pancetta in reepjes en plet de knoflook. Bak de pancetta met de knoflook 5 tot 6 minuten in een droge koekenpan op middelhoog vuur tot het vet is uitgebakken en de reepjes knapperig zijn. Haal de knoflook eruit en zet het vuur uit.","Klop intussen het ei en de eidooier los met de geraspte pecorino en flink wat versgemalen zwarte peper.","Schep de afgegoten spaghetti door de pancetta in de pan. Giet het eimengsel erover en roer snel, zonder vuur, tot er een romige saus ontstaat. Voeg scheutjes kookvocht toe tot de saus mooi aan de pasta hangt.","Serveer direct met extra pecorino en peper. De hitte van de pasta gaart het ei net genoeg zonder dat het stolt, zo blijft de saus zijdezacht."]},{"id":101,"name":"Pasta all'amatriciana met spek en pecorino","type":"Vlees","time":25,"emoji":"🍝","cuisine":"Italiaans","ingredients":[["bucatini","100","g"],["gerookt spek","50","g"],["tomatenblokjes","200","g"],["ui","0.25","stuk"],["pecorino","25","g"],["chilivlokken","0.25","tl"],["witte wijn","30","ml"]],"steps":["Snijd het spek in dikke reepjes en snipper de ui. Bak het spek 5 minuten in een droge koekenpan op middelhoog vuur tot het vet is uitgebakken en de reepjes goudbruin zijn. Schep het spek uit de pan en laat het vet erin.","Bak de ui en de chilivlokken 3 minuten in het spekvet. Blus af met de witte wijn en laat 1 minuut inkoken.","Voeg de tomatenblokjes toe en laat de saus 10 minuten zachtjes pruttelen tot hij iets dikker is. Roer het spek er weer door en breng op smaak met zout en peper.","Kook intussen de bucatini in ruim water met zout volgens de verpakking beetgaar. Giet af en bewaar een kopje kookvocht.","Schep de pasta met een scheutje kookvocht en de helft van de pecorino door de saus. Serveer met de rest van de kaas erover; de zoute pecorino en het rokerige spek maken de simpele tomatensaus heel vol van smaak."]},{"id":102,"name":"Snelle lasagne met gehakt en spinazie","type":"Vlees","time":40,"emoji":"🧀","cuisine":"Italiaans","ingredients":[["lasagnebladen","4","stuk"],["rundergehakt","125","g"],["spinazie","100","g"],["passata","200","ml"],["ui","0.5","stuk"],["knoflook","1","teen"],["crème fraîche","75","g"],["geraspte kaas","40","g"],["italiaanse kruiden","1","tl"]],"steps":["Verwarm de oven voor op 200°C. Snipper de ui en hak de knoflook fijn. Verhit 1 eetlepel olijfolie in een hapjespan op hoog vuur en bak het gehakt met de ui 5 minuten rul en bruin.","Voeg de knoflook en de Italiaanse kruiden toe en bak 1 minuut mee. Giet de passata erbij, breng op smaak met zout en peper en laat 5 minuten pruttelen. Roer de spinazie erdoor en laat die in 1 minuut slinken.","Roer de crème fraîche los met een scheutje water en een snuf zout tot een dun gietbaar sausje.","Schep een laag gehaktsaus in een ingevette ovenschaal, leg er lasagnebladen op en herhaal tot alles op is. Eindig met een laagje gehaktsaus, giet de crème fraîche erover en bestrooi met de geraspte kaas.","Bak de lasagne 20 tot 25 minuten in de oven tot de kaas goudbruin is en de bladen zacht zijn. Laat 5 minuten staan voor het snijden, dan blijven de lagen mooi op hun plek."]},{"id":103,"name":"Pasta Boursin met courgette en cherrytomaat","type":"Vegetarisch","time":20,"emoji":"🧀","cuisine":"Europees","ingredients":[["penne","100","g"],["boursin","50","g"],["courgette","0.5","stuk"],["cherrytomaten","125","g"],["knoflook","1","teen"],["basilicum","0.25","bosje"],["pijnboompitten","10","g"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de penne volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Snijd intussen de courgette in halve plakjes, halveer de cherrytomaten en snijd de knoflook fijn. Rooster de pijnboompitten 2 minuten in een droge koekenpan en schep ze op een schoteltje.","Verhit 1 eetlepel olijfolie in dezelfde pan op middelhoog vuur. Bak de courgette 5 minuten tot hij lichtbruin kleurt, voeg de knoflook en de tomaten toe en bak 3 minuten mee tot de tomaten zacht worden.","Zet het vuur laag, voeg de Boursin toe met een flinke scheut kookvocht en roer tot een romige saus. Breng op smaak met peper en zout.","Schep de pasta door de saus en serveer met de pijnboompitten en gescheurde basilicum erover. De kruidige roomkaas smelt tot een saus waar de zoete tomaten mooi in uitkomen."]},{"id":104,"name":"Tortellini-ovenschotel met groenten en mozzarella","type":"Vegetarisch","time":35,"emoji":"🧀","cuisine":"Italiaans","ingredients":[["verse tortellini","150","g"],["mozzarella","0.5","bol"],["passata","200","ml"],["courgette","0.5","stuk"],["rode paprika","0.5","stuk"],["knoflook","1","teen"],["italiaanse kruiden","1","tl"],["parmezaanse kaas","15","g"]],"steps":["Verwarm de oven voor op 200°C. Snijd de courgette en de paprika in blokjes en hak de knoflook fijn.","Verhit 1 eetlepel olijfolie in een hapjespan op hoog vuur en bak de courgette en paprika 5 minuten tot ze beginnen te kleuren. Voeg de knoflook en de Italiaanse kruiden toe en bak 1 minuut mee.","Giet de passata erbij, breng op smaak met zout en peper en laat 3 minuten pruttelen. Roer de rauwe tortellini erdoor met een scheutje water.","Schep alles in een ingevette ovenschaal, scheur de mozzarella erover en bestrooi met de geraspte parmezaan.","Bak de schotel 18 tot 20 minuten in de oven tot de kaas gesmolten en lichtbruin is. Serveer met wat peper; de tortellini garen in de saus en nemen zo alle tomatensmaak op."]},{"id":105,"name":"Groene pasta met spinazie, erwten en ricotta","type":"Vegetarisch","time":20,"emoji":"🟢","cuisine":"Italiaans","ingredients":[["rigatoni","100","g"],["spinazie","100","g"],["doperwten","75","g"],["ricotta","60","g"],["knoflook","1","teen"],["citroen","0.25","stuk"],["parmezaanse kaas","20","g"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de rigatoni volgens de verpakking beetgaar. Voeg de laatste 2 minuten de doperwten toe. Bewaar een kopje kookvocht voor het afgieten.","Verhit intussen 1 eetlepel olijfolie in een koekenpan op middelhoog vuur. Bak de fijngesneden knoflook 1 minuut en laat de spinazie in 2 minuten slinken met een snuf zout.","Doe de spinazie met de helft van de ricotta, de geraspte parmezaan, het sap van de citroen en een flinke scheut kookvocht in een hoge beker en pureer met de staafmixer tot een gladde groene saus. Breng op smaak met peper en zout.","Schep de pasta en de erwten terug in de pan en roer de groene saus erdoor. Verwarm 1 minuut op laag vuur en voeg kookvocht toe als de saus te dik is.","Verdeel over de borden en schep de rest van de ricotta er in klodders op. Maak af met wat citroenrasp en peper; de frisse citroen houdt de romige saus licht."]},{"id":106,"name":"Pasta met broccoli, ansjovis en pangrattato","type":"Vis","time":25,"emoji":"🥦","cuisine":"Italiaans","ingredients":[["orecchiette","100","g"],["broccoli","200","g"],["ansjovisfilets","4","stuk"],["knoflook","2","teen"],["oud brood","1","sneden"],["chilivlokken","0.25","tl"],["citroen","0.25","stuk"],["parmezaanse kaas","15","g"]],"steps":["Verkruimel het brood grof in een keukenmachine of met de hand. Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur en bak het kruim met 1 fijngesneden teen knoflook en een snuf zout 4 tot 5 minuten goudbruin en krokant. Schep op een bord.","Snijd de broccoli in kleine roosjes. Breng een ruime pan water met zout aan de kook en kook de orecchiette volgens de verpakking. Voeg de laatste 4 minuten de broccoli toe. Bewaar een kopje kookvocht.","Verhit intussen 2 eetlepels olijfolie in dezelfde koekenpan op laag vuur. Voeg de ansjovis, de andere teen knoflook in plakjes en de chilivlokken toe en roer 2 minuten tot de ansjovis uit elkaar valt.","Giet de pasta en broccoli af en schep ze door de ansjovisolie. Druk de broccoli met een lepel wat fijn en voeg een scheut kookvocht toe zodat alles smeuïg wordt. Breng op smaak met citroensap en peper.","Serveer met het krokante broodkruim en de parmezaan erover. De ansjovis geeft diepte zonder dat het naar vis smaakt, en het kruim zorgt voor beet."]},{"id":107,"name":"Orecchiette met worst en broccoli","type":"Vlees","time":25,"emoji":"🍝","cuisine":"Italiaans","ingredients":[["orecchiette","100","g"],["italiaanse worst","100","g"],["broccoli","150","g"],["knoflook","1","teen"],["chilivlokken","0.25","tl"],["venkelzaad","0.5","tl"],["parmezaanse kaas","20","g"]],"steps":["Snijd de broccoli in kleine roosjes en snijd de knoflook in dunne plakjes. Haal het vel van de worst en verkruimel het vlees.","Breng een ruime pan water met zout aan de kook en kook de orecchiette volgens de verpakking beetgaar. Voeg de laatste 4 minuten de broccoli toe. Bewaar een kopje kookvocht.","Verhit intussen 1 eetlepel olijfolie in een koekenpan op hoog vuur. Bak het worstvlees 6 tot 8 minuten rul en bruin, met het venkelzaad erbij. Zet het vuur lager en bak de knoflook en de chilivlokken 1 minuut mee.","Giet de pasta en de broccoli af en schep ze door de worst. Voeg een flinke scheut kookvocht en de helft van de parmezaan toe en roer tot er een smeuïg laagje om de pasta zit.","Serveer met de rest van de parmezaan en peper. Het vette, kruidige worstvlees en de zachte broccoli vullen elkaar precies goed aan."]},{"id":108,"name":"Pasta alla norma met aubergine en ricotta","type":"Vegetarisch","time":30,"emoji":"🍆","cuisine":"Italiaans","ingredients":[["rigatoni","100","g"],["aubergine","0.5","stuk"],["tomatenblokjes","200","g"],["knoflook","1","teen"],["ricotta","50","g"],["basilicum","0.25","bosje"],["parmezaanse kaas","15","g"]],"steps":["Snijd de aubergine in blokjes van 2 cm. Verhit 2 eetlepels olijfolie in een grote koekenpan op hoog vuur en bak de aubergine 8 tot 10 minuten tot hij rondom bruin en zacht is. Bestrooi met zout en schep op een bord.","Zet het vuur middelhoog, voeg nog een scheutje olie toe en bak de fijngesneden knoflook 1 minuut. Voeg de tomatenblokjes toe, breng op smaak met zout en peper en laat 10 minuten pruttelen.","Kook intussen de rigatoni in ruim water met zout volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Roer de aubergine door de tomatensaus en laat 2 minuten meepruttelen. Schep de pasta met een scheutje kookvocht erdoor.","Verdeel over de borden en maak af met klodders ricotta, de geraspte parmezaan en gescheurde basilicum. De koele ricotta tempert de zoete tomaat en de rokerige aubergine mooi."]},{"id":109,"name":"Cacio e pepe","type":"Vegetarisch","time":15,"emoji":"🧀","cuisine":"Italiaans","ingredients":[["spaghetti","100","g"],["pecorino","40","g"],["parmezaanse kaas","20","g"],["zwarte peperkorrels","1","tl"],["roomboter","10","g"]],"steps":["Breng een pan water met wat zout aan de kook; gebruik iets minder water dan normaal, zodat het kookvocht lekker zetmeelrijk wordt. Kook de spaghetti volgens de verpakking beetgaar.","Maal of stamp intussen de peperkorrels grof. Rooster de peper 1 minuut in een droge koekenpan op middelhoog vuur tot hij begint te geuren en zet het vuur uit.","Rasp de pecorino en de parmezaan heel fijn en roer ze in een kom met een paar eetlepels kookvocht tot een dikke, gladde pasta.","Schep de spaghetti met een tang in de koekenpan bij de peper, voeg de boter en een scheut kookvocht toe en roer 1 minuut. Haal de pan van het vuur, voeg het kaasmengsel toe en roer stevig tot er een romige saus ontstaat. Voeg scheutjes kookvocht toe als het te droog is.","Serveer meteen met extra peper en pecorino. Met maar drie ingrediënten draait alles om het roeren buiten het vuur, zo smelt de kaas zonder te klonteren."]},{"id":110,"name":"Pasta puttanesca met olijven en kappertjes","type":"Vis","time":20,"emoji":"🫒","cuisine":"Italiaans","ingredients":[["spaghetti","100","g"],["tomatenblokjes","200","g"],["ansjovisfilets","3","stuk"],["zwarte olijven","30","g"],["kappertjes","1","el"],["knoflook","1","teen"],["chilivlokken","0.25","tl"],["peterselie","0.25","bosje"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de spaghetti volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Snijd de knoflook fijn en halveer de olijven. Verhit 2 eetlepels olijfolie in een koekenpan op laag vuur en roer de ansjovis, knoflook en chilivlokken 2 minuten tot de ansjovis is opgelost in de olie.","Voeg de tomatenblokjes, olijven en kappertjes toe en laat de saus 10 minuten op middelhoog vuur pruttelen tot hij iets is ingedikt. Proef en breng op smaak met peper; zout is meestal niet meer nodig.","Schep de spaghetti met een scheutje kookvocht door de saus en roer 1 minuut op het vuur.","Serveer met grofgehakte peterselie. De zoute olijven en kappertjes en de pittige knoflook maken dit een saus met karakter, zonder dat er kaas aan te pas komt."]},{"id":111,"name":"Pasta met gerookte forel, doperwten en dille","type":"Vis","time":20,"emoji":"🐟","cuisine":"Italiaans","ingredients":[["penne","100","g"],["gerookte forelfilet","75","g"],["doperwten","75","g"],["crème fraîche","60","g"],["dille","0.25","bosje"],["citroen","0.5","stuk"],["sjalot","1","stuk"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de penne volgens de verpakking beetgaar. Voeg de laatste 3 minuten de doperwten toe. Bewaar een kopje kookvocht.","Snipper intussen de sjalot, hak de dille fijn en rasp de schil van de citroen. Pluk de gerookte forel in grove stukken en haal eventuele graatjes eruit.","Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur en bak de sjalot 3 minuten zacht. Zet het vuur laag en roer de crème fraîche, de citroenrasp en een scheut kookvocht erdoor tot een gladde saus.","Schep de pasta met de doperwten door de saus en voeg de forel toe. Warm 1 minuut door zonder veel te roeren, zodat de vis in stukken blijft.","Maak af met de dille, een scheutje citroensap en flink wat peper. Gerookte forel is milder en minder vet dan gerookte zalm en past precies bij de frisse dille en de zoete erwten."]},{"id":112,"name":"Pasta met worstjes, venkelzaad en tomaat","type":"Vlees","time":25,"emoji":"🌭","cuisine":"Italiaans","ingredients":[["fusilli","100","g"],["italiaanse worst","100","g"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["venkelzaad","1","tl"],["chilivlokken","0.25","tl"],["parmezaanse kaas","20","g"]],"steps":["Haal het vel van de worst en verkruimel het vlees. Snipper de ui en snijd de knoflook fijn. Stamp het venkelzaad grof.","Verhit 1 eetlepel olijfolie in een hapjespan op hoog vuur en bak het worstvlees 5 minuten bruin. Voeg de ui toe en bak 3 minuten mee tot hij zacht is, dan de knoflook, het venkelzaad en de chilivlokken nog 1 minuut.","Voeg de tomatenblokjes toe, breng op smaak met zout en peper en laat de saus 10 minuten zachtjes pruttelen.","Kook intussen de fusilli in ruim water met zout volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Schep de pasta met een scheutje kookvocht door de saus en serveer met de geraspte parmezaan. Het venkelzaad geeft de worst een licht anijsachtige smaak die prachtig past bij de tomaat."]},{"id":113,"name":"Rigatoni met paprikaroomsaus en geroosterde kikkererwten","type":"Vegetarisch","time":25,"emoji":"🫑","cuisine":"Italiaans","ingredients":[["rigatoni","100","g"],["geroosterde paprika uit pot","100","g"],["kikkererwten uit blik","100","g"],["kookroom","75","ml"],["knoflook","1","teen"],["gerookt paprikapoeder","1","tl"],["parmezaanse kaas","20","g"],["basilicum","0.25","bosje"]],"steps":["Spoel de kikkererwten af en dep ze goed droog. Verhit 1 eetlepel olijfolie in een koekenpan op hoog vuur en bak de kikkererwten 8 tot 10 minuten tot ze knapperig zijn. Bestrooi met het paprikapoeder en zout en schep ze op een bord.","Breng een ruime pan water met zout aan de kook en kook de rigatoni volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Pureer intussen de geroosterde paprika met de knoflook, de kookroom en de parmezaan met de staafmixer tot een gladde saus. Breng op smaak met zout en peper.","Giet de saus in de koekenpan en verwarm 3 minuten op laag vuur. Schep de pasta erdoor met een scheutje kookvocht tot de saus mooi aan de rigatoni hangt.","Serveer met de krokante kikkererwten en gescheurde basilicum erover. De zoete, rokerige saus en de knapperige kikkererwten geven contrast in smaak en beet."]},{"id":114,"name":"Mac and cheese met krokant broodkruim","type":"Vegetarisch","time":30,"emoji":"🧀","cuisine":"Amerikaans","ingredients":[["macaroni","100","g"],["belegen kaas","60","g"],["cheddar","40","g"],["melk","200","ml"],["panko","20","g"],["dijonmosterd","0.5","tl"],["nootmuskaat","0.25","tl"]],"steps":["Verwarm de oven voor op 200°C. Kook de macaroni in ruim water met zout 2 minuten korter dan op de verpakking staat en giet af.","Smelt intussen 15 gram boter in een steelpan op middelhoog vuur. Roer 1 eetlepel bloem erdoor en bak 1 minuut. Giet de melk er in delen bij en blijf roeren tot een gladde saus die in 3 tot 4 minuten dikker wordt.","Haal de pan van het vuur en roer de geraspte belegen kaas en cheddar, de mosterd en de nootmuskaat erdoor tot alles gesmolten is. Breng op smaak met zout en peper.","Schep de macaroni door de kaassaus en doe alles in een ingevette ovenschaal. Meng de panko met 1 theelepel gesmolten boter en strooi het over de schaal.","Bak 12 tot 15 minuten in de oven tot het kruim goudbruin is en de saus bubbelt. Serveer meteen; het knapperige laagje maakt de romige pasta eronder extra lekker."]},{"id":115,"name":"Pasta met kip, spinazie en zongedroogde tomaat","type":"Vlees","time":20,"emoji":"🍗","cuisine":"Italiaans","ingredients":[["penne","100","g"],["kipdijfilet","125","g"],["spinazie","100","g"],["zongedroogde tomaten","40","g"],["knoflook","1","teen"],["kookroom","75","ml"],["parmezaanse kaas","20","g"],["italiaanse kruiden","1","tl"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de penne volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Snijd de kip in reepjes en bestrooi met de Italiaanse kruiden, zout en peper. Snijd de zongedroogde tomaten in reepjes en de knoflook fijn.","Verhit 1 eetlepel olie uit de pot zongedroogde tomaten in een koekenpan op hoog vuur en bak de kip 5 tot 6 minuten goudbruin en gaar. Voeg de knoflook en de tomaten toe en bak 1 minuut mee.","Zet het vuur laag, giet de kookroom erbij en laat de spinazie er in 2 minuten in slinken. Roer de parmezaan erdoor en breng op smaak.","Schep de pasta met een scheutje kookvocht door de saus en serveer met peper. De zoetzure zongedroogde tomaat geeft de romige kipsaus precies de nodige kick."]},{"id":116,"name":"Spaghetti alle vongole","type":"Vis","time":20,"emoji":"🐚","cuisine":"Italiaans","ingredients":[["spaghetti","100","g"],["vongole (kokkels)","250","g"],["knoflook","2","teen"],["witte wijn","50","ml"],["chilivlokken","0.5","tl"],["peterselie","0.25","bosje"],["citroen","0.25","stuk"]],"steps":["Spoel de vongole onder koud water en gooi kapotte of open schelpen weg die niet sluiten als je erop tikt. Breng een ruime pan water met zout aan de kook en kook de spaghetti volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Snijd intussen de knoflook in dunne plakjes en hak de peterselie fijn.","Verhit 3 eetlepels olijfolie in een grote pan met deksel op middelhoog vuur. Bak de knoflook en de chilivlokken 1 tot 2 minuten tot de knoflook lichtgoud is.","Zet het vuur hoog, voeg de vongole en de wijn toe en doe het deksel op de pan. Laat 3 tot 4 minuten stomen tot de schelpen open zijn. Gooi schelpen die dicht blijven weg.","Schep de spaghetti met een scheut kookvocht door de schelpen en laat 1 minuut pruttelen tot het vocht aan de pasta hangt. Maak af met de peterselie, een scheutje citroensap en peper. Het zoute schelpenvocht is de saus; meer heeft dit gerecht niet nodig."]},{"id":117,"name":"Pasta met pompoen, salie en hazelnoot","type":"Vegetarisch","time":30,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["tagliatelle","100","g"],["flespompoen","200","g"],["salie","0.25","bosje"],["hazelnoten","20","g"],["knoflook","1","teen"],["parmezaanse kaas","20","g"],["roomboter","20","g"]],"steps":["Verwarm de oven voor op 220°C. Schil de pompoen en snijd hem in blokjes van 2 cm. Meng met 1 eetlepel olijfolie, zout en peper en rooster 20 minuten op een bakplaat tot de blokjes zacht en gebruind zijn.","Hak de hazelnoten grof en rooster ze 3 minuten in een droge koekenpan op middelhoog vuur. Schep ze op een bord.","Breng een ruime pan water met zout aan de kook en kook de tagliatelle volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Smelt de boter in de koekenpan op middelhoog vuur. Voeg de salieblaadjes en de geplette knoflook toe en bak 2 minuten tot de blaadjes knapperig zijn en de boter lichtbruin kleurt en nootachtig ruikt. Haal de knoflook eruit.","Schep de pasta, de pompoen en een scheut kookvocht door de salieboter. Serveer met de hazelnoten en de parmezaan erover; de zoete pompoen, de hartige boter en de nootjes zijn een klassieke herfstcombinatie."]},{"id":118,"name":"Risotto met groene asperges en citroen","type":"Vegetarisch","time":35,"emoji":"🌱","cuisine":"Italiaans","ingredients":[["risottorijst","80","g"],["groene asperges","150","g"],["sjalot","1","stuk"],["groentebouillonblokje","0.5","stuk"],["witte wijn","50","ml"],["citroen","0.5","stuk"],["parmezaanse kaas","25","g"],["roomboter","15","g"]],"steps":["Los het bouillonblokje op in 400 ml heet water en houd de bouillon warm in een steelpan. Snijd de houtige onderkanten van de asperges, snijd de stelen in stukjes van 2 cm en houd de punten apart. Snipper de sjalot.","Verhit 1 eetlepel olijfolie in een hapjespan op middelhoog vuur en bak de sjalot 3 minuten zacht. Voeg de rijst toe en roer 1 minuut tot de korrels glanzen. Blus af met de wijn en roer tot die is opgenomen.","Voeg telkens een soeplepel warme bouillon toe en roer regelmatig; schenk pas nieuwe bouillon bij als de vorige is opgenomen. Doe dit 16 tot 18 minuten tot de rijst romig en beetgaar is.","Voeg na 10 minuten de aspergestukjes toe en de laatste 4 minuten de punten, zodat ze knapperig blijven.","Haal de pan van het vuur en roer de boter, de parmezaan, de rasp en het sap van de citroen erdoor. Laat 2 minuten staan met de deksel erop en serveer met peper; de citroen houdt de romige risotto fris en laat de asperge goed uitkomen."]},{"id":119,"name":"Risotto met pompoen en salie","type":"Vegetarisch","time":35,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["risottorijst","80","g"],["flespompoen","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["groentebouillonblokje","0.5","stuk"],["witte wijn","50","ml"],["salie","0.25","bosje"],["parmezaanse kaas","25","g"],["roomboter","15","g"]],"steps":["Schil de pompoen en snijd hem in blokjes van 1 cm. Los het bouillonblokje op in 400 ml heet water en houd de bouillon warm. Snipper de ui en hak de knoflook fijn.","Verhit 1 eetlepel olijfolie in een hapjespan op middelhoog vuur en bak de ui 3 minuten zacht. Voeg de pompoen en de knoflook toe en bak 4 minuten mee. Roer de rijst erdoor en blus af met de wijn.","Voeg telkens een soeplepel bouillon toe en roer regelmatig; voeg pas nieuwe bouillon toe als de vorige is opgenomen. Doe dit 18 tot 20 minuten tot de rijst romig en beetgaar is en de pompoen zacht. Druk een deel van de pompoen met de lepel fijn zodat de risotto oranje kleurt.","Smelt intussen de boter in een klein pannetje op middelhoog vuur en bak de salieblaadjes 1 tot 2 minuten tot ze knapperig zijn.","Haal de risotto van het vuur, roer de parmezaan en de salieboter erdoor en breng op smaak met zout en peper. Serveer met de knapperige blaadjes erbovenop; de zoete pompoen en de kruidige salie horen bij elkaar."]},{"id":120,"name":"Risotto met doperwten, citroen en munt","type":"Vegetarisch","time":35,"emoji":"🟢","cuisine":"Italiaans","ingredients":[["risottorijst","80","g"],["doperwten","100","g"],["sjalot","1","stuk"],["groentebouillonblokje","0.5","stuk"],["witte wijn","50","ml"],["citroen","0.5","stuk"],["munt","0.25","bosje"],["parmezaanse kaas","25","g"],["roomboter","15","g"]],"steps":["Los het bouillonblokje op in 400 ml heet water en houd de bouillon warm in een steelpan. Snipper de sjalot en hak de munt fijn.","Verhit 1 eetlepel olijfolie in een hapjespan op middelhoog vuur en bak de sjalot 3 minuten zacht. Voeg de rijst toe en roer 1 minuut tot de korrels glanzen. Blus af met de wijn en roer tot die is opgenomen.","Voeg telkens een soeplepel bouillon toe en roer regelmatig; schenk pas nieuwe bouillon bij als de vorige is opgenomen. Doe dit 16 tot 18 minuten tot de rijst romig en beetgaar is.","Voeg de laatste 4 minuten de doperwten toe. Pureer eventueel een derde van de erwten met een scheut bouillon en roer dat erdoor voor een groenere kleur.","Haal de pan van het vuur en roer de boter, de parmezaan, de citroenrasp en een kneepje citroensap erdoor. Laat 2 minuten staan en serveer met de munt erover; munt en citroen maken deze risotto fris en lentezoet."]},{"id":121,"name":"Zeevruchtenrisotto met saffraan","type":"Vis","time":35,"emoji":"🦐","cuisine":"Italiaans","ingredients":[["risottorijst","80","g"],["zeevruchtenmix","150","g"],["sjalot","1","stuk"],["knoflook","1","teen"],["visbouillonblokje","0.5","stuk"],["witte wijn","50","ml"],["saffraan","0.25","tl"],["cherrytomaten","75","g"],["peterselie","0.25","bosje"]],"steps":["Los het bouillonblokje op in 400 ml heet water, voeg de saffraan toe en houd de bouillon warm. Snipper de sjalot, hak de knoflook fijn en halveer de cherrytomaten. Dep de zeevruchten droog.","Verhit 1 eetlepel olijfolie in een hapjespan op middelhoog vuur en bak de sjalot en knoflook 3 minuten zacht. Voeg de rijst toe en roer 1 minuut. Blus af met de wijn en roer tot die is opgenomen.","Voeg telkens een soeplepel saffraanbouillon toe en roer regelmatig; voeg pas nieuwe bouillon toe als de vorige is opgenomen. Doe dit 16 tot 18 minuten tot de rijst romig en beetgaar is.","Verhit intussen 1 eetlepel olijfolie in een koekenpan op hoog vuur en bak de zeevruchten en de tomaten 3 tot 4 minuten tot de garnalen roze zijn. Bestrooi met zout en peper.","Roer de zeevruchten en de tomaten door de risotto en breng op smaak. Serveer met gehakte peterselie en een scheutje olijfolie; de saffraan geeft kleur en een zachte bloemige smaak die prachtig past bij de zilte zeevruchten."]},{"id":122,"name":"Pizza met serranoham, rucola en parmezaan","type":"Vlees","time":20,"emoji":"🍕","cuisine":"Italiaans","ingredients":[["pizzadeeg uit de koeling","0.5","stuk"],["passata","75","ml"],["mozzarella","0.5","bol"],["serranoham","40","g"],["rucola","25","g"],["parmezaanse kaas","15","g"],["gedroogde oregano","0.5","tl"]],"steps":["Verwarm de oven voor op 240°C met een bakplaat erin. Rol het deeg uit op bakpapier en snijd het in de gewenste vorm.","Roer de passata met de oregano, een snuf zout en een scheutje olijfolie. Smeer het dun over het deeg en laat een rand van 2 cm vrij. Scheur de mozzarella in stukjes en verdeel ze erover.","Schuif de pizza met bakpapier en al op de hete bakplaat en bak 10 tot 12 minuten tot de rand goudbruin is en de kaas bubbelt.","Leg direct na het bakken de plakken serranoham losjes op de pizza, zodat ze net warm worden maar niet uitdrogen.","Strooi de rucola en de parmezaanschaafsels erover en maak af met peper en een scheutje olijfolie. De koele, pittige rucola en de zoute ham smaken het best op de hete pizza."]},{"id":123,"name":"Pizza margherita met burrata","type":"Vegetarisch","time":20,"emoji":"🍕","cuisine":"Italiaans","ingredients":[["pizzadeeg uit de koeling","0.5","stuk"],["passata","75","ml"],["burrata","0.5","bol"],["knoflook","1","teen"],["basilicum","0.25","bosje"],["gedroogde oregano","0.5","tl"]],"steps":["Verwarm de oven voor op 240°C met een bakplaat erin. Rol het deeg uit op bakpapier.","Roer de passata met de fijngesneden knoflook, de oregano, een snuf zout en 1 theelepel olijfolie. Smeer het dun over het deeg en laat een rand van 2 cm vrij.","Schuif de pizza met bakpapier en al op de hete bakplaat en bak 10 tot 12 minuten tot de rand goudbruin en knapperig is.","Haal de pizza uit de oven, leg de burrata in het midden en scheur hem open zodat de romige vulling over de pizza loopt.","Maak af met basilicumblaadjes, peper en een scheutje olijfolie en snijd in punten. De koele romige burrata op de hete tomatensaus is simpel en toch feestelijk."]},{"id":124,"name":"Plaattaart met pesto, ricotta en tomaat","type":"Vegetarisch","time":30,"emoji":"🥧","cuisine":"Italiaans","ingredients":[["bladerdeeg uit de koeling","0.5","stuk"],["ricotta","75","g"],["groene pesto","1","el"],["cherrytomaten","125","g"],["parmezaanse kaas","15","g"],["ei","0.5","stuk"],["basilicum","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C. Rol het bladerdeeg uit op een met bakpapier beklede bakplaat en snijd met een mes een lijn op 2 cm van de rand, zonder helemaal door te snijden, zodat er een opstaande rand ontstaat.","Roer de ricotta los met de pesto, de geraspte parmezaan, zout en peper. Smeer het mengsel binnen de rand over het deeg.","Halveer de cherrytomaten en leg ze met de snijkant naar boven op de ricotta. Bestrooi met peper en een scheutje olijfolie. Klop het ei los en bestrijk de rand ermee.","Bak de taart 20 tot 22 minuten in de oven tot de rand goudbruin en hoog is en de tomaten zacht zijn.","Laat 3 minuten rusten en maak af met gescheurde basilicum. Serveer met een groene salade; de kruidige pesto-ricotta en de zoete tomaten maken deze taart licht en zomers."]},{"id":125,"name":"Hartige taart met prei, spek en kaas","type":"Vlees","time":40,"emoji":"🥧","cuisine":"Europees","ingredients":[["hartige taartdeeg","100","g"],["prei","0.5","stuk"],["spekreepjes","50","g"],["ei","1","stuk"],["crème fraîche","60","g"],["geraspte belegen kaas","40","g"],["tijm","0.5","tl"],["nootmuskaat","0.25","tl"]],"steps":["Verwarm de oven voor op 190°C. Bekleed een ingevette kleine taartvorm of ovenschaaltje met het deeg en prik de bodem in met een vork.","Snijd de prei in dunne ringen en was hem goed. Bak de spekreepjes 4 minuten in een droge koekenpan op middelhoog vuur tot ze knapperig zijn. Voeg de prei en de tijm toe en bak 5 minuten mee tot de prei zacht is.","Klop in een kom het ei los met de crème fraîche, de helft van de kaas, de nootmuskaat, peper en een beetje zout.","Verdeel de prei en het spek over de deegbodem, giet het eimengsel erover en bestrooi met de rest van de kaas.","Bak de taart 25 minuten in de oven tot de vulling gestold en goudbruin is. Laat 5 minuten staan en serveer met een frisse salade; de zoete prei en het zoute spek zijn een klassiek duo in de romige vulling."]},{"id":126,"name":"Quiche met spinazie, feta en pijnboompitten","type":"Vegetarisch","time":40,"emoji":"🥧","cuisine":"Europees","ingredients":[["hartige taartdeeg","100","g"],["spinazie","125","g"],["feta","50","g"],["ei","1","stuk"],["crème fraîche","60","g"],["pijnboompitten","10","g"],["knoflook","1","teen"],["nootmuskaat","0.25","tl"]],"steps":["Verwarm de oven voor op 190°C. Bekleed een ingevette kleine taartvorm met het deeg en prik de bodem in met een vork.","Verhit 1 theelepel olijfolie in een koekenpan op middelhoog vuur, bak de fijngesneden knoflook 1 minuut en laat de spinazie in 2 tot 3 minuten slinken. Knijp de spinazie in een zeef goed uit, anders wordt de quiche waterig.","Klop het ei los met de crème fraîche, de nootmuskaat, peper en een snufje zout. Roer de spinazie erdoor.","Giet de vulling op de deegbodem, verkruimel de feta erover en strooi de pijnboompitten erop.","Bak de quiche 25 minuten in de oven tot de vulling stevig is en de pijnboompitten goudbruin zijn. Laat 5 minuten staan voor het aansnijden; de zoute feta en de nootachtige pitten tillen de milde spinazievulling op."]},{"id":127,"name":"Flammkuchen met spek, ui en crème fraîche","type":"Vlees","time":25,"emoji":"🥓","cuisine":"Europees","ingredients":[["pizzadeeg uit de koeling","0.5","stuk"],["crème fraîche","75","g"],["spekreepjes","50","g"],["rode ui","0.5","stuk"],["nootmuskaat","0.25","tl"],["bieslook","0.25","bosje"]],"steps":["Verwarm de oven voor op 240°C met een bakplaat erin. Rol het deeg uit op bakpapier en rol het met een deegroller nog iets dunner; een flammkuchen hoort dun en krokant te zijn.","Roer de crème fraîche los met de nootmuskaat, peper en een snuf zout. Smeer het in een dunne laag over het deeg tot bijna aan de rand.","Snijd de rode ui in dunne halve ringen en verdeel ze met de spekreepjes over de crème fraîche.","Schuif de flammkuchen met bakpapier en al op de hete bakplaat en bak 10 tot 12 minuten tot de bodem knapperig is en het spek lichtbruin.","Knip de bieslook erover, snijd in stukken en eet direct. De frisse, licht zure crème fraîche en het zoute spek maken dit een simpel maar verslavend plaatbrood."]},{"id":128,"name":"Kiprollade gevuld met spinazie en ricotta","type":"Vlees","time":35,"emoji":"🍗","cuisine":"Italiaans","ingredients":[["kipfilet","1","stuk"],["spinazie","75","g"],["ricotta","50","g"],["parmezaanse kaas","15","g"],["knoflook","1","teen"],["cherrytomaten","100","g"],["krieltjes","200","g"],["italiaanse kruiden","1","tl"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes, meng ze met 1 eetlepel olijfolie, zout en peper en leg ze op een bakplaat. Rooster ze alvast 10 minuten.","Laat intussen de spinazie met de fijngesneden knoflook in 2 minuten slinken in een koekenpan met een scheutje olie. Knijp hem goed uit, hak grof en meng met de ricotta, de parmezaan, zout en peper.","Leg de kipfilet tussen twee vellen bakpapier en sla hem met een pan of deegroller plat tot ongeveer 1 cm dik. Bestrooi met de Italiaanse kruiden, zout en peper. Smeer de vulling erover, rol de kip strak op en zet vast met cocktailprikkers.","Verhit 1 eetlepel olie in de koekenpan op hoog vuur en bak de rollade 3 minuten rondom bruin. Leg hem met de cherrytomaten bij de krieltjes op de bakplaat en bak nog 15 tot 18 minuten in de oven tot de kip gaar is.","Laat de rollade 3 minuten rusten, verwijder de prikkers en snijd in plakken. Serveer met de krieltjes en de zachte tomaten; de romige vulling houdt de kip sappig en de tomaten geven een fris sausje."]},{"id":129,"name":"Saltimbocca van kalkoen met salie en prosciutto","type":"Vlees","time":25,"emoji":"🌿","cuisine":"Italiaans","ingredients":[["kalkoenfilet","150","g"],["prosciutto","30","g"],["salie","0.25","bosje"],["witte wijn","50","ml"],["citroen","0.25","stuk"],["roomboter","15","g"],["sperziebonen","150","g"],["ciabatta","0.5","stuk"]],"steps":["Snijd de kalkoenfilet in 2 dunne lappen en sla ze tussen bakpapier met een pan plat tot ongeveer 1 cm dik. Bestrooi met peper en weinig zout, want de ham is al zout.","Leg op elke lap 2 salieblaadjes en dek af met een plakje prosciutto. Druk de ham goed aan en prik hem eventueel vast met een cocktailprikker. Bestuif de lapjes licht met bloem.","Breng een pan water met zout aan de kook en kook de sperziebonen 6 tot 8 minuten beetgaar. Giet af en meng met een scheutje olijfolie.","Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur. Bak de lapjes eerst 3 minuten op de hamkant en dan 2 tot 3 minuten op de andere kant tot ze gaar zijn. Leg ze op een bord.","Giet de wijn in de hete pan, laat 1 minuut inkoken, roer de boter en een kneepje citroensap erdoor tot een glanzend sausje. Schep het over de saltimbocca en serveer met de bonen en een stuk ciabatta; de zoute ham en de kruidige salie geven het milde kalkoenvlees precies genoeg karakter."]},{"id":130,"name":"Pad thai met garnalen en pinda's","type":"Vis","time":25,"emoji":"🥜","cuisine":"Thais","ingredients":[["rijstnoedels","80","g"],["garnalen","100","g"],["ei","1","stuk"],["taugé","50","g"],["bosui","2","stuk"],["knoflook","1","teen"],["vissaus","1","el"],["limoen","0.5","stuk"],["pinda's","20","g"]],"steps":["Week de rijstnoedels 8 tot 10 minuten in heet water tot ze soepel maar nog stevig zijn. Giet af en spoel koud.","Roer intussen de vissaus met 1 eetlepel suiker, het sap van de halve limoen en 1 eetlepel water tot een sausje. Snijd de bosui in ringen, hak de knoflook en de pinda's grof.","Verhit 1 eetlepel olie in een wok of grote koekenpan op hoog vuur. Bak de garnalen met de knoflook 2 minuten tot ze roze zijn en schuif ze naar de zijkant.","Breek het ei in de pan, roer het 1 minuut los tot het net gestold is en voeg de noedels en de saus toe. Wokken, 2 tot 3 minuten, tot de noedels de saus hebben opgenomen.","Schep de taugé en het witte deel van de bosui erdoor en haal de pan van het vuur. Serveer met de pinda's, het groen van de bosui en een extra partje limoen; het zure van de limoen en het zoute van de vissaus houden het gerecht fris."]},{"id":131,"name":"Pad see ew met brede rijstnoedels en broccoli","type":"Vegetarisch","time":20,"emoji":"🍜","cuisine":"Thais","ingredients":[["brede rijstnoedels","100","g"],["broccoli","150","g"],["ei","1","stuk"],["knoflook","2","teen"],["ketjap manis","1.5","el"],["sojasaus","1","el"],["rijstazijn","1","tl"],["chilivlokken","0.25","tl"]],"steps":["Bereid de rijstnoedels volgens de verpakking tot ze net gaar zijn, giet af en spoel kort met koud water zodat ze niet plakken.","Snijd de broccoli in kleine roosjes en de steel in dunne plakjes. Hak de knoflook fijn. Roer de ketjap, sojasaus en rijstazijn met 1 theelepel suiker tot een saus.","Verhit 1 eetlepel olie in een wok op hoog vuur. Bak de broccoli 3 tot 4 minuten met een scheutje water tot hij knapperig gaar is en schep hem uit de pan.","Doe nog 1 eetlepel olie in de wok en bak de knoflook 30 seconden. Breek het ei erbij en roer het 1 minuut los. Voeg de noedels en de saus toe en laat ze 2 tot 3 minuten bakken zonder te veel te roeren, zodat ze hier en daar bruin en rokerig worden.","Schep de broccoli terug door de noedels en serveer met de chilivlokken. De zoete, donkere saus en de licht aangebakken noedels maken dit een lekker rokerig straatgerecht."]},{"id":132,"name":"Massaman curry met rund en aardappel","type":"Vlees","time":40,"emoji":"🥘","cuisine":"Thais","ingredients":[["runderpoulet","150","g"],["aardappelen","150","g"],["ui","0.5","stuk"],["kokosmelk","200","ml"],["massaman currypasta","1.5","el"],["vissaus","1","tl"],["pinda's","20","g"],["rijst","80","g"],["limoen","0.25","stuk"]],"steps":["Snijd de ui in halve ringen en schil de aardappelen. Snijd ze in stukken van 3 centimeter. Dep het vlees droog.","Verhit 1 eetlepel olie in een stoofpan op hoog vuur en bak het vlees 3 minuten rondom bruin. Voeg de ui toe en bak 2 minuten mee.","Roer de currypasta erdoor en bak 1 minuut tot hij geurt. Giet de kokosmelk en 150 ml water erbij, voeg de aardappelen, de vissaus en 1 theelepel suiker toe en breng aan de kook.","Laat de curry met het deksel schuin op de pan 25 minuten zachtjes pruttelen op laag vuur, tot de aardappelen gaar zijn en het vlees mals. Roer af en toe.","Kook intussen de rijst volgens de verpakking en rooster de pinda's 2 minuten in een droge pan. Serveer de curry op de rijst met de pinda's en een kneepje limoen; de milde, licht zoete saus met kaneelachtige specerijen past precies bij het zachte rundvlees."]},{"id":133,"name":"Gele curry met spinazie en kikkererwten","type":"Vegetarisch","time":25,"emoji":"🍛","cuisine":"Thais","ingredients":[["kikkererwten","120","g"],["spinazie","100","g"],["ui","0.5","stuk"],["gele currypasta","1.5","el"],["kokosmelk","200","ml"],["rijst","80","g"],["limoen","0.25","stuk"],["koriander","0.25","bosje"]],"steps":["Kook de rijst volgens de verpakking.","Snipper de ui. Verhit 1 eetlepel olie in een pan op middelhoog vuur en bak de ui 4 minuten zacht. Voeg de currypasta toe en bak 1 minuut mee tot hij geurt.","Giet de kokosmelk en 100 ml water erbij. Laat de kikkererwten uitlekken en voeg ze toe met 1 theelepel suiker. Laat 8 tot 10 minuten zachtjes pruttelen tot de saus iets dikker is.","Roer de spinazie in delen door de curry en laat 2 minuten slinken. Breng op smaak met zout en het sap van de limoen.","Serveer de curry op de rijst met grof gehakte koriander. De zachte, romige kokos vangt de pit van de gele currypasta mooi op."]},{"id":134,"name":"Panang curry met kip en sperziebonen","type":"Vlees","time":25,"emoji":"🍛","cuisine":"Thais","ingredients":[["kipdijfilet","150","g"],["sperziebonen","125","g"],["rode paprika","0.5","stuk"],["panang currypasta","1.5","el"],["kokosmelk","200","ml"],["pindakaas","1","tl"],["vissaus","1","tl"],["rijst","80","g"],["thaise basilicum","0.25","bosje"]],"steps":["Kook de rijst volgens de verpakking. Maak de sperziebonen schoon en halveer ze. Snijd de paprika in reepjes en de kip in stukken van 2 centimeter.","Schep 3 eetlepels van het dikke deel van de kokosmelk in een wok en verhit op middelhoog vuur. Roer de currypasta erdoor en bak 2 minuten tot de olie zich afscheidt.","Voeg de kip toe en bak 3 minuten tot hij rondom wit is. Giet de rest van de kokosmelk erbij met de pindakaas, vissaus en 1 theelepel suiker.","Voeg de sperziebonen en paprika toe en laat 8 minuten zachtjes pruttelen tot de kip gaar is en de bonen nog een beetje bite hebben.","Scheur de basilicum erover en serveer met de rijst. Panang is dikker en zoeter dan rode curry, en de pindakaas geeft precies die nootachtige rondheid."]},{"id":135,"name":"Thaise viskoekjes met komkommersalade","type":"Vis","time":30,"emoji":"🐟","cuisine":"Thais","ingredients":[["witvisfilet","150","g"],["rode currypasta","1","el"],["ei","0.5","stuk"],["sperziebonen","40","g"],["komkommer","0.5","stuk"],["rijstazijn","1","el"],["pinda's","15","g"],["zoete chilisaus","2","el"],["limoenblad","2","stuk"]],"steps":["Snijd de komkommer in dunne halve maantjes en meng met de rijstazijn, 1 theelepel suiker en een snuf zout. Zet weg om te marineren.","Snijd de sperziebonen in heel dunne ringetjes en de limoenblaadjes in flinterdunne reepjes. Dep de vis droog en snijd hem in blokjes.","Doe de vis met de currypasta, het ei, 1 theelepel vissaus of zout en 1 eetlepel bloem in een keukenmachine en maal tot een kleverige massa. Meng de sperziebonen en het limoenblad erdoor.","Vorm met natte handen 4 platte koekjes. Verhit een laag olie van 1 centimeter in een koekenpan op middelhoog vuur en bak de koekjes 3 tot 4 minuten per kant goudbruin. Laat uitlekken op keukenpapier.","Hak de pinda's grof en strooi ze over de komkommersalade. Serveer de viskoekjes met de salade en de zoete chilisaus; de frisse, zure komkommer houdt de pittige koekjes luchtig."]},{"id":136,"name":"Larb van kipgehakt met limoen en munt","type":"Vlees","time":20,"emoji":"🌿","cuisine":"Thais","ingredients":[["kipgehakt","150","g"],["sjalot","1","stuk"],["limoen","1","stuk"],["vissaus","1.5","el"],["munt","0.25","bosje"],["koriander","0.25","bosje"],["rijst","1","el"],["chilivlokken","0.5","tl"],["little gem","1","krop"]],"steps":["Rooster de ongekookte rijst 4 tot 5 minuten in een droge koekenpan op middelhoog vuur tot hij goudbruin is en geurt. Maal grof in een vijzel; dit geeft de larb zijn knapperige beet.","Snijd de sjalot in dunne ringen. Pluk de munt en koriander. Maak de little gem los in blaadjes.","Verhit 1 theelepel olie in dezelfde pan op hoog vuur en bak het kipgehakt 5 tot 6 minuten rul en gaar. Haal de pan van het vuur.","Roer de vissaus, het sap van de limoen, de chilivlokken en een snuf suiker door het warme gehakt. Voeg de sjalot, de kruiden en de geroosterde rijst toe en meng goed.","Serveer de larb met de slablaadjes om er hapjes mee te scheppen. Zout, zuur, pittig en fris komen hier in één hap samen."]},{"id":137,"name":"Butter chicken met naan","type":"Vlees","time":35,"emoji":"🍛","cuisine":"Indiaas","ingredients":[["kipdijfilet","150","g"],["yoghurt","2","el"],["garam masala","1.5","tl"],["knoflook","1","teen"],["gember","1","cm"],["gezeefde tomaten","150","ml"],["slagroom","50","ml"],["naan","1","stuk"],["koriander","0.25","bosje"]],"steps":["Snijd de kip in stukken van 3 centimeter en meng met de yoghurt, 1 theelepel garam masala en een snuf zout. Laat 10 minuten marineren terwijl de rest wordt voorbereid.","Rasp de knoflook en gember fijn. Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 5 minuten tot hij bruine randjes heeft. Schep hem uit de pan.","Smelt 1 eetlepel boter in dezelfde pan op middelhoog vuur. Bak de knoflook en gember 1 minuut, voeg de rest van de garam masala en 1 theelepel paprikapoeder toe en bak 30 seconden.","Giet de gezeefde tomaten erbij met 1 theelepel suiker en laat 8 minuten pruttelen tot de saus dikker is. Roer de slagroom erdoor, voeg de kip toe en laat nog 5 minuten zachtjes garen.","Verwarm de naan 2 minuten in een hete droge pan of onder de grill. Serveer de butter chicken met de naan en gehakte koriander; de zachte, romige tomatensaus is precies gemaakt om het brood in te dopen."]},{"id":138,"name":"Chana masala met basmatirijst","type":"Vegetarisch","time":25,"emoji":"🫘","cuisine":"Indiaas","ingredients":[["kikkererwten","150","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["gember","1","cm"],["tomatenblokjes","150","g"],["garam masala","1","tl"],["komijnzaad","0.5","tl"],["basmatirijst","80","g"],["koriander","0.25","bosje"]],"steps":["Kook de basmatirijst volgens de verpakking.","Snipper de ui en rasp de knoflook en gember. Verhit 1 eetlepel olie in een pan op middelhoog vuur en bak het komijnzaad 30 seconden. Voeg de ui toe en bak 5 minuten goudbruin.","Roer de knoflook, gember, garam masala en 0.5 theelepel kurkuma erdoor en bak 1 minuut. Voeg de tomatenblokjes toe en laat 5 minuten inkoken tot een dikke saus.","Laat de kikkererwten uitlekken en voeg ze toe met 100 ml water. Laat 8 minuten pruttelen en druk een deel van de kikkererwten plat met een lepel zodat de saus bindt. Breng op smaak met zout en een kneepje citroen.","Serveer op de rijst met gehakte koriander. Een lepel yoghurt erbij tempert de pit en maakt het geheel romig."]},{"id":139,"name":"Kip tikka masala met koriander","type":"Vlees","time":35,"emoji":"🍛","cuisine":"Indiaas","ingredients":[["kipfilet","150","g"],["yoghurt","3","el"],["tikka masala kruiden","2","tl"],["ui","0.5","stuk"],["knoflook","1","teen"],["tomatenblokjes","200","g"],["crème fraîche","2","el"],["rijst","80","g"],["koriander","0.25","bosje"]],"steps":["Snijd de kip in blokken en meng met 2 eetlepels yoghurt, de helft van de kruiden en een snuf zout. Laat 10 minuten staan.","Kook de rijst volgens de verpakking. Snipper de ui en hak de knoflook fijn.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 5 minuten tot hij mooi bruin is. Schep hem uit de pan.","Doe 1 eetlepel olie in de pan en bak de ui 5 minuten op middelhoog vuur. Voeg de knoflook en de rest van de kruiden toe, bak 1 minuut en giet de tomatenblokjes erbij. Laat 10 minuten pruttelen.","Roer de crème fraîche en de laatste yoghurt door de saus, voeg de kip toe en laat 5 minuten zachtjes garen. Serveer op de rijst met veel koriander; de frisse kruiden geven de rijke saus lucht."]},{"id":140,"name":"Palak paneer met naan","type":"Vegetarisch","time":30,"emoji":"🧀","cuisine":"Indiaas","ingredients":[["paneer","125","g"],["spinazie","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["gember","1","cm"],["garam masala","1","tl"],["slagroom","50","ml"],["naan","1","stuk"]],"steps":["Snijd de paneer in blokjes van 2 centimeter. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de blokjes 4 minuten tot ze goudbruin zijn. Schep ze op een bord.","Laat de spinazie 1 minuut slinken in een pan met een scheutje water, giet af en pureer grof met de staafmixer.","Snipper de ui en rasp de knoflook en gember. Bak de ui 5 minuten in de koekenpan met 1 eetlepel boter, voeg knoflook, gember, garam masala en 0.5 theelepel komijn toe en bak 1 minuut.","Roer de spinaziepuree en de slagroom erdoor en laat 5 minuten zachtjes pruttelen. Voeg de paneer toe en warm 3 minuten mee. Breng op smaak met zout.","Verwarm de naan kort in een droge pan en serveer bij de palak paneer. De milde, licht zoute kaas en de kruidige spinazieroom zijn samen een klassieker."]},{"id":141,"name":"Aloo gobi met linzen en rijst","type":"Vegetarisch","time":30,"emoji":"🥔","cuisine":"Indiaas","ingredients":[["aardappelen","150","g"],["bloemkool","200","g"],["rode linzen","50","g"],["ui","0.5","stuk"],["gember","1","cm"],["kurkuma","0.5","tl"],["komijnzaad","0.5","tl"],["rijst","70","g"],["koriander","0.25","bosje"]],"steps":["Kook de rijst volgens de verpakking. Spoel de linzen af en kook ze in 200 ml water met een snuf zout 12 minuten tot ze zacht zijn.","Schil de aardappelen en snijd ze in blokjes van 2 centimeter. Snijd de bloemkool in kleine roosjes. Snipper de ui en rasp de gember.","Verhit 2 eetlepels olie in een koekenpan met deksel op middelhoog vuur. Bak het komijnzaad 30 seconden, voeg de ui en gember toe en bak 3 minuten.","Voeg de aardappelen, bloemkool, kurkuma, 1 theelepel garam masala en een snuf zout toe. Schenk er 50 ml water bij, dek af en laat 15 minuten garen. Schud de pan af en toe en haal het deksel de laatste 3 minuten eraf zodat de groenten bruin worden.","Serveer de aloo gobi met de linzen en de rijst, en strooi er koriander over. De droge, kruidige groenten en de zachte linzen vullen elkaar precies aan."]},{"id":142,"name":"Kip korma met amandel en rozijnen","type":"Vlees","time":30,"emoji":"🍛","cuisine":"Indiaas","ingredients":[["kipdijfilet","150","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["kormakruiden","2","tl"],["kokosmelk","100","ml"],["yoghurt","3","el"],["amandelschaafsel","15","g"],["rozijnen","15","g"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking. Snijd de kip in stukken van 3 centimeter, snipper de ui en hak de knoflook fijn.","Rooster het amandelschaafsel 2 minuten in een droge koekenpan tot het licht goudbruin is en schep het eruit.","Verhit 1 eetlepel olie en 1 theelepel boter in dezelfde pan op middelhoog vuur. Bak de ui 5 minuten zacht, voeg de knoflook en de kormakruiden toe en bak 1 minuut.","Voeg de kip toe en bak 3 minuten tot hij rondom wit is. Giet de kokosmelk erbij met de rozijnen en laat 12 minuten zachtjes pruttelen tot de kip gaar is.","Haal de pan van het vuur en roer de yoghurt erdoor zodat de saus niet schift. Serveer op de rijst met de amandelen erover; de zoete rozijnen en nootachtige amandel maken deze milde curry extra rijk."]},{"id":143,"name":"Viscurry met kokos en tamarinde","type":"Vis","time":25,"emoji":"🐟","cuisine":"Indiaas","ingredients":[["witvisfilet","150","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["gember","1","cm"],["kokosmelk","150","ml"],["tamarindepasta","1","tl"],["kurkuma","0.5","tl"],["tomaat","1","stuk"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking. Snijd de vis in stukken van 4 centimeter en bestrooi met de kurkuma en een snuf zout.","Snipper de ui, rasp de knoflook en gember en snijd de tomaat in blokjes.","Verhit 1 eetlepel olie in een hapjespan op middelhoog vuur. Bak de ui 4 minuten, voeg de knoflook, gember en 1 theelepel korianderpoeder toe en bak 1 minuut.","Voeg de tomaat toe en bak 2 minuten. Giet de kokosmelk erbij, roer de tamarindepasta en 0.5 theelepel suiker erdoor en laat 5 minuten pruttelen.","Leg de vis in de saus, zet het vuur laag en laat 6 tot 8 minuten zachtjes garen zonder te roeren. Serveer op de rijst; het zure van de tamarinde maakt de romige kokossaus licht en fris bij de vis."]},{"id":144,"name":"Tandoori-roodbaars met zoeteaardappelsalade","type":"Vis","time":25,"emoji":"🐟","cuisine":"Indiaas","ingredients":[["roodbaarsfilet","150","g"],["yoghurt","3","el"],["tandoorikruiden","2","tl"],["zoete aardappel","200","g"],["rode ui","0.25","stuk"],["komkommer","0.25","stuk"],["limoen","0.5","stuk"],["munt","0.25","bosje"]],"steps":["Verwarm de oven voor op 220°C. Schil de zoete aardappel, snijd hem in blokjes van 2 cm en meng met 1 eetlepel olie en zout. Rooster 20 minuten op een bakplaat tot de blokjes zacht zijn met bruine randjes.","Meng 2 eetlepels yoghurt met de tandoorikruiden en een snuf zout. Smeer de roodbaars aan de vleeskant dik in en laat even staan.","Leg de vis na 12 minuten met de huid naar beneden naast de zoete aardappel en bak 8 tot 10 minuten mee tot hij ondoorzichtig is en makkelijk uit elkaar valt.","Snijd intussen de rode ui in dunne halve ringen en de komkommer in blokjes. Meng met de rest van de yoghurt, het sap van de limoen, gehakte munt, zout en peper.","Schep de zoete aardappel door de komkommer-uimengsel en serveer de vis erop. Roodbaars heeft een stevige, licht zoete smaak die de pittige tandoorikruiden goed aankan."]},{"id":145,"name":"Tofu in zwartebonensaus met paprika","type":"Vegetarisch","time":20,"emoji":"🫘","cuisine":"Chinees","ingredients":[["stevige tofu","150","g"],["rode paprika","0.5","stuk"],["groene paprika","0.5","stuk"],["bosui","2","stuk"],["knoflook","2","teen"],["zwartebonensaus","1.5","el"],["sojasaus","1","el"],["maizena","1","tl"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking. Dep de tofu droog, snijd hem in blokjes van 2 centimeter en bestuif met de maizena.","Snijd de paprika's in stukken van 2 centimeter, de bosui in stukjes van 3 centimeter en de knoflook in plakjes. Roer de zwartebonensaus met de sojasaus, 1 theelepel suiker en 50 ml water tot een saus.","Verhit 2 eetlepels olie in een wok op hoog vuur en bak de tofu 5 tot 6 minuten tot hij rondom knapperig en goudbruin is. Schep hem uit de pan.","Bak de paprika en knoflook 3 minuten in de wok. Voeg de tofu en de saus toe en wok 1 tot 2 minuten tot alles glanst.","Schep de bosui erdoor en serveer op de rijst. De zoute, hartige zwartebonensaus geeft de milde tofu precies de diepte die hij nodig heeft."]},{"id":146,"name":"Mapo tofu met gehakt en Szechuanpeper","type":"Vlees","time":25,"emoji":"🌶️","cuisine":"Chinees","ingredients":[["zachte tofu","200","g"],["half-om-halfgehakt","80","g"],["doubanjiang","1","el"],["knoflook","1","teen"],["gember","1","cm"],["bosui","2","stuk"],["szechuanpeper","0.5","tl"],["sojasaus","1","tl"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking. Snijd de tofu in blokjes van 2 centimeter en laat ze 2 minuten in zachtjes kokend water met zout liggen; zo blijven ze stevig. Giet voorzichtig af.","Rooster de szechuanpeper 1 minuut in een droge pan en maal fijn. Hak de knoflook en gember fijn, snijd de bosui in ringen.","Verhit 1 eetlepel olie in een wok op hoog vuur en bak het gehakt 3 minuten rul en bruin. Voeg de doubanjiang, knoflook en gember toe en bak 1 minuut tot de olie rood kleurt.","Giet 150 ml water erbij met de sojasaus en 0.5 theelepel suiker. Laat 2 minuten koken, schuif de tofu erin en laat 4 minuten zachtjes pruttelen. Bind met 1 theelepel maizena aangemaakt met water.","Serveer op de rijst met de bosui en de szechuanpeper erover. De tintelende peper en de pittige bonenpasta maken dit een gerecht met een echte Szechuan-kick."]},{"id":147,"name":"Gebakken rijst met ei, doperwten en bosui","type":"Vegetarisch","time":15,"emoji":"🍚","cuisine":"Chinees","ingredients":[["rijst","80","g"],["ei","2","stuk"],["doperwten","60","g"],["bosui","3","stuk"],["knoflook","1","teen"],["sojasaus","1","el"],["sesamolie","1","tl"]],"steps":["Kook de rijst volgen
