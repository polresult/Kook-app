mplate-columns:repeat(4,1fr);z-index:8}nav button{border:0;background:#fff;color:#7b8794;font-size:11px}nav span{display:block;font-size:21px}nav .on{color:var(--b)}.recipe{padding:14px}.recipe .pic{height:225px;border-radius:18px}.back{border:0;border-radius:50%;width:38px;height:38px;font-size:18px}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.rating button{border:1px solid var(--ln);background:#fff;border-radius:13px;padding:12px 3px;font-size:22px}.rating small{display:block;font-size:10px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 15px;border-radius:20px;display:none;z-index:20}.prefs{padding:12px;border:1px solid var(--ln);border-radius:15px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{text-align:center;background:#f5f8fb;padding:10px;border-radius:12px}.stat b{display:block;font-size:20px}

ss="on" data-p="discover"><span>◉</span>Ontdekken</button><button data-p="week"><span>▣</span>Mijn week</button><button data-p="shop"><span>🛒</span>Boodschappen</button><button data-p="favorites"><span>♡</span>Voor jou</button></nav><div id="toast" class="toast"></div></div><script>
const R=[{"id": 1, "name": "Romige tomatenpasta met burrata", "type": "Vegetarisch", "time": 25, "emoji": "🍝", "cuisine": "Italiaans", "ingredients": [["pasta", "100", "g"], ["burrata", "0.5", "bol"], ["cherrytomaten", "125", "g"], ["knoflook", "1", "teen"], ["basilicum", "0.5", "bosje"]], "steps": ["Breng een ruime pan water met zout aan de kook en kook de pasta volgens de verpakking beetgaar (meestal 9 tot 11 minuten). Bewaar een kopje kookvocht.", "Halveer intussen de cherrytomaten en snijd de knoflook fijn.", "Verhit 2 eetlepels olijfolie in een koekenpan op middelhoog vuur. Bak de knoflook 1 minuut, voeg de tomaten toe en bak 6 tot 8 minuten tot ze zacht worden en openbarsten. Druk ze licht plat met een lepel.", "Schep de pasta met een scheutje kookvocht door de tomaten en laat 1 minuut pruttelen tot de saus romig aan de pasta hangt.", "Verdeel over de borden, scheur de burrata erboven en maak af met basilicum, peper en zout."]}, {"id": 2, "name": "Kip teriyaki met broccoli", "type": "Vlees", "time": 30, "emoji": "🍗", "cuisine": "Aziatisch", "ingredients": [["kipfilet", "150", "g"], ["rijst", "80", "g"], ["broccoli", "0.5", "stronk"], ["paprika", "0.5", "stuk"], ["teriyakisaus", "2", "el"]], "steps": ["Kook de rijst volgens de verpakking (ongeveer 12 minuten) en laat afgedekt staan.", "Snijd de kipfilet in blokjes, de broccoli in kleine roosjes en de paprika in reepjes.", "Verhit 1 eetlepel olie in een wok op hoog vuur. Bak de kip 5 tot 6 minuten tot hij goudbruin en gaar is. Haal uit de pan.", "Voeg de broccoli en paprika toe met een scheutje water en roerbak 5 minuten tot de broccoli beetgaar is.", "Doe de kip terug, giet de teriyakisaus erbij en laat 1 tot 2 minuten pruttelen tot de saus glanst en aan de kip hangt.", "Serveer op de rijst."]}, {"id": 3, "name": "Kabeljauw met krieltjes en citroen", "type": "Vis", "time": 35, "emoji": "🐟", "cuisine": "Mediterraan", "ingredients": [["kabeljauwfilet", "150", "g"], ["krieltjes", "250", "g"], ["courgette", "0.5", "stuk"], ["citroen", "0.5", "stuk"], ["dille", "0.5", "bosje"]], "steps": ["Verwarm de oven voor op 200°C.", "Halveer de krieltjes, meng ze op een bakplaat met olijfolie, zout en peper en rooster ze 15 minuten.", "Snijd de courgette intussen in halve plakken en de citroen in dunne schijfjes. Dep de kabeljauw droog en bestrooi met zout en peper.", "Schep de courgette door de krieltjes, leg de kabeljauw erbovenop met de citroenschijfjes erop en besprenkel met olie.", "Bak nog 12 tot 15 minuten tot de vis ondoorzichtig is en makkelijk uiteenvalt.", "Bestrooi met fijngehakte dille en serveer."]}, {"id": 4, "name": "Groene curry met tofu", "type": "Vegetarisch", "time": 30, "emoji": "🥘", "cuisine": "Aziatisch", "ingredients": [["tofu", "125", "g"], ["kokosmelk", "200", "ml"], ["groene currypasta", "1", "el"], ["sperziebonen", "100", "g"], ["rijst", "80", "g"]], "steps": ["Kook de rijst volgens de verpakking.", "Dep de tofu droog, snijd in blokjes en bak in 2 eetlepels olie op hoog vuur 8 minuten tot alle kanten goudbruin en krokant zijn. Haal uit de pan.", "Maak de sperziebonen schoon en halveer ze.", "Bak de currypasta 1 minuut in dezelfde pan tot hij geurt. Giet de kokosmelk erbij en roer glad.", "Voeg de sperziebonen toe en laat 10 tot 12 minuten zachtjes koken tot ze beetgaar zijn.", "Schep de tofu erdoor, warm 1 minuut mee en serveer met de rijst."]}, {"id": 5, "name": "Taco's met gekruid gehakt", "type": "Vlees", "time": 25, "emoji": "🌮", "cuisine": "Mexicaans", "ingredients": [["rundergehakt", "150", "g"], ["tacoschelpen", "4", "stuk"], ["tomaat", "1", "stuk"], ["sla", "0.25", "krop"], ["crème fraîche", "60", "ml"]], "steps": ["Verwarm de oven voor op 180°C.", "Verhit een koekenpan op hoog vuur en bak het gehakt 6 tot 8 minuten rul en bruin. Kruid met tacokruiden (of komijn, paprikapoeder, chilipoeder en zout), voeg een scheutje water toe en laat 2 minuten pruttelen.", "Verwarm de tacoschelpen intussen 4 tot 5 minuten in de oven.", "Snijd de tomaat in blokjes en de sla in reepjes.", "Vul de schelpen met gehakt, sla en tomaat en schep er crème fraîche op."]}, {"id": 6, "name": "Zalm met honing-mosterd", "type": "Vis", "time": 30, "emoji": "🍣", "cuisine": "Europees", "ingredients": [["zalmfilet", "150", "g"], ["aardappeltjes", "250", "g"], ["broccoli", "0.5", "stronk"], ["honing", "0.5", "el"], ["mosterd", "0.5", "el"]], "steps": ["Verwarm de oven voor op 200°C.", "Halveer de aardappeltjes en snijd de broccoli in roosjes. Meng op een bakplaat met olie, zout en peper en rooster 15 minuten.", "Roer intussen honing en mosterd met een snuf zout tot een glazuur. Dep de zalm droog en bestrijk hem ermee.", "Leg de zalm tussen de groenten op de plaat en bak nog 12 tot 14 minuten tot de zalm net gaar is. In het midden mag hij nog licht roze zijn.", "Serveer direct."]}, {"id": 7, "name": "Paddenstoelenrisotto", "type": "Vegetarisch", "time": 35, "emoji": "🍄", "cuisine": "Italiaans", "ingredients": [["risottorijst", "90", "g"], ["paddenstoelen", "150", "g"], ["parmezaan", "25", "g"], ["ui", "0.5", "stuk"], ["groentebouillon", "350", "ml"]], "steps": ["Breng de bouillon aan de kook en houd hem tegen de kook aan.", "Snipper de ui en snijd de paddenstoelen in plakjes.", "Verhit olie of boter in een ruime pan en bak de paddenstoelen op hoog vuur 5 minuten bruin. Schep de helft uit de pan en bewaar.", "Zet het vuur lager, voeg de ui toe en fruit 3 minuten glazig. Voeg de rijst toe en roer 1 minuut tot de korrels glanzen.", "Voeg steeds een soeplepel hete bouillon toe en roer tot die bijna is opgenomen voordat je de volgende toevoegt. Dit duurt 18 tot 20 minuten. De rijst is klaar als hij romig is met nog een lichte bite.", "Haal van het vuur, roer de parmezaan en een klontje boter erdoor en laat 2 minuten afgedekt staan. Serveer met de bewaarde paddenstoelen erop."]}, {"id": 8, "name": "Kip fajita bowl", "type": "Vlees", "time": 25, "emoji": "🥗", "cuisine": "Mexicaans", "ingredients": [["kipfilet", "150", "g"], ["rijst", "80", "g"], ["paprika", "1", "stuk"], ["mais", "75", "g"], ["avocado", "0.5", "stuk"]], "steps": ["Kook de rijst volgens de verpakking.", "Snijd de kipfilet in reepjes en de paprika in dunne repen. Meng de kip met fajitakruiden (of paprikapoeder, komijn, knoflookpoeder en zout).", "Verhit 1 eetlepel olie in een pan op hoog vuur en bak de kip 5 tot 6 minuten tot hij gaar is. Voeg de paprika toe en bak 3 minuten mee tot hij net zacht is.", "Verwarm de mais 1 minuut mee in de pan.", "Snijd de avocado in plakjes. Verdeel rijst, kip, paprika en mais over kommen en leg de avocado erop. Lekker met een kneep limoen."]}, {"id": 9, "name": "Pasta pesto met courgette", "type": "Vegetarisch", "time": 20, "emoji": "🌿", "cuisine": "Italiaans", "ingredients": [["pasta", "100", "g"], ["courgette", "0.5", "stuk"], ["pesto", "1.5", "el"], ["parmezaan", "20", "g"], ["pijnboompitten", "10", "g"]], "steps": ["Kook de pasta beetgaar volgens de verpakking en bewaar een kopje kookvocht.", "Snijd de courgette in halve plakjes. Verhit 1 eetlepel olijfolie in een koekenpan op hoog vuur en bak de courgette 5 tot 6 minuten tot hij bruin is maar nog bite heeft. Kruid met zout en peper.", "Rooster de pijnboompitten 2 minuten in een droge pan tot ze goudbruin zijn. Let op, ze kleuren snel.", "Giet de pasta af en meng met de pesto en een scheutje kookvocht tot de saus mooi hecht.", "Schep de courgette erdoor en serveer met parmezaan en pijnboompitten."]}, {"id": 10, "name": "Garnalen in knoflook met orzo", "type": "Vis", "time": 25, "emoji": "🍤", "cuisine": "Mediterraan", "ingredients": [["garnalen", "150", "g"], ["orzo", "90", "g"], ["spinazie", "100", "g"], ["knoflook", "1", "teen"], ["citroen", "0.25", "stuk"]], "steps": ["Kook de orzo in gezouten water 8 tot 10 minuten beetgaar en giet af.", "Snijd de knoflook fijn en dep de garnalen droog.", "Verhit 2 eetlepels olijfolie in een koekenpan op middelhoog vuur. Bak de knoflook 30 seconden, voeg de garnalen toe en bak 2 tot 3 minuten tot ze roze en net gaar zijn.", "Voeg de spinazie in delen toe en laat in 2 minuten slinken.", "Schep de orzo erdoor, knijp de citroen erboven uit en breng op smaak met zout, peper en eventueel een snuf chilivlokken."]}, {"id": 11, "name": "Kip in romige pestosaus", "type": "Vlees", "time": 30, "emoji": "🍲", "cuisine": "Italiaans", "ingredients": [["kipfilet", "150", "g"], ["pasta", "90", "g"], ["spinazie", "100", "g"], ["pesto", "1", "el"], ["kookroom", "75", "ml"]], "steps": ["Kook de pasta beetgaar volgens de verpakking.", "Snijd de kipfilet in blokjes en kruid met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de kip 6 tot 7 minuten goudbruin en gaar.", "Zet het vuur laag, roer pesto en kookroom erdoor en laat 2 minuten zachtjes pruttelen.", "Voeg de spinazie toe en laat in 2 minuten slinken.", "Giet de pasta af, schep door de saus en serveer. Lekker met wat extra parmezaan."]}, {"id": 12, "name": "Nasi met omelet", "type": "Vegetarisch", "time": 25, "emoji": "🍚", "cuisine": "Aziatisch", "ingredients": [["rijst", "80", "g"], ["ei", "1", "stuk"], ["prei", "0.5", "stuk"], ["wortel", "1", "stuk"], ["ketjap", "1", "el"]], "steps": ["Kook de rijst volgens de verpakking en laat afkoelen op een bord. Rijst van gisteren is nog beter.", "Snijd de prei in ringen en de wortel in kleine blokjes.", "Klop het ei los met een snuf zout. Verhit een beetje olie in een koekenpan en bak in 2 minuten een dunne omelet. Laat op een bord glijden en snijd in reepjes.", "Verhit 1 eetlepel olie in een wok op hoog vuur en bak wortel en prei 4 minuten.", "Voeg de rijst toe en roerbak 3 minuten tot alles heet is. Roer de ketjap erdoor en kruid met peper. Serveer met de omeletreepjes erop."]}, {"id": 13, "name": "Zalm teriyaki bowl", "type": "Vis", "time": 25, "emoji": "🍱", "cuisine": "Aziatisch", "ingredients": [["zalmfilet", "150", "g"], ["rijst", "80", "g"], ["komkommer", "0.5", "stuk"], ["edamame", "75", "g"], ["teriyakisaus", "2", "el"]], "steps": ["Kook de rijst volgens de verpakking.", "Kook de edamame 3 minuten in gezouten water en giet af. Snijd de komkommer in dunne halve plakjes.", "Dep de zalm droog. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de zalm 3 minuten op de huidkant en 2 minuten op de andere kant.", "Giet de teriyakisaus erbij en laat 1 minuut inkoken terwijl je de zalm ermee bedruipt.", "Verdeel de rijst over kommen, leg zalm, komkommer en edamame erop en lepel de saus uit de pan erover. Lekker met sesamzaad."]}, {"id": 14, "name": "Gehaktballetjes in tomatensaus", "type": "Vlees", "time": 35, "emoji": "🍝", "cuisine": "Italiaans", "ingredients": [["rundergehakt", "150", "g"], ["spaghetti", "100", "g"], ["passata", "200", "ml"], ["ui", "0.5", "stuk"], ["parmezaan", "20", "g"]], "steps": ["Kneed het gehakt met zout, peper en eventueel wat paneermeel en Italiaanse kruiden. Draai er balletjes van ter grootte van een walnoot.", "Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de balletjes 6 tot 8 minuten rondom bruin. Haal uit de pan.", "Snipper de ui en fruit hem 3 minuten in dezelfde pan. Giet de passata erbij en kruid met zout, peper en een snuf suiker.", "Leg de balletjes terug in de saus en laat 15 minuten zachtjes pruttelen met de deksel schuin op de pan.", "Kook intussen de spaghetti beetgaar volgens de verpakking.", "Serveer de spaghetti met de balletjes en saus en bestrooi met parmezaan."]}, {"id": 15, "name": "Gnocchi met spinazie en tomaat", "type": "Vegetarisch", "time": 20, "emoji": "🥔", "cuisine": "Italiaans", "ingredients": [["gnocchi", "250", "g"], ["spinazie", "100", "g"], ["cherrytomaten", "125", "g"], ["mozzarella", "0.5", "bol"], ["pesto", "1", "el"]], "steps": ["Halveer de cherrytomaten en scheur de mozzarella in stukken.", "Verhit 2 eetlepels olijfolie in een grote koekenpan op middelhoog vuur. Bak de gnocchi zonder ze eerst te koken 8 tot 10 minuten tot ze rondom goudbruin en krokant zijn. Niet te vaak omscheppen.", "Voeg de tomaten toe en bak 3 minuten mee tot ze zacht word n koekenpan met deksel op middelhoog vuur en bak de paprika 5 minuten zacht.", "Voeg de tomatenblokjes toe met komijn, paprikapoeder, zout en peper en laat 10 minuten pruttelen tot de saus iets is ingedikt.", "Maak met een lepel kuiltjes in de saus en breek in elk kuiltje een ei.", "Leg de deksel op de pan en laat de eieren 6 tot 8 minuten zachtjes garen tot het eiwit gestold is en de dooier nog zacht.", "Verkruimel de feta erover en serveer met brood om in de saus te dopen. Rooster het brood eventueel 2 minuten onder de grill."]}, {"id": 19, "name": "Pokébowl met zalm", "type": "Vis", "time": 25, "emoji": "🥢", "cuisine": "Aziatisch", "ingredients": [["zalmfilet", "150", "g"], ["sushirijst", "80", "g"], ["komkommer", "0.5", "stuk"], ["avocado", "0.5", "stuk"], ["sojasaus", "1", "el"]], "steps": ["Kook de sushirijst volgens de verpakking en breng op smaak met een scheutje rijstazijn en een snuf zout.", "Gebruik zalm van sushikwaliteit en snijd die in blokjes, of bak gewone zalm 3 minuten per kant op middelhoog vuur en breek hem in stukken.", "Snijd de komkommer in dunne halve plakjes en de avocado in blokjes.", "Verdeel de rijst over kommen en leg zalm, komkommer en avocado er in vakjes bovenop.", "Besprenkel met sojasaus en maak af met sesamzaad of lente-ui."]}, {"id": 20, "name": "Traybake kip en groenten", "type": "Vlees", "time": 40, "emoji": "🍗", "cuisine": "Europees", "ingredients": [["kippendij", "175", "g"], ["aardappeltjes", "250", "g"], ["paprika", "0.5", "stuk"], ["courgette", "0.5", "stuk"], ["rode ui", "0.5", "stuk"]], "steps": ["Verwarm de oven voor op 200°C.", "Halveer de aardappeltjes en snijd paprika, courgette en rode ui in grove stukken. Snijd de kippendij in grote stukken.", "Meng alles op een bakplaat met 2 eetlepels olijfolie, paprikapoeder, oregano, zout en peper. Verdeel in één laag.", "Rooster 20 minuten, schep om en rooster nog 15 minuten tot de aardappeltjes goudbruin zijn en de kip gaar.", "Serveer direct, lekker met een lepel yoghurt of h let S=JSON.parse(localStorage.getItem('kookV3')||localStorage.getItem('kookV2')||'{"week":[],"fav":[],"ratings":{},"checked":{},"persons":2,"pantry":{}}');S.pantry=S.pantry||{};
const save=()=>{localStorage.setItem('kookV3',JSON.stringify(S));localStorage.setItem('kookV2',JSON.stringify(S))};const by=id=>R.find(x=>x.id===id);
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}
function score(r){let s=0;if(S.ratings[r.id]=='lekker')s+=20;if(S.ratings[r.id]=='niet')s-=100;let liked=R.filter(x=>S.ratings[x.id]=='lekker');liked.forEach(x=>{if(x.type==r.type)s+=2;if(x.cuisine==r.cuisine)s+=3});return s+Math.random()}
const PHOTOS={"1":8105128,"2":35064952,"3":11044248,"4":6120232,"5":9993709,"6":8112939,"7":15667778,"8":32371273,"9":3807044,"10":726000,"11":10165873,"12":32655065,"13":8112939,"14":9617397,"15":12041931,"16":10296469,"17":4611425,"18":6275095,"19":20571432,"20":19615783,"21":31779531,"22":31423004,"23":110814,"24":5531160,"25":10398946,"26":15059057,"27":6275187,"28":13443376,"29":6896393,"30":7262798};
function picture(r,eager=false){return `<img src="photos/${PHOTOS[r.id]}.webp" alt="Voorbeeldfoto bij ${r.name}" loading="${eager?'eager':'lazy'}" decoding="async" onerror="this.hidden=true;this.parentElement.textContent='${r.emoji}'">`}
function card(r){return `<div class="card"><button type="button" class="pic photo-button" aria-label="Bekijk ${r.name}" onclick="openR(${r.id})">${picture(r)}</button><div class="pad"><div class="row between"><div><div class="title">${r.name}</div><div class="meta">${r.type} · ${r.cuisine} · ${r.time} min</div></div><button class="btn soft small" onclick="fav(${r.id})">${S.fav.includes(r.id)?'♥':'♡'}</button></div><div class="actions"><button class="btn primary small" onclick="add(${r.id})">+ Mijn week</button><button class="btn soft small" onclick="openR(${r.id})">Bekijken</button></div></div></div>`}
function currentSeason(r){let m=new Date().getMonth()+1;return r.cuisine==='Seizoensgerecht'||((m>=9&&m<=11)&&['Paddenstoelenrisotto','Pompoenpasta met feta','Traybake kip en groenten','Kabeljauw met krieltjes en citroen'].includes(r.name))} function filtered(f='Alles'){let q=(document.getElementById('search')?.value||'').toLowerCase().trim();return R.filter(r=>{let ok=f==='Alles'||(f==='Snel'?r.time<=25:(f==='Seizoen'?currentSeason(r):r.type===f));let hay=(r.name+' '+r.cuisine+' '+r.type+' '+r.ingredients.map(x=>x[0]).join(' ')).toLowerCase();return ok&&(!q||hay.includes(q))}).sort((a,b)=>score(b)-score(a))} function render(f='Alles'){let list=filtered(f);if(!list.length){suggest.innerHTML='';cards.innerHTML='<div class="empty">Geen gerechten gevonden.</div>';return}let top=list[0];suggest.innerHTML=`<div class="section">Aanrader voor jou</div>${card(top)}`;cards.innerHTML='<div class="section">Meer inspiratie</div>'+list.slice(1).map(card).join('')} function doSearch(){render(document.querySelector('.chip.on')?.dataset.f||'Alles')}
function fav(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];save();render(document.querySelector('.chip.on')?.dataset.f||'Alles');renderFav()}
function add(id){if(!S.week.includes(id)){let previous=shoppingTotals();S.week.push(id);refreshChecks(previous);save();toast('Toegevoegd aan Mijn week')}renderWeek();renderShop()}
function removeW(id){let previous=shoppingTotals();S.week=S.week.filter(x=>x!=id);refreshChecks(previous);save();renderWeek();renderShop()}
function persons(n){let previous=shoppingTotals();S.persons=Math.max(1,Math.min(8,S.persons+n));refreshChecks(previous);save();renderWeek();renderShop()}
function makeWeek(){let liked=R.filter(x=>S.ratings[x.id]!='niet').sort((a,b)=>score(b)-score(a));let picks=[],types=['Vegetarisch','Vlees','Vis','Vegetarisch','Vlees'];types.forEach(t=>{let a=liked.filter(x=>x.type===t&&!picks.includes(x.id));if(a.length)picks.push(a[0].id)});let previous=shoppingTotals();S.week=picks;refreshChecks(previous);save();renderWeek();renderShop();toast('Gevarieerd weekmenu gemaakt')}
function swapW(id){let old=by(id),a=R.filter(r=>r.id!==id&&!S.week.includes(r.id)&&S.ratings[r.id]!=='niet'&&r.type===old.type).sort((a,b)=>score(b)-score(a));if(a.length){let previous=shoppingTotals();S.week=S.week.map(x=>x===id?a[0].id:x);refreshChecks(previous);save();renderWeek();renderShop();toast('Gerecht gewisseld')}} function surprise(){let a=R.filter(x=>!S.week.includes(x.id)&&S.ratings[x.id]!='niet').sort((a,b)=>score(b)-score(a));if(a.length)add(a[0].id)}
function renderWeek(){document.getElementById('pc').textContent=S.persons;let el=document.getElementById('weekList');if(!S.week.length)return el.innerHTML='<div class="empty">Nog geen gerechten gekozen.</div>';let days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];el.innerHTML=S.week.map((id,i)=>{let r=by(id);return `<div class="day"><div class="row between"><button type="button" onclick="openR(${id},'week')" style="flex:1;min-width:0;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer"><b>${days[i]}</b><div class="title" style="font-size:16px">${r.emoji} ${r.name}</div><div class="meta">${r.type} · ${r.time} min</div></button><div><button class="btn soft small" onclick="swapW(${id})">↻</button><button class="btn danger small" onclick="removeW(${id})">×</button></div></div></div>`}).join('')}
function qty(v){let n=parseFloat(v);return isNaN(n)?v:String(Math.round(n*S.persons*100)/100).replace('.',',')}
function unitName(u){return ({stuks:'stuk',bollen:'bol',stronken:'stronk',tenen:'teen',bosjes:'bosje'})[u]||u}
const RENAMED={"groene pesto":"pesto",currypasta:"groene currypasta"};function shoppingKey(n,u){n=n.trim().toLowerCase();if(RENAMED[n])n=RENAMED[n];if(n==='basilicum'&&u==='g')u='bosje';return n+'|'+unitName(u)}
function shoppingTotals(){let m={};S.week.forEach(id=>by(id).ingredients.forEach(([n,q,u])=>{let k=shoppingKey(n,u);m[k]=(m[k]||0)+parseFloat(q)*S.persons}));return m}
function refreshChecks(previous){let next=shoppingTotals();Object.keys(S.checked).forEach(k=>{if(next[k]!==previous[k])delete S.checked[k]})}
for(const field of ['checked','pantry']){let normalized={};Object.entries(S[field]||{}).forEach(([k,v])=>{let [n,u]=k.split('|');let key=shoppingKey(n,u);normalized[key]=normalized[key]||v});S[field]=normalized}
function renderShop(){let m=shoppingTotals();let keys=Object.keys(m),el=document.getElementById('shopping');if(!keys.length)return el.innerHTML='<div class="empty">Je boodschappen verschijnen zodra je gerechten kiest.</div>';el.innerHTML=keys.sort().map(k=>{let [n,u]=k.split('|'),q=(Math.round(m[k]*100)/100);return `<label class="check ${(S.checked[k]||S.pantry[k])?'done':''}"><input type="checkbox" ${S.checked[k]?'checked':''} onchange="ck('${k}',this.checked)"><div style="flex:1"><b>${n}</b><div class="meta">${String(q).replace('.',',')} ${u}</div></div><button type="button" class="btn soft small" onclick="event.preventDefault();pantry('${k}')">${S.pantry[k]?'In huis ✓':'In huis'}</button></label>`}).join('')}
function ck(k,v){S.checked[k]=v;save();renderShop()} function pantry(k){S.pantry[k]=!S.pantry[k];save();renderShop();toast(S.pantry[k]?'Staat al in huis':'Terug op lijst')}function clearChecked(){Object.keys(S.checked).forEach(k=>{if(S.checked[k])delete S.checked[k]});save();renderShop()}
function renderFav(){let good=Object.values(S.ratings).filter(x=>x==='lekker').length,bad=Object.values(S.ratings).filter(x=>x==='niet').length;document.getElementById('profile').innerHTML=`<div class="section">Jouw smaakprofiel</div><div class="stats"><div class="stat"><b>${good}</b>lekker</div><div class="stat"><b>${bad}</b>niet</div><div class="stat"><b>${S.fav.length}</b>favoriet</div></div><div class="meta">Je beoordelingen worden gebruikt om Ontdekken en Maak mijn week beter bij je smaak te laten passen.</div>`;let rs=R.filter(x=>S.fav.includes(x.id));document.getElementById('fav').innerHTML='<div class="section">Favorieten</div>'+(rs.length?rs.map(card).join(''):'<div class="empty">Nog geen favorieten.</div>')}
function rate(id,v){S.ratings[id]=v;if(v==='lekker'&&!S.fav.includes(id))S.fav.push(id);save();toast('Smaak onthouden');renderFav()}
function openR(id,origin='discover'){let r=by(id);show('detail');document.getElementById('detail').innerHTML=`<div class="recipe"><button class="back" onclick="show('${origin}')">←</button><div class="pic" style="margin-top:10px">${picture(r,true)}</div><div class="photo-credit">Voorbeeldfoto van een vergelijkbaar gerecht · <a href="https://www.pexels.com/photo/${PHOTOS[r.id]}/" target="_blank" rel="noopener noreferrer">Pexels</a></div><h2>${r.name}</h2><div class="meta">${r.type} · ${r.cuisine} · ${r.time} min · ${S.persons} personen</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="add(${id})">Toevoegen aan Mijn week</button><div class="section">Ingrediënten</div><ul>${r.ingredients.map(x=>`<li style="margin:9px 0"><b>${x[0]}</b> — ${qty(x[1])} ${x[2]}</li>`).join('')}</ul><div class="section">Bereiding</div><ol>${r.steps.map(x=>`<li style="margin:10px 0;line-height:1.45">${x}</li>`).join('')}</ol><div class="section">Wat vond je ervan?</div><div class="rating"><button onclick="rate(${id},'lekker')">😍<small>Heerlijk</small></button><button onclick="rate(${id},'neutraal')">😐<small>Neutraal</small></button><button onclick="rate(${id},'niet')">👎<small>Niet meer</small></button></div></div>`}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(p).classList.add('on');let d=p==='detail';head.style.display=d?'none':'block';nav.style.display=d?'none':'grid';filters.style.display=p==='discover'?'flex':'none';let T={discover:['Kook','Lekker, makkelijk en gevarieerd'],week:['Mijn week','Stel je weekmenu samen'],shop:['Boodschappen','Automatisch samengevoegd'],favorites:['Voor jou','De app leert je smaak kennen']};if(T[p]){heading.textContent=T[p][0];subtitle.textContent=T[p][1]}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='week')renderWeek();if(p==='shop')renderShop();if(p==='favorites')renderFav();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)});render();renderWeek();renderShop();renderFav();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
