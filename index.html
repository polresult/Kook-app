s de verpakking en spreid hem uit op een bord om snel af te koelen. Gekoelde rijst van gisteren is nog beter.","Snijd de bosui in ringen en houd het groen apart. Hak de knoflook fijn en klop de eieren los met een snuf zout.","Verhit 1 eetlepel olie in een wok op hoog vuur. Giet de eieren erin, roer 1 minuut tot ze net gestold zijn en schep ze uit de pan.","Doe nog 1 eetlepel olie in de wok en bak het witte deel van de bosui met de knoflook 30 seconden. Voeg de rijst en de doperwten toe en wok 3 tot 4 minuten tot de rijst hete, losse korrels heeft.","Roer de sojasaus, de sesamolie, het ei en het groen van de bosui erdoor en serveer meteen. Een scheutje chili-olie erover maakt het nog lekkerder."]},{"id":148,"name":"Zoetzure kip met ananas en paprika","type":"Vlees","time":30,"emoji":"🍍","cuisine":"Chinees","ingredients":[["kipfilet","150","g"],["ananas","100","g"],["rode paprika","0.5","stuk"],["ui","0.5","stuk"],["maizena","2","el"],["ketchup","2","el"],["rijstazijn","1.5","el"],["sojasaus","1","el"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking. Snijd de kip in blokjes van 3 centimeter en hussel ze door de maizena met een snuf zout en peper.","Snijd de ananas in blokjes, de paprika in stukken en de ui in grove parten. Roer de ketchup, rijstazijn, sojasaus, 1 eetlepel suiker en 50 ml water tot een saus.","Verhit 3 eetlepels olie in een wok op hoog vuur en bak de kip 6 tot 7 minuten tot hij knapperig en goudbruin is. Laat uitlekken op keukenpapier.","Giet het meeste vet uit de wok en bak de ui en paprika 3 minuten. Voeg de ananas en de saus toe en laat 2 minuten borrelen tot de saus glanst en indikt.","Schep de kip door de saus en serveer meteen op de rijst. Het zoete van de ananas en het zure van de azijn houden de krokante kip precies in balans."]},{"id":149,"name":"Kung pao kip met cashewnoten","type":"Vlees","time":25,"emoji":"🥜","cuisine":"Chinees","ingredients":[["kipdijfilet","150","g"],["cashewnoten","30","g"],["rode paprika","0.5","stuk"],["bosui","2","stuk"],["knoflook","1","teen"],["gedroogde chilipepers","3","stuk"],["sojasaus","1.5","el"],["rijstazijn","1","el"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking. Snijd de kip in blokjes van 2 centimeter en meng met 1 theelepel sojasaus en 1 theelepel maizena.","Roer de rest van de sojasaus met de rijstazijn, 1 theelepel suiker, 1 theelepel maizena en 3 eetlepels water tot een saus. Snijd de paprika in blokjes, de bosui in stukjes en de knoflook in plakjes.","Rooster de cashewnoten 2 minuten in een droge wok tot ze licht kleuren en haal ze eruit.","Verhit 1.5 eetlepel olie in de wok op hoog vuur. Bak de chilipepers en knoflook 30 seconden, voeg de kip toe en bak 4 minuten tot hij bruin en gaar is.","Voeg de paprika toe en wok 2 minuten. Giet de saus erbij en laat 1 minuut indikken. Roer de cashews en bosui erdoor en serveer op de rijst; de rokerige chili, de zoetzure saus en de knapperige noten maken dit een echte klassieker."]},{"id":150,"name":"Snelle pekingeend-stijl kip met pannenkoekjes en hoisin","type":"Vlees","time":30,"emoji":"🥞","cuisine":"Chinees","ingredients":[["kipdijfilet","175","g"],["hoisinsaus","3","el"],["vijfkruidenpoeder","0.5","tl"],["honing","1","tl"],["chinese pannenkoekjes","6","stuk"],["komkommer","0.25","stuk"],["bosui","2","stuk"]],"steps":["Verwarm de oven voor op 200°C. Meng 1 eetlepel hoisin met de honing, het vijfkruidenpoeder, 1 theelepel sojasaus en een snuf zout. Wrijf de kipdijen ermee in.","Leg de kip op een bakplaat met bakpapier en rooster 20 tot 22 minuten tot hij gaar is en de buitenkant donker en plakkerig.","Snijd intussen de komkommer in dunne reepjes van 5 centimeter en de bosui in dunne lange reepjes. Leg ze in koud water zodat ze krullen en knapperig blijven.","Stoom de pannenkoekjes de laatste 3 minuten boven een pan water, of verwarm ze 30 seconden in de magnetron onder een vochtige doek.","Snijd de kip in dunne reepjes. Zet alles op tafel: smeer een pannenkoekje in met hoisin, leg er kip, komkommer en bosui op en rol op. De zoete hoisin en de frisse komkommer maken het net zo lekker als bij de echte eend."]},{"id":151,"name":"Gyoza met dipsaus en komkommersalade","type":"Vlees","time":25,"emoji":"🥟","cuisine":"Japans","ingredients":[["varkensgehakt","100","g"],["chinese kool","60","g"],["bosui","1","stuk"],["gember","1","cm"],["gyozavellen","10","stuk"],["sojasaus","2","el"],["rijstazijn","1","el"],["komkommer","0.5","stuk"],["sesamolie","1","tl"]],"steps":["Snijd de kool heel fijn, bestrooi met een snuf zout en knijp na 5 minuten het vocht eruit. Hak de bosui fijn en rasp de gember.","Meng het gehakt met de kool, bosui, gember, 1 theelepel sojasaus en de helft van de sesamolie. Leg een theelepel vulling in het midden van elk vel, maak de rand nat en vouw dicht met kleine plooitjes.","Snijd de komkommer in dunne plakjes en meng met de helft van de rijstazijn, een snuf suiker en zout. Roer de rest van de sojasaus en rijstazijn met de rest van de sesamolie tot een dipsaus.","Verhit 1 eetlepel olie in een koekenpan met deksel op middelhoog vuur. Zet de gyoza met de platte kant naar beneden in de pan en bak 2 tot 3 minuten tot de bodem goudbruin is.","Giet 50 ml water in de pan, doe het deksel erop en stoom 5 minuten tot het water verdampt is en de vulling gaar. Serveer met de dipsaus en de komkommersalade; krokant onder, zacht boven en fris ernaast."]},{"id":152,"name":"Kip katsu curry met rijst","type":"Vlees","time":35,"emoji":"🍛","cuisine":"Japans","ingredients":[["kipfilet","150","g"],["panko","40","g"],["ei","1","stuk"],["ui","0.5","stuk"],["wortel","1","stuk"],["japanse curryblokjes","25","g"],["rijst","80","g"],["komkommer","0.25","stuk"]],"steps":["Kook de rijst volgens de verpakking. Snipper de ui en snijd de wortel in dunne plakjes.","Verhit 1 eetlepel olie in een pan op middelhoog vuur en bak de ui en wortel 5 minuten. Giet er 250 ml water bij en laat 10 minuten zachtjes koken tot de wortel zacht is. Roer de curryblokjes erdoor tot een dikke saus en houd warm.","Snijd de kipfilet overlangs open tot een platte lap en sla hem iets dunner. Haal de kip door 1 eetlepel bloem, dan door het losgeklopte ei en tot slot door de panko. Druk goed aan.","Verhit een laag olie van 1 centimeter in een koekenpan op middelhoog vuur en bak de kip 4 minuten per kant goudbruin en gaar. Laat uitlekken op keukenpapier.","Snijd de kip in repen en leg hem op de rijst. Schep de currysaus ernaast en serveer met dunne plakjes komkommer. Het krokante korstje blijft knapperig naast de milde, zoete curry."]},{"id":153,"name":"Yakitori-spiesen met bosui en rijst","type":"Vlees","time":25,"emoji":"🍢","cuisine":"Japans","ingredients":[["kipdijfilet","150","g"],["bosui","3","stuk"],["sojasaus","2","el"],["mirin","2","el"],["honing","1","tl"],["gember","1","cm"],["rijst","80","g"],["sesamzaad","1","tl"]],"steps":["Kook de rijst volgens de verpakking. Leg 4 houten spiesjes 10 minuten in water zodat ze niet verbranden.","Breng de sojasaus, mirin, honing en de geraspte gember in een steelpannetje aan de kook en laat 4 tot 5 minuten inkoken tot een stroperige saus.","Snijd de kip in stukken van 3 centimeter en de bosui in stukken van 3 centimeter. Rijg kip en bosui om en om aan de spiesjes.","Verhit een grillpan op hoog vuur en vet hem licht in. Gril de spiesjes 8 tot 10 minuten, draai ze regelmatig en kwast ze de laatste 3 minuten een paar keer in met de saus tot ze glanzen.","Serveer de spiesjes op de rijst met de rest van de saus en het sesamzaad. De zoet-zoute glazuurlaag en de licht verkoolde bosui zijn de smaak van een Japanse izakaya."]},{"id":154,"name":"Japanse gehaktballetjes in teriyaki","type":"Vlees","time":30,"emoji":"🍡","cuisine":"Japans","ingredients":[["kipgehakt","150","g"],["bosui","2","stuk"],["gember","1","cm"],["panko","2","el"],["sojasaus","2","el"],["mirin","2","el"],["paksoi","1","stuk"],["rijst","80","g"],["sesamzaad","1","tl"]],"steps":["Kook de rijst volgens de verpakking. Hak de bosui fijn en rasp de gember.","Meng het gehakt met de helft van de bosui, de gember, de panko, 1 theelepel sojasaus en een snuf zout. Rol er met natte handen 8 balletjes van.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de balletjes 8 minuten, regelmatig draaiend, tot ze rondom bruin zijn.","Roer de rest van de sojasaus met de mirin, 1 theelepel suiker en 2 eetlepels water. Giet de saus bij de balletjes en laat 3 tot 4 minuten pruttelen tot hij stroperig wordt en de balletjes glanzen.","Snijd de paksoi in de lengte in kwarten en bak hem 3 minuten in een tweede pan met een scheutje water. Serveer de balletjes op de rijst met de paksoi, de rest van de bosui en het sesamzaad; het zoete glazuur en de frisse groente zijn samen een eenvoudige, troostende maaltijd."]},{"id":155,"name":"Okonomiyaki met kool en bosui","type":"Vegetarisch","time":25,"emoji":"🥞","cuisine":"Japans","ingredients":[["witte kool","200","g"],["ei","1","stuk"],["bosui","2","stuk"],["bloem","60","g"],["groentebouillonblokje","0.25","stuk"],["japanse mayonaise","1","el"],["okonomiyakisaus","1.5","el"],["ingelegde gember","1","el"]],"steps":["Snijd de kool in heel dunne reepjes en de bosui in ringen. Los het stukje bouillonblokje op in 80 ml lauw water.","Klop de bloem met de bouillon en het ei tot een glad beslag. Meng de kool, de helft van de bosui en de ingelegde gember erdoor; het lijkt veel kool, maar dat hoort zo.","Verhit 1 eetlepel olie in een koekenpan van ongeveer 20 centimeter op middelhoog vuur. Schep het beslag erin en druk het aan tot een dikke pannenkoek van 2 centimeter.","Bak 5 tot 6 minuten met het deksel op de pan tot de onderkant goudbruin is. Keer met behulp van een bord en bak de andere kant nog 5 minuten.","Schuif de okonomiyaki op een bord, bestrijk met de okonomiyakisaus en spuit de mayonaise er in dunne lijnen over. Strooi de rest van de bosui erover. De zoete saus en de romige mayonaise maken van de gebakken kool een hartig feestje."]},{"id":156,"name":"Zalm-donburi met avocado en sesam","type":"Vis","time":20,"emoji":"🍱","cuisine":"Japans","ingredients":[["zalmfilet","125","g"],["sushirijst","80","g"],["avocado","0.5","stuk"],["komkommer","0.25","stuk"],["sojasaus","1.5","el"],["mirin","1","el"],["rijstazijn","1","el"],["sesamzaad","1","tl"],["bosui","1","stuk"]],"steps":["Kook de sushirijst volgens de verpakking. Roer de rijstazijn met 1 theelepel suiker en een snuf zout door de hete rijst en laat even staan.","Snijd de avocado in plakjes, de komkommer in dunne halve maantjes en de bosui in ringen.","Verhit 1 theelepel olie in een koekenpan op middelhoog vuur. Bak de zalm 3 minuten op de huidkant en 2 minuten op de andere kant.","Giet de sojasaus en mirin bij de zalm en laat 1 minuut borrelen terwijl de zalm met de saus wordt bedruipt, tot hij glanst.","Schep de rijst in een kom, verdeel de zalm in stukken erover en leg de avocado en komkommer ernaast. Giet de saus uit de pan erover en bestrooi met sesam en bosui. De zoet-zoute saus, romige avocado en frisse komkommer maken deze kom helemaal compleet."]},{"id":157,"name":"Koreaanse krokante kip met zoete chilisaus","type":"Vlees","time":30,"emoji":"🍗","cuisine":"Koreaans","ingredients":[["kipdijfilet","175","g"],["maizena","3","el"],["gochujang","1","el"],["ketchup","1","el"],["honing","1","el"],["knoflook","1","teen"],["sojasaus","1","tl"],["rijst","80","g"],["sesamzaad","1","tl"]],"steps":["Kook de rijst volgens de verpakking. Snijd de kip in stukken van 3 centimeter en bestrooi met zout en peper. Hussel de stukken door de maizena tot ze rondom droog bedekt zijn.","Rasp de knoflook. Roer de gochujang, ketchup, honing, sojasaus, knoflook en 1 eetlepel water in een kommetje tot een saus.","Verhit een laag olie van 1.5 centimeter in een pan op middelhoog tot hoog vuur. Bak de kip in twee porties 6 tot 7 minuten tot hij goudbruin en knapperig is. Laat uitlekken op keukenpapier.","Bak de kip daarna nog eens 2 minuten in de hete olie; dit tweede bad maakt de korst extra krokant. Laat opnieuw uitlekken.","Verwarm de saus 1 minuut in een schone pan tot hij borrelt, schep de kip erdoor en serveer meteen op de rijst met het sesamzaad. Het krokante korstje onder de plakkerige, zoet-pittige saus is waar het om draait."]},{"id":158,"name":"Bulgogi van rund met rijst en kimchi","type":"Vlees","time":25,"emoji":"🥩","cuisine":"Koreaans","ingredients":[["dungesneden biefstuk","150","g"],["sojasaus","2","el"],["peer","0.25","stuk"],["knoflook","1","teen"],["sesamolie","1","tl"],["ui","0.5","stuk"],["bosui","1","stuk"],["kimchi","50","g"],["rijst","80","g"]],"steps":["Kook de rijst volgens de verpakking.","Rasp de peer en de knoflook. Meng ze met de sojasaus, de sesamolie, 1 theelepel suiker en een draai peper. Snijd het vlees in dunne reepjes en laat ze 10 minuten in de marinade liggen.","Snijd de ui in dunne halve ringen en de bosui in ringen.","Verhit 1 eetlepel olie in een koekenpan of wok op hoog vuur. Bak de ui 2 minuten, voeg het vlees met de marinade toe en bak 3 tot 4 minuten tot het vlees net gaar is en de saus karamelliseert.","Serveer de bulgogi op de rijst met de kimchi ernaast en de bosui erover. De zoete, zachte peer in de marinade en de zure kimchi vormen samen precies het Koreaanse evenwicht."]},{"id":159,"name":"Kimchi-gebakken rijst met spiegelei","type":"Vegetarisch","time":15,"emoji":"🍳","cuisine":"Koreaans","ingredients":[["rijst","80","g"],["kimchi","100","g"],["ei","1","stuk"],["bosui","2","stuk"],["gochujang","1","tl"],["sojasaus","1","tl"],["sesamolie","1","tl"],["nori","0.5","stuk"]],"steps":["Kook de rijst volgens de verpakking en laat hem iets afkoelen; rijst van een dag oud werkt het best.","Hak de kimchi grof en bewaar het sap. Snijd de bosui in ringen.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Bak de kimchi met het witte deel van de bosui 2 minuten. Roer de gochujang erdoor en bak 30 seconden.","Voeg de rijst, de sojasaus en 1 eetlepel kimchisap toe en bak 3 tot 4 minuten, af en toe omscheppend, tot de rijst hier en daar knapperig wordt. Roer de sesamolie erdoor.","Bak het ei in een tweede pan in een beetje olie tot het wit gestold is en de dooier nog zacht. Schep de rijst in een kom, leg het ei erop en strooi de bosui en in reepjes geknipte nori erover. De lopende dooier maakt de pittige rijst zacht en romig."]},{"id":160,"name":"Vietnamese bún met citroengras-kip","type":"Vlees","time":30,"emoji":"🍜","cuisine":"Vietnamees","ingredients":[["kipdijfilet","150","g"],["citroengras","1","stuk"],["knoflook","1","teen"],["vissaus","2","el"],["rijstvermicelli","70","g"],["komkommer","0.25","stuk"],["wortel","1","stuk"],["limoen","1","stuk"],["munt","0.25","bosje"]],"steps":["Hak het zachte binnenste van het citroengras en de knoflook heel fijn. Meng met 1 eetlepel vissaus, 1 theelepel suiker en 1 theelepel olie. Snijd de kip in dunne repen en meng ze met de marinade. Laat 10 minuten staan.","Roer de rest van de vissaus met het sap van de limoen, 1 eetlepel suiker, 3 eetlepels water en naar smaak wat chilivlokken tot een dressing.","Bereid de vermicelli volgens de verpakking, spoel koud en laat uitlekken. Snijd de komkommer en wortel in dunne reepjes en pluk de munt.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 6 tot 7 minuten tot hij gaar is met donkere, karamelachtige randjes.","Verdeel de noedels over een kom, leg de groenten, de munt en de kip erop en giet de dressing erover. Koud, warm, fris en hartig in één kom; dat maakt bún zo lekker op een warme dag."]},{"id":161,"name":"Chili con carne met rijst","type":"Vlees","time":35,"emoji":"🌶️","cuisine":"Mexicaans","ingredients":[["rundergehakt","125","g"],["kidneybonen","100","g"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["rode paprika","0.5","stuk"],["komijn","1","tl"],["gerookt paprikapoeder","1","tl"],["rijst","75","g"]],"steps":["Snipper de ui, snijd de knoflook fijn en de paprika in blokjes. Spoel de kidneybonen af in een zeef.","Verhit 1 eetlepel olie in een ruime pan op middelhoog vuur. Bak de ui 4 minuten zacht, voeg de knoflook, komijn en het paprikapoeder toe en bak 1 minuut mee tot het geurt.","Zet het vuur hoog, voeg het gehakt toe en bak het 5 minuten rul en bruin. Voeg de paprika en de tomatenblokjes toe, breng aan de kook en laat met de deksel schuin op de pan 15 minuten zachtjes pruttelen.","Kook intussen de rijst volgens de verpakking.","Roer de bonen door de chili en laat 5 minuten meewarmen. Breng op smaak met zout, peper en eventueel een snuf chilivlokken.","Serveer de chili op de rijst met een lepel zure room erop. De koele room tempert het pittige en rokerige van de chili."]},{"id":162,"name":"Chili sin carne met zwarte bonen en zoete aardappel","type":"Vegetarisch","time":30,"emoji":"🫘","cuisine":"Mexicaans","ingredients":[["zwarte bonen","125","g"],["zoete aardappel","150","g"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["maïs","50","g"],["komijn","1","tl"],["gerookt paprikapoeder","1","tl"],["rijst","75","g"]],"steps":["Schil de zoete aardappel en snijd hem in blokjes van 1 centimeter. Snipper de ui, snijd de knoflook fijn en spoel de bonen en de maïs af.","Verhit 1 eetlepel olie in een pan op middelhoog vuur. Bak de ui 3 minuten, voeg de zoete aardappel, knoflook, komijn en het paprikapoeder toe en bak 2 minuten mee.","Voeg de tomatenblokjes en 100 ml water toe. Breng aan de kook en laat met de deksel op de pan 15 minuten pruttelen tot de zoete aardappel zacht is.","Kook intussen de rijst volgens de verpakking.","Roer de bonen en de maïs erdoor en laat 5 minuten meewarmen. Breng op smaak met zout, peper en een scheutje limoensap.","Serveer op de rijst met wat koriander en een lepel yoghurt. De zoete aardappel geeft een zachte zoetheid die mooi tegen de pittige tomatensaus staat."]},{"id":163,"name":"Burrito's met gehakt, rijst en bonen","type":"Vlees","time":35,"emoji":"🌯","cuisine":"Mexicaans","ingredients":[["grote tortilla's","2","stuk"],["rundergehakt","100","g"],["rijst","50","g"],["kidneybonen","75","g"],["taco-kruiden","1","el"],["geraspte kaas","30","g"],["tomaat","1","stuk"],["ijsbergsla","50","g"],["zure room","2","el"]],"steps":["Kook de rijst volgens de verpakking (meestal 10 tot 12 minuten). Snijd intussen de tomaat in blokjes en de sla in reepjes en spoel de bonen af.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak het gehakt 5 minuten rul. Voeg de taco-kruiden, de bonen en 50 ml water toe en laat 3 minuten pruttelen tot het vocht bijna weg is.","Schep de rijst door het gehakt. Verwarm de tortilla's 20 seconden per kant in een droge koekenpan zodat ze soepel worden.","Leg de kaas in het midden van elke tortilla, daarop het gehaktmengsel, tomaat, sla en zure room. Vouw de zijkanten naar binnen en rol strak op.","Bak de burrito's met de naad naar beneden 2 minuten per kant in een droge koekenpan op middelhoog vuur, zodat ze dichtgaan en licht krokant worden.","Snijd schuin doormidden en serveer met salsa. De gesmolten kaas houdt alles bij elkaar en de koude sla geeft een frisse beet."]},{"id":164,"name":"Burrito bowl met kip en maïs","type":"Vlees","time":25,"emoji":"🥗","cuisine":"Mexicaans","ingredients":[["kipdijfilet","125","g"],["rijst","75","g"],["maïs","75","g"],["zwarte bonen","75","g"],["avocado","0.5","stuk"],["limoen","0.5","stuk"],["cherrytomaten","75","g"],["taco-kruiden","1","el"],["koriander","0.25","bosje"]],"steps":["Kook de rijst volgens de verpakking. Snijd de kip in reepjes en meng met de taco-kruiden en 1 theelepel olie.","Halveer de cherrytomaten, snijd de avocado in plakjes en spoel de bonen en de maïs af. Hak de koriander grof.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 6 tot 8 minuten bruin en gaar. Schep op een bord, doe de maïs en bonen in dezelfde pan en warm ze 2 minuten op.","Roer het sap van de halve limoen met een snuf zout door de rijst.","Schep de rijst in een kom en leg de kip, bonen met maïs, tomaat en avocado er in vakjes op. Bestrooi met koriander en geef er zure room bij; de limoen en koriander maken de kom lekker fris."]},{"id":165,"name":"Quesadilla's met zwarte bonen en kaas","type":"Vegetarisch","time":20,"emoji":"🧀","cuisine":"Mexicaans","ingredients":[["tortilla's","2","stuk"],["zwarte bonen","100","g"],["geraspte cheddar","50","g"],["lente-ui","2","stuk"],["jalapeño","0.5","stuk"],["gerookt paprikapoeder","0.5","tl"],["limoen","0.5","stuk"],["zure room","2","el"]],"steps":["Spoel de bonen af en prak ze grof met een vork. Meng met het paprikapoeder, een snuf zout en een scheutje limoensap. Snijd de lente-ui in ringetjes en de jalapeño fijn.","Bestrijk de ene helft van elke tortilla met de bonenpuree, strooi de kaas, lente-ui en jalapeño erover en vouw dicht.","Verhit 1 theelepel olie in een koekenpan op middelhoog vuur. Bak de quesadilla's 3 minuten per kant tot ze goudbruin en krokant zijn en de kaas gesmolten is.","Laat 1 minuut rusten en snijd in punten. Serveer met zure room en een partje limoen; het frisse zuur van de limoen is precies wat de romige kaas nodig heeft."]},{"id":166,"name":"Huevos rancheros met zwarte bonen","type":"Vegetarisch","time":20,"emoji":"🍳","cuisine":"Mexicaans","ingredients":[["eieren","2","stuk"],["zwarte bonen","100","g"],["kleine tortilla's","2","stuk"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["chilipoeder","0.5","tl"],["feta","30","g"],["koriander","0.25","bosje"]],"steps":["Snipper de ui en snijd de knoflook fijn. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur, bak de ui 3 minuten en de knoflook met het chilipoeder 1 minuut mee. Voeg de tomatenblokjes toe en laat 8 minuten inkoken tot een dikke salsa. Breng op smaak met zout.","Spoel de bonen af en warm ze in een steelpannetje met een scheutje water en een snuf zout. Prak ze licht met een vork.","Verwarm de tortilla's 30 seconden per kant in een droge koekenpan en houd ze warm in een theedoek.","Bak de eieren in 1 theelepel olie 3 minuten tot het wit gestold is en de dooier nog zacht.","Leg de tortilla's op borden, schep de bonen erop en leg de eieren erbovenop. Lepel de salsa erlangs, verkruimel de feta erover en maak af met koriander. De lopende dooier mengt zich met de pittige salsa."]},{"id":167,"name":"Garnalentaco's met avocado en limoencrème","type":"Vis","time":20,"emoji":"🌮","cuisine":"Mexicaans","ingredients":[["garnalen","125","g"],["kleine tortilla's","3","stuk"],["avocado","0.5","stuk"],["rode kool","75","g"],["limoen","1","stuk"],["crème fraîche","2","el"],["gerookt paprikapoeder","1","tl"],["koriander","0.25","bosje"]],"steps":["Roer de crème fraîche met de rasp en het sap van een halve limoen en een snuf zout tot een limoencrème. Snijd de rode kool heel fijn en meng met het sap van de andere helft limoen en een snuf zout.","Dep de garnalen droog en meng ze met het paprikapoeder, zout en peper.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de garnalen 2 tot 3 minuten tot ze roze en net gaar zijn.","Verwarm de tortilla's 20 seconden per kant in een droge koekenpan. Snijd de avocado in plakjes.","Beleg de tortilla's met de kool, garnalen en avocado, lepel de limoencrème erover en strooi er koriander op. De knapperige kool en de zure crème houden de zoete garnalen in balans."]},{"id":168,"name":"Taco's met pulled chicken en koolsalade","type":"Vlees","time":35,"emoji":"🌮","cuisine":"Mexicaans","ingredients":[["kipdijfilet","150","g"],["kleine tortilla's","3","stuk"],["witte kool","100","g"],["wortel","0.5","stuk"],["bbq-saus","2","el"],["gerookt paprikapoeder","1","tl"],["mayonaise","1","el"],["limoen","0.5","stuk"],["koriander","0.25","bosje"]],"steps":["Wrijf de kip in met het paprikapoeder, zout en peper. Verhit 1 eetlepel olie in een pan met deksel op middelhoog vuur en bak de kip 2 minuten per kant bruin. Voeg 100 ml water toe, leg de deksel erop en laat 15 minuten zachtjes garen.","Snijd intussen de kool heel fijn en rasp de wortel. Meng met de mayonaise, het limoensap, zout en peper en laat staan.","Haal de kip uit de pan en trek het vlees met twee vorken uit elkaar. Kook het vocht in de pan op hoog vuur in tot een paar lepels, roer de bbq-saus erdoor en schep de kip terug. Laat 3 minuten pruttelen tot het vlees glanst.","Verwarm de tortilla's 20 seconden per kant in een droge koekenpan.","Vul de tortilla's met de kip en de koolsalade en maak af met koriander en een partje limoen. De frisse, knapperige kool is precies de tegenhanger van de zoete, rokerige kip."]},{"id":169,"name":"Mexicaanse bloemkoolsteaks met zoeteaardappelpuree","type":"Vegetarisch","time":35,"emoji":"🥦","cuisine":"Mexicaans","ingredients":[["bloemkool","0.5","stuk"],["zoete aardappel","200","g"],["taco-kruiden","1","el"],["limoen","0.5","stuk"],["feta","30","g"],["zwarte bonen","75","g"],["koriander","0.25","bosje"],["crème fraîche","1","el"]],"steps":["Verwarm de oven voor op 220°C. Snijd de bloemkool door het hart in 2 plakken van 2 centimeter dik. Meng 1 eetlepel olie met de taco-kruiden en een snuf zout en bestrijk de plakken aan beide kanten.","Leg de steaks op een bakplaat met bakpapier en rooster ze 25 minuten, halverwege keren, tot ze goudbruin en zacht zijn.","Schil intussen de zoete aardappel, snijd in blokjes en kook 12 tot 15 minuten gaar. Giet af en stamp met de crème fraîche, zout en peper tot een gladde puree.","Spoel de bonen af en warm ze in een pannetje met het limoensap en een snuf zout.","Schep de puree op de borden, leg de bloemkoolsteaks erop en verdeel de bonen eromheen. Verkruimel de feta erover en maak af met koriander. De zoete puree vangt de pit van de kruiden mooi op."]},{"id":170,"name":"Klassieke hamburger met cheddar en augurk","type":"Vlees","time":25,"emoji":"🍔","cuisine":"Amerikaans","ingredients":[["rundergehakt","125","g"],["hamburgerbroodje","1","stuk"],["cheddar","25","g"],["augurk","1","stuk"],["tomaat","0.5","stuk"],["rode ui","0.25","stuk"],["ijsbergsla","30","g"],["mayonaise","1","el"],["ketchup","1","el"]],"steps":["Kneed het gehakt losjes met zout en peper en vorm een burger die iets breder is dan het broodje. Druk een kuiltje in het midden en zet 10 minuten in de koelkast.","Snijd intussen de tomaat en de rode ui in dunne ringen en de augurk in plakjes. Roer de mayonaise en ketchup door elkaar tot een saus.","Verhit 1 theelepel olie in een koekenpan op hoog vuur. Bak de burger 3 tot 4 minuten per kant en leg in de laatste minuut de cheddar erop met een deksel op de pan, zodat de kaas smelt.","Snijd het broodje open en rooster de snijkanten 1 minuut in dezelfde pan.","Bestrijk het broodje met de saus en stapel sla, burger, augurk, tomaat en ui. Het zuur van de augurk snijdt door de vette kaas en het sappige vlees."]},{"id":171,"name":"Smashburger met gekarameliseerde ui","type":"Vlees","time":25,"emoji":"🍔","cuisine":"Amerikaans","ingredients":[["rundergehakt","125","g"],["hamburgerbroodje","1","stuk"],["ui","1","stuk"],["cheddar","25","g"],["augurk","1","stuk"],["mayonaise","1","el"],["mosterd","1","tl"],["ijsbergsla","30","g"]],"steps":["Snijd de ui in dunne halve ringen. Verhit 1 eetlepel boter in een koekenpan op middellaag vuur en bak de ui 12 tot 15 minuten, af en toe roerend, tot hij diep goudbruin en zoet is. Snuf zout erbij.","Verdeel het gehakt in 2 losse ballen zonder te kneden. Snijd de augurk fijn en roer hem met de mayonaise en mosterd tot een saus.","Verhit een zware koekenpan op de hoogste stand tot hij begint te roken. Leg de ballen erin en druk ze met een spatel plat tot dunne burgers. Bestrooi met zout en peper, bak 2 minuten tot er een donkere korst is, keer, leg de cheddar erop en bak nog 1 minuut.","Rooster de snijkanten van het broodje 1 minuut in de pan.","Bestrijk het broodje met de saus, leg de sla en de twee burgers op elkaar en schep de ui erbovenop. De zoete ui en de krokante vleesrandjes maken deze burger."]},{"id":172,"name":"Kipburger met hot honey en koolsalade","type":"Vlees","time":30,"emoji":"🍗","cuisine":"Amerikaans","ingredients":[["kipdijfilet","125","g"],["hamburgerbroodje","1","stuk"],["panko","30","g"],["ei","1","stuk"],["honing","1","el"],["chilivlokken","0.5","tl"],["witte kool","75","g"],["mayonaise","1","el"],["limoen","0.5","stuk"]],"steps":["Snijd de kool heel fijn en meng met de helft van de mayonaise, het limoensap en een snuf zout. Verwarm de honing met de chilivlokken en 1 theelepel water 1 minuut in een pannetje en zet apart.","Sla de kip plat tot ongeveer 1 centimeter dik. Haal hem door bloem met zout en peper, dan door het losgeklopte ei en tot slot door de panko.","Verhit 3 eetlepels olie in een koekenpan op middelhoog vuur en bak de kip 4 tot 5 minuten per kant goudbruin en gaar. Laat uitlekken op keukenpapier.","Snijd het broodje open en rooster de snijkanten 1 minuut in een droge pan.","Bestrijk het broodje met de rest van de mayonaise, leg de kip erop, lepel de hot honey erover en eindig met de koolsalade. Zoet, pittig, krokant en fris in één hap."]},{"id":173,"name":"Bonenburger met avocado en chipotlemayo","type":"Vegetarisch","time":30,"emoji":"🥑","cuisine":"Amerikaans","ingredients":[["zwarte bonen","150","g"],["paneermeel","30","g"],["ei","1","stuk"],["komijn","1","tl"],["hamburgerbroodje","1","stuk"],["avocado","0.5","stuk"],["mayonaise","1","el"],["chipotlepasta","1","tl"],["sla","30","g"]],"steps":["Spoel de bonen af, dep ze droog en prak ze grof met een vork. Meng met het paneermeel, het ei, de komijn, zout en peper. Vorm een dikke burger en zet 15 minuten in de koelkast zodat hij stevig wordt.","Roer intussen de mayonaise met de chipotlepasta. Prak de avocado grof met een snuf zout.","Verhit 2 eetlepels olie in een koekenpan op middelhoog vuur. Bak de burger 4 tot 5 minuten per kant tot hij een krokante korst heeft; keer hem voorzichtig met een spatel.","Snijd het broodje open en rooster de snijkanten 1 minuut in een droge pan.","Bestrijk het broodje met de chipotlemayo, leg de sla en de burger erop en schep de avocado erbovenop. De romige avocado zacht het rokerige, pittige van de chipotle."]},{"id":174,"name":"Pulled-jackfruitburger met bbq-saus","type":"Vegetarisch","time":30,"emoji":"🍔","cuisine":"Amerikaans","ingredients":[["jackfruit","200","g"],["bbq-saus","3","el"],["ui","0.5","stuk"],["knoflook","1","teen"],["gerookt paprikapoeder","1","tl"],["hamburgerbroodje","1","stuk"],["witte kool","75","g"],["mayonaise","1","el"],["augurk","1","stuk"]],"steps":["Laat de jackfruit uitlekken, spoel af en trek de stukken met de vingers of een vork uit elkaar; snijd harde kernstukjes fijn. Snipper de ui en snijd de knoflook fijn.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de ui 4 minuten. Voeg de knoflook en het paprikapoeder toe en bak 1 minuut mee. Doe de jackfruit erbij, zet het vuur hoog en bak 5 minuten tot de randjes bruin worden.","Roer de bbq-saus en 50 ml water erdoor, leg de deksel op de pan en laat 10 minuten zachtjes pruttelen. Haal de deksel eraf en laat inkoken tot de saus plakkerig is. Breng op smaak met zout en peper.","Snijd intussen de kool en de augurk fijn en meng met de mayonaise, zout en peper.","Rooster het broodje, schep de jackfruit erop en eindig met de koolsalade. De zoete, rokerige saus en de frisse kool geven precies het pulled-pork-gevoel."]},{"id":175,"name":"Loaded fries met gehakt, kaas en jalapeño","type":"Vlees","time":30,"emoji":"🍟","cuisine":"Amerikaans","ingredients":[["ovenfriet","200","g"],["rundergehakt","100","g"],["geraspte cheddar","50","g"],["jalapeño uit pot","2","el"],["taco-kruiden","1","el"],["tomaat","0.5","stuk"],["lente-ui","1","stuk"],["zure room","2","el"]],"steps":["Verwarm de oven voor op 220°C. Verdeel de friet over een bakplaat en bak volgens de verpakking (meestal 18 tot 20 minuten) tot hij knapperig is.","Verhit intussen 1 theelepel olie in een koekenpan op hoog vuur en bak het gehakt 5 minuten rul. Voeg de taco-kruiden en 3 eetlepels water toe en laat 2 minuten inkoken.","Snijd de tomaat in blokjes en de lente-ui in ringetjes. Laat de jalapeño uitlekken.","Schep de friet in een ovenschaal, verdeel het gehakt erover en strooi de kaas en de jalapeño erbovenop. Zet 5 minuten terug in de oven tot de kaas gesmolten is.","Maak af met de tomaat, lente-ui en klodders zure room. De koele room en de frisse tomaat houden de pittige, kazige friet luchtig."]},{"id":176,"name":"Kapsalon met zoete aardappelfriet en kip","type":"Vlees","time":30,"emoji":"🍟","cuisine":"Nederlands","ingredients":[["zoete aardappel","250","g"],["kipdijfilet","125","g"],["shoarmakruiden","1","el"],["geraspte kaas","40","g"],["ijsbergsla","50","g"],["tomaat","0.5","stuk"],["knoflooksaus","2","el"],["sambal","1","tl"]],"steps":["Verwarm de oven voor op 220°C. Schil de zoete aardappel en snijd in frietjes van 1 centimeter dik. Meng met 1 eetlepel olie en zout, verdeel over een bakplaat met bakpapier en bak 20 tot 25 minuten, halverwege keren.","Snijd de kip in reepjes en meng met de shoarmakruiden. Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de kip 6 tot 8 minuten bruin en gaar.","Snijd de sla in reepjes en de tomaat in blokjes.","Schep de friet in een ovenschaaltje, leg de kip erop en strooi de kaas erover. Zet 3 tot 4 minuten onder de hete grill tot de kaas gesmolten is.","Leg de sla en tomaat erbovenop en maak af met knoflooksaus en sambal. De koude, knapperige sla op de warme kaas is wat een kapsalon zo lekker maakt."]},{"id":177,"name":"Griekse wraps met kipgehakt en tzatziki","type":"Vlees","time":25,"emoji":"🌯","cuisine":"Grieks","ingredients":[["kipgehakt","125","g"],["wraps","2","stuk"],["griekse yoghurt","75","g"],["komkommer","0.25","stuk"],["knoflook","1","teen"],["gedroogde oregano","1","tl"],["tomaat","0.5","stuk"],["rode ui","0.25","stuk"],["feta","30","g"]],"steps":["Rasp de komkommer grof en knijp het vocht eruit. Meng met de yoghurt, de geperste knoflook, een snuf zout en een scheutje olijfolie tot tzatziki.","Meng het kipgehakt met de oregano, zout en peper. Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak het gehakt 6 tot 8 minuten rul en bruin.","Snijd de tomaat in blokjes en de rode ui in dunne ringen. Verkruimel de feta.","Verwarm de wraps 20 seconden per kant in een droge koekenpan.","Bestrijk de wraps met tzatziki, verdeel het gehakt, de tomaat, ui en feta erover en rol op. De koele tzatziki is precies wat het kruidige gehakt nodig heeft."]},{"id":178,"name":"Falafelwrap met hummus en ingelegde rode ui","type":"Vegetarisch","time":20,"emoji":"🧆","cuisine":"Midden-Oosters","ingredients":[["falafel","125","g"],["wraps","2","stuk"],["hummus","3","el"],["rode ui","0.5","stuk"],["citroen","0.5","stuk"],["komkommer","0.25","stuk"],["tomaat","0.5","stuk"],["peterselie","0.25","bosje"],["yoghurt","2","el"]],"steps":["Snijd de rode ui in heel dunne ringen en meng met het citroensap, een snuf zout en een snuf suiker. Laat 10 minuten staan tot de ui zacht en roze is.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de falafel 6 tot 8 minuten rondom krokant.","Snijd intussen de komkommer en tomaat in blokjes, hak de peterselie fijn en meng alles met een scheutje olijfolie en zout.","Verwarm de wraps 20 seconden per kant in een droge pan. Bestrijk met hummus, leg de falafel erop en druk ze licht plat. Verdeel de salade, de uitgelekte ui en een lepel yoghurt erover en rol op. De zure ui maakt de romige hummus en de kruidige falafel lekker licht."]},{"id":179,"name":"Wraps met teriyaki-tofu, kimchi en peer","type":"Vegetarisch","time":20,"emoji":"🌯","cuisine":"Aziatisch","ingredients":[["stevige tofu","150","g"],["wraps","2","stuk"],["teriyakisaus","2","el"],["kimchi","50","g"],["peer","0.5","stuk"],["sla","30","g"],["mayonaise","1","el"],["sesamzaad","1","tl"],["maizena","1","el"]],"steps":["Dep de tofu goed droog, snijd in plakken van 1 centimeter en dan in reepjes. Bestuif met de maizena.","Verhit 2 eetlepels olie in een koekenpan op hoog vuur en bak de tofu 6 tot 8 minuten tot hij rondom goudbruin en krokant is. Zet het vuur laag, roer de teriyakisaus erdoor en bak 1 minuut tot de tofu glanst.","Snijd de peer in dunne reepjes en hak de kimchi grof. Roer de mayonaise met 1 theelepel van het kimchivocht.","Verwarm de wraps 20 seconden per kant in een droge pan. Bestrijk met de mayonaise, beleg met sla, tofu, kimchi en peer en strooi het sesamzaad erover. Rol op; de zoete peer vangt het zure, pittige van de kimchi op."]},{"id":180,"name":"Kipshoarma met knoflooksaus en pita","type":"Vlees","time":25,"emoji":"🥙","cuisine":"Midden-Oosters","ingredients":[["kipdijfilet","150","g"],["pitabroodjes","2","stuk"],["shoarmakruiden","1","el"],["griekse yoghurt","3","el"],["knoflook","1","teen"],["ijsbergsla","50","g"],["tomaat","0.5","stuk"],["rode ui","0.25","stuk"],["citroen","0.25","stuk"]],"steps":["Snijd de kip in reepjes en meng met de shoarmakruiden, 1 eetlepel olie en een snuf zout. Laat 10 minuten marineren.","Roer intussen de yoghurt met de geperste knoflook, het citroensap, zout en peper tot knoflooksaus.","Snijd de sla in reepjes, de tomaat in blokjes en de rode ui in dunne ringen.","Verhit een koekenpan op hoog vuur en bak de kip 6 tot 8 minuten; laat hem af en toe even liggen zodat er krokante randjes komen.","Rooster de pitabroodjes 2 tot 3 minuten in de broodrooster, snijd open en vul met sla, kip, tomaat en ui. Lepel de knoflooksaus erover; de koele saus tegen de hete, kruidige kip is de klassieke combinatie."]},{"id":181,"name":"Gyros van varkensvlees met tzatziki","type":"Vlees","time":30,"emoji":"🥙","cuisine":"Grieks","ingredients":[["varkensfiletlapjes","150","g"],["pitabroodjes","2","stuk"],["gyroskruiden","1","el"],["griekse yoghurt","75","g"],["komkommer","0.25","stuk"],["knoflook","1","teen"],["tomaat","0.5","stuk"],["rode ui","0.25","stuk"],["citroen","0.25","stuk"]],"steps":["Snijd het vlees in dunne reepjes en meng met de gyroskruiden, 1 eetlepel olie, het citroensap en een snuf zout. Laat 15 minuten marineren.","Rasp intussen de komkommer grof en knijp het vocht eruit. Meng met de yoghurt, de geperste knoflook, zout en een scheutje olijfolie tot tzatziki.","Snijd de tomaat in halve plakken en de rode ui in dunne ringen.","Verhit een koekenpan op hoog vuur zonder extra olie en bak het vlees in 2 porties 3 tot 4 minuten per portie, tot het bruin en gaar is.","Rooster de pitabroodjes, snijd ze open en vul met tzatziki, vlees, tomaat en ui. Wie wil doet er zoals in Griekenland een paar frietjes bij; het frisse van de tzatziki past precies bij het kruidige vlees."]},{"id":182,"name":"Caesarsalade met kip en krokante croutons","type":"Vlees","time":20,"emoji":"🥗","cuisine":"Amerikaans","ingredients":[["kipfilet","125","g"],["romaine sla","0.5","krop"],["oud brood","1","sneden"],["parmezaan","25","g"],["mayonaise","2","el"],["citroen","0.25","stuk"],["knoflook","1","teen"],["ansjovisfilet","1","stuk"],["worcestersaus","0.5","tl"]],"steps":["Verwarm de oven voor op 200°C. Snijd het brood in blokjes, meng met 1 eetlepel olijfolie en een snuf zout en bak 8 tot 10 minuten tot ze goudbruin en krokant zijn.","Prak de ansjovis en knoflook fijn en roer ze met de mayonaise, het citroensap, de worcestersaus, 1 eetlepel water en de helft van de geraspte parmezaan tot een dressing. Peper erbij.","Snijd de kipfilet horizontaal door tot 2 dunne lapjes en bestrooi met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak 3 tot 4 minuten per kant gaar. Laat 2 minuten rusten en snijd in reepjes.","Scheur de sla in stukken en meng met de dressing.","Verdeel de kip en croutons over de sla en schaaf de rest van de parmezaan erover. De zoute kaas en ansjovis in de dressing maken de knapperige sla hartig en vol."]},{"id":183,"name":"Salade niçoise met tonijn en ei","type":"Vis","time":25,"emoji":"🥗","cuisine":"Frans","ingredients":[["tonijn in olijfolie","80","g"],["ei","1","stuk"],["krieltjes","150","g"],["sperziebonen","75","g"],["cherrytomaten","75","g"],["zwarte olijven","25","g"],["rode ui","0.25","stuk"],["dijonmosterd","1","tl"],["citroen","0.25","stuk"]],"steps":["Kook de krieltjes 15 minuten gaar in water met zout. Voeg de laatste 4 minuten de sperziebonen toe en giet af.","Kook het ei 7 minuten in kokend water, laat schrikken onder koud water, pel en halveer.","Roer de mosterd met het citroensap, 2 eetlepels olijfolie, zout en peper tot een dressing. Snijd de rode ui in dunne ringen en halveer de tomaten.","Halveer de krieltjes en meng ze nog lauwwarm met de helft van de dressing.","Schik de krieltjes, bonen, tomaten en olijven op een bord, verdeel de tonijn in grove stukken erover en leg het ei erop. Druppel de rest van de dressing erover; de lauwwarme aardappels nemen de dressing op en maken de salade vol van smaak."]},{"id":184,"name":"Griekse salade met feta, olijven en warm brood","type":"Vegetarisch","time":15,"emoji":"🫒","cuisine":"Grieks","ingredients":[["feta","75","g"],["tomaat","1","stuk"],["komkommer","0.25","stuk"],["rode ui","0.25","stuk"],["kalamata-olijven","30","g"],["gedroogde oregano","1","tl"],["turks brood","0.25","stuk"],["rode wijnazijn","1","el"]],"steps":["Verwarm de oven voor op 180°C en leg het brood er 5 minuten in tot het warm en knapperig is.","Snijd de tomaat in grove parten, de komkommer in dikke halve maantjes en de rode ui in dunne ringen.","Meng de groenten en olijven in een kom met 2 eetlepels olijfolie, de azijn, de helft van de oregano, zout en peper.","Leg de feta in één stuk bovenop de salade, besprenkel met olijfolie en strooi de rest van de oregano erover. Serveer met het warme brood om de olie en het tomatensap mee op te deppen."]},{"id":185,"name":"Pastasalade met tonijn, ei en augurk","type":"Vis","time":20,"emoji":"🥗","cuisine":"Europees","ingredients":[["fusilli","80","g"],["tonijn","80","g"],["ei","1","stuk"],["augurk","2","stuk"],["mayonaise","2","el"],["griekse yoghurt","1","el"],["rode ui","0.25","stuk"],["maïs","50","g"],["bieslook","0.25","bosje"]],"steps":["Kook de pasta volgens de verpakking beetgaar (meestal 9 tot 11 minuten). Kook tegelijk het ei 8 minuten in een pannetje. Spoel de pasta kort koud af en laat uitlekken.","Snijd de augurk in blokjes, snipper de rode ui en knip de bieslook fijn. Laat de tonijn en de maïs uitlekken.","Roer de mayonaise met de yoghurt, 1 eetlepel augurkennat, zout en peper tot een dressing.","Meng de pasta met de tonijn, maïs, augurk, ui en dressing. Pel het ei, snijd in parten en leg erop. Strooi de bieslook erover; het zuur van de augurk houdt de romige salade fris."]},{"id":186,"name":"Couscoussalade met ras el hanout, geroosterde groente en feta","type":"Vegetarisch","time":30,"emoji":"🥗","cuisine":"Marokkaans","ingredients":[["couscous","75","g"],["courgette","0.5","stuk"],["rode paprika","0.5","stuk"],["rode ui","0.5","stuk"],["ras el hanout","2","tl"],["feta","50","g"],["kikkererwten","75","g"],["citroen","0.5","stuk"],["munt","0.25","bosje"]],"steps":["Verwarm de oven voor op 220°C. Snijd de courgette, paprika en rode ui in stukken van 2 centimeter en meng met de uitgelekte kikkererwten, 1,5 eetlepel olie, de ras el hanout en zout. Verdeel over een bakplaat en rooster 20 minuten, halverwege omscheppen.","Doe de couscous met een snuf zout in een kom, giet er 100 ml kokend water op, dek af en laat 5 minuten staan. Maak los met een vork en roer 1 eetlepel olijfolie erdoor.","Snijd de munt fijn en rasp de schil van de citroen.","Schep de geroosterde groenten door de couscous met het citroensap en de rasp. Verkruimel de feta erover en strooi de munt erbovenop. Lekker warm of lauw; de zilte feta en frisse munt staan mooi tegen de warme kruiden."]},{"id":187,"name":"Geitenkaassalade met walnoot, peer en honing","type":"Vegetarisch","time":15,"emoji":"🧀","cuisine":"Frans","ingredients":[["zachte geitenkaas","60","g"],["peer","0.5","stuk"],["walnoten","20","g"],["gemengde sla","75","g"],["honing","1","el"],["balsamicoazijn","1","el"],["stokbrood","2","sneden"],["dijonmosterd","0.5","tl"]],"steps":["Rooster de walnoten 2 tot 3 minuten in een droge koekenpan en hak ze grof.","Roer de mosterd met de balsamicoazijn, 2 eetlepels olijfolie, zout en peper tot een dressing.","Snijd de geitenkaas in 2 plakken en leg ze op de sneden stokbrood. Zet 3 tot 4 minuten onder de hete grill tot de kaas smelt en bruine blosjes krijgt.","Snijd de peer in dunne parten en meng de sla met de dressing. Leg het brood met kaas op de sla, verdeel de peer en walnoten erover en druppel de honing erbovenop. De zoete peer en honing maken de pittige geitenkaas rond."]},{"id":188,"name":"Warme salade van geroosterde groente met ei en yoghurtdressing","type":"Vegetarisch","time":35,"emoji":"🥗","cuisine":"Mediterraan","ingredients":[["zoete aardappel","150","g"],["courgette","0.5","stuk"],["rode paprika","0.5","stuk"],["rode ui","0.5","stuk"],["ei","1","stuk"],["griekse yoghurt","3","el"],["knoflook","1","teen"],["rucola","30","g"],["komijn","1","tl"]],"steps":["Verwarm de oven voor op 220°C. Snijd de zoete aardappel ongeschild in blokjes van 2 centimeter, de courgette in halve plakken, de paprika in stukken en de ui in parten. Meng met 1,5 eetlepel olie, de komijn, zout en peper.","Verdeel de groenten over een bakplaat met bakpapier en rooster 25 minuten, halverwege omscheppen, tot ze zacht zijn met bruine randjes.","Roer intussen de yoghurt met de geperste knoflook, 1 eetlepel olijfolie, een scheutje water en zout tot een gladde dressing.","Kook het ei de laatste 7 minuten in kokend water, laat schrikken onder koud water, pel en halveer.","Meng de warme groenten met de rucola, lepel de dressing erover en leg het ei erop. Maal er flink peper over; de warme groente laat de rucola net slinken en de koele dressing bindt alles."]},{"id":189,"name":"Pokébowl met tonijn en edamame","type":"Vis","time":20,"emoji":"🍣","cuisine":"Japans","ingredients":[["sushi-tonijn","100","g"],["sushirijst","75","g"],["edamame","50","g"],["avocado","0.5","stuk"],["komkommer","0.25","stuk"],["sojasaus","1","el"],["sesamolie","1","tl"],["rijstazijn","1","el"],["sesamzaad","1","tl"]],"steps":["Spoel de rijst tot het water helder is en kook volgens de verpakking (ongeveer 12 minuten). Roer de rijstazijn met een snuf suiker en zout erdoor en laat iets afkoelen.","Kook de edamame 3 minuten in water met zout en giet af. Snijd de tonijn in blokjes van 1,5 centimeter en meng met de sojasaus en sesamolie. Laat 5 minuten staan.","Snijd de komkommer in halve maantjes en de avocado in plakjes.","Schep de rijst in een kom en leg de tonijn, edamame, komkommer en avocado er in vakjes op. Strooi het sesamzaad erover en geef er eventueel mayonaise met sriracha bij; de zure rijst en de zachte tonijn zijn samen precies in balans."]},{"id":190,"name":"Quinoabowl met champignons, miso en spiegelei","type":"Vegetarisch","time":15,"emoji":"🍳","cuisine":"Aziatisch","ingredients":[["quinoa","60","g"],["champignons","125","g"],["ei","1","stuk"],["miso","1","el"],["knoflook","1","teen"],["lente-ui","1","stuk"],["spinazie","50","g"],["sesamzaad","1","tl"],["sojasaus","1","tl"]],"steps":["Spoel de quinoa af en kook 12 minuten in 150 ml water met een snuf zout. Zet het vuur uit en laat 2 minuten nastomen.","Snijd de champignons in kwarten, de knoflook fijn en de lente-ui in ringetjes. Roer de miso met de sojasaus en 2 eetlepels warm water glad.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur en bak de champignons 5 minuten bruin zonder veel te roeren. Voeg de knoflook toe en bak 1 minuut, laat de spinazie 1 minuut slinken en roer het misomengsel erdoor.","Bak het ei in 1 theelepel olie 3 minuten tot het wit gestold is en de dooier nog zacht.","Schep de quinoa in een kom, leg de champignons en het ei erop en strooi de lente-ui en het sesamzaad erover. De lopende dooier mengt met de hartige miso tot een saus."]},{"id":191,"name":"Buddha bowl met geroosterde kikkererwten en tahin","type":"Vegetarisch","time":30,"emoji":"🥗","cuisine":"Mediterraan","ingredients":[["kikkererwten","125","g"],["zoete aardappel","150","g"],["quinoa","60","g"],["tahin","1","el"],["citroen","0.5","stuk"],["gerookt paprikapoeder","1","tl"],["rode kool","50","g"],["avocado","0.5","stuk"],["spinazie","30","g"]],"steps":["Verwarm de oven voor op 220°C. Laat de kikkererwten uitlekken en dep ze droog. Snijd de zoete aardappel in blokjes van 2 centimeter. Meng beide met 1 eetlepel olie, het paprikapoeder en zout en verdeel over een bakplaat. Rooster 25 minuten, halverwege omscheppen.","Spoel de quinoa af en kook 12 minuten in 150 ml water met een snuf zout.","Roer de tahin met de helft van het citroensap, 2 eetlepels water en een snuf zout tot een gladde dressing; voeg water toe als hij te dik is.","Snijd de rode kool heel fijn en meng met de rest van het citroensap en een snuf zout. Snijd de avocado in plakjes.","Schep de quinoa in een kom, leg de spinazie, zoete aardappel, kikkererwten, kool en avocado er in vakjes op en lepel de dressing erover. De krokante kikkererwten en de romige tahin maken de kom compleet."]},{"id":192,"name":"Zelfgemaakte vissticks van heek met kappertjesdip","type":"Vis","time":30,"emoji":"🐟","cuisine":"Europees","ingredients":[["heekfilet","150","g"],["paneermeel","40","g"],["ei","1","stuk"],["kappertjes","1","el"],["yoghurt","3","el"],["mayonaise","1","el"],["citroen","0.5","stuk"],["krieltjes","200","g"],["doperwten","75","g"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes, meng ze met 1 eetlepel olie, zout en peper en rooster ze 25 minuten op een bakplaat tot ze goudbruin zijn.","Snijd de heek in repen van 2 cm breed en bestrooi ze met zout en peper. Zet drie diepe borden klaar: één met 2 eetlepels bloem, één met het losgeklopte ei en één met het paneermeel. Haal de repen eerst door de bloem, dan door het ei en druk ze stevig in het paneermeel.","Hak de kappertjes grof en roer ze door de yoghurt en mayonaise met de rasp van de citroen en een draai peper.","Verhit 3 eetlepels olie in een koekenpan op middelhoog vuur en bak de vissticks 3 tot 4 minuten per kant goudbruin en krokant. Laat ze uitlekken op keukenpapier en bestrooi met een snuf zout.","Kook de doperwten intussen 3 minuten in water met zout en giet af.","Serveer de vissticks met de krieltjes, de erwten, een partje citroen en de dip erbij; de zoute kappertjes en het frisse zuur maken de milde vis extra lekker."]},{"id":193,"name":"Kibbeling met remouladesaus en friet","type":"Vis","time":30,"emoji":"🐟","cuisine":"Nederlands","ingredients":[["kabeljauwfilet","150","g"],["aardappelen","250","g"],["mayonaise","3","el"],["augurk","1","stuk"],["kappertjes","1","tl"],["peterselie","0.25","bosje"],["citroen","0.25","stuk"],["paprikapoeder","1","tl"]],"steps":["Verwarm de oven voor op 220°C. Schil de aardappelen en snijd ze in frieten van 1 cm dik. Dep ze droog, meng met 1 eetlepel olie en zout en bak ze 25 tot 30 minuten op een bakplaat, halverwege keren.","Snipper de augurk fijn en hak de kappertjes en de peterselie. Roer alles door de mayonaise met een scheutje citroensap en wat peper.","Snijd de vis in stukken van 3 cm en bestrooi met zout. Roer 4 eetlepels bloem, het paprikapoeder, een halve theelepel zout en 75 ml koud water tot een glad, dik beslag.","Verhit een laag olie van 2 cm in een pan op middelhoog tot hoog vuur, tot een stukje brood er direct in bruist. Haal de stukjes vis door het beslag en bak ze in twee porties 3 tot 4 minuten goudbruin. Laat uitlekken op keukenpapier.","Serveer de kibbeling met de friet, de remoulade en een partje citroen; de romige, zure saus is precies wat de knapperige vis nodig heeft."]},{"id":194,"name":"Visburger met wortel-knolselderijremoulade","type":"Vis","time":30,"emoji":"🍔","cuisine":"Europees","ingredients":[["koolvisfilet","150","g"],["paneermeel","40","g"],["ei","1","stuk"],["hamburgerbroodje","1","stuk"],["wortel","1","stuk"],["knolselderij","100","g"],["mayonaise","2","el"],["grove mosterd","1","tl"],["little gem","0.5","krop"]],"steps":["Rasp de wortel en de knolselderij grof. Meng ze met de mayonaise, de mosterd, een scheutje citroensap of azijn, zout en peper en laat de remoulade intrekken.","Snijd de vis in een stuk dat op het broodje past en bestrooi met zout en peper. Haal de vis door 2 eetlepels bloem, dan door het losgeklopte ei en druk hem in het paneermeel.","Verhit 3 eetlepels olie in een koekenpan op middelhoog vuur en bak de vis 3 tot 4 minuten per kant goudbruin en gaar. Laat kort uitlekken op keukenpapier.","Snijd het broodje open en rooster het 2 minuten in de broodrooster of met de snijkant naar beneden in de pan.","Beleg het broodje met blaadjes little gem, de vis en een flinke lepel remoulade. Serveer meteen; de knapperige, licht zure remoulade houdt de krokante vis lekker fris."]},{"id":195,"name":"Zeebaars met krieltjes en bimi","type":"Vis","time":30,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["zeebaarsfilet","150","g"],["krieltjes","250","g"],["bimi","150","g"],["knoflook","1","teen"],["citroen","0.5","stuk"],["cherrytomaten","100","g"],["peterselie","0.25","bosje"]],"steps":["Halveer de krieltjes en kook ze 10 minuten in water met zout. Giet af en laat even uitstomen.","Verhit 2 eetlepels olijfolie in een grote koekenpan op middelhoog vuur en bak de krieltjes 10 minuten goudbruin, af en toe schudden. Voeg de laatste 4 minuten de bimi, de gehalveerde tomaten en de fijngesneden knoflook toe.","Dep de zeebaars droog, snijd de huid drie keer in en bestrooi met zout en peper. Verhit 1 eetlepel olie in een tweede pan op middelhoog tot hoog vuur en bak de vis 3 tot 4 minuten op de huid tot die krokant is. Keer en bak nog 1 minuut.","Hak de peterselie en schep die met de rasp van de citroen door de krieltjes.","Leg de vis met de huid naar boven op de krieltjes en knijp wat citroensap erover. Het sap en de zoete tomaatjes houden het gerecht licht en zomers."]},{"id":196,"name":"Forel uit de oven met citroen en amandel","type":"Vis","time":30,"emoji":"🐟","cuisine":"Europees","ingredients":[["forel","1","stuk"],["citroen","0.5","stuk"],["amandelschaafsel","20","g"],["peterselie","0.25","bosje"],["knoflook","1","teen"],["aardappelen","200","g"],["sperziebonen","100","g"]],"steps":["Verwarm de oven voor op 200°C. Schil de aardappelen, snijd ze in parten en kook ze 15 minuten in water met zout.","Dep de forel droog en bestrooi hem binnen en buiten met zout en peper. Vul de buik met schijfjes citroen, plakjes knoflook en de steeltjes van de peterselie. Leg de vis in een ovenschaal, besprenkel met 1 eetlepel olijfolie en bak 18 tot 20 minuten tot het vlees bij de graat loslaat.","Kook de sperziebonen 5 minuten in water met zout en giet af.","Rooster het amandelschaafsel 2 minuten in een droge koekenpan op middelhoog vuur. Voeg 1 eetlepel boter toe en laat die lichtbruin worden. Haal de pan van het vuur en roer een scheutje citroensap en de gehakte peterselieblaadjes erdoor.","Serveer de forel met de amandelboter erover, de aardappelen en de bonen ernaast. De nootachtige boter en het zure citroensap maken de milde vis rijk zonder zwaar te worden."]},{"id":197,"name":"Heek met bietjes en peterseliekruim","type":"Vis","time":35,"emoji":"🐟","cuisine":"Europees","ingredients":[["heekfilet","150","g"],["gekookte bietjes","150","g"],["witbrood","1","sneden"],["peterselie","0.5","bosje"],["citroen","0.5","stuk"],["knoflook","1","teen"],["aardappelen","250","g"],["crème fraîche","2","el"]],"steps":["Verwarm de oven voor op 200°C. Schil de aardappelen, snijd ze in parten, meng met 1 eetlepel olie en zout en rooster ze 25 tot 30 minuten op een bakplaat.","Snijd de bietjes in parten en meng ze met 1 eetlepel olie, een scheutje azijn, zout en peper. Leg ze de laatste 15 minuten bij de aardappelen op de bakplaat.","Verkruimel het brood fijn, met de hand of in een keukenmachine. Meng het kruim met de fijngehakte peterselie, de geperste knoflook, de rasp van de citroen, 1 eetlepel olijfolie en een snuf zout.","Bestrooi de heek met zout en peper, leg hem in een ingevette ovenschaal en druk het kruim er stevig op. Bak 12 tot 14 minuten in de oven tot het kruim goudbruin is en de vis net gaar.","Roer de crème fraîche los met een scheutje citroensap en een snuf zout.","Serveer de vis met de aardappelen, de bietjes en een lepel crème fraîche; de zoete biet, de frisse room en het knapperige kruim passen mooi bij de zachte heek."]},{"id":198,"name":"Schelvis in pakketjes met prei en witte wijn","type":"Vis","time":30,"emoji":"🐟","cuisine":"Frans","ingredients":[["schelvisfilet","150","g"],["prei","1","stuk"],["witte wijn","50","ml"],["crème fraîche","2","el"],["tijm","2","takje"],["citroen","0.25","stuk"],["aardappelen","250","g"],["cherrytomaten","75","g"]],"steps":["Verwarm de oven voor op 200°C. Schil de aardappelen, snijd ze in stukken en kook ze 15 tot 18 minuten in water met zout.","Snijd de prei in dunne ringen en was ze goed. Verhit 1 eetlepel boter in een koekenpan op middelhoog vuur en smoor de prei 5 minuten zacht met een snuf zout.","Leg een groot vel bakpapier op een bakplaat. Schep de prei in het midden, leg de schelvis erop en bestrooi met zout en peper. Verdeel de gehalveerde tomaatjes en de tijm erover, giet de wijn erbij en leg de crème fraîche bovenop. Vouw het papier dicht tot een pakketje.","Bak het pakketje 12 tot 14 minuten in de oven tot de vis ondoorzichtig is en in vlokken uit elkaar valt.","Stamp de aardappelen grof met een klontje boter. Open het pakketje aan tafel en serveer met de puree en een kneepje citroen. In het pakketje gaart de schelvis in zijn eigen vocht, de wijn en de room, dus hij blijft heel sappig."]},{"id":199,"name":"Schelvis in mosterdroomsaus met prei en rijst","type":"Vis","time":20,"emoji":"🐟","cuisine":"Europees","ingredients":[["schelvisfilet","125","g"],["rijst","80","g"],["kookroom","100","ml"],["prei","0.5","stuk"],["grove mosterd","1","el"],["citroen","0.25","stuk"],["dille","0.25","bosje"],["sjalot","1","stuk"]],"steps":["Kook de rijst volgens de verpakking.","Snijd de prei in dunne ringen en was ze goed. Snipper de sjalot en hak de dille fijn. Dep de schelvis droog, snijd hem in 2 stukken en bestrooi met zout en peper.","Verhit 1 eetlepel boter in een koekenpan op middelhoog vuur en smoor de prei en sjalot 4 minuten zacht. Voeg de room en de mosterd toe en laat 2 minuten zachtjes pruttelen.","Leg de vis in de saus, zet het deksel schuin op de pan en laat 5 tot 6 minuten zachtjes garen tot de vis ondoorzichtig is en in witte vlokken uit elkaar valt. Niet omdraaien, de vis is kwetsbaar.","Roer de dille en een scheutje citroensap erdoor en proef op zout. Serveer op de rijst. Schelvis is zachter van smaak dan kabeljauw en laat de pittige mosterd mooi naar voren komen."]},{"id":200,"name":"Zeebaars met sesam, gember en noedels","type":"Vis","time":25,"emoji":"🍜","cuisine":"Japans","ingredients":[["zeebaarsfilet","125","g"],["sesamzaad","2","el"],["eiernoedels","75","g"],["paksoi","1","stuk"],["sojasaus","2","el"],["honing","1","tl"],["gember","2","cm"],["lente-ui","1","stuk"],["limoen","0.5","stuk"]],"steps":["Roer de sojasaus, de honing, de geraspte gember en het sap van de limoen tot een saus. Dep de zeebaars droog en kerf de huid 3 keer licht in, zodat hij niet kromtrekt.","Kook de noedels volgens de verpakking, giet af en spoel kort af met koud water.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur. Leg de vis met de huid naar beneden in de pan en bak 4 minuten zonder te bewegen tot de huid krokant is. Keer om, bestrooi de huid met het sesamzaad en bak nog 1 tot 2 minuten.","Snijd de paksoi in repen en de lente-ui in ringen. Roerbak de paksoi 2 minuten in dezelfde pan, voeg de noedels en de helft van de saus toe en wok 1 minuut.","Serveer de noedels met de zeebaars erop, de rest van de saus en de lente-ui. Zeebaars heeft een dunne, knapperige huid en fijn wit vlees dat lekker licht blijft bij de gember en sesam."]},{"id":201,"name":"Tonijnsteak met ingelegde ui en parelcouscous","type":"Vis","time":25,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["tonijnsteak","150","g"],["parelcouscous","75","g"],["rode ui","0.5","stuk"],["witte wijnazijn","2","el"],["cherrytomaten","100","g"],["komkommer","0.25","stuk"],["peterselie","0.25","bosje"],["citroen","0.5","stuk"],["olijven","25","g"]],"steps":["Snijd de rode ui in dunne halve ringen en meng ze met de azijn, 1 theelepel suiker en een snuf zout. Laat minstens 15 minuten staan tot de ui roze en zacht is.","Kook de parelcouscous 8 tot 10 minuten in water met zout tot hij beetgaar is en giet af.","Halveer de tomaten, snijd de komkommer in blokjes en de olijven in stukjes en hak de peterselie. Schep alles door de couscous met 1 eetlepel olijfolie, het sap van de citroen, zout en peper.","Dep de tonijn droog, wrijf hem in met olie, zout en peper. Verhit een grillpan op hoog vuur tot hij rookt en gril de tonijn 1 tot 2 minuten per kant, zodat hij vanbinnen nog rosé is.","Snijd de tonijn in plakken en leg hem op de couscous met de uitgelekte ui erover. De zure ui snijdt mooi door de vlezige, rijke tonijn heen."]},{"id":202,"name":"Coquilles met doperwtenpuree en krokante spek","type":"Vis","time":25,"emoji":"🥪","cuisine":"Frans","ingredients":[["coquilles","4","stuk"],["doperwten","150","g"],["ontbijtspek","2","plak"],["sjalot","1","stuk"],["munt","0.25","bosje"],["citroen","0.25","stuk"],["krieltjes","200","g"],["boter","15","g"]],"steps":["Halveer de krieltjes en kook ze in 12 tot 15 minuten gaar in water met zout. Giet af en schud ze om met een klontje boter, zout en peper.","Bak het spek in een droge koekenpan op middelhoog vuur in 4 tot 5 minuten krokant. Leg het op keukenpapier en bewaar het vet in de pan.","Snipper de sjalot. Kook de doperwten 3 minuten, giet af en pureer ze met de sjalot, de munt, de boter, een scheutje citroensap, zout en peper tot een grove puree. Houd warm.","Dep de coquilles goed droog en bestrooi met zout. Verhit de pan met het spekvet plus 1 theelepel olie op hoog vuur en bak de coquilles 1,5 minuut per kant tot ze goudbruin zijn en net ondoorzichtig vanbinnen. Niet langer, dan worden ze taai.","Schep de doperwtenpuree op het bord, leg de coquilles erop en verkruimel het spek erover. Serveer met de krieltjes. Zoete coquilles, zoete erwten en zout spek: een klassieke combinatie die in 25 minuten op tafel staat."]},{"id":203,"name":"Gamba's pil pil met brood","type":"Vis","time":15,"emoji":"🍤","cuisine":"Spaans","ingredients":[["gepelde gamba's","150","g"],["knoflook","3","teen"],["rode peper","1","stuk"],["gerookt paprikapoeder","0.5","tl"],["peterselie","0.25","bosje"],["ciabatta","0.5","stuk"],["citroen","0.25","stuk"]],"steps":["Snijd de knoflook in dunne plakjes, de rode peper in ringen en hak de peterselie. Dep de gamba's droog en bestrooi ze met zout.","Verhit 4 eetlepels olijfolie in een kleine koekenpan op laag vuur. Bak de knoflook en de peper 2 tot 3 minuten zachtjes tot de knoflook net begint te kleuren.","Zet het vuur hoog, voeg de gamba's toe en bak ze 2 tot 3 minuten, halverwege keren, tot ze roze zijn. Strooi het paprikapoeder erover en knijp wat citroensap erbij.","Rooster het brood intussen 3 minuten in de broodrooster of onder de grill.","Serveer de gamba's direct in de pan met de peterselie erover en het brood ernaast om de knoflookolie op te deppen; die olie is minstens zo lekker als de gamba's zelf."]},{"id":204,"name":"Paella met kip en garnalen","type":"Vis","time":40,"emoji":"🥘","cuisine":"Spaans","ingredients":[["kipdijfilet","100","g"],["garnalen","100","g"],["paellarijst","80","g"],["kippenbouillon","250","ml"],["rode paprika","0.5","stuk"],["knoflook","1","teen"],["gerookt paprikapoeder","1","tl"],["doperwten","50","g"],["citroen","0.25","stuk"]],"steps":["Snijd de kip in stukken van 3 cm, de paprika in reepjes en de knoflook fijn. Verhit 2 eetlepels olijfolie in een grote koekenpan op middelhoog vuur en bak de kip 5 minuten bruin.","Voeg de paprika en de knoflook toe en bak 3 minuten mee. Roer het paprikapoeder en de rijst erdoor en bak 1 minuut tot de korrels glanzen.","Giet de bouillon erbij, breng aan de kook en zet het vuur laag. Laat 18 tot 20 minuten zachtjes koken zonder te roeren tot de rijst het vocht heeft opgenomen. Voeg een scheutje water toe als de rijst te droog wordt.","Druk de garnalen en de doperwten de laatste 5 minuten in de rijst en leg een deksel op de pan.","Zet het vuur het laatste halve minuutje hoog voor een knapperig korstje op de bodem. Serveer met een partje citroen; het rokerige paprikapoeder en het frisse sap tillen de hele pan op."]},{"id":205,"name":"Inktvisringen met aioli en salade","type":"Vis","time":25,"emoji":"🦑","cuisine":"Spaans","ingredients":[["inktvisringen","150","g"],["paprikapoeder","1","tl"],["mayonaise","3","el"],["knoflook","1","teen"],["citroen","0.5","stuk"],["gemengde sla","50","g"],["cherrytomaten","75","g"],["komkommer","0.25","stuk"]],"steps":["Pers de knoflook en roer hem door de mayonaise met 1 theelepel citroensap en een snuf zout.","Halveer de tomaten en snijd de komkommer in halve maantjes. Meng ze met de sla, 1 eetlepel olijfolie, wat citroensap, zout en peper.","Dep de inktvisringen goed droog. Meng 4 eetlepels bloem met het paprikapoeder, zout en peper en haal de ringen erdoor.","Verhit een laag olie van 2 cm in een pan op middelhoog tot hoog vuur. Bak de ringen in twee porties 2 tot 3 minuten goudbruin en knapperig. Laat uitlekken op keukenpapier en bestrooi met zout.","Serveer de ringen met de aioli, de salade en een partje citroen. De knoflookmayo en het frisse zuur maken de krokante inktvis helemaal af."]},{"id":206,"name":"Sardientjes op toast met tomaat en knoflook","type":"Vis","time":15,"emoji":"🐟","cuisine":"Mediterraan","ingredients":[["sardientjes in olijfolie","120","g"],["zuurdesembrood","2","sneden"],["tomaat","1","stuk"],["knoflook","1","teen"],["citroen","0.25","stuk"],["peterselie","0.25","bosje"],["rode ui","0.25","stuk"],["chilivlokken","0.5","tl"]],"steps":["Rooster het brood goudbruin in de broodrooster of 2 minuten per kant in een droge grillpan op hoog vuur.","Halveer de knoflookteen en wrijf de snijkant stevig over het warme brood. Halveer de tomaat en wrijf het vruchtvlees erover tot het brood rood kleurt. Besprenkel met 1 eetlepel olijfolie en zout.","Snijd de rode ui heel fijn en hak de peterselie.","Laat de sardientjes uitlekken en leg ze op het brood. Verdeel de ui, de peterselie en de chilivlokken erover en knijp wat citroensap erbij.","Serveer direct, eventueel met wat sla erbij. De zoete tomaat, de scherpe knoflook en het zuur van de citroen houden de volle, zoute sardientjes in balans."],"course":"voor"},{"id":207,"name":"Makreel op toast met gebakken wortel en sojasaus","type":"Vis","time":20,"emoji":"🐟","cuisine":"Europees","ingredients":[["gerookte makreelfilet","100","g"],["zuurdesembrood","2","sneden"],["wortel","2","stuk"],["sojasaus","1","el"],["honing","1","tl"],["sesamzaad","1","tl"],["lente-ui","1","stuk"],["limoen","0.25","stuk"],["crème fraîche","2","el"]],"steps":["Snijd de wortels in dunne, schuine plakjes. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de wortel 8 tot 10 minuten tot hij zacht is met bruine randjes.","Voeg de sojasaus, de honing en 1 eetlepel water toe en laat 1 minuut inkoken tot de wortel glanst.","Verwijder het vel van de makreel en trek het vlees in grove stukken. Snijd de lente-ui in dunne ringen. Rooster het brood goudbruin.","Roer de crème fraîche los met het sap van de limoen en een snuf zout en smeer het op de toast.","Verdeel de wortel en de makreel over het brood en strooi de lente-ui en het sesamzaad erover. De zoete, hartige wortel en de frisse room passen verrassend goed bij de rokerige makreel."],"course":"voor"},{"id":208,"name":"Kabeljauw met bocconcini, sperziebonen en tomaat","type":"Vis","time":25,"emoji":"🧀","cuisine":"Mediterraan","ingredients":[["kabeljauwfilet","150","g"],["bocconcini","60","g"],["sperziebonen","150","g"],["cherrytomaten","125","g"],["knoflook","1","teen"],["basilicum","0.25","bosje"],["ciabatta","0.5","stuk"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 200°C. Maak de sperziebonen schoon en kook ze 4 minuten in water met zout. Giet af.","Halveer de tomaten en meng ze in een ovenschaal met de bonen, de fijngesneden knoflook, 1 eetlepel olijfolie, zout en peper.","Bestrooi de kabeljauw met zout en peper en leg hem op de groenten. Rasp de schil van de citroen erover en bak 12 tot 14 minuten in de oven tot de vis net gaar is.","Verdeel de bocconcini de laatste 3 minuten over de schaal, zodat ze net zacht worden. Snijd het brood en rooster het kort mee op het rooster.","Scheur de basilicum erover en serveer met het brood om het sap op te deppen. De smeltende mozzarella en de zoete tomaatjes maken de magere vis lekker sappig."]},{"id":209,"name":"Witte bonen met gestoofde rode ui, tonijn en krokant brood","type":"Vis","time":25,"emoji":"🫘","cuisine":"Mediterraan","ingredients":[["witte bonen","200","g"],["tonijn in olijfolie","80","g"],["rode ui","1","stuk"],["knoflook","1","teen"],["ciabatta","0.5","stuk"],["cherrytomaten","100","g"],["peterselie","0.25","bosje"],["citroen","0.5","stuk"]],"steps":["Snijd de rode ui in dunne halve ringen. Verhit 2 eetlepels olijfolie in een hapjespan op middellaag vuur en stoof de ui 10 minuten tot hij zacht en zoet is. Voeg de laatste minuut de fijngesneden knoflook toe.","Spoel de bonen af en halveer de tomaten. Voeg ze toe aan de ui met 3 eetlepels water en laat 5 minuten warm worden. Breng op smaak met zout en peper.","Scheur de ciabatta in grove stukken, meng met 1 eetlepel olijfolie en bak ze 4 minuten in een droge koekenpan op middelhoog vuur tot ze goudbruin en knapperig zijn.","Laat de tonijn uitlekken en schep hem in grove stukken door de bonen. Laat 1 minuut doorwarmen, roer het sap van de citroen en de gehakte peterselie erdoor.","Verdeel over diepe borden en leg het brood erop. De zoete ui en de volle tonijn maken van simpele bonen een echte maaltijd."]},{"id":210,"name":"Mosselen in gele curry met rijst","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/Ddwh1MVvL4a/","basePersons":4,"ingredients":[["gele currypasta",null,""],["olijfolie",null,""],["ui",null,""],["paprika",null,""],["gember",null,""],["citroen",null,""],["verse chilipeper",null,""],["kokosmelk",null,""],["mosselen","1000","g"],["rijst",null,""]],"steps":["Bak gele currypasta kort in een wok met olijfolie.","Voeg gesnipperde ui, blokjes paprika, gember, citroensap en chilipeper zonder zaadjes toe.","Schenk kokosmelk erbij en verwarm circa 8 minuten.","Voeg de schoongemaakte mosselen toe. Roer af en toe tot ze open zijn.","Serveer met rijst en schenk de saus erover."],"timeNote":"","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-210.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/Ddwh1MVvL4a/","screenshotReviewed":true,"screenshotTimeSeconds":53.53,"photoCaption":"Naturally."},{"id":211,"name":"Kip piccata met citroen en kappertjes","type":"Vlees","time":25,"emoji":"🍋","cuisine":"Italiaans","ingredients":[["kipfilet","150","g"],["citroen","0.5","stuk"],["kappertjes","1","el"],["kippenbouillon","100","ml"],["knoflook","1","teen"],["peterselie","0.25","bosje"],["linguine","80","g"],["rucola","30","g"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de linguine volgens de verpakking beetgaar.","Snijd de kipfilet horizontaal doormidden tot twee dunne lappen en sla ze tussen plastic plat tot 1 cm. Bestrooi met zout en peper en haal ze door 2 eetlepels bloem.","Verhit 1 eetlepel olie en 1 eetlepel boter in een koekenpan op middelhoog tot hoog vuur en bak de kip 3 minuten per kant goudbruin. Schep uit de pan.","Bak de fijngesneden knoflook 30 seconden in dezelfde pan. Giet de bouillon en het sap van de citroen erbij, voeg de kappertjes toe en laat 2 tot 3 minuten inkoken. Roer 1 eetlepel koude boter erdoor tot de saus glanst en leg de kip 1 minuut terug.","Serveer de kip met de saus op de pasta, met de gehakte peterselie en de rucola erover. De zure citroen en de zoute kappertjes maken de boterige saus licht en fris."]},{"id":212,"name":"Kip in mosterdsaus met aardappelpuree","type":"Vlees","time":30,"emoji":"🍗","cuisine":"Frans","ingredients":[["kipdijfilet","150","g"],["aardappelen","250","g"],["kookroom","100","ml"],["grove mosterd","1","el"],["dijonmosterd","1","tl"],["sjalot","1","stuk"],["melk","50","ml"],["sperziebonen","100","g"],["tijm","2","takje"]],"steps":["Schil de aardappelen, snijd ze in stukken en kook ze 15 tot 18 minuten in water met zout. Giet af en stamp ze met de warme melk, een klontje boter, zout en peper tot een gladde puree.","Bestrooi de kip met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de kip 5 tot 6 minuten per kant goudbruin en gaar. Schep uit de pan en houd warm onder folie.","Snipper de sjalot en bak hem 2 minuten in het bakvet. Voeg de tijmblaadjes, de room en beide mosterds toe en laat 3 minuten zachtjes pruttelen tot de saus iets dikker wordt. Leg de kip terug in de saus.","Kook de sperziebonen intussen 5 minuten in water met zout en giet af.","Serveer de kip met de mosterdsaus op de puree, met de bonen ernaast. De pittige mosterd en de zachte room maken de puree heerlijk smeuïg."]},{"id":213,"name":"Zalmburger met limoenmayo en koolsalade","type":"Vis","time":25,"emoji":"🍔","cuisine":"Europees","ingredients":[["zalmfilet","150","g"],["hamburgerbroodje","1","stuk"],["limoen","0.5","stuk"],["mayonaise","2","el"],["witte kool","100","g"],["wortel","0.5","stuk"],["lente-ui","1","stuk"],["paneermeel","2","el"],["koriander","0.25","bosje"]],"steps":["Haal de huid van de zalm en hak het vlees met een groot mes fijn. Meng met het paneermeel, de fijngesneden lente-ui, de helft van de gehakte koriander, de rasp van de limoen, zout en peper. Vorm een dikke burger en zet hem 10 minuten in de koelkast.","Snijd de kool heel fijn en rasp de wortel. Meng ze met 1 eetlepel mayonaise, 1 theelepel limoensap en een snuf zout.","Roer de rest van de mayonaise met de rest van het limoensap en de koriander tot de limoenmayo.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de burger 4 minuten per kant tot hij goudbruin en net gaar is.","Snijd het broodje open en rooster het 2 minuten. Besmeer met limoenmayo, leg de burger erop en de koolsalade erbovenop. De frisse limoen en de knapperige kool maken de vette zalm lekker licht."]},{"id":214,"name":"Kipschnitzel met citroen en aardappelsalade","type":"Vlees","time":30,"emoji":"🍋","cuisine":"Europees","ingredients":[["kipfilet","150","g"],["paneermeel","50","g"],["ei","1","stuk"],["krieltjes","250","g"],["augurk","1","stuk"],["rode ui","0.25","stuk"],["mayonaise","2","el"],["citroen","0.5","stuk"],["bieslook","0.25","bosje"]],"steps":["Kook de krieltjes 15 minuten in water met zout, giet af en halveer ze.","Snijd de kipfilet horizontaal doormidden en sla de lappen tussen plastic plat tot 1 cm dik. Bestrooi met zout en peper. Haal ze door 2 eetlepels bloem, dan door het losgeklopte ei en druk ze in het paneermeel.","Snipper de augurk en de rode ui fijn en knip de bieslook. Meng met de mayonaise en 1 theelepel citroensap en schep door de lauwwarme krieltjes.","Verhit 4 eetlepels olie in een grote koekenpan op middelhoog vuur en bak de schnitzels 3 tot 4 minuten per kant goudbruin en krokant. Laat uitlekken op keukenpapier.","Serveer de schnitzel met de aardappelsalade en een flink partje citroen om eroverheen te knijpen; het zuur maakt de krokante korst extra lekker."]},{"id":215,"name":"Jerk chicken van kippendijen met rijst en bonen","type":"Vlees","time":35,"emoji":"🌶️","cuisine":"Caribisch","ingredients":[["kipdijfilet","150","g"],["jerk-kruiden","1","el"],["rijst","80","g"],["kidneybonen","100","g"],["kokosmelk","100","ml"],["lente-ui","1","stuk"],["limoen","0.5","stuk"],["knoflook","1","teen"],["tijm","2","takje"]],"steps":["Meng de jerk-kruiden met 1 eetlepel olie, de geperste knoflook, de tijmblaadjes, het sap van de limoen en een snuf zout. Wrijf de kip ermee in en laat 10 minuten staan. Verwarm de oven voor op 200°C.","Spoel de rijst af en doe hem in een pan met de kokosmelk, 100 ml water en een snuf zout. Breng aan de kook, zet het vuur laag en laat 12 minuten met de deksel op de pan koken. Schep de afgespoelde bonen er de laatste 5 minuten door.","Verhit 1 eetlepel olie in een ovenbestendige koekenpan op middelhoog tot hoog vuur en bak de kip 3 minuten per kant bruin. Zet de pan 12 tot 15 minuten in de oven tot de kip gaar en donker geglaceerd is.","Snijd de lente-ui in ringen en roer hem door de rijst.","Snijd de kip in plakken en serveer op de rijst met bonen en een partje limoen. De romige kokosrijst vangt de pit van de jerk-kruiden mooi op."]},{"id":216,"name":"Peri-peri kip met maïskolf en salade","type":"Vlees","time":35,"emoji":"🌶️","cuisine":"Portugees","ingredients":[["kipdijfilet","150","g"],["maïskolf","1","stuk"],["rode peper","1","stuk"],["knoflook","1","teen"],["gerookt paprikapoeder","1","tl"],["citroen","0.5","stuk"],["gemengde sla","50","g"],["tomaat","1","stuk"],["rode ui","0.25","stuk"]],"steps":["Hak de rode peper fijn en pers de knoflook. Meng ze met het paprikapoeder, het sap van de citroen, 1 eetlepel olie, zout en peper. Wrijf de kip in met de marinade en laat 10 minuten staan. Verwarm de oven voor op 200°C.","Leg de kip op een bakplaat met bakpapier en rooster 20 tot 25 minuten tot de randen donker en de kip gaar is.","Kook de maïskolf 8 minuten in water. Verhit 1 eetlepel boter in een grillpan op hoog vuur en gril de kolf 3 minuten tot hij bruine strepen heeft, af en toe draaien.","Snijd de tomaat in parten en de rode ui in dunne ringen. Meng ze met de sla, 1 eetlepel olijfolie, een scheutje citroensap, zout en peper.","Serveer de kip met de maïskolf en de salade. Het zoet van de maïs en de frisse salade zijn een fijne tegenhanger van de pittige, rokerige kip."]},{"id":217,"name":"Kip met appelmoes, gebakken aardappelen en mayo","type":"Vlees","time":30,"emoji":"🍎","cuisine":"Nederlands","ingredients":[["kipfilet","150","g"],["aardappelen","250","g"],["appelmoes","100","g"],["mayonaise","2","el"],["paprikapoeder","1","tl"],["sperziebonen","100","g"],["ui","0.5","stuk"]],"steps":["Schil de aardappelen, snijd ze in blokjes van 2 cm en kook ze 6 minuten voor in water met zout. Giet af en laat 2 minuten uitstomen.","Verhit 2 eetlepels olie in een grote koekenpan op middelhoog vuur en bak de aardappelen 15 minuten goudbruin, af en toe omscheppen. Voeg halverwege de ui in halve ringen toe. Bestrooi met zout.","Wrijf de kipfilet in met het paprikapoeder, zout en peper. Verhit 1 eetlepel boter in een tweede pan op middelhoog vuur en bak de kip 6 tot 7 minuten per kant goudbruin en gaar. Laat 2 minuten rusten en snijd in plakken.","Kook de sperziebonen 5 minuten in water met zout en giet af.","Serveer de kip met de gebakken aardappelen, de bonen, een lepel appelmoes en een klodder mayo. Zoet, zout en romig naast elkaar: precies zoals het thuis vroeger smaakte."]},{"id":218,"name":"Geglaceerde kip met ovengroente en uiendip","type":"Vlees","time":35,"emoji":"🍗","cuisine":"Amerikaans","ingredients":[["kipdijfilet","150","g"],["honing","1","el"],["sojasaus","1","el"],["ketchup","1","el"],["zoete aardappel","1","stuk"],["rode paprika","0.5","stuk"],["courgette","0.5","stuk"],["zure room","3","el"],["lente-ui","1","stuk"]],"steps":["Verwarm de oven voor op 200°C. Snijd de zoete aardappel, de paprika en de courgette in stukken van 3 cm. Meng met 1 eetlepel olie, zout en peper en rooster 25 minuten op een bakplaat, halverwege omscheppen.","Roer de honing, de sojasaus, de ketchup en 1 theelepel azijn tot een glaze.","Bestrooi de kip met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak de kip 5 minuten per kant goudbruin. Giet de glaze erbij en keer de kip 2 minuten door de saus tot hij glanzend en plakkerig is.","Snijd de lente-ui heel fijn en roer hem door de zure room met zout, peper en een scheutje citroensap.","Serveer de kip in plakken op de ovengroente met een lepel uiend
