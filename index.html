.","Haal de biefstuk 10 minuten van tevoren uit de koelkast en dep hem droog. Snipper de sjalot fijn en druk de peperkorrels licht plat met de bolle kant van een lepel.","Verhit 1 eetlepel olie met een klontje boter in een koekenpan op hoog vuur. Bak de biefstuk 2 tot 3 minuten per kant voor rosé, bestrooi met zout en laat hem onder folie 5 minuten rusten.","Zet het vuur lager en bak de sjalot 2 minuten in hetzelfde vet. Voeg de peperkorrels, 50 ml water en het verkruimelde bouillonblokje toe en laat 1 minuut inkoken. Roer de room erdoor en laat 2 tot 3 minuten zachtjes pruttelen tot de saus iets dikker is.","Snijd de biefstuk in plakken en leg ze op het bord met de friet en wat sla. Schenk de pepersaus erover: de pittige, romige saus en de krokante friet maken van een simpele biefstuk een echte bistroklassieker."]},{"id":223,"name":"Biefstuk met kaassaus en bulgursalade","type":"Vlees","time":20,"emoji":"🥩","cuisine":"Europees","ingredients":[["biefstuk","1","stuk"],["bulgur","70","g"],["cherrytomaten","100","g"],["komkommer","0.25","stuk"],["peterselie","0.25","bosje"],["geraspte belegen kaas","30","g"],["crème fraîche","3","el"],["citroen","0.25","stuk"]],"steps":["Kook de bulgur volgens de verpakking in licht gezouten water (meestal 8 tot 10 minuten) en laat hem uitlekken.","Halveer intussen de cherrytomaten, snijd de komkommer in blokjes en hak de peterselie grof. Meng ze met de bulgur, het sap van de citroen, 1 eetlepel olijfolie, zout en peper.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Dep de biefstuk droog en bak hem 2 tot 3 minuten per kant. Bestrooi met zout en peper en laat hem 5 minuten rusten onder folie.","Verwarm in een steelpan op laag vuur de crème fraîche met 2 eetlepels water. Roer de kaas erdoor en blijf roeren tot een gladde saus; breng op smaak met peper.","Snijd de biefstuk in plakken en leg ze naast de bulgursalade. Lepel de kaassaus erover: de frisse salade houdt de romige kaas en het sappige vlees mooi in balans."]},{"id":224,"name":"Sliptong in boter met citroen en krieltjes","type":"Vis","time":25,"emoji":"🍋","cuisine":"Nederlands","ingredients":[["sliptong","2","stuk"],["krieltjes","250","g"],["sperziebonen","125","g"],["citroen","0.5","stuk"],["peterselie","0.25","bosje"],["bloem","2","el"],["kappertjes","1","el"]],"steps":["Halveer de krieltjes en kook ze in 12 tot 15 minuten gaar in water met zout. Kook de sperziebonen de laatste 5 minuten mee. Giet af.","Dep de sliptongen droog, bestrooi ze met zout en peper en haal ze door de bloem. Klop het overtollige meel eraf.","Verhit 25 gram boter met 1 eetlepel olie in een grote koekenpan op middelhoog vuur. Bak de tongen 3 minuten per kant tot ze goudbruin zijn en het vlees makkelijk van de graat loskomt. Leg ze op de borden.","Voeg nog 15 gram boter toe aan de pan en laat die lichtbruin kleuren. Roer de kappertjes, het sap van de citroen en de gehakte peterselie erdoor en haal de pan van het vuur.","Giet de citroenboter over de vis en serveer met de krieltjes en bonen. Sliptong is een Hollandse klassieker: klein, snel gaar en met een fijne, zoete smaak die alleen boter en citroen nodig heeft."]},{"id":225,"name":"Beef stroganoff met tagliatelle","type":"Vlees","time":30,"emoji":"🍄","cuisine":"Europees","ingredients":[["biefstukreepjes","125","g"],["tagliatelle","100","g"],["champignons","125","g"],["ui","0.5","stuk"],["augurken","2","stuk"],["paprikapoeder","1","tl"],["tomatenpuree","1","el"],["crème fraîche","3","el"],["peterselie","0.25","bosje"]],"steps":["Snijd de champignons in plakjes, snipper de ui en snijd de augurken in dunne reepjes. Hak de peterselie fijn.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Bak de biefstukreepjes 1 tot 2 minuten snel bruin, bestrooi met zout en peper en haal ze uit de pan.","Breng een ruime pan water met zout aan de kook en kook de tagliatelle volgens de verpakking beetgaar (meestal 7 tot 9 minuten).","Smelt intussen een klontje boter in dezelfde koekenpan op middelhoog vuur. Bak de ui en champignons 6 tot 8 minuten tot het vocht verdampt is en ze bruin worden. Roer het paprikapoeder en de tomatenpuree erdoor en bak 1 minuut mee.","Voeg 100 ml water, de augurk en de crème fraîche toe en laat 3 minuten zachtjes pruttelen. Doe het vlees met het vrijgekomen vocht terug en warm 1 minuut door zonder te koken.","Serveer de stroganoff op de tagliatelle met de peterselie erover. De zure augurk en het zoete paprikapoeder maken de romige saus licht en vol tegelijk."]},{"id":226,"name":"Lomo saltado met friet en rijst","type":"Vlees","time":25,"emoji":"🥩","cuisine":"Zuid-Amerikaans","ingredients":[["biefstukreepjes","125","g"],["diepvriesfriet","100","g"],["rijst","60","g"],["rode ui","0.5","stuk"],["tomaat","1","stuk"],["knoflook","1","teen"],["sojasaus","1.5","el"],["rode wijnazijn","1","el"],["koriander","0.25","bosje"]],"steps":["Verwarm de oven voor op 220°C en bak de friet 18 tot 20 minuten op een bakplaat. Kook de rijst volgens de verpakking.","Snijd de rode ui in dikke parten, de tomaat in partjes en de knoflook fijn. Hak de koriander grof. Roer de sojasaus en azijn met 2 eetlepels water tot een saus.","Verhit 1 eetlepel olie in een wok of grote koekenpan op zeer hoog vuur. Bak de biefstukreepjes 1 tot 2 minuten tot ze net bruin zijn, bestrooi met zout en peper en schep ze op een bord.","Bak in dezelfde pan de ui en knoflook 2 minuten op hoog vuur. Voeg de tomaat toe en bak 1 minuut, dan het vlees en de saus en laat 1 minuut sudderen.","Schep de friet door de pan en serveer meteen met de rijst en de koriander. De friet zuigt de hartige sojasaus op: zo eten ze het in Lima ook."]},{"id":227,"name":"Gehaktballen met rodewijnjus en aardappel-selderijpuree","type":"Vlees","time":40,"emoji":"🍖","cuisine":"Nederlands","ingredients":[["half-om-half gehakt","150","g"],["aardappels","200","g"],["knolselderij","100","g"],["ui","0.5","stuk"],["paneermeel","2","el"],["ei","0.5","stuk"],["rode wijn","75","ml"],["runderbouillonblokje","0.5","stuk"],["tijm","2","takje"]],"steps":["Schil de aardappels en de knolselderij en snijd ze in gelijke stukken. Kook ze 20 minuten in water met zout tot ze zacht zijn.","Snipper intussen de ui. Kneed het gehakt met de helft van de ui, het paneermeel, het ei, zout en peper en vorm er 2 ballen van.","Verhit 1 eetlepel olie met een klontje boter in een koekenpan op middelhoog vuur. Bak de ballen in 6 tot 8 minuten rondom bruin en haal ze uit de pan.","Bak de rest van de ui 3 minuten in hetzelfde vet, roer 1 theelepel bloem erdoor en blus af met de rode wijn. Voeg 150 ml water, het bouillonblokje en de tijm toe. Leg de ballen terug en laat 15 minuten zachtjes pruttelen met de deksel schuin op de pan.","Giet de aardappels en knolselderij af, stamp ze fijn met een klontje boter en een scheut melk en breng op smaak met zout en peper.","Serveer de ballen op de puree en schenk de jus erover. De zoete rode wijn en de nootachtige knolselderij maken deze Hollandse klassieker net iets feestelijker."]},{"id":228,"name":"Viskoekjes van schelvis met dille en aardappel-komkommersalade","type":"Vis","time":30,"emoji":"🥒","cuisine":"Europees","ingredients":[["schelvisfilet","125","g"],["krieltjes","200","g"],["komkommer","0.5","stuk"],["dille","0.5","bosje"],["ei","0.5","stuk"],["paneermeel","3","el"],["yoghurt","3","el"],["citroen","0.25","stuk"]],"steps":["Kook de krieltjes in 15 minuten gaar in water met zout. Giet af en laat afkoelen.","Hak intussen de schelvis met een mes heel fijn en meng met het ei, 2 eetlepels paneermeel, de helft van de dille, de geraspte schil van de citroen, zout en peper. Vorm er 2 platte koekjes van en bestrooi ze met het overige paneermeel.","Snijd de komkommer in dunne plakjes en de krieltjes in halve plakjes. Meng ze met de yoghurt, de rest van de dille, het citroensap, zout en peper.","Verhit 2 eetlepels olie in een koekenpan op middelhoog vuur en bak de viskoekjes 4 minuten per kant tot ze goudbruin en gaar zijn.","Serveer de viskoekjes op de salade met een partje citroen. Schelvis heeft stevige witte vlokken en blijft in het koekje lekker sappig."]},{"id":229,"name":"Varkenshaas met champignonroomsaus","type":"Vlees","time":30,"emoji":"🍄","cuisine":"Europees","ingredients":[["varkenshaas","150","g"],["champignons","150","g"],["sjalot","1","stuk"],["knoflook","1","teen"],["kookroom","100","ml"],["mosterd","1","tl"],["krieltjes","200","g"],["sperziebonen","100","g"]],"steps":["Halveer de krieltjes en kook ze 15 minuten in water met zout. Kook de sperziebonen de laatste 6 minuten mee en giet alles af.","Snijd intussen de champignons in plakjes, snipper de sjalot en snijd de knoflook fijn. Dep de varkenshaas droog en bestrooi met zout en peper.","Verhit 1 eetlepel olie met een klontje boter in een koekenpan op middelhoog vuur. Bak de varkenshaas in 10 tot 12 minuten rondom bruin en net gaar, draai hem regelmatig. Haal het vlees uit de pan en laat het onder folie 5 minuten rusten.","Bak in dezelfde pan de champignons 5 minuten op hoog vuur tot ze bruin zijn. Voeg de sjalot en knoflook toe en bak 2 minuten mee. Roer de room en mosterd erdoor en laat 3 minuten zachtjes inkoken.","Snijd de varkenshaas in plakken en serveer met de krieltjes en bonen. Schep de champignonsaus eroverheen, de romige saus met een vleugje mosterd maakt het malse vlees helemaal af."]},{"id":230,"name":"Varkenshaas met truffeltapenade en rucola","type":"Vlees","time":30,"emoji":"🍖","cuisine":"Italiaans","ingredients":[["varkenshaas","150","g"],["truffeltapenade","1.5","el"],["rucola","40","g"],["krieltjes","200","g"],["cherrytomaten","100","g"],["parmezaanse kaas","20","g"],["balsamicoazijn","1","tl"],["rozemarijn","1","takje"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes en meng ze op een bakplaat met 1 eetlepel olijfolie, de fijngehakte rozemarijn, zout en peper. Rooster 20 tot 25 minuten tot ze knapperig zijn.","Dep de varkenshaas droog en bestrooi met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak het vlees in 10 tot 12 minuten rondom bruin en net gaar.","Laat de varkenshaas 5 minuten rusten onder folie en snijd hem dan in plakken van 1 cm.","Halveer de cherrytomaten en meng ze met de rucola, de balsamicoazijn en 1 eetlepel olijfolie.","Leg de plakken vlees op het bord, schep een lepel truffeltapenade op elke plak en leg de rucolasalade en krieltjes ernaast. Schaaf de parmezaan erover: de aardse truffel en de peperige rucola geven het milde varkensvlees veel karakter."]},{"id":231,"name":"Speklapjes met ketjap en spitskool","type":"Vlees","time":30,"emoji":"🥬","cuisine":"Nederlands","ingredients":[["speklapjes","2","stuk"],["spitskool","0.25","stuk"],["ketjap manis","2","el"],["knoflook","1","teen"],["gember","1","cm"],["sambal","0.5","tl"],["aardappels","200","g"],["bosui","1","stuk"]],"steps":["Schil de aardappels, snijd ze in stukken en kook ze 20 minuten in water met zout. Giet af en stamp ze grof met een klontje boter en een scheut melk.","Snijd intussen de knoflook en gember fijn en roer ze met de ketjap en sambal tot een marinade. Snijd de spitskool in dunne reepjes en de bosui in ringetjes.","Verhit een koekenpan op middelhoog vuur zonder olie en bak de speklapjes 5 tot 6 minuten per kant tot ze goudbruin zijn. Schenk de laatste 2 minuten de marinade erbij en draai de lapjes om tot ze glanzend zijn.","Verhit 1 eetlepel olie in een tweede pan op hoog vuur. Roerbak de spitskool 5 tot 6 minuten met een snuf zout tot hij beetgaar is maar nog wat knapperig.","Serveer de speklapjes met de aardappelstamp en de spitskool, giet het sausje uit de pan erover en strooi de bosui erop. Zoet, pittig en een beetje Indisch: een Hollandse avondmaaltijd met een twist."]},{"id":232,"name":"Schnitzel met champignonsaus en friet","type":"Vlees","time":25,"emoji":"🍄","cuisine":"Europees","ingredients":[["varkensschnitzel","1","stuk"],["diepvriesfriet","150","g"],["champignons","125","g"],["ui","0.5","stuk"],["kookroom","75","ml"],["paneermeel","4","el"],["ei","0.5","stuk"],["peterselie","0.25","bosje"]],"steps":["Verwarm de oven voor op 220°C en bak de friet 18 tot 20 minuten op een bakplaat.","Snijd de champignons in plakjes en snipper de ui. Verhit 1 eetlepel olie in een steelpan op middelhoog vuur, bak de ui en champignons 6 tot 8 minuten bruin, roer 1 theelepel bloem erdoor en voeg de room en 50 ml water toe. Laat 3 minuten zachtjes pruttelen en breng op smaak met zout en peper.","Klop het ei los op een bord en doe het paneermeel op een tweede bord. Bestrooi de schnitzel met zout en peper, haal hem door 1 eetlepel bloem, dan door het ei en druk hem in het paneermeel.","Verhit 3 eetlepels olie in een koekenpan op middelhoog vuur en bak de schnitzel 3 tot 4 minuten per kant goudbruin en knapperig. Laat uitlekken op keukenpapier.","Serveer de schnitzel met de friet en de champignonsaus ernaast, bestrooid met gehakte peterselie. Romig, krokant en hartig: dit is eten zoals in een Oostenrijks berghut."]},{"id":233,"name":"Lamskoteletjes met rozemarijn en witte bonen","type":"Vlees","time":25,"emoji":"🌿","cuisine":"Mediterraan","ingredients":[["lamskoteletjes","2","stuk"],["witte bonen in blik","200","g"],["rozemarijn","2","takje"],["knoflook","2","teen"],["cherrytomaten","100","g"],["spinazie","75","g"],["citroen","0.25","stuk"]],"steps":["Hak de blaadjes van 1 takje rozemarijn fijn en snijd de knoflook in plakjes. Wrijf de koteletjes in met de helft van de rozemarijn, 1 eetlepel olijfolie, zout en peper en laat 10 minuten staan.","Spoel de bonen af en halveer de cherrytomaten.","Verhit 1 eetlepel olijfolie in een koekenpan op hoog vuur. Bak de lamskoteletjes 3 minuten per kant voor rosé, leg het tweede takje rozemarijn erbij in de pan. Haal het vlees eruit en laat het 5 minuten rusten onder folie.","Zet het vuur middelhoog en bak de knoflook 1 minuut in het lamsvet. Voeg de tomaten toe en bak 3 minuten, dan de bonen met 50 ml water en de rest van de rozemarijn. Laat 4 minuten pruttelen en roer de spinazie erdoor tot hij geslonken is.","Schep de bonen op het bord, leg de koteletjes erop en knijp wat citroensap erover. De kruidige lam, de romige bonen en het frisse citroensap smaken samen naar een zomer in Toscane."]},{"id":234,"name":"Lamsgehakt-tajine met pruimen en couscous","type":"Vlees","time":35,"emoji":"🥘","cuisine":"Marokkaans","ingredients":[["lamsgehakt","125","g"],["couscous","75","g"],["gedroogde pruimen","40","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["ras el hanout","1.5","tl"],["tomatenblokjes","200","g"],["wortel","1","stuk"],["amandelen","15","g"]],"steps":["Snipper de ui, snijd de knoflook fijn en de wortel in dunne halve plakjes. Halveer de pruimen.","Kneed het lamsgehakt met de helft van de ras el hanout, zout en peper en draai er kleine balletjes van ter grootte van een walnoot.","Verhit 1 eetlepel olie in een hapjespan op middelhoog vuur en bak de balletjes in 5 minuten rondom bruin. Haal ze uit de pan en bak de ui, knoflook en wortel 4 minuten in dezelfde pan.","Voeg de rest van de ras el hanout, de tomatenblokjes, de pruimen en 100 ml water toe. Leg de balletjes terug, doe de deksel op de pan en laat 15 minuten zachtjes stoven tot de saus dik is.","Overgiet intussen de couscous met 100 ml kokend water en een snuf zout, dek af en laat 5 minuten wellen. Roer los met een vork en een klontje boter. Rooster de amandelen 2 minuten in een droge pan.","Serveer de tajine op de couscous met de amandelen erover. De zoete pruimen en de warme specerijen bij het lam geven dit gerecht zijn typisch Marokkaanse smaak."]},{"id":235,"name":"Kefta in tomatensaus met ei","type":"Vlees","time":30,"emoji":"🍳","cuisine":"Marokkaans","ingredients":[["rundergehakt","125","g"],["ei","1","stuk"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["komijn","1","tl"],["paprikapoeder","1","tl"],["koriander","0.25","bosje"],["turks brood","0.25","stuk"]],"steps":["Snipper de ui en snijd de knoflook fijn. Hak de koriander grof.","Kneed het gehakt met de helft van de ui, de helft van de komijn, de helft van de koriander, zout en peper en vorm er kleine balletjes van.","Verhit 1 eetlepel olie in een koekenpan met deksel op middelhoog vuur. Bak de balletjes 5 minuten rondom bruin en haal ze uit de pan. Bak de rest van de ui en de knoflook 3 minuten, voeg het paprikapoeder en de rest van de komijn toe en bak 1 minuut mee.","Voeg de tomatenblokjes en 50 ml water toe, breng op smaak met zout en laat 8 minuten pruttelen. Leg de balletjes terug in de saus.","Maak een kuiltje in de saus, breek het ei erin en doe de deksel op de pan. Laat 5 tot 6 minuten zachtjes garen tot het eiwit gestold is en de dooier nog zacht.","Strooi de rest van de koriander erover en serveer meteen uit de pan met het brood om te dopen. Het zachte ei en de kruidige tomatensaus horen bij elkaar als in een Marokkaans straatcafé."]},{"id":236,"name":"Eendenborst met sinaasappel en zoete appeltjes","type":"Vlees","time":30,"emoji":"🍊","cuisine":"Frans","ingredients":[["eendenborstfilet","1","stuk"],["sinaasappel","1","stuk"],["appel","1","stuk"],["sjalot","1","stuk"],["honing","1","tl"],["kippenbouillonblokje","0.25","stuk"],["krieltjes","200","g"],["tijm","2","takje"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes, meng ze met 1 eetlepel olie, de tijm, zout en peper en rooster ze 20 tot 25 minuten op een bakplaat.","Snijd het vet van de eendenborst kruislings in, zonder in het vlees te snijden, en bestrooi met zout en peper. Leg hem met het vet naar beneden in een koude koekenpan en zet die op middelhoog vuur. Bak 6 tot 8 minuten tot het vet goudbruin en knapperig is, draai om en bak nog 3 tot 4 minuten.","Leg de eend 5 minuten te rusten onder folie. Schenk het eendenvet op 1 eetlepel na uit de pan.","Snijd de appel in partjes en de sjalot fijn. Bak de appel 3 minuten in het eendenvet tot hij licht bruin is, voeg de sjalot en honing toe en bak 1 minuut mee. Schenk het sap van de sinaasappel en 50 ml water met het bouillonblokje erbij en laat 3 minuten inkoken tot een glanzende saus.","Snijd de eend in dunne plakken en serveer met de appeltjes, de saus en de krieltjes. Het zoete van sinaasappel en appel snijdt mooi door het rijke eendenvlees heen, een Franse klassieker op een doordeweekse avond."]},{"id":237,"name":"Worstjes met zuurkool en mosterd","type":"Vlees","time":30,"emoji":"🌭","cuisine":"Europees","ingredients":[["braadworstjes","2","stuk"],["zuurkool","150","g"],["aardappels","200","g"],["ui","0.5","stuk"],["appel","0.5","stuk"],["grove mosterd","1","el"],["karwijzaad","0.5","tl"],["melk","50","ml"]],"steps":["Schil de aardappels, snijd ze in stukken en kook ze 20 minuten in water met zout.","Snipper intussen de ui en snijd de appel in blokjes. Verhit 1 eetlepel olie in een pan op middelhoog vuur, bak de ui 3 minuten en voeg de zuurkool, appel, karwijzaad en 50 ml water toe. Laat 15 minuten zachtjes stoven met de deksel op de pan.","Verhit een klontje boter in een koekenpan op middelhoog vuur en bak de worstjes 12 tot 15 minuten, regelmatig draaien, tot ze rondom bruin en gaar zijn.","Giet de aardappels af, stamp ze met de warme melk, een klontje boter en de helft van de mosterd tot een smeuïge puree. Breng op smaak met zout en peper.","Serveer de worstjes op de puree met de zuurkool ernaast en de rest van de mosterd erbij. Zuur, zout en een beetje zoet van de appel: hier wordt een koude avond warm van."]},{"id":238,"name":"Worstjes-traybake met pompoen en rode ui","type":"Vlees","time":40,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["braadworstjes","2","stuk"],["flespompoen","250","g"],["rode ui","1","stuk"],["krieltjes","150","g"],["knoflook","2","teen"],["rozemarijn","1","takje"],["honing","1","tl"],["grove mosterd","1","tl"]],"steps":["Verwarm de oven voor op 200°C. Snijd de pompoen (schil mag eraan blijven bij flespompoen) in blokken van 3 cm, de rode ui in parten en halveer de krieltjes. Plet de knoflooktenen met de platte kant van een mes.","Meng de pompoen, ui, krieltjes en knoflook op een bakplaat met 1,5 eetlepel olijfolie, de rozemarijnnaaldjes, zout en peper. Rooster 15 minuten.","Leg de worstjes tussen de groente en rooster nog 20 minuten tot de worstjes bruin zijn en de pompoen zacht. Schep halverwege om.","Roer de honing en mosterd met 1 theelepel water tot een glazuur en kwast dit de laatste 5 minuten over de worstjes.","Serveer direct van de bakplaat. De zoete, zachte pompoen en de ui zuigen het vet van de worstjes op en dat maakt deze herfstmaaltijd zo troostrijk."]},{"id":239,"name":"Frittata met aardappel, paprika en broccoli","type":"Vegetarisch","time":30,"emoji":"🍳","cuisine":"Italiaans","ingredients":[["eieren","3","stuk"],["krieltjes","150","g"],["rode paprika","0.5","stuk"],["broccoli","125","g"],["ui","0.5","stuk"],["geraspte belegen kaas","30","g"],["peterselie","0.25","bosje"]],"steps":["Snijd de krieltjes in plakjes van 0,5 cm en de broccoli in kleine roosjes. Kook ze samen 6 minuten in water met zout en giet af.","Snijd intussen de paprika in reepjes en snipper de ui. Klop de eieren los met de kaas, de gehakte peterselie, zout en peper.","Verwarm de ovengrill voor. Verhit 1,5 eetlepel olijfolie in een kleine ovenbestendige koekenpan op middelhoog vuur en bak de ui en paprika 4 minuten. Voeg de krieltjes en broccoli toe en bak 3 minuten tot de aardappel licht kleurt.","Giet het eimengsel over de groente, zet het vuur laag en laat 8 tot 10 minuten garen tot de onderkant stevig is en alleen de bovenkant nog vochtig.","Zet de pan 2 tot 3 minuten onder de grill tot de frittata goudbruin en gaar is. Laat even staan, snijd in punten en serveer lauwwarm met een groene salade. Lekker met een lepel pesto erbij."]},{"id":240,"name":"Omelet met geitenkaas, spinazie en tomaat","type":"Vegetarisch","time":15,"emoji":"🍳","cuisine":"Frans","ingredients":[["eieren","3","stuk"],["zachte geitenkaas","40","g"],["spinazie","75","g"],["cherrytomaten","75","g"],["bieslook","0.25","bosje"],["desembrood","2","sneden"]],"steps":["Halveer de cherrytomaten en knip de bieslook fijn. Klop de eieren los met 1 eetlepel water, zout en peper.","Verhit 1 theelepel olie in een koekenpan op middelhoog vuur. Bak de tomaten 2 minuten, voeg de spinazie toe en laat 1 minuut slinken. Schep op een bord.","Smelt een klontje boter in dezelfde pan op middelhoog vuur. Giet het ei erin en trek met een spatel de gestolde randen naar het midden, 2 minuten, tot de omelet bijna gestold is maar nog glanst.","Verdeel de spinazie, tomaten en de verkruimelde geitenkaas over de ene helft, zet het vuur laag en laat 1 minuut staan. Vouw de omelet dicht en laat hem op het bord glijden.","Rooster het brood en serveer de omelet met de bieslook erover. De romige geitenkaas smelt net genoeg tegen de warme tomaat en spinazie: een snel Frans ontbijt-voor-avondeten."]},{"id":241,"name":"Gevulde paprika's met rijst en feta","type":"Vegetarisch","time":40,"emoji":"🫑","cuisine":"Mediterraan","ingredients":[["rode paprika","2","stuk"],["rijst","60","g"],["feta","50","g"],["tomatenblokjes","150","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["pijnboompitten","15","g"],["oregano","1","tl"],["peterselie","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C. Kook de rijst volgens de verpakking (meestal 10 tot 12 minuten) en giet af.","Snijd de kapjes van de paprika's en haal de zaadlijsten eruit. Snipper de ui en snijd de knoflook fijn. Hak de peterselie grof.","Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur. Bak de ui 3 minuten, voeg de knoflook en oregano toe en bak 1 minuut mee. Roer de helft van de tomatenblokjes, de rijst, de pijnboompitten, de peterselie en de verkruimelde feta erdoor en breng op smaak met zout en peper.","Giet de rest van de tomatenblokjes in een ovenschaal, zet de paprika's erin en vul ze met het rijstmengsel. Leg de kapjes erop en besprenkel met 1 eetlepel olijfolie.","Bak de paprika's 25 minuten in de oven tot ze zacht zijn en de randen beginnen te kleuren. Serveer met de tomatensaus uit de schaal: de zoete, zachte paprika en de zoute feta zijn een klassieke combinatie uit de Griekse keuken."]},{"id":242,"name":"Moussaka-stijl ovenschotel met linzen","type":"Vegetarisch","time":40,"emoji":"🍆","cuisine":"Grieks","ingredients":[["aubergine","1","stuk"],["linzen in blik","150","g"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["kaneel","0.25","tl"],["griekse yoghurt","100","g"],["ei","0.5","stuk"],["geraspte belegen kaas","30","g"]],"steps":["Verwarm de oven voor op 200°C. Snijd de aubergine in de lengte in plakken van 0,5 cm, bestrijk ze met 1 eetlepel olijfolie en zout en rooster ze 12 minuten op een bakplaat tot ze zacht zijn.","Snipper intussen de ui en snijd de knoflook fijn. Verhit 1 eetlepel olijfolie in een pan op middelhoog vuur, bak de ui 4 minuten, voeg de knoflook en kaneel toe en bak 1 minuut mee.","Spoel de linzen af en voeg ze met de tomatenblokjes toe. Laat 8 minuten pruttelen tot de saus dik is en breng op smaak met zout en peper.","Klop de yoghurt los met het ei, de helft van de kaas, een snuf zout en peper.","Leg de helft van de aubergine in een kleine ovenschaal, schep de linzensaus erop en dek af met de rest van de aubergine. Verdeel het yoghurtmengsel erover en strooi de rest van de kaas erop.","Bak 15 minuten in de oven tot de bovenkant goudbruin is. Laat 5 minuten staan en serveer: de kaneel in de linzen en de frisse yoghurtlaag geven precies dat Griekse moussaka-gevoel, zonder gehakt."]},{"id":243,"name":"Groentelasagne uit één pan","type":"Vegetarisch","time":35,"emoji":"🥘","cuisine":"Italiaans","ingredients":[["lasagnebladen","4","stuk"],["courgette","0.5","stuk"],["champignons","100","g"],["spinazie","75","g"],["tomatenblokjes","200","g"],["knoflook","1","teen"],["ricotta","75","g"],["geraspte mozzarella","40","g"],["basilicum","0.25","bosje"]],"steps":["Snijd de courgette in blokjes, de champignons in plakjes en de knoflook fijn. Breek de lasagnebladen in grove stukken.","Verhit 1 eetlepel olijfolie in een grote hapjespan met deksel op middelhoog vuur. Bak de champignons en courgette 5 tot 6 minuten tot ze bruin kleuren, voeg de knoflook toe en bak 1 minuut mee.","Voeg de tomatenblokjes en 200 ml water toe, breng op smaak met zout, peper en een snuf suiker en breng aan de kook. Roer de stukken lasagne erdoor zodat ze onder de saus liggen.","Doe de deksel op de pan en laat 12 tot 14 minuten zachtjes pruttelen tot de pasta gaar is. Roer af en toe zodat de bladen niet aan elkaar plakken en voeg een scheut water toe als het te droog wordt.","Roer de spinazie erdoor tot hij geslonken is. Schep lepels ricotta op de pasta, strooi de mozzarella erover, leg de deksel erop en laat 3 minuten staan tot de kaas gesmolten is.","Serveer met basilicum erover. Alle lagen van een lasagne, maar in één pan en een half uur: de romige ricotta tegen de zoete tomatensaus smaakt net zo goed als uit de oven."]},{"id":244,"name":"Spanakopita van filodeeg met spinazie en feta","type":"Vegetarisch","time":40,"emoji":"🥧","cuisine":"Grieks","ingredients":[["filodeeg","4","vel"],["spinazie","200","g"],["feta","75","g"],["bosui","2","stuk"],["ei","0.5","stuk"],["dille","0.25","bosje"],["citroen","0.25","stuk"],["sesamzaad","1","tl"]],"steps":["Verwarm de oven voor op 190°C. Snijd de bosui in ringetjes en hak de dille fijn.","Verhit 1 eetlepel olijfolie in een grote koekenpan op middelhoog vuur. Bak de bosui 2 minuten, voeg de spinazie in delen toe en laat 3 tot 4 minuten slinken. Knijp de spinazie in een zeef goed uit en laat iets afkoelen.","Meng de spinazie met de verkruimelde feta, het ei, de dille, het geraspte schil van de citroen, peper en een klein beetje zout.","Smelt 25 gram boter. Leg een vel filodeeg in een ingevette kleine ovenschaal, kwast met boter en herhaal met het tweede vel. Schep de vulling erop, dek af met de laatste twee vellen die elk gekwast worden en vouw de randen naar binnen. Kwast de bovenkant met boter en strooi het sesamzaad erover.","Bak de spanakopita 25 minuten in de oven tot het deeg goudbruin en krokant is. Laat 5 minuten staan voor het snijden.","Serveer met een partje citroen en een tomatensalade. De knapperige laagjes, de zoute feta en de frisse dille maken dit tot het Griekse zondagseten bij uitstek."]},{"id":245,"name":"Camembert uit de oven met tijm, wortel en knoflookbrood","type":"Vegetarisch","time":25,"emoji":"🧀","cuisine":"Frans","ingredients":[["camembert","0.5","stuk"],["wortel","2","stuk"],["stokbrood","0.5","stuk"],["knoflook","2","teen"],["tijm","3","takje"],["honing","1","tl"],["walnoten","15","g"],["rucola","30","g"]],"steps":["Verwarm de oven voor op 200°C. Schil de wortels en snijd ze in de lengte in kwarten. Meng ze op een bakplaat met 1 eetlepel olijfolie, 1 takje tijm, zout en peper en rooster 20 minuten tot ze zacht en licht gekarameliseerd zijn.","Pers de knoflook en meng met 25 gram zachte boter en een snuf zout. Snijd het stokbrood schuin open, besmeer met de knoflookboter en zet het de laatste 8 minuten bij de wortel in de oven.","Haal de camembert uit de verpakking, leg hem in een klein ovenschaaltje en snijd de bovenkant kruislings in. Steek de rest van de tijm erin en druppel de honing erover.","Zet de camembert de laatste 12 minuten in de oven tot hij in het midden gesmolten en vloeibaar is. Rooster de walnoten intussen 2 minuten in een droge pan en hak ze grof.","Serveer de camembert met de walnoten erover, de geroosterde wortel, het knoflookbrood en wat rucola. Doop de wortel en het brood in de warme kaas: de zoete wortel en de honing passen verrassend goed bij de rijke, zoute camembert."]},{"id":246,"name":"Geroosterde pompoen met burrata en hazelnoot","type":"Vegetarisch","time":35,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["flespompoen","300","g"],["burrata","0.5","bol"],["hazelnoten","20","g"],["rucola","40","g"],["honing","1","tl"],["chilivlokken","0.25","tl"],["balsamicoazijn","1","tl"],["ciabatta","0.5","stuk"]],"steps":["Verwarm de oven voor op 210°C. Snijd de pompoen in parten van 2 cm dik, de schil mag eraan blijven. Meng ze op een bakplaat met 1 eetlepel olijfolie, de chilivlokken, zout en peper.","Rooster de pompoen 25 tot 30 minuten tot hij zacht is en donkere randjes heeft. Keer de parten halverwege om.","Rooster intussen de hazelnoten 3 minuten in een droge pan, laat afkoelen en hak ze grof. Snijd de ciabatta in plakken en rooster ze de laatste 5 minuten mee in de oven.","Meng de rucola met de balsamicoazijn en 1 theelepel olijfolie.","Leg de warme pompoen op het bord, scheur de burrata erboven en strooi de hazelnoten erover. Druppel de honing erop en leg de rucola en het brood ernaast. De koele, romige burrata tegen de warme zoete pompoen en de knapperige noten is puur herfst op een bord."]},{"id":247,"name":"Tempeh in ketjapsaus met wintergroenten en rijst","type":"Vegetarisch","time":30,"emoji":"🍚","cuisine":"Indonesisch","ingredients":[["tempeh","125","g"],["rijst","75","g"],["spruitjes","100","g"],["wortel","1","stuk"],["ketjap manis","2","el"],["knoflook","1","teen"],["gember","1","cm"],["sambal","0.5","tl"],["limoen","0.25","stuk"]],"steps":["Kook de rijst volgens de verpakking. Snijd de tempeh in blokjes van 2 cm, halveer de spruitjes en snijd de wortel in dunne schuine plakjes.","Snijd de knoflook en gember fijn en roer ze met de ketjap, sambal en 2 eetlepels water tot een saus.","Verhit 2 eetlepels olie in een wok of grote koekenpan op hoog vuur. Bak de tempeh 6 tot 8 minuten tot de blokjes rondom goudbruin en knapperig zijn. Schep ze uit de pan.","Bak in dezelfde pan de spruitjes en wortel 5 minuten op hoog vuur tot ze bruine randjes hebben. Voeg 3 eetlepels water toe, doe de deksel op de pan en laat 3 minuten stomen tot ze beetgaar zijn.","Doe de tempeh terug en schenk de ketjapsaus erbij. Roerbak 1 tot 2 minuten tot alles glanzend en plakkerig is.","Serveer op de rijst met een partje limoen. De nootachtige tempeh en de zoete ketjap maken de stevige winterspruitjes ineens heel Indonesisch."]},{"id":248,"name":"Sticky tofu met mihoen en paksoi","type":"Vegetarisch","time":20,"emoji":"🥢","cuisine":"Aziatisch","ingredients":[["stevige tofu","150","g"],["mihoen","60","g"],["paksoi","1","stuk"],["sojasaus","2","el"],["honing","1","tl"],["knoflook","1","teen"],["gember","1","cm"],["maizena","1","el"],["sesamzaad","1","tl"]],"steps":["Dep de tofu goed droog, snijd in blokjes van 2 cm en schud ze om met de maizena en een snuf zout. Week de mihoen volgens de verpakking in heet water (meestal 3 tot 4 minuten) en giet af.","Snijd de knoflook en gember fijn en roer ze met de sojasaus, honing en 2 eetlepels water tot een saus. Snijd de paksoi in de lengte in kwarten.","Verhit 2 eetlepels olie in een wok of koekenpan op hoog vuur. Bak de tofu 6 tot 7 minuten, af en toe keren, tot alle kanten goudbruin en knapperig zijn. Schep op een bord.","Bak de paksoi 2 minuten in dezelfde pan tot de stelen beetgaar zijn en de bladen geslonken. Voeg de tofu en de saus toe en roerbak 1 minuut tot de saus dikker wordt en aan de tofu plakt.","Schep de mihoen erdoor of leg hem onder in de kom, de tofu en paksoi erop en het sesamzaad erover. Knapperig, plakkerig en zoet-zout: klaar in twintig minuten."]},{"id":249,"name":"Linzenstoof met rijst en spinazie","type":"Vegetarisch","time":30,"emoji":"🫘","cuisine":"Midden-Oosters","ingredients":[["rode linzen","80","g"],["rijst","70","g"],["spinazie","100","g"],["ui","1","stuk"],["knoflook","1","teen"],["komijn","1","tl"],["tomatenpuree","1","el"],["citroen","0.25","stuk"],["yoghurt","2","el"]],"steps":["Snipper de ui en snijd de knoflook fijn. Kook de rijst volgens de verpakking.","Verhit 1 eetlepel olijfolie in een pan op middelhoog vuur. Bak de helft van de ui 4 minuten zacht, voeg de knoflook en komijn toe en bak 1 minuut mee. Roer de tomatenpuree erdoor en bak nog 1 minuut.","Spoel de linzen af en voeg ze toe met 300 ml water en een snuf zout. Breng aan de kook en laat 15 minuten zachtjes pruttelen, roer af en toe, tot de linzen zacht zijn en de stoof dik is.","Bak intussen de rest van de ui in 1 eetlepel olie op middelhoog vuur in 8 tot 10 minuten goudbruin en knapperig.","Roer de spinazie door de linzen en laat 2 minuten slinken. Breng op smaak met het citroensap, zout en peper.","Serveer de stoof op de rijst met de gebakken ui en een lepel yoghurt erop. De zoete krokante ui en het frisse citroensap tillen de milde linzen naar een hoger niveau, net als bij een Libanese mujaddara."]},{"id":250,"name":"Spruitjesstamppot met geroosterde walnoot en mosterd","type":"Vegetarisch","time":35,"emoji":"🥬","cuisine":"Nederlands","ingredients":[["aardappels","250","g"],["spruitjes","200","g"],["walnoten","25","g"],["grove mosterd","1","el"],["ui","0.5","stuk"],["melk","75","ml"],["geraspte oude kaas","30","g"]],"steps":["Schil de aardappels en snijd ze in gelijke stukken. Kook ze 20 minuten in water met zout tot ze zacht zijn.","Maak intussen de spruitjes schoon en halveer ze. Snipper de ui.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur. Bak de ui 3 minuten, voeg de spruitjes toe met een snuf zout en bak 8 tot 10 minuten tot ze bruine randjes hebben en beetgaar zijn. Voeg eventueel een scheutje water toe om ze te laten stomen.","Rooster de walnoten 3 minuten in een droge pan en hak ze grof.","Giet de aardappels af en stamp ze met de warme melk, een klontje boter en de mosterd tot een grove puree. Schep de spruitjes en de helft van de kaas erdoor en breng op smaak met zout en peper.","Serveer de stamppot met de walnoten en de rest van de kaas erover. De bittere spruitjes, de pittige mosterd en de nootachtige walnoten maken deze stamppot ook zonder vlees compleet."]},{"id":251,"name":"Kabeljauw met bocconcini en sperziebonen","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdmMTjhPGE7/","basePersons":null,"ingredients":[["kabeljauw",null,""],["bocconcini",null,""],["sperziebonen",null,""],["cherrytomaten",null,""],["olijfolie",null,""],["wi ption-reviewed","videoReviewed":false},{"id":259,"name":"Gemarineerde tonijn met Parmezaankoek en wasabimayo","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","ingredients":[["tonijn",250,"g"],["sushi-azijn",2,"lepel"],["sojasaus",1,"el"],["sesamzaad",1,"tl"],["sesamolie",1,"el"],["olijfolie",2,"el"],["knoflook",1,"teen"],["citroenrasp",0.5,"citroen"],["rode ui",0.5,"stuk"],["parmezaan",30,"g"],["rucola",30,"g"],["wasabi",0.5,"tl"],["mayonaise",2,"el"]],"steps":["Meng stukjes tonijn met sushi-azijn, sojasaus, sesamzaad, sesamolie, olijfolie, geraspte knoflook, citroenrasp en rode ui. Laat marineren.","Vorm met een ring cirkels parmezaan op bakpapier. Bak 12 minuten op 200°C en trek het papier voorzichtig los.","Meng rucola bij de tonijn en serveer met de koek en mayonaise met wasabi."],"note":"Gebaseerd op het Instagram-bijschrift; de volledige video is nog niet gecontroleerd. Ontbrekende hoeveelheden zijn praktisch geschat en gemarkeerd. Aantal personen niet genoemd: aangenomen 2 personen.","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DcTTzHjvLjI/","basePersons":2,"sourcePersons":null,"portionsEstimated":true,"sourceIngredients":[["tonijn",null,""],["sushi-azijn",2,"lepel"],["sojasaus",null,""],["sesamzaad",null,""],["sesamolie",null,""],["olijfolie",null,""],["knoflook",1,"teen"],["citroenrasp",null,""],["rode ui",null,""],["parmezaan",null,""],["rucola",null,""],["wasabi",null,""],["mayonaise",null,""]],"estimatedIngredients":["tonijn","sojasaus","sesamzaad","sesamolie","olijfolie","citroenrasp","rode ui","parmezaan","rucola","wasabi","mayonaise"],"timeNote":"Koek 12 min op 200°C; marineertijd en totale tijd onbekend.","sourceStatus":"caption-reviewed","videoReviewed":false},{"id":260,"name":"Gamba-omelet met saus van koppen en schalen","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/ function missingShopping(){let m={};S.week.forEach(id=>{let r=by(id);if(!r)return;r.ingredients.forEach(ing=>{let [n,q,u]=ing;if(amountNumber(q)!==null&&sourcePortions(r))return;let k=shoppingKey(n,'onbekend');if(!m[k])m[k]={name:n,notes:[]};let note=r.name+': '+(q===null||q===undefined?'hoeveelheid niet genoemd':String(q)+' '+u+(sourcePortions(r)?'':' — aantal bronporties onbekend'));if(!m[k].notes.includes(note))m[k].notes.push(note)})});return m}
function card(r){return `<div class="card"><button type="button" class="pic photo-button" aria-label="Bekijk ${r.name}" onclick="openR(${r.id})">${picture(r)}</button><div class="pad"><div class="row between"><div><div class="title">${r.name}</div><div class="meta">${r.type} · ${r.cuisine} · ${timeLabel(r)}</div></div><button class="btn soft small" onclick="fav(${r.id})">${S.fav.includes(r.id)?'♥':'♡'}</button></div><div class="actions"><button class="btn primary small" onclick="add(${r.id})">+ Mijn week</button><button class="btn soft small" onclick="openR(${r.id})">Bekijken</button></div></div></div>`}
function currentSeason(r){let m=new Date().getMonth()+1;let n=r.name.toLowerCase();let K=(m>=9&&m<=11)?['pompoen','paddenstoel','champignon','stamppot','spruit','traybake','stoof','risotto','prei','witlof','hutspot']:(m>=3&&m<=5)?['asperge','doperwt','erwten','citroen','spinazie','munt','radijs','lams']:(m>=6&&m<=8)?['salade','ceviche','taco','bowl','burger','wrap','spies','tonijn','mango','gazpacho','pil pil']:['stamppot','erwtensoep','hutspot','boerenkool','zuurkool','spruit','stoof','soep','ovenschotel','witlof','curry','lasagne'];return r.cuisine==='Seizoensgerecht'||K.some(k=>n.includes(k))} function filtered(f='Alles'){let q=(document.getElementById('search')?.value||'').toLowerCase().trim();return R.filter(r=>{let ok=f==='Alles'||(f==='Snel'?Number.isFinite(r.time)&&r.time>0&&r.time<=25:(f==='ODRVA'?r.source==='ODRVA':(f==='Seizoen'?currentSeason(r):r.type===f)));let hay=(r.name+' '+r.cuisine+' '+r.type+' '+r.ingredients.map(x=>x[0]).join(' ')).toLowerCase();return ok&&(!q||hay.includes(q))}).sort((a,b)=>score(b)-score(a))} function render(f='Alles'){let list=filtered(f);if(!list.length){suggest.innerHTML='';cards.innerHTML='<div class="empty">Geen gerechten gevonden.</div>';return}let top=list[0];suggest.innerHTML=`<div class="section">Aanrader voor jou</div>${card(top)}`;cards.innerHTML='<div class="section">Meer inspiratie</div>'+list.slice(1).map(card).join('')} function doSearch(){render(document.querySelector('.chip.on')?.dataset.f||'Alles')}
function fav(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!=id):[...S.fav,id];save();render(document.querySelector('.chip.on')?.dataset.f||'Alles');renderFav()}
function add(id){if(!S.week.includes(id)){let previous=shoppingTotals();S.week.push(id);refreshChecks(previous);save();toast('Toegevoegd aan Mijn week')}renderWeek();renderShop()}
function removeW(id){let previous=shoppingTotals();S.week=S.week.filter(x=>x!=id);refreshChecks(previous);save();renderWeek();renderShop()}
function persons(n){let previous=shoppingTotals();S.persons=Math.max(1,Math.min(8,S.persons+n));refreshChecks(previous);save();renderWeek();renderShop()}
function makeWeek(){let liked=R.filter(x=>S.ratings[x.id]!='niet').sort((a,b)=>score(b)-score(a));let picks=[],types=['Vegetarisch','Vlees','Vis','Vegetarisch','Vlees'];types.forEach(t=>{let a=liked.filter(x=>x.type===t&&!picks.includes(x.id));if(a.length)picks.push(a[0].id)});let previous=shoppingTotals();S.week=picks;refreshChecks(previous);save();renderWeek();renderShop();toast('Gevarieerd weekmenu gemaakt')}
function swapW(id){let old=by(id),a=R.filter(r=>r.id!==id&&!S.week.includes(r.id)&&S.ratings[r.id]!=='niet'&&r.type===old.type).sort((a,b)=>score(b)-score(a));if(a.length){let previous=shoppingTotals();S.week=S.week.map(x=>x===id?a[0].id:x);refreshChecks(previous);save();renderWeek();renderShop();toast('Gerecht gewisseld')}} function surprise(){let a=R.filter(x=>!S.week.includes(x.id)&&S.ratings[x.id]!='niet').sort((a,b)=>score(b)-score(a));if(a.length)add(a[0].id)}
function renderWeek(){document.getElementById('pc').textContent=S.persons;let el=document.getElementById('weekList');if(!S.week.length)return el.innerHTML='<div class="empty">Nog geen gerechten gekozen.</div>';let days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];el.innerHTML=S.week.map((id,i)=>{let r=by(id);return `<div class="day"><div class="row between"><button type="button" onclick="openR(${id},'week')" style="flex:1;min-width:0;text-align:left;border:0;background:transparent;color:inherit;font:inherit;padding:0;cursor:pointer"><b>${days[i%7]}${i>=7?` · week ${Math.floor(i/7)+1}`:''}</b><div class="title" style="font-size:16px">${r.emoji} ${r.name}</div><div class="meta">${r.type} · ${timeLabel(r)}</div></button><div><button class="btn soft small" onclick="swapW(${id})">↻</button><button class="btn danger small" onclick="removeW(${id})">×</button></div></div></div>`}).join('')}
function qty(v){let n=parseFloat(v);return isNaN(n)?v:String(Math.round(n*S.persons*100)/100).replace('.',',')}
const WHOLE=new Set(['stuk','bol','krop','stronk','bosje','sneden','takje','vel','plak','teen']);
function unitName(u){return ({stuks:'stuk',bollen:'bol',stronken:'stronk',tenen:'teen',bosjes:'bosje'})[u]||u}
const RENAMED={"groene pesto":"pesto",currypasta:"groene currypasta"};function shoppingKey(n,u){n=n.trim().toLowerCase();if(RENAMED[n])n=RENAMED[n];if(n==='basilicum'&&u==='g')u='bosje';return n+'|'+unitName(u)}
function shoppingTotals(){let m={};S.week.forEach(id=>{let r=by(id);if(!r)return;let base=sourcePortions(r);r.ingredients.forEach(([n,q,u])=>{let number=amountNumber(q);if(number===null||!base)return;let k=shoppingKey(n,u);m[k]=(m[k]||0)+number*S.persons/base})});Object.entries(missingShopping()).forEach(([k,v])=>m[k]=v.notes.join(' / '));return m}
function refreshChecks(previous){let next=shoppingTotals();Object.keys(S.checked).forEach(k=>{if(next[k]!==previous[k])delete S.checked[k]})}
for(const field of ['checked','pantry']){let normalized={};Object.entries(S[field]||{}).forEach(([k,v])=>{let [n,u]=k.split('|');let key=shoppingKey(n,u);normalized[key]=normalized[key]||v});S[field]=normalized}
function estimatedShopping(){let m={};S.week.forEach(id=>{let r=by(id);if(!r)return;r.ingredients.forEach(([n,q,u])=>{if((r.estimatedIngredients||[]).includes(n)||r.portionsEstimated)m[shoppingKey(n,u)]=true})});return m}
function renderShop(){let m=shoppingTotals(),missing=missingShopping(),estimates=estimatedShopping();let keys=Object.keys(m),el=document.getElementById('shopping');if(!keys.length)return el.innerHTML='<div class="empty">Je boodschappen verschijnen zodra je gerechten kiest.</div>';let warning=Object.keys(missing).length?'<div class="prefs">Voor sommige ODRVA-ingrediënten ontbreken hoeveelheden of het aantal bronporties. Controleer deze bij de bron; ze worden niet automatisch omgerekend.</div>':'';if(Object.keys(estimates).length)warning+='<div class="prefs">De regels met “geschat / porties aangenomen” bevatten geschatte hoeveelheden of een aangenomen aantal personen. Controleer naar eigen inzicht.</div>';el.innerHTML=warning+keys.sort().map(k=>{let [n,u]=k.split('|'),unknown=missing[k],q=unknown?null:(WHOLE.has(u)?Math.ceil(m[k]-1e-9):Math.round(m[k]*100)/100),label=unknown?'Hoeveelheid controleren<br>'+unknown.notes.map(esc).join('<br>'):String(q).replace('.',',')+' '+esc(u)+(estimates[k]?' · geschat / porties aangenomen':'');return `<label class="check ${(S.checked[k]||S.pantry[k])?'done':''}"><input type="checkbox" data-k="${esc(k)}" ${S.checked[k]?'checked':''} onchange="ck(this.dataset.k,this.checked)"><div style="flex:1"><b>${esc(n)}</b><div class="meta">${label}</div></div><button type="button" class="btn soft small" data-k="${esc(k)}" onclick="event.preventDefault();pantry(this.dataset.k)">${S.pantry[k]?'In huis ✓':'In huis'}</button></label>`}).join('')}
function ck(k,v){S.checked[k]=v;save();renderShop()} function pantry(k){S.pantry[k]=!S.pantry[k];save();renderShop();toast(S.pantry[k]?'Staat al in huis':'Terug op lijst')}function clearChecked(){Object.keys(S.checked).forEach(k=>{if(S.checked[k])delete S.checked[k]});save();renderShop()}
function renderFav(){let good=Object.values(S.ratings).filter(x=>x==='lekker').length,bad=Object.values(S.ratings).filter(x=>x==='niet').length;document.getElementById('profile').innerHTML=`<div class="section">Jouw smaakprofiel</div><div class="stats"><div class="stat"><b>${good}</b>lekker</div><div class="stat"><b>${bad}</b>niet</div><div class="stat"><b>${S.fav.length}</b>favoriet</div></div><div class="meta">Je beoordelingen worden gebruikt om Ontdekken en Maak mijn week beter bij je smaak te laten passen.</div>`;let rs=R.filter(x=>S.fav.includes(x.id));document.getElementById('fav').innerHTML='<div class="section">Favorieten</div>'+(rs.length?rs.map(card).join(''):'<div class="empty">Nog geen favorieten.</div>')}
function rate(id,v){S.ratings[id]=v;if(v==='lekker'&&!S.fav.includes(id))S.fav.push(id);save();toast('Smaak onthouden');renderFav()}
function openR(id,origin='discover'){let r=by(id);show('detail');document.getElementById('detail').innerHTML=`<div class="recipe"><button class="back" onclick="show('${origin}')">←</button><div class="pic" style="margin-top:10px">${picture(r,true)}</div>${PHOTOS[r.id]?`<div class="photo-credit">Voorbeeldfoto van een vergelijkbaar gerecht · <a href="https://www.pexels.com/photo/${PHOTOS[r.id]}/" target="_blank" rel="noopener noreferrer">Pexels</a></div>`:''}<h2>${r.name}</h2><div class="meta">${r.type} · ${r.cuisine} · ${timeLabel(r)} · ${S.persons} personen</div>${r.sourceUrl?`<p class="meta"><a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener noreferrer">Bekijk de oorspronkelijke Instagram-video</a></p><div class="meta">${esc(r.timeNote||'Totale tijd niet genoemd.')}<br>${r.portionsEstimated?`Praktische versie voor ${r.basePersons} personen (aantal personen geschat). Hoeveelheden worden omgerekend.`:r.basePersons?`Bronrecept: ${r.basePersons} personen. Bekende hoeveelheden worden omgerekend.`:'Aantal bronporties niet genoemd. Bronhoeveelheden blijven ongewijzigd.'}</div>`:''}${r.note?`<div class="meta" style="margin-top:8px">${r.note}</div>`:''}<button class="btn primary" style="width:100%;margin-top:14px" onclick="add(${id})">Toevoegen aan Mijn week</button><div class="section">Ingrediënten</div><ul>${r.ingredients.map(x=>`<li style="margin:9px 0"><b>${x[0]}</b> — ${ingredientLabel(r,x)}</li>`).join('')}</ul><div class="section">Bereiding</div><ol>${r.steps.map(x=>`<li style="margin:10px 0;line-height:1.45">${x}</li>`).join('')}</ol><div class="section">Wat vond je ervan?</div><div class="rating"><button onclick="rate(${id},'lekker')">😍<small>Heerlijk</small></button><button onclick="rate(${id},'neutraal')">😐<small>Neutraal</small></button><button onclick="rate(${id},'niet')">👎<small>Niet meer</small></button></div></div>`}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(p).classList.add('on');let d=p==='detail';head.style.display=d?'none':'block';nav.style.display=d?'none':'grid';filters.style.display=p==='discover'?'flex':'none';let T={discover:['Kook','Lekker, makkelijk en gevarieerd'],week:['Mijn week','Stel je weekmenu samen'],shop:['Boodschappen','Automatisch samengevoegd'],favorites:['Voor jou','De app leert je smaak kennen']};if(T[p]){heading.textContent=T[p][0];subtitle.textContent=T[p][1]}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='week')renderWeek();if(p==='shop')renderShop();if(p==='favorites')renderFav();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)});render();renderWeek();renderShop();renderFav();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
