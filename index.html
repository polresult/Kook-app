ip ernaast. De koele, frisse dip is precies goed bij de zoete, hartige glaze."]},{"id":219,"name":"Kip in pistachekorst met geroosterde bloemkool","type":"Vlees","time":30,"emoji":"🥦","cuisine":"Mediterraan","ingredients":[["kipfilet","150","g"],["pistachenoten","30","g"],["paneermeel","2","el"],["dijonmosterd","1","el"],["bloemkool","250","g"],["citroen","0.5","stuk"],["Griekse yoghurt","3","el"],["knoflook","1","teen"],["peterselie","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C. Snijd de bloemkool in kleine roosjes, meng met 1 eetlepel olie, zout en peper en leg op een bakplaat. Rooster 25 minuten tot de randen bruin zijn.","Hak de pistachenoten fijn en meng ze met het paneermeel, de rasp van de citroen en een snuf zout. Bestrooi de kipfilet met zout en peper, smeer de bovenkant in met de mosterd en druk het pistachemengsel erop.","Leg de kip op een bakplaat met bakpapier, besprenkel met 1 eetlepel olie en bak 18 tot 20 minuten naast de bloemkool tot de korst goudbruin en de kip gaar is.","Roer de yoghurt met de geperste knoflook, het sap van de citroen en een snuf zout.","Snijd de kip in plakken en serveer met de bloemkool, de knoflookyoghurt en de gehakte peterselie. De nootachtige korst, de zoete geroosterde bloemkool en de frisse yoghurt passen heel mooi bij elkaar."]},{"id":220,"name":"Kipdijen met citroen, knoflook en krieltjes uit de oven","type":"Vlees","time":40,"emoji":"🍋","cuisine":"Mediterraan","ingredients":[["kipdijen met bot","2","stuk"],["krieltjes","250","g"],["knoflook","3","teen"],["citroen","0.5","stuk"],["rozemarijn","2","takje"],["cherrytomaten","100","g"],["rucola","30","g"]],"steps":["Verwarm de oven voor op 220°C. Halveer de krieltjes en doe ze in een ovenschaal met de ongepelde knoflooktenen, de rozemarijn, 1 eetlepel olijfolie, zout en peper.","Dep de kipdijen droog en bestrooi ze royaal met zout en peper. Leg ze met de huid naar boven op de krieltjes, steek schijfjes citroen ertussen en knijp de rest van het citroensap erover. Besprenkel de kip met 1 eetlepel olie.","Bak 30 tot 35 minuten tot de huid krokant en de kip gaar is. Schud de krieltjes halverwege om en leg de laatste 10 minuten de cherrytomaten erbij.","Druk de zachte knoflook uit het vel en meng hem door de krieltjes en het braadvocht.","Serveer uit de schaal met de rucola erover. Het citroenvocht, de knoflook en het kippenvet trekken in de krieltjes en dat is precies waar het om draait."]},{"id":221,"name":"Kipgehaktballetjes in romige kerriesaus","type":"Vlees","time":30,"emoji":"🍛","cuisine":"Europees","ingredients":[["kipgehakt","150","g"],["paneermeel","2","el"],["ei","0.5","stuk"],["ui","0.5","stuk"],["kerriepoeder","1","el"],["kokosmelk","150","ml"],["tomatenblokjes","100","g"],["rijst","80","g"],["koriander","0.25","bosje"]],"steps":["Kook de rijst volgens de verpakking.","Meng het gehakt met het paneermeel, het ei, 1 theelepel van het kerriepoeder, zout en peper. Draai er met natte handen balletjes van ter grootte van een walnoot.","Verhit 1 eetlepel olie in een hapjespan op middelhoog vuur en bak de balletjes 6 tot 8 minuten rondom bruin. Schep ze uit de pan.","Snipper de ui en bak hem 3 minuten in dezelfde pan. Voeg de rest van het kerriepoeder toe en bak 1 minuut mee. Giet de tomatenblokjes en de kokosmelk erbij, breng aan de kook en leg de balletjes terug. Laat 8 tot 10 minuten zachtjes pruttelen tot de saus dikker wordt en de balletjes gaar zijn.","Serveer de balletjes met de saus op de rijst en strooi de gehakte koriander erover. De milde kerrie en de zoete kokos maken het een saus die om een extra schep rijst vraagt."]},{"id":222,"name":"Biefstuk met pepersaus en friet","type":"Vlees","time":25,"emoji":"🥩","cuisine":"Frans","ingredients":[["biefstuk","1","stuk"],["diepvriesfriet","150","g"],["sjalot","1","stuk"],["groene peperkorrels","1","tl"],["kookroom","75","ml"],["runderbouillonblokje","0.25","stuk"],["sla","0.25","krop"]],"steps":["Verwarm de oven voor op 220°C. Spreid de friet uit op een bakplaat en bak 18 tot 20 minuten goudbruin, halverwege even omscheppen.","Haal de biefstuk 10 minuten van tevoren uit de koelkast en dep hem droog. Snipper de sjalot fijn en druk de peperkorrels licht plat met de bolle kant van een lepel.","Verhit 1 eetlepel olie met een klontje boter in een koekenpan op hoog vuur. Bak de biefstuk 2 tot 3 minuten per kant voor rosé, bestrooi met zout en laat hem onder folie 5 minuten rusten.","Zet het vuur lager en bak de sjalot 2 minuten in hetzelfde vet. Voeg de peperkorrels, 50 ml water en het verkruimelde bouillonblokje toe en laat 1 minuut inkoken. Roer de room erdoor en laat 2 tot 3 minuten zachtjes pruttelen tot de saus iets dikker is.","Snijd de biefstuk in plakken en leg ze op het bord met de friet en wat sla. Schenk de pepersaus erover: de pittige, romige saus en de krokante friet maken van een simpele biefstuk een echte bistroklassieker."]},{"id":223,"name":"Biefstuk met kaassaus en bulgursalade","type":"Vlees","time":20,"emoji":"🥩","cuisine":"Europees","ingredients":[["biefstuk","1","stuk"],["bulgur","70","g"],["cherrytomaten","100","g"],["komkommer","0.25","stuk"],["peterselie","0.25","bosje"],["geraspte belegen kaas","30","g"],["crème fraîche","3","el"],["citroen","0.25","stuk"]],"steps":["Kook de bulgur volgens de verpakking in licht gezouten water (meestal 8 tot 10 minuten) en laat hem uitlekken.","Halveer intussen de cherrytomaten, snijd de komkommer in blokjes en hak de peterselie grof. Meng ze met de bulgur, het sap van de citroen, 1 eetlepel olijfolie, zout en peper.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Dep de biefstuk droog en bak hem 2 tot 3 minuten per kant. Bestrooi met zout en peper en laat hem 5 minuten rusten onder folie.","Verwarm in een steelpan op laag vuur de crème fraîche met 2 eetlepels water. Roer de kaas erdoor en blijf roeren tot een gladde saus; breng op smaak met peper.","Snijd de biefstuk in plakken en leg ze naast de bulgursalade. Lepel de kaassaus erover: de frisse salade houdt de romige kaas en het sappige vlees mooi in balans."]},{"id":224,"name":"Sliptong in boter met citroen en krieltjes","type":"Vis","time":25,"emoji":"🍋","cuisine":"Nederlands","ingredients":[["sliptong","2","stuk"],["krieltjes","250","g"],["sperziebonen","125","g"],["citroen","0.5","stuk"],["peterselie","0.25","bosje"],["bloem","2","el"],["kappertjes","1","el"]],"steps":["Halveer de krieltjes en kook ze in 12 tot 15 minuten gaar in water met zout. Kook de sperziebonen de laatste 5 minuten mee. Giet af.","Dep de sliptongen droog, bestrooi ze met zout en peper en haal ze door de bloem. Klop het overtollige meel eraf.","Verhit 25 gram boter met 1 eetlepel olie in een grote koekenpan op middelhoog vuur. Bak de tongen 3 minuten per kant tot ze goudbruin zijn en het vlees makkelijk van de graat loskomt. Leg ze op de borden.","Voeg nog 15 gram boter toe aan de pan en laat die lichtbruin kleuren. Roer de kappertjes, het sap van de citroen en de gehakte peterselie erdoor en haal de pan van het vuur.","Giet de citroenboter over de vis en serveer met de krieltjes en bonen. Sliptong is een Hollandse klassieker: klein, snel gaar en met een fijne, zoete smaak die alleen boter en citroen nodig heeft."]},{"id":225,"name":"Beef stroganoff met tagliatelle","type":"Vlees","time":30,"emoji":"🍄","cuisine":"Europees","ingredients":[["biefstukreepjes","125","g"],["tagliatelle","100","g"],["champignons","125","g"],["ui","0.5","stuk"],["augurken","2","stuk"],["paprikapoeder","1","tl"],["tomatenpuree","1","el"],["crème fraîche","3","el"],["peterselie","0.25","bosje"]],"steps":["Snijd de champignons in plakjes, snipper de ui en snijd de augurken in dunne reepjes. Hak de peterselie fijn.","Verhit 1 eetlepel olie in een koekenpan op hoog vuur. Bak de biefstukreepjes 1 tot 2 minuten snel bruin, bestrooi met zout en peper en haal ze uit de pan.","Breng een ruime pan water met zout aan de kook en kook de tagliatelle volgens de verpakking beetgaar (meestal 7 tot 9 minuten).","Smelt intussen een klontje boter in dezelfde koekenpan op middelhoog vuur. Bak de ui en champignons 6 tot 8 minuten tot het vocht verdampt is en ze bruin worden. Roer het paprikapoeder en de tomatenpuree erdoor en bak 1 minuut mee.","Voeg 100 ml water, de augurk en de crème fraîche toe en laat 3 minuten zachtjes pruttelen. Doe het vlees met het vrijgekomen vocht terug en warm 1 minuut door zonder te koken.","Serveer de stroganoff op de tagliatelle met de peterselie erover. De zure augurk en het zoete paprikapoeder maken de romige saus licht en vol tegelijk."]},{"id":226,"name":"Lomo saltado met friet en rijst","type":"Vlees","time":25,"emoji":"🥩","cuisine":"Zuid-Amerikaans","ingredients":[["biefstukreepjes","125","g"],["diepvriesfriet","100","g"],["rijst","60","g"],["rode ui","0.5","stuk"],["tomaat","1","stuk"],["knoflook","1","teen"],["sojasaus","1.5","el"],["rode wijnazijn","1","el"],["koriander","0.25","bosje"]],"steps":["Verwarm de oven voor op 220°C en bak de friet 18 tot 20 minuten op een bakplaat. Kook de rijst volgens de verpakking.","Snijd de rode ui in dikke parten, de tomaat in partjes en de knoflook fijn. Hak de koriander grof. Roer de sojasaus en azijn met 2 eetlepels water tot een saus.","Verhit 1 eetlepel olie in een wok of grote koekenpan op zeer hoog vuur. Bak de biefstukreepjes 1 tot 2 minuten tot ze net bruin zijn, bestrooi met zout en peper en schep ze op een bord.","Bak in dezelfde pan de ui en knoflook 2 minuten op hoog vuur. Voeg de tomaat toe en bak 1 minuut, dan het vlees en de saus en laat 1 minuut sudderen.","Schep de friet door de pan en serveer meteen met de rijst en de koriander. De friet zuigt de hartige sojasaus op: zo eten ze het in Lima ook."]},{"id":227,"name":"Gehaktballen met rodewijnjus en aardappel-selderijpuree","type":"Vlees","time":40,"emoji":"🍖","cuisine":"Nederlands","ingredients":[["half-om-half gehakt","150","g"],["aardappels","200","g"],["knolselderij","100","g"],["ui","0.5","stuk"],["paneermeel","2","el"],["ei","0.5","stuk"],["rode wijn","75","ml"],["runderbouillonblokje","0.5","stuk"],["tijm","2","takje"]],"steps":["Schil de aardappels en de knolselderij en snijd ze in gelijke stukken. Kook ze 20 minuten in water met zout tot ze zacht zijn.","Snipper intussen de ui. Kneed het gehakt met de helft van de ui, het paneermeel, het ei, zout en peper en vorm er 2 ballen van.","Verhit 1 eetlepel olie met een klontje boter in een koekenpan op middelhoog vuur. Bak de ballen in 6 tot 8 minuten rondom bruin en haal ze uit de pan.","Bak de rest van de ui 3 minuten in hetzelfde vet, roer 1 theelepel bloem erdoor en blus af met de rode wijn. Voeg 150 ml water, het bouillonblokje en de tijm toe. Leg de ballen terug en laat 15 minuten zachtjes pruttelen met de deksel schuin op de pan.","Giet de aardappels en knolselderij af, stamp ze fijn met een klontje boter en een scheut melk en breng op smaak met zout en peper.","Serveer de ballen op de puree en schenk de jus erover. De zoete rode wijn en de nootachtige knolselderij maken deze Hollandse klassieker net iets feestelijker."]},{"id":228,"name":"Viskoekjes van schelvis met dille en aardappel-komkommersalade","type":"Vis","time":30,"emoji":"🥒","cuisine":"Europees","ingredients":[["schelvisfilet","125","g"],["krieltjes","200","g"],["komkommer","0.5","stuk"],["dille","0.5","bosje"],["ei","0.5","stuk"],["paneermeel","3","el"],["yoghurt","3","el"],["citroen","0.25","stuk"]],"steps":["Kook de krieltjes in 15 minuten gaar in water met zout. Giet af en laat afkoelen.","Hak intussen de schelvis met een mes heel fijn en meng met het ei, 2 eetlepels paneermeel, de helft van de dille, de geraspte schil van de citroen, zout en peper. Vorm er 2 platte koekjes van en bestrooi ze met het overige paneermeel.","Snijd de komkommer in dunne plakjes en de krieltjes in halve plakjes. Meng ze met de yoghurt, de rest van de dille, het citroensap, zout en peper.","Verhit 2 eetlepels olie in een koekenpan op middelhoog vuur en bak de viskoekjes 4 minuten per kant tot ze goudbruin en gaar zijn.","Serveer de viskoekjes op de salade met een partje citroen. Schelvis heeft stevige witte vlokken en blijft in het koekje lekker sappig."]},{"id":229,"name":"Varkenshaas met champignonroomsaus","type":"Vlees","time":30,"emoji":"🍄","cuisine":"Europees","ingredients":[["varkenshaas","150","g"],["champignons","150","g"],["sjalot","1","stuk"],["knoflook","1","teen"],["kookroom","100","ml"],["mosterd","1","tl"],["krieltjes","200","g"],["sperziebonen","100","g"]],"steps":["Halveer de krieltjes en kook ze 15 minuten in water met zout. Kook de sperziebonen de laatste 6 minuten mee en giet alles af.","Snijd intussen de champignons in plakjes, snipper de sjalot en snijd de knoflook fijn. Dep de varkenshaas droog en bestrooi met zout en peper.","Verhit 1 eetlepel olie met een klontje boter in een koekenpan op middelhoog vuur. Bak de varkenshaas in 10 tot 12 minuten rondom bruin en net gaar, draai hem regelmatig. Haal het vlees uit de pan en laat het onder folie 5 minuten rusten.","Bak in dezelfde pan de champignons 5 minuten op hoog vuur tot ze bruin zijn. Voeg de sjalot en knoflook toe en bak 2 minuten mee. Roer de room en mosterd erdoor en laat 3 minuten zachtjes inkoken.","Snijd de varkenshaas in plakken en serveer met de krieltjes en bonen. Schep de champignonsaus eroverheen, de romige saus met een vleugje mosterd maakt het malse vlees helemaal af."]},{"id":230,"name":"Varkenshaas met truffeltapenade en rucola","type":"Vlees","time":30,"emoji":"🍖","cuisine":"Italiaans","ingredients":[["varkenshaas","150","g"],["truffeltapenade","1.5","el"],["rucola","40","g"],["krieltjes","200","g"],["cherrytomaten","100","g"],["parmezaanse kaas","20","g"],["balsamicoazijn","1","tl"],["rozemarijn","1","takje"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes en meng ze op een bakplaat met 1 eetlepel olijfolie, de fijngehakte rozemarijn, zout en peper. Rooster 20 tot 25 minuten tot ze knapperig zijn.","Dep de varkenshaas droog en bestrooi met zout en peper. Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur en bak het vlees in 10 tot 12 minuten rondom bruin en net gaar.","Laat de varkenshaas 5 minuten rusten onder folie en snijd hem dan in plakken van 1 cm.","Halveer de cherrytomaten en meng ze met de rucola, de balsamicoazijn en 1 eetlepel olijfolie.","Leg de plakken vlees op het bord, schep een lepel truffeltapenade op elke plak en leg de rucolasalade en krieltjes ernaast. Schaaf de parmezaan erover: de aardse truffel en de peperige rucola geven het milde varkensvlees veel karakter."]},{"id":231,"name":"Speklapjes met ketjap en spitskool","type":"Vlees","time":30,"emoji":"🥬","cuisine":"Nederlands","ingredients":[["speklapjes","2","stuk"],["spitskool","0.25","stuk"],["ketjap manis","2","el"],["knoflook","1","teen"],["gember","1","cm"],["sambal","0.5","tl"],["aardappels","200","g"],["bosui","1","stuk"]],"steps":["Schil de aardappels, snijd ze in stukken en kook ze 20 minuten in water met zout. Giet af en stamp ze grof met een klontje boter en een scheut melk.","Snijd intussen de knoflook en gember fijn en roer ze met de ketjap en sambal tot een marinade. Snijd de spitskool in dunne reepjes en de bosui in ringetjes.","Verhit een koekenpan op middelhoog vuur zonder olie en bak de speklapjes 5 tot 6 minuten per kant tot ze goudbruin zijn. Schenk de laatste 2 minuten de marinade erbij en draai de lapjes om tot ze glanzend zijn.","Verhit 1 eetlepel olie in een tweede pan op hoog vuur. Roerbak de spitskool 5 tot 6 minuten met een snuf zout tot hij beetgaar is maar nog wat knapperig.","Serveer de speklapjes met de aardappelstamp en de spitskool, giet het sausje uit de pan erover en strooi de bosui erop. Zoet, pittig en een beetje Indisch: een Hollandse avondmaaltijd met een twist."]},{"id":232,"name":"Schnitzel met champignonsaus en friet","type":"Vlees","time":25,"emoji":"🍄","cuisine":"Europees","ingredients":[["varkensschnitzel","1","stuk"],["diepvriesfriet","150","g"],["champignons","125","g"],["ui","0.5","stuk"],["kookroom","75","ml"],["paneermeel","4","el"],["ei","0.5","stuk"],["peterselie","0.25","bosje"]],"steps":["Verwarm de oven voor op 220°C en bak de friet 18 tot 20 minuten op een bakplaat.","Snijd de champignons in plakjes en snipper de ui. Verhit 1 eetlepel olie in een steelpan op middelhoog vuur, bak de ui en champignons 6 tot 8 minuten bruin, roer 1 theelepel bloem erdoor en voeg de room en 50 ml water toe. Laat 3 minuten zachtjes pruttelen en breng op smaak met zout en peper.","Klop het ei los op een bord en doe het paneermeel op een tweede bord. Bestrooi de schnitzel met zout en peper, haal hem door 1 eetlepel bloem, dan door het ei en druk hem in het paneermeel.","Verhit 3 eetlepels olie in een koekenpan op middelhoog vuur en bak de schnitzel 3 tot 4 minuten per kant goudbruin en knapperig. Laat uitlekken op keukenpapier.","Serveer de schnitzel met de friet en de champignonsaus ernaast, bestrooid met gehakte peterselie. Romig, krokant en hartig: dit is eten zoals in een Oostenrijks berghut."]},{"id":233,"name":"Lamskoteletjes met rozemarijn en witte bonen","type":"Vlees","time":25,"emoji":"🌿","cuisine":"Mediterraan","ingredients":[["lamskoteletjes","2","stuk"],["witte bonen in blik","200","g"],["rozemarijn","2","takje"],["knoflook","2","teen"],["cherrytomaten","100","g"],["spinazie","75","g"],["citroen","0.25","stuk"]],"steps":["Hak de blaadjes van 1 takje rozemarijn fijn en snijd de knoflook in plakjes. Wrijf de koteletjes in met de helft van de rozemarijn, 1 eetlepel olijfolie, zout en peper en laat 10 minuten staan.","Spoel de bonen af en halveer de cherrytomaten.","Verhit 1 eetlepel olijfolie in een koekenpan op hoog vuur. Bak de lamskoteletjes 3 minuten per kant voor rosé, leg het tweede takje rozemarijn erbij in de pan. Haal het vlees eruit en laat het 5 minuten rusten onder folie.","Zet het vuur middelhoog en bak de knoflook 1 minuut in het lamsvet. Voeg de tomaten toe en bak 3 minuten, dan de bonen met 50 ml water en de rest van de rozemarijn. Laat 4 minuten pruttelen en roer de spinazie erdoor tot hij geslonken is.","Schep de bonen op het bord, leg de koteletjes erop en knijp wat citroensap erover. De kruidige lam, de romige bonen en het frisse citroensap smaken samen naar een zomer in Toscane."]},{"id":234,"name":"Lamsgehakt-tajine met pruimen en couscous","type":"Vlees","time":35,"emoji":"🥘","cuisine":"Marokkaans","ingredients":[["lamsgehakt","125","g"],["couscous","75","g"],["gedroogde pruimen","40","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["ras el hanout","1.5","tl"],["tomatenblokjes","200","g"],["wortel","1","stuk"],["amandelen","15","g"]],"steps":["Snipper de ui, snijd de knoflook fijn en de wortel in dunne halve plakjes. Halveer de pruimen.","Kneed het lamsgehakt met de helft van de ras el hanout, zout en peper en draai er kleine balletjes van ter grootte van een walnoot.","Verhit 1 eetlepel olie in een hapjespan op middelhoog vuur en bak de balletjes in 5 minuten rondom bruin. Haal ze uit de pan en bak de ui, knoflook en wortel 4 minuten in dezelfde pan.","Voeg de rest van de ras el hanout, de tomatenblokjes, de pruimen en 100 ml water toe. Leg de balletjes terug, doe de deksel op de pan en laat 15 minuten zachtjes stoven tot de saus dik is.","Overgiet intussen de couscous met 100 ml kokend water en een snuf zout, dek af en laat 5 minuten wellen. Roer los met een vork en een klontje boter. Rooster de amandelen 2 minuten in een droge pan.","Serveer de tajine op de couscous met de amandelen erover. De zoete pruimen en de warme specerijen bij het lam geven dit gerecht zijn typisch Marokkaanse smaak."]},{"id":235,"name":"Kefta in tomatensaus met ei","type":"Vlees","time":30,"emoji":"🍳","cuisine":"Marokkaans","ingredients":[["rundergehakt","125","g"],["ei","1","stuk"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["komijn","1","tl"],["paprikapoeder","1","tl"],["koriander","0.25","bosje"],["turks brood","0.25","stuk"]],"steps":["Snipper de ui en snijd de knoflook fijn. Hak de koriander grof.","Kneed het gehakt met de helft van de ui, de helft van de komijn, de helft van de koriander, zout en peper en vorm er kleine balletjes van.","Verhit 1 eetlepel olie in een koekenpan met deksel op middelhoog vuur. Bak de balletjes 5 minuten rondom bruin en haal ze uit de pan. Bak de rest van de ui en de knoflook 3 minuten, voeg het paprikapoeder en de rest van de komijn toe en bak 1 minuut mee.","Voeg de tomatenblokjes en 50 ml water toe, breng op smaak met zout en laat 8 minuten pruttelen. Leg de balletjes terug in de saus.","Maak een kuiltje in de saus, breek het ei erin en doe de deksel op de pan. Laat 5 tot 6 minuten zachtjes garen tot het eiwit gestold is en de dooier nog zacht.","Strooi de rest van de koriander erover en serveer meteen uit de pan met het brood om te dopen. Het zachte ei en de kruidige tomatensaus horen bij elkaar als in een Marokkaans straatcafé."]},{"id":236,"name":"Eendenborst met sinaasappel en zoete appeltjes","type":"Vlees","time":30,"emoji":"🍊","cuisine":"Frans","ingredients":[["eendenborstfilet","1","stuk"],["sinaasappel","1","stuk"],["appel","1","stuk"],["sjalot","1","stuk"],["honing","1","tl"],["kippenbouillonblokje","0.25","stuk"],["krieltjes","200","g"],["tijm","2","takje"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes, meng ze met 1 eetlepel olie, de tijm, zout en peper en rooster ze 20 tot 25 minuten op een bakplaat.","Snijd het vet van de eendenborst kruislings in, zonder in het vlees te snijden, en bestrooi met zout en peper. Leg hem met het vet naar beneden in een koude koekenpan en zet die op middelhoog vuur. Bak 6 tot 8 minuten tot het vet goudbruin en knapperig is, draai om en bak nog 3 tot 4 minuten.","Leg de eend 5 minuten te rusten onder folie. Schenk het eendenvet op 1 eetlepel na uit de pan.","Snijd de appel in partjes en de sjalot fijn. Bak de appel 3 minuten in het eendenvet tot hij licht bruin is, voeg de sjalot en honing toe en bak 1 minuut mee. Schenk het sap van de sinaasappel en 50 ml water met het bouillonblokje erbij en laat 3 minuten inkoken tot een glanzende saus.","Snijd de eend in dunne plakken en serveer met de appeltjes, de saus en de krieltjes. Het zoete van sinaasappel en appel snijdt mooi door het rijke eendenvlees heen, een Franse klassieker op een doordeweekse avond."]},{"id":237,"name":"Worstjes met zuurkool en mosterd","type":"Vlees","time":30,"emoji":"🌭","cuisine":"Europees","ingredients":[["braadworstjes","2","stuk"],["zuurkool","150","g"],["aardappels","200","g"],["ui","0.5","stuk"],["appel","0.5","stuk"],["grove mosterd","1","el"],["karwijzaad","0.5","tl"],["melk","50","ml"]],"steps":["Schil de aardappels, snijd ze in stukken en kook ze 20 minuten in water met zout.","Snipper intussen de ui en snijd de appel in blokjes. Verhit 1 eetlepel olie in een pan op middelhoog vuur, bak de ui 3 minuten en voeg de zuurkool, appel, karwijzaad en 50 ml water toe. Laat 15 minuten zachtjes stoven met de deksel op de pan.","Verhit een klontje boter in een koekenpan op middelhoog vuur en bak de worstjes 12 tot 15 minuten, regelmatig draaien, tot ze rondom bruin en gaar zijn.","Giet de aardappels af, stamp ze met de warme melk, een klontje boter en de helft van de mosterd tot een smeuïge puree. Breng op smaak met zout en peper.","Serveer de worstjes op de puree met de zuurkool ernaast en de rest van de mosterd erbij. Zuur, zout en een beetje zoet van de appel: hier wordt een koude avond warm van."]},{"id":238,"name":"Worstjes-traybake met pompoen en rode ui","type":"Vlees","time":40,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["braadworstjes","2","stuk"],["flespompoen","250","g"],["rode ui","1","stuk"],["krieltjes","150","g"],["knoflook","2","teen"],["rozemarijn","1","takje"],["honing","1","tl"],["grove mosterd","1","tl"]],"steps":["Verwarm de oven voor op 200°C. Snijd de pompoen (schil mag eraan blijven bij flespompoen) in blokken van 3 cm, de rode ui in parten en halveer de krieltjes. Plet de knoflooktenen met de platte kant van een mes.","Meng de pompoen, ui, krieltjes en knoflook op een bakplaat met 1,5 eetlepel olijfolie, de rozemarijnnaaldjes, zout en peper. Rooster 15 minuten.","Leg de worstjes tussen de groente en rooster nog 20 minuten tot de worstjes bruin zijn en de pompoen zacht. Schep halverwege om.","Roer de honing en mosterd met 1 theelepel water tot een glazuur en kwast dit de laatste 5 minuten over de worstjes.","Serveer direct van de bakplaat. De zoete, zachte pompoen en de ui zuigen het vet van de worstjes op en dat maakt deze herfstmaaltijd zo troostrijk."]},{"id":239,"name":"Frittata met aardappel, paprika en broccoli","type":"Vegetarisch","time":30,"emoji":"🍳","cuisine":"Italiaans","ingredients":[["eieren","3","stuk"],["krieltjes","150","g"],["rode paprika","0.5","stuk"],["broccoli","125","g"],["ui","0.5","stuk"],["geraspte belegen kaas","30","g"],["peterselie","0.25","bosje"]],"steps":["Snijd de krieltjes in plakjes van 0,5 cm en de broccoli in kleine roosjes. Kook ze samen 6 minuten in water met zout en giet af.","Snijd intussen de paprika in reepjes en snipper de ui. Klop de eieren los met de kaas, de gehakte peterselie, zout en peper.","Verwarm de ovengrill voor. Verhit 1,5 eetlepel olijfolie in een kleine ovenbestendige koekenpan op middelhoog vuur en bak de ui en paprika 4 minuten. Voeg de krieltjes en broccoli toe en bak 3 minuten tot de aardappel licht kleurt.","Giet het eimengsel over de groente, zet het vuur laag en laat 8 tot 10 minuten garen tot de onderkant stevig is en alleen de bovenkant nog vochtig.","Zet de pan 2 tot 3 minuten onder de grill tot de frittata goudbruin en gaar is. Laat even staan, snijd in punten en serveer lauwwarm met een groene salade. Lekker met een lepel pesto erbij."]},{"id":240,"name":"Omelet met geitenkaas, spinazie en tomaat","type":"Vegetarisch","time":15,"emoji":"🍳","cuisine":"Frans","ingredients":[["eieren","3","stuk"],["zachte geitenkaas","40","g"],["spinazie","75","g"],["cherrytomaten","75","g"],["bieslook","0.25","bosje"],["desembrood","2","sneden"]],"steps":["Halveer de cherrytomaten en knip de bieslook fijn. Klop de eieren los met 1 eetlepel water, zout en peper.","Verhit 1 theelepel olie in een koekenpan op middelhoog vuur. Bak de tomaten 2 minuten, voeg de spinazie toe en laat 1 minuut slinken. Schep op een bord.","Smelt een klontje boter in dezelfde pan op middelhoog vuur. Giet het ei erin en trek met een spatel de gestolde randen naar het midden, 2 minuten, tot de omelet bijna gestold is maar nog glanst.","Verdeel de spinazie, tomaten en de verkruimelde geitenkaas over de ene helft, zet het vuur laag en laat 1 minuut staan. Vouw de omelet dicht en laat hem op het bord glijden.","Rooster het brood en serveer de omelet met de bieslook erover. De romige geitenkaas smelt net genoeg tegen de warme tomaat en spinazie: een snel Frans ontbijt-voor-avondeten."]},{"id":241,"name":"Gevulde paprika's met rijst en feta","type":"Vegetarisch","time":40,"emoji":"🫑","cuisine":"Mediterraan","ingredients":[["rode paprika","2","stuk"],["rijst","60","g"],["feta","50","g"],["tomatenblokjes","150","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["pijnboompitten","15","g"],["oregano","1","tl"],["peterselie","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C. Kook de rijst volgens de verpakking (meestal 10 tot 12 minuten) en giet af.","Snijd de kapjes van de paprika's en haal de zaadlijsten eruit. Snipper de ui en snijd de knoflook fijn. Hak de peterselie grof.","Verhit 1 eetlepel olijfolie in een koekenpan op middelhoog vuur. Bak de ui 3 minuten, voeg de knoflook en oregano toe en bak 1 minuut mee. Roer de helft van de tomatenblokjes, de rijst, de pijnboompitten, de peterselie en de verkruimelde feta erdoor en breng op smaak met zout en peper.","Giet de rest van de tomatenblokjes in een ovenschaal, zet de paprika's erin en vul ze met het rijstmengsel. Leg de kapjes erop en besprenkel met 1 eetlepel olijfolie.","Bak de paprika's 25 minuten in de oven tot ze zacht zijn en de randen beginnen te kleuren. Serveer met de tomatensaus uit de schaal: de zoete, zachte paprika en de zoute feta zijn een klassieke combinatie uit de Griekse keuken."]},{"id":242,"name":"Moussaka-stijl ovenschotel met linzen","type":"Vegetarisch","time":40,"emoji":"🍆","cuisine":"Grieks","ingredients":[["aubergine","1","stuk"],["linzen in blik","150","g"],["tomatenblokjes","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["kaneel","0.25","tl"],["griekse yoghurt","100","g"],["ei","0.5","stuk"],["geraspte belegen kaas","30","g"]],"steps":["Verwarm de oven voor op 200°C. Snijd de aubergine in de lengte in plakken van 0,5 cm, bestrijk ze met 1 eetlepel olijfolie en zout en rooster ze 12 minuten op een bakplaat tot ze zacht zijn.","Snipper intussen de ui en snijd de knoflook fijn. Verhit 1 eetlepel olijfolie in een pan op middelhoog vuur, bak de ui 4 minuten, voeg de knoflook en kaneel toe en bak 1 minuut mee.","Spoel de linzen af en voeg ze met de tomatenblokjes toe. Laat 8 minuten pruttelen tot de saus dik is en breng op smaak met zout en peper.","Klop de yoghurt los met het ei, de helft van de kaas, een snuf zout en peper.","Leg de helft van de aubergine in een kleine ovenschaal, schep de linzensaus erop en dek af met de rest van de aubergine. Verdeel het yoghurtmengsel erover en strooi de rest van de kaas erop.","Bak 15 minuten in de oven tot de bovenkant goudbruin is. Laat 5 minuten staan en serveer: de kaneel in de linzen en de frisse yoghurtlaag geven precies dat Griekse moussaka-gevoel, zonder gehakt."]},{"id":243,"name":"Groentelasagne uit één pan","type":"Vegetarisch","time":35,"emoji":"🥘","cuisine":"Italiaans","ingredients":[["lasagnebladen","4","stuk"],["courgette","0.5","stuk"],["champignons","100","g"],["spinazie","75","g"],["tomatenblokjes","200","g"],["knoflook","1","teen"],["ricotta","75","g"],["geraspte mozzarella","40","g"],["basilicum","0.25","bosje"]],"steps":["Snijd de courgette in blokjes, de champignons in plakjes en de knoflook fijn. Breek de lasagnebladen in grove stukken.","Verhit 1 eetlepel olijfolie in een grote hapjespan met deksel op middelhoog vuur. Bak de champignons en courgette 5 tot 6 minuten tot ze bruin kleuren, voeg de knoflook toe en bak 1 minuut mee.","Voeg de tomatenblokjes en 200 ml water toe, breng op smaak met zout, peper en een snuf suiker en breng aan de kook. Roer de stukken lasagne erdoor zodat ze onder de saus liggen.","Doe de deksel op de pan en laat 12 tot 14 minuten zachtjes pruttelen tot de pasta gaar is. Roer af en toe zodat de bladen niet aan elkaar plakken en voeg een scheut water toe als het te droog wordt.","Roer de spinazie erdoor tot hij geslonken is. Schep lepels ricotta op de pasta, strooi de mozzarella erover, leg de deksel erop en laat 3 minuten staan tot de kaas gesmolten is.","Serveer met basilicum erover. Alle lagen van een lasagne, maar in één pan en een half uur: de romige ricotta tegen de zoete tomatensaus smaakt net zo goed als uit de oven."]},{"id":244,"name":"Spanakopita van filodeeg met spinazie en feta","type":"Vegetarisch","time":40,"emoji":"🥧","cuisine":"Grieks","ingredients":[["filodeeg","4","vel"],["spinazie","200","g"],["feta","75","g"],["bosui","2","stuk"],["ei","0.5","stuk"],["dille","0.25","bosje"],["citroen","0.25","stuk"],["sesamzaad","1","tl"]],"steps":["Verwarm de oven voor op 190°C. Snijd de bosui in ringetjes en hak de dille fijn.","Verhit 1 eetlepel olijfolie in een grote koekenpan op middelhoog vuur. Bak de bosui 2 minuten, voeg de spinazie in delen toe en laat 3 tot 4 minuten slinken. Knijp de spinazie in een zeef goed uit en laat iets afkoelen.","Meng de spinazie met de verkruimelde feta, het ei, de dille, het geraspte schil van de citroen, peper en een klein beetje zout.","Smelt 25 gram boter. Leg een vel filodeeg in een ingevette kleine ovenschaal, kwast met boter en herhaal met het tweede vel. Schep de vulling erop, dek af met de laatste twee vellen die elk gekwast worden en vouw de randen naar binnen. Kwast de bovenkant met boter en strooi het sesamzaad erover.","Bak de spanakopita 25 minuten in de oven tot het deeg goudbruin en krokant is. Laat 5 minuten staan voor het snijden.","Serveer met een partje citroen en een tomatensalade. De knapperige laagjes, de zoute feta en de frisse dille maken dit tot het Griekse zondagseten bij uitstek."]},{"id":245,"name":"Camembert uit de oven met tijm, wortel en knoflookbrood","type":"Vegetarisch","time":25,"emoji":"🧀","cuisine":"Frans","ingredients":[["camembert","0.5","stuk"],["wortel","2","stuk"],["stokbrood","0.5","stuk"],["knoflook","2","teen"],["tijm","3","takje"],["honing","1","tl"],["walnoten","15","g"],["rucola","30","g"]],"steps":["Verwarm de oven voor op 200°C. Schil de wortels en snijd ze in de lengte in kwarten. Meng ze op een bakplaat met 1 eetlepel olijfolie, 1 takje tijm, zout en peper en rooster 20 minuten tot ze zacht en licht gekarameliseerd zijn.","Pers de knoflook en meng met 25 gram zachte boter en een snuf zout. Snijd het stokbrood schuin open, besmeer met de knoflookboter en zet het de laatste 8 minuten bij de wortel in de oven.","Haal de camembert uit de verpakking, leg hem in een klein ovenschaaltje en snijd de bovenkant kruislings in. Steek de rest van de tijm erin en druppel de honing erover.","Zet de camembert de laatste 12 minuten in de oven tot hij in het midden gesmolten en vloeibaar is. Rooster de walnoten intussen 2 minuten in een droge pan en hak ze grof.","Serveer de camembert met de walnoten erover, de geroosterde wortel, het knoflookbrood en wat rucola. Doop de wortel en het brood in de warme kaas: de zoete wortel en de honing passen verrassend goed bij de rijke, zoute camembert."]},{"id":246,"name":"Geroosterde pompoen met burrata en hazelnoot","type":"Vegetarisch","time":35,"emoji":"🎃","cuisine":"Seizoensgerecht","ingredients":[["flespompoen","300","g"],["burrata","0.5","bol"],["hazelnoten","20","g"],["rucola","40","g"],["honing","1","tl"],["chilivlokken","0.25","tl"],["balsamicoazijn","1","tl"],["ciabatta","0.5","stuk"]],"steps":["Verwarm de oven voor op 210°C. Snijd de pompoen in parten van 2 cm dik, de schil mag eraan blijven. Meng ze op een bakplaat met 1 eetlepel olijfolie, de chilivlokken, zout en peper.","Rooster de pompoen 25 tot 30 minuten tot hij zacht is en donkere randjes heeft. Keer de parten halverwege om.","Rooster intussen de hazelnoten 3 minuten in een droge pan, laat afkoelen en hak ze grof. Snijd de ciabatta in plakken en rooster ze de laatste 5 minuten mee in de oven.","Meng de rucola met de balsamicoazijn en 1 theelepel olijfolie.","Leg de warme pompoen op het bord, scheur de burrata erboven en strooi de hazelnoten erover. Druppel de honing erop en leg de rucola en het brood ernaast. De koele, romige burrata tegen de warme zoete pompoen en de knapperige noten is puur herfst op een bord."]},{"id":247,"name":"Tempeh in ketjapsaus met wintergroenten en rijst","type":"Vegetarisch","time":30,"emoji":"🍚","cuisine":"Indonesisch","ingredients":[["tempeh","125","g"],["rijst","75","g"],["spruitjes","100","g"],["wortel","1","stuk"],["ketjap manis","2","el"],["knoflook","1","teen"],["gember","1","cm"],["sambal","0.5","tl"],["limoen","0.25","stuk"]],"steps":["Kook de rijst volgens de verpakking. Snijd de tempeh in blokjes van 2 cm, halveer de spruitjes en snijd de wortel in dunne schuine plakjes.","Snijd de knoflook en gember fijn en roer ze met de ketjap, sambal en 2 eetlepels water tot een saus.","Verhit 2 eetlepels olie in een wok of grote koekenpan op hoog vuur. Bak de tempeh 6 tot 8 minuten tot de blokjes rondom goudbruin en knapperig zijn. Schep ze uit de pan.","Bak in dezelfde pan de spruitjes en wortel 5 minuten op hoog vuur tot ze bruine randjes hebben. Voeg 3 eetlepels water toe, doe de deksel op de pan en laat 3 minuten stomen tot ze beetgaar zijn.","Doe de tempeh terug en schenk de ketjapsaus erbij. Roerbak 1 tot 2 minuten tot alles glanzend en plakkerig is.","Serveer op de rijst met een partje limoen. De nootachtige tempeh en de zoete ketjap maken de stevige winterspruitjes ineens heel Indonesisch."]},{"id":248,"name":"Sticky tofu met mihoen en paksoi","type":"Vegetarisch","time":20,"emoji":"🥢","cuisine":"Aziatisch","ingredients":[["stevige tofu","150","g"],["mihoen","60","g"],["paksoi","1","stuk"],["sojasaus","2","el"],["honing","1","tl"],["knoflook","1","teen"],["gember","1","cm"],["maizena","1","el"],["sesamzaad","1","tl"]],"steps":["Dep de tofu goed droog, snijd in blokjes van 2 cm en schud ze om met de maizena en een snuf zout. Week de mihoen volgens de verpakking in heet water (meestal 3 tot 4 minuten) en giet af.","Snijd de knoflook en gember fijn en roer ze met de sojasaus, honing en 2 eetlepels water tot een saus. Snijd de paksoi in de lengte in kwarten.","Verhit 2 eetlepels olie in een wok of koekenpan op hoog vuur. Bak de tofu 6 tot 7 minuten, af en toe keren, tot alle kanten goudbruin en knapperig zijn. Schep op een bord.","Bak de paksoi 2 minuten in dezelfde pan tot de stelen beetgaar zijn en de bladen geslonken. Voeg de tofu en de saus toe en roerbak 1 minuut tot de saus dikker wordt en aan de tofu plakt.","Schep de mihoen erdoor of leg hem onder in de kom, de tofu en paksoi erop en het sesamzaad erover. Knapperig, plakkerig en zoet-zout: klaar in twintig minuten."]},{"id":249,"name":"Linzenstoof met rijst en spinazie","type":"Vegetarisch","time":30,"emoji":"🫘","cuisine":"Midden-Oosters","ingredients":[["rode linzen","80","g"],["rijst","70","g"],["spinazie","100","g"],["ui","1","stuk"],["knoflook","1","teen"],["komijn","1","tl"],["tomatenpuree","1","el"],["citroen","0.25","stuk"],["yoghurt","2","el"]],"steps":["Snipper de ui en snijd de knoflook fijn. Kook de rijst volgens de verpakking.","Verhit 1 eetlepel olijfolie in een pan op middelhoog vuur. Bak de helft van de ui 4 minuten zacht, voeg de knoflook en komijn toe en bak 1 minuut mee. Roer de tomatenpuree erdoor en bak nog 1 minuut.","Spoel de linzen af en voeg ze toe met 300 ml water en een snuf zout. Breng aan de kook en laat 15 minuten zachtjes pruttelen, roer af en toe, tot de linzen zacht zijn en de stoof dik is.","Bak intussen de rest van de ui in 1 eetlepel olie op middelhoog vuur in 8 tot 10 minuten goudbruin en knapperig.","Roer de spinazie door de linzen en laat 2 minuten slinken. Breng op smaak met het citroensap, zout en peper.","Serveer de stoof op de rijst met de gebakken ui en een lepel yoghurt erop. De zoete krokante ui en het frisse citroensap tillen de milde linzen naar een hoger niveau, net als bij een Libanese mujaddara."]},{"id":250,"name":"Spruitjesstamppot met geroosterde walnoot en mosterd","type":"Vegetarisch","time":35,"emoji":"🥬","cuisine":"Nederlands","ingredients":[["aardappels","250","g"],["spruitjes","200","g"],["walnoten","25","g"],["grove mosterd","1","el"],["ui","0.5","stuk"],["melk","75","ml"],["geraspte oude kaas","30","g"]],"steps":["Schil de aardappels en snijd ze in gelijke stukken. Kook ze 20 minuten in water met zout tot ze zacht zijn.","Maak intussen de spruitjes schoon en halveer ze. Snipper de ui.","Verhit 1 eetlepel olie in een koekenpan op middelhoog vuur. Bak de ui 3 minuten, voeg de spruitjes toe met een snuf zout en bak 8 tot 10 minuten tot ze bruine randjes hebben en beetgaar zijn. Voeg eventueel een scheutje water toe om ze te laten stomen.","Rooster de walnoten 3 minuten in een droge pan en hak ze grof.","Giet de aardappels af en stamp ze met de warme melk, een klontje boter en de mosterd tot een grove puree. Schep de spruitjes en de helft van de kaas erdoor en breng op smaak met zout en peper.","Serveer de stamppot met de walnoten en de rest van de kaas erover. De bittere spruitjes, de pittige mosterd en de nootachtige walnoten maken deze stamppot ook zonder vlees compleet."]},{"id":251,"name":"Kabeljauw met bocconcini en sperziebonen","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdmMTjhPGE7/","basePersons":null,"ingredients":[["kabeljauw",null,""],["bocconcini",null,""],["sperziebonen",null,""],["cherrytomaten",null,""],["olijfolie",null,""],["witte wijn","een scheut",""],["knoflook",null,""],["tijm",null,""],["citroen",null,""]],"steps":["Blancheer de sperziebonen.","Bak de tomaatjes in ruime olijfolie. Voeg na enkele minuten witte wijn, knoflook en tijm toe.","Laat circa 15 minuten sudderen en voeg de sperziebonen toe.","Voeg bocconcini toe, laat op laag vuur nog 8 minuten sudderen en voeg citroensap toe.","Bak de kabeljauw apart, circa 4 minuten per kant. Voeg toe aan de groenten en meng voorzichtig.","Serveer met het bakvocht."],"timeNote":"","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-251.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdmMTjhPGE7/","screenshotReviewed":true,"screenshotTimeSeconds":53.47,"photoCaption":""},{"id":252,"name":"Witte bonen met tonijn, rode ui en geroosterd brood","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdrDqsoSeju/","basePersons":null,"ingredients":[["witte bonen",null,""],["rode ui",null,""],["olijfolie",null,""],["knoflook",null,""],["roomboter","een klein klontje",""],["brood",null,""],["tonijn uit blik",null,""],["tijm",null,""]],"steps":["Spoel de witte bonen af.","Snijd de rode ui dun en bak minstens 15 minuten heel zacht in olijfolie. De ui mag wat beet houden.","Voeg knoflook en een klein klontje boter toe.","Haal de ui uit de pan en bak blokjes brood in dezelfde pan.","Meng bonen, ui en tonijn. Werk af met brood, tijm en olijfolie."],"timeNote":"","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-252.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdrDqsoSeju/","screenshotReviewed":true,"screenshotTimeSeconds":49.45,"photoCaption":"Pure flavour."},{"id":253,"name":"Rijst met gemarineerde zalm, edamame, ei en avocado","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DclGxpIPEOE/","basePersons":null,"ingredients":[["rijst",null,""],["zalm",null,""],["koningsoesterzwam",null,""],["sojasaus",null,""],["vissaus",null,""],["azijn",null,""],["oestersaus",null,""],["knoflook",null,""],["edamame",null,""],["ei","2","stuk"],["sesamolie",null,""],["avocado",null,""]],"steps":["Snijd de koningsoesterzwam in plakken en bak kort aan.","Snijd zalm in blokjes, marineer met sojasaus, vissaus, azijn en oestersaus en bak kort aan.","Roerbak in dezelfde pan knoflook en edamame tot ze gaar zijn.","Kook twee eieren hard. Meng eieren en edamame met sesamolie en geraspte knoflook.","Snijd avocado en serveer alles op rijst."],"timeNote":"","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-253.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DclGxpIPEOE/","screenshotReviewed":true,"screenshotTimeSeconds":44.91,"photoCaption":"Made with love."},{"id":254,"name":"Butterfly kipdrumsticks met salie en citroen","type":"Vlees","time":null,"emoji":"🍽️","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","ingredients":[["kipdrumsticks",4,"stuk"],["sojasaus",1,"el"],["olijfolie",2,"el"],["salie",4,"blad"],["tijm",2,"takje"],["gember",10,"g"],["citroen",0.5,"stuk"]],"steps":["Snijd drumsticks open en plat.","Marineer circa 1 uur in sojasaus, olijfolie, salie, tijm, gember en citroen; schep af en toe om.","Grill circa 25 minuten en keer regelmatig tot goudbruin en gaar."],"sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DZurHVlPjNH/","basePersons":2,"sourcePersons":null,"portionsEstimated":true,"sourceIngredients":[["kipdrumsticks",null,""],["sojasaus",null,""],["olijfolie",null,""],["salie",null,""],["tijm",null,""],["gember",null,""],["citroen",null,""]],"estimatedIngredients":["kipdrumsticks","sojasaus","olijfolie","salie","tijm","gember","citroen"],"timeNote":"Marineren circa 1 uur; grillen circa 25 min","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-254.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DZurHVlPjNH/","screenshotTimeSeconds":44.26,"screenshotReviewed":true},{"id":255,"name":"Macaroni met ham, mosterd en boterige broccoli","type":"Vlees","time":25,"emoji":"🍝","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","ingredients":[["macaroni","100","g"],["sjalot","0.5","stuk"],["slagroom","75","ml"],["hamblokjes","75","g"],["mosterd","1","el"],["bieslook","0.25","bosje"],["broccoli","0.5","stronk"],["roomboter","15","g"],["knoflook","1","teen"]],"steps":["Kook de macaroni beetgaar.","Fruit de sjalot zachtjes. Voeg slagroom, bieslook en hamblokjes toe en roer de mosterd erdoor.","Snijd de broccoli klein en gaar hem rustig in roomboter met knoflook tot hij zacht is maar nog beet heeft.","Schep de macaroni door de romige mosterdsaus.","Serveer met de broccoli erop."],"timeNote":"","photo":"photos/odrva-255.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DNoNEIqPUkX/","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DNoNEIqPUkX/","screenshotReviewed":true,"screenshotTimeSeconds":59.06},{"id":256,"name":"Broodje pesto met gebakken tomaat, croutons en jonge kaas","type":"Vegetarisch","time":20,"emoji":"🥪","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","ingredients":[["broodje","1","stuk"],["pesto","1","el"],["cherrytomaten","125","g"],["jonge kaas","40","g"],["croutons","25","g"],["basilicum","0.25","bosje"]],"steps":["Bak de tomaatjes in een beetje olijfolie tot ze zacht en licht gekaramelliseerd zijn.","Snijd het broodje open en bestrijk met pesto.","Verdeel de gebakken tomaatjes erover en leg de jonge kaas erop.","Laat de kaas kort smelten onder de grill, maak af met krokante croutons en wat verse basilicum."],"timeNote":"","photo":"photos/odrva-256.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DN3KH253scU/","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DN3KH253scU/","screenshotReviewed":true,"screenshotTimeSeconds":57.96,"photoCaption":"All organic."},{"id":257,"name":"Garnalen met aardappel, tomaat en witte wijn","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","ingredients":[["garnalen",300,"g"],["olijfolie",2,"el"],["tomaat",2,"stuk"],["knoflook",2,"teen"],["witte wijn",100,"ml"],["aardappel",400,"g"],["citroen",0.5,"stuk"],["koriander",10,"g"]],"steps":["Bak 1–2 minuten kort aan beide kanten en haal uit de pan.","Laat tomaat zacht worden en voeg knoflook, wijn, aardappel en citroen toe. Laat circa 15 minuten sudderen.","Voeg garnalen en koriander toe en verwarm nog enkele minuten."],"sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/Da57_devx5x/","basePersons":2,"sourcePersons":null,"portionsEstimated":true,"sourceIngredients":[["garnalen",null,""],["olijfolie",null,""],["tomaat",null,""],["knoflook",null,""],["witte wijn",null,""],["aardappel",null,""],["citroen",null,""],["koriander",null,""]],"estimatedIngredients":["garnalen","olijfolie","tomaat","knoflook","witte wijn","aardappel","citroen","koriander"],"timeNote":"Garnalen eerst 1–2 min; saus circa 15 min en nog enkele minuten","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-257.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/Da57_devx5x/","screenshotTimeSeconds":57.06,"screenshotReviewed":true,"photoCaption":""},{"id":258,"name":"Tuna tonnato","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdJGnVfvOzu/","basePersons":null,"ingredients":[["verse tonijn",null,""],["ansjovis",null,""],["mayonaise",null,""],["sojasaus",null,""],["crème fraîche",null,""],["citroen",null,""],["ijsbergsla",null,""]],"steps":["Pureer ansjovis, mayonaise, sojasaus, crème fraîche en citroensap zo glad mogelijk.","Leg de mousse op de rauwe tonijn.","Werk af met dun geschaafde ijsbergsla."],"timeNote":"","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-258.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdJGnVfvOzu/","screenshotReviewed":true,"screenshotTimeSeconds":47.74,"photoCaption":"Naturally.","course":"voor"},{"id":259,"name":"Gemarineerde tonijn met Parmezaankoek en wasabimayo","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","ingredients":[["tonijn",250,"g"],["sushi-azijn",2,"lepel"],["sojasaus",1,"el"],["sesamzaad",1,"tl"],["sesamolie",1,"el"],["olijfolie",2,"el"],["knoflook",1,"teen"],["citroenrasp",0.5,"citroen"],["rode ui",0.5,"stuk"],["parmezaan",30,"g"],["rucola",30,"g"],["wasabi",0.5,"tl"],["mayonaise",2,"el"]],"steps":["Meng stukjes tonijn met sushi-azijn, sojasaus, sesamzaad, sesamolie, olijfolie, geraspte knoflook, citroenrasp en rode ui. Laat marineren.","Vorm met een ring cirkels parmezaan op bakpapier. Bak 12 minuten op 200°C en trek het papier voorzichtig los.","Meng rucola bij de tonijn en serveer met de koek en mayonaise met wasabi."],"sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DcTTzHjvLjI/","basePersons":2,"sourcePersons":null,"portionsEstimated":true,"sourceIngredients":[["tonijn",null,""],["sushi-azijn",2,"lepel"],["sojasaus",null,""],["sesamzaad",null,""],["sesamolie",null,""],["olijfolie",null,""],["knoflook",1,"teen"],["citroenrasp",null,""],["rode ui",null,""],["parmezaan",null,""],["rucola",null,""],["wasabi",null,""],["mayonaise",null,""]],"estimatedIngredients":["tonijn","sojasaus","sesamzaad","sesamolie","olijfolie","citroenrasp","rode ui","parmezaan","rucola","wasabi","mayonaise"],"timeNote":"Koek 12 min op 200°C","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-259.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DcTTzHjvLjI/","screenshotTimeSeconds":51.52,"screenshotReviewed":true,"course":"voor"},{"id":260,"name":"Gamba-omelet met saus van koppen en schalen","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/Dci5ukcPTet/","basePersons":null,"ingredients":[["garnalen",null,""],["sojasaus",null,""],["vissaus",null,""],["oestersaus",null,""],["azijn",null,""],["ei",null,""],["roomboter",null,""],["ui",null,""],["prei",null,""],["peper",null,""],["zout",null,""],["bleekselderij",null,""],["witte wijn",null,""],["water",null,""],["knoflook",null,""],["tomaat",null,""],["room","een scheut",""]],"steps":["Pel de garnalen en bewaar koppen en schalen. Snijd het vlees klein en marineer met sojasaus, vissaus, oestersaus en azijn.","Bak kort aan en leg apart.","Giet geklopte eieren in dezelfde pan en bak een omelet. Leg de garnalen in het midden en rol op.","Bak koppen en schalen met boter in een andere pan. Voeg ui, prei, peper, zout, bleekselderij, witte wijn, water, knoflook en tomaat toe.","Laat circa een halfuur net onder het kookpunt sudderen, pureer en zeef.","Meng room erdoor en schenk over de omelet. De rest kan als soep worden geserveerd."],"timeNote":"","sourceStatus":"caption-reviewed","videoReviewed":false,"photo":"photos/odrva-260.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/Dci5ukcPTet/","screenshotReviewed":true,"screenshotTimeSeconds":56.54,"photoCaption":"Pure flavour."},{"id":261,"name":"Gefrituurde garnalenspiesjes met pittige saus","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DdGoInrvD8W/","basePersons":null,"ingredients":[["garnalen",null,""],["eiwit",null,""],["panko",null,""],["frituurolie",null,""],["Griekse yoghurt","1", [["kippenpoot",2,"stuk"],["miso",1,"el"],["pindakaas",2,"el"],["kippenbouillon",300,"ml"],["sjalot",1,"stuk"],["knoflook",2,"teen"],["sojasaus",1,"el"],["vissaus",1,"tl"],["kurkuma",1,"tl"],["shiitake",100,"g"],["rijst",150,"g"],["spinazie",150,"g"]],"sourceIngredients":[["kippenpoot",null,""],["miso",null,""],["pindakaas",null,""],["kippenbouillon",null,""],["sjalot",null,""],["knoflook",null,""],["sojasaus",null,""],["vissaus",null,""],["kurkuma",null,""],["shiitake",null,""],["rijst",null,""],["spinazie",null,""]],"estimatedIngredients":["kippenpoot","miso","pindakaas","kippenbouillon","sjalot","knoflook","sojasaus","vissaus","kurkuma","shiitake","rijst","spinazie"],"steps":["Bak de kippenpoten rondom aan, voeg gesneden sjalot, knoflook en de shiitake in plakjes toe en bak kort mee.","Meng miso, pindakaas, kippenbouillon, sojasaus, vissaus en kurkuma en voeg toe.","Laat op laag vuur afgedekt stoven tot de kip volledig gaar is. Laat de saus indien nodig onafgedekt inkoken.","Kook rijst en laat spinazie slinken. Serveer bij de kip en saus."],"timeNote":"Totale tijd niet genoemd.","note":"Gebaseerd op het oorspronkelijke Instagram-bijschrift en geselecteerde videobeelden. Ontbrekende hoeveelheden zijn praktisch geschat voor 2 personen; volledige videocontrole open.","sourceStatus":"caption-reviewed","videoReviewed":false,"sourceCaption":"Juicy chicken legs with miso, peanut butter, chicken broth, shallot, garlic, soy sauce and fish sauce. All organic. Naturally.\nDo you want also this cool, high-quality pan like this from Bare Cookware? Head over to their website and use my code for a great discount: MAURICE10","selectedFramesReviewed":true,"photo":"photos/odrva-351.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DW9A-3uDw0H/","screenshotReviewed":true,"screenshotTimeSeconds":51.2,"photoCaption":"Simple & fresh."},{"id":352,"name":"Broodje sardines met augurk en mosterdmayo","type":"Vis","time":null,"emoji":"🐟","cuisine":"Onder de rook van Amsterdam","source":"ODRVA","sourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DW3-FVRj8wZ/","basePersons":2,"sourcePersons":null,"portionsEstimated":true,"ingredients":[["broodje",2,"stuk"],["sardines",120,"g"],["augurk",2,"stuk"],["ei",2,"stuk"],["rode ui",0.5,"stuk"],["mosterd",1,"tl"],["mayonaise",2,"el"]],"sourceIngredients":[["broodje",null,""],["sardines",null,""],["augurk",null,""],["ei",null,""],["rode ui",null,""],["mosterd",null,""],["mayonaise",null,""]],"estimatedIngredients":["broodje","sardines","augurk","ei","rode ui","mosterd","mayonaise"],"steps":["Kook de eieren, pel en snijd in plakjes. Snijd augurk en rode ui.","Meng mosterd met mayonaise en besmeer de broodjes.","Beleg met sardines, augurk, ei en rode ui."],"timeNote":"Totale tijd niet genoemd.","note":"Gebaseerd op het oorspronkelijke Instagram-bijschrift en geselecteerde videobeelden. Ontbrekende hoeveelheden zijn praktisch geschat voor 2 personen; volledige videocontrole open.","sourceStatus":"caption-reviewed","videoReviewed":false,"sourceCaption":"A delicious summer sandwich, Maurice style. Sardines, pickles, egg, red onion and a mustard-mayo sauce. Love it.\nAll organic. Naturally.","selectedFramesReviewed":true,"photo":"photos/odrva-352.webp","screenshotSourceUrl":"https://www.instagram.com/onderderookvanamsterdam/reel/DW3-FVRj8wZ/","screenshotReviewed":true,"screenshotTimeSeconds":50.77,"photoCaption":"All organic."},{"id":353,"name":"Käsespätzle met spitskool en gefrituurde ui","type":"Vegetarisch","time":45,"emoji":"🧀","cuisine":"Duits","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kasespatzle","season":"herfst","ingredients":[["ei","1","stuk"],["bloem","60","g"],["spitskool","125","g"],["ui","0.5","stuk"],["gruyère","40","g"],["belegen kaas","25","g"],["bieslook","0.25","bosje"]],"steps":["Klop het ei los met een snuf zout en 25 ml water. Roer de bloem er beetje bij beetje door tot een dik, taai beslag. Hak de bieslook fijn en roer de helft erdoor. Laat het beslag 10 minuten rusten.","Snijd de ui in dunne halve ringen. Verhit een laag van 1 cm zonnebloemolie in een kleine pan op middelhoog vuur en frituur de ui in 4 tot 5 minuten goudbruin. Laat uitlekken op keukenpapier en bestrooi met zout.","Breng een ruime pan water met zout aan de kook. Druk het beslag door een spätzlezeef of een vergiet met grote gaten boven het water en kook de spätzle 2 minuten, tot ze bovendrijven. Schep ze eruit en spoel kort koud af.","Snijd de spitskool in dunne reepjes. Verhit 1 eetlepel olijfolie met een klontje boter in een grote koekenpan op hoog vuur en bak de kool 4 minuten tot de randen bruin kleuren.","Zet het vuur laag, schep de spätzle erdoor en strooi de geraspte gruyère en belegen kaas erover. Laat 2 minuten smelten en schep om tot alles draderig is.","Serveer met de rest van de bieslook, flink zwarte peper en de krokante uienringen erbovenop."]},{"id":354,"name":"Linzenschotel met boerenkoolpesto en shiitake","type":"Vegetarisch","time":35,"emoji":"🥬","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/linzenschotel-met-boerenkoolpesto","season":"herfst","ingredients":[["puylinzen","60","g"],["boerenkool","40","g"],["shiitake","50","g"],["zongedroogde tomaten","20","g"],["pijnboompitten","15","g"],["parmezaan","20","g"],["knoflook","1","teen"],["citroen","0.25","stuk"]],"steps":["Kook de linzen in ruim water met zout in 20 minuten gaar. Giet af en houd warm.","Rooster intussen de pijnboompitten 2 minuten in een droge koekenpan op middelhoog vuur tot ze kleuren. Houd een derde apart voor de garnering.","Maal de rest van de pijnboompitten met de helft van de boerenkool, de helft van de knoflook, de parmezaan, het citroensap en 3 eetlepels olijfolie in een keukenmachine tot een grove pesto. Breng op smaak met peper en zout.","Scheur de shiitake in stukken en snijd de rest van de knoflook fijn. Bak ze 5 minuten in 1 eetlepel olijfolie op hoog vuur tot ze goudbruin zijn en kruid met zout.","Meng de pesto door de warme linzen, samen met de rest van de boerenkool en de in reepjes gesneden zongedroogde tomaten. De kool slinkt door de warmte.","Schep de shiitake erop en maak af met de achtergehouden pijnboompitten en wat extra geraspte parmezaan."]},{"id":355,"name":"Bietengalette met geitenkaas en tijm","type":"Vegetarisch","time":40,"emoji":"🥧","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/bieten-galette-met-geitenkaas","season":"herfst","ingredients":[["hartig taartdeeg","0.25","stuk"],["rode biet","1","stuk"],["rode ui","0.25","stuk"],["geitenkaas","25","g"],["knoflook","0.5","teen"],["tijm","1","g"],["ei","0.25","stuk"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 200°C en bekleed een bakplaat met bakpapier.","Schil de bieten en schaaf ze met een mandoline in flinterdunne plakjes. Meng ze in een kom met 1 eetlepel olijfolie, het citroensap, de fijngehakte knoflook, de tijmblaadjes, peper en zout.","Rol het deeg uit op de bakplaat en snijd het grof rond. Snijd de rode ui in dunne halve ringen.","Leg de bietenplakjes dakpansgewijs op het deeg en laat een rand van 3 cm vrij. Verdeel de ui erover en verkruimel de geitenkaas erop. Vouw de rand naar binnen over de vulling.","Klop het ei los en bestrijk de rand ermee. Bak de galette 20 tot 25 minuten in het midden van de oven tot het deeg goudbruin en de biet zacht is.","Laat 5 minuten staan voor het snijden en serveer met een groene salade."]},{"id":356,"name":"Gevulde flespompoen met orzo, champignons en oude kaas","type":"Vegetarisch","time":95,"emoji":"🎃","cuisine":"Mediterraan","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/gevulde-pompoen","season":"herfst","ingredients":[["flespompoen","250","g"],["orzo","20","g"],["champignons","30","g"],["courgette","40","g"],["ui","0.25","stuk"],["oude kaas","20","g"],["rozemarijn","1","g"],["groentebouillon","125","ml"]],"steps":["Verwarm de oven voor op 180°C. Halveer de pompoen in de lengte, lepel de pitten eruit en hol de helften uit tot een rand van 1 cm. Snijd het uitgehaalde vruchtvlees in blokjes van 0,5 cm.","Breng de bouillon aan de kook en kook de orzo erin in 8 minuten gaar. Giet af.","Snipper de ui, hak de rozemarijn fijn en snijd champignons en courgette in blokjes van 0,5 cm. Fruit de ui met de rozemarijn 2 minuten in 1 eetlepel olijfolie op middelhoog vuur. Voeg pompoenblokjes, courgette en champignons toe en bak 8 minuten op hoog vuur tot ze bruin kleuren. Kruid met peper en zout.","Schep de orzo en de geraspte oude kaas door de groenten. Bestrijk de pompoenhelften vanbinnen met olijfolie, bestrooi met zout en vul ze royaal.","Leg de helften op een bakplaat, dek losjes af met aluminiumfolie en bak 60 minuten. Haal de folie eraf en bak nog 15 minuten tot de pompoen zacht is en de bovenkant kleurt.","Snijd in dikke plakken en serveer met wat extra geraspte kaas."]},{"id":357,"name":"Rodewijnrisotto met paddenstoelen en krokante salie","type":"Vegetarisch","time":45,"emoji":"🍷","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/rode-wijn-risotto","season":"herfst","ingredients":[["risottorijst","75","g"],["gemengde paddenstoelen","150","g"],["rode wijn","90","ml"],["groentebouillon","200","ml"],["ui","0.25","stuk"],["knoflook","1","teen"],["parmezaan","15","g"],["salie","2","g"]],"steps":["Snipper de ui, hak de knoflook fijn en snijd de paddenstoelen in stukken. Verwarm de bouillon in een steelpan en houd hem tegen de kook aan.","Verhit 1 eetlepel olijfolie in een hapjespan op middelhoog vuur en fruit ui en knoflook 3 minuten glazig. Bak twee derde van de paddenstoelen 5 minuten mee.","Roer de rijst erdoor en bak 2 minuten tot de korrels glazig zijn. Schenk de rode wijn erbij en roer tot hij bijna is opgenomen.","Voeg de hete bouillon soeplepel voor soeplepel toe, steeds als de vorige is opgenomen, en roer regelmatig. Na 20 tot 25 minuten is de risotto romig en beetgaar.","Bak intussen de rest van de paddenstoelen in een klontje boter 4 minuten goudbruin op hoog vuur en kruid met zout. Bak in dezelfde pan de salieblaadjes 30 seconden krokant.","Roer een klontje boter en de parmezaan door de risotto, breng op smaak met peper en zout en serveer met de gebakken paddenstoelen en de salie erop."]},{"id":358,"name":"Pasta met palmkool, bloemkoolroomsaus en pangrattato","type":"Vegetarisch","time":35,"emoji":"🍝","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/pasta-met-palmkool","season":"winter","ingredients":[["pasta","75","g"],["palmkool","40","g"],["bloemkool","50","g"],["melk","90","ml"],["crème fraîche","1","el"],["parmezaan","15","g"],["zuurdesembrood","30","g"],["knoflook","1","teen"]],"steps":["Snijd de bloemkool in kleine roosjes en kook ze in de melk met een snuf zout in 15 minuten zacht op laag vuur.","Kook intussen de pasta in ruim water met zout volgens de verpakking beetgaar en bewaar een kopje kookvocht.","Maal het brood tot grof kruim. Verhit 2 eetlepels olijfolie in een koekenpan op middelhoog vuur, bak de gekneusde knoflook 1 minuut en haal hem eruit. Bak het broodkruim met een snuf chilivlokken 3 minuten goudbruin en schep het uit de pan.","Verwijder de harde nerven uit de palmkool, snijd de bladeren in repen en roerbak ze 3 tot 4 minuten in dezelfde pan tot ze zacht zijn.","Pureer de bloemkool met de melk, de crème fraîche en de parmezaan tot een gladde saus. Breng op smaak met peper, zout en nootmuskaat en laat 2 minuten indikken op laag vuur.","Meng de pasta met de saus en de palmkool, voeg eventueel een scheut kookvocht toe en serveer met de pangrattato en extra parmezaan."]},{"id":359,"name":"Freekeh met geroosterde pompoen, spinazie en hüttenkäse","type":"Vegetarisch","time":40,"emoji":"🌾","cuisine":"Midden-Oosters","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/freekeh-met-geroosterde-pompoen","season":"herfst","ingredients":[["freekeh","50","g"],["flespompoen","200","g"],["rode ui","0.5","stuk"],["spinazie","40","g"],["hüttenkäse","25","g"],["pompoenpitten","10","g"],["citroen","0.25","stuk"],["komijn","0.25","tl"]],"steps":["Verwarm de oven voor op 200°C. Schil de pompoen, snijd hem in blokjes van 2 cm en snijd de rode ui in parten. Meng op een bakplaat met 1 eetlepel olijfolie, een halve theelepel chipotle of gerookt paprikapoeder en zout.","Rooster 25 tot 30 minuten tot de pompoen zacht is en de randen karamelliseren.","Kook intussen de freekeh in 250 ml water met zout in 15 minuten gaar. Giet af en doe in een kom.","Schep de spinazie door de hete freekeh zodat hij slinkt.","Klop een dressing van het citroensap, 2 eetlepels olijfolie, de komijn, peper en zout en meng die door de freekeh.","Verdeel de geroosterde pompoen en ui erover en maak af met de hüttenkäse en de pompoenpitten. Lauwwarm is hij het lekkerst."]},{"id":360,"name":"Bastilla met pompoen, gekarameliseerde ui en feta","type":"Vegetarisch","time":45,"emoji":"🥟","cuisine":"Marokkaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/bastilla","season":"herfst","ingredients":[["pompoen","125","g"],["rode ui","1","stuk"],["knoflook","0.5","teen"],["feta","25","g"],["filodeeg","1","stuk"],["sumak","0.5","tl"],["za'atar","0.5","tl"],["sesamzaad","0.25","el"]],"steps":["Verwarm de oven voor op 200°C. Snijd de pompoen in blokjes van 2 cm en meng ze op een bakplaat met 1 eetlepel olijfolie, de sumak, de za'atar, een snuf chilivlokken en zout. Rooster 20 minuten.","Snijd de rode ui in dunne halve ringen en hak de knoflook fijn. Bak ze in 1 eetlepel olijfolie 15 minuten op laag vuur, af en toe roerend, tot ze zacht en zoet zijn. Kruid met zout.","Bestrijk de vellen filodeeg een voor een dun met olijfolie en stapel ze op elkaar op een bakplaat met bakpapier.","Schep de uien in het midden van het deeg, verdeel de pompoen erover en verkruimel de feta erop. Vouw de randen van het deeg naar binnen zodat een open pakket ontstaat, bestrijk de bovenkant met olie en strooi het sesamzaad erover.","Bak 20 minuten op 200°C tot het deeg goudbruin en knapperig is. Dek af met folie als de bovenkant te snel kleurt.","Snijd in punten en serveer met een lepel yoghurt en een groene salade."]},{"id":361,"name":"Knolselderijsteak met waldorfsalade en aardappelpuree","type":"Vegetarisch","time":40,"emoji":"🥗","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/knolselderij-steak","season":"herfst","ingredients":[["knolselderij","0.5","stuk"],["kruimige aardappelen","200","g"],["appel","0.25","stuk"],["bleekselderij","0.5","stuk"],["walnoten","10","g"],["crème fraîche","50","ml"],["mosterd","0.5","el"],["honing","0.25","el"]],"steps":["Roer een marinade van 1 eetlepel olijfolie, de mosterd, de honing en wat tijmblaadjes. Schil de aardappelen, snijd ze in stukken en kook ze 20 minuten in water met zout.","Schil de knolselderij en snijd er per persoon een plak van 2 cm dik van; bewaar de rest voor de salade. Kook de plakken 10 minuten in gezouten water tot ze net gaar zijn, dep ze droog en bestrijk ze aan beide kanten met de marinade.","Snijd de overgebleven knolselderij, de appel en de bleekselderij in dunne reepjes. Meng met de walnoten, 1 eetlepel mayonaise en een lepel van de crème fraîche tot een frisse waldorfsalade. Breng op smaak met peper en zout.","Giet de aardappelen af en stamp ze met de rest van de crème fraîche, een klontje boter, peper en zout tot een gladde puree.","Verhit een klontje boter in een koekenpan op middelhoog vuur en bak de knolselderijsteaks 3 tot 4 minuten per kant goudbruin.","Serveer de steak op de puree met de waldorfsalade ernaast."]},{"id":362,"name":"Kumpir: Turkse gepofte aardappel met rode kool en olijven","type":"Vegetarisch","time":75,"emoji":"🥔","cuisine":"Turks","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kumpir","season":"altijd","ingredients":[["grote kruimige aardappel","1","stuk"],["roomboter","10","g"],["geraspte mozzarella","25","g"],["rode kool","25","g"],["cherrytomaten","2","stuk"],["groene olijven","2","stuk"],["zongedroogde tomaten","1","stuk"],["knoflooksaus","1.5","el"]],"steps":["Verwarm de oven voor op 200°C. Was de aardappel, prik hem een paar keer in, wikkel hem in aluminiumfolie en pof hem 50 tot 60 minuten in de oven tot een mes er zonder weerstand in gaat.","Snijd intussen de rode kool heel fijn en kneed hem met een snuf zout en een scheutje azijn zacht. Halveer de cherrytomaten en olijven en snijd de zongedroogde tomaat in reepjes.","Haal de folie van de aardappel, snijd hem in de lengte open en druk hem iets uit elkaar.","Lepel het binnenste in een kom, meng het met de boter en de mozzarella tot een romige massa en breng op smaak met peper en zout. Schep het terug in de schil.","Beleg de kumpir met rode kool, tomaat, olijven en zongedroogde tomaat en lepel de knoflooksaus erover.","Serveer meteen, eventueel met wat peterselie en een extra lepel yoghurt."]},{"id":363,"name":"Hertenstoof met ontbijtkoek en kruidnagel","type":"Vlees","time":180,"emoji":"🦌","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/wildstoof-van-hert","season":"herfst","ingredients":[["hertensukade","250","g"],["ui","0.5","stuk"],["winterwortel","0.25","stuk"],["rode wijn","50","ml"],["wildfond","50","ml"],["ontbijtkoek","0.5","plak"],["laurierblad","0.5","stuk"],["kruidnagel","0.5","stuk"]],"steps":["Snijd het hertenvlees in blokjes van 3 cm en dep ze droog. Snipper de ui en snijd de winterwortel in plakjes.","Verhit 1 eetlepel olijfolie in een stoofpan op middelhoog vuur en fruit ui en wortel 4 minuten. Schuif ze opzij, zet het vuur hoog en bak het vlees in porties rondom bruin.","Blus af met de rode wijn en de wildfond en schraap de aanbaksels los. Zet het vuur laag.","Snijd de ontbijtkoek in stukken en voeg hem toe met het laurierblad en de kruidnagel. Leg het deksel op de pan en stoof 2,5 uur op het laagste vuur, af en toe roerend, tot het vlees uit elkaar valt.","Is de saus te dun, haal dan het deksel eraf en laat hem het laatste kwartier inkoken. Vis laurier en kruidnagel eruit en breng op smaak met peper en zout.","Serveer met aardappelpuree of krieltjes en gestoofde rode kool."]},{"id":364,"name":"Boeuf bourguignon met spek en champignons","type":"Vlees","time":200,"emoji":"🍷","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/boeuf-bourguignon","season":"winter","ingredients":[["runderriblappen","150","g"],["spekblokjes","25","g"],["wortel","1","stuk"],["champignons","50","g"],["kleine uitjes","3","stuk"],["knoflook","1","teen"],["rode wijn","100","ml"],["runderbouillon","75","ml"]],"steps":["Snijd het vlees in stukken van 4 cm, dep ze droog en bestrooi met peper en zout. Pel de uitjes, snijd de wortel in grove stukken en halveer de champignons.","Bak de spekblokjes in een stoofpan op middelhoog vuur 4 minuten krokant en schep ze eruit. Bak het vlees in dezelfde pan in porties op hoog vuur rondom bruin en haal het uit de pan.","Fruit de uitjes, de wortel en de fijngehakte knoflook 4 minuten in het bakvet. Roer 1 eetlepel tomatenpuree en 1 eetlepel bloem erdoor en bak 1 minuut mee.","Schenk de rode wijn erbij, laat een derde verdampen en voeg een takje tijm en een laurierblad toe. Leg het vlees terug, schenk de bouillon erbij tot het net onderstaat en breng aan de kook.","Laat 2,5 tot 3 uur sudderen op het laagste vuur met het deksel schuin op de pan, tot het vlees boterzacht is. Breng op smaak met peper en zout.","Bak vlak voor het serveren de champignons 4 minuten in een klontje boter op hoog vuur, warm de spekjes mee en schep alles door de stoof. Lekker met aardappelpuree of stokbrood."]},{"id":365,"name":"Goulash met rundvlees, paprika en karwijzaad","type":"Vlees","time":180,"emoji":"🥘","cuisine":"Hongaars","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/recept-voor-goulash-met-rund","season":"winter","ingredients":[["runderlappen","180","g"],["rode paprika","0.5","stuk"],["ui","0.5","stuk"],["runderbouillon","125","ml"],["tomatenpuree","1","el"],["paprikapoeder","0.5","tl"],["karwijzaad","0.25","tl"],["laurierblad","0.5","stuk"]],"steps":["Snijd het vlees in blokjes van 3 cm, bestrooi met peper en zout en bestuif het met 1 eetlepel bloem.","Verhit 1 eetlepel olijfolie in een stoofpan op hoog vuur en braad het vlees in porties rondom bruin. Haal het uit de pan.","Snipper de ui en snijd de paprika in blokjes. Fruit de ui 3 minuten op middelhoog vuur, voeg de paprika toe en bak 3 minuten mee.","Roer de tomatenpuree, het paprikapoeder en het karwijzaad erdoor en bak 1 minuut, zodat de specerijen hun smaak afgeven.","Leg het vlees terug, schenk de bouillon erbij en voeg het laurierblad toe. Breng aan de kook en stoof 2,5 tot 3 uur met het deksel op de pan op het laagste vuur, tot het vlees uit elkaar valt. Haal het laatste half uur het deksel eraf als de saus te dun is.","Verwijder het laurierblad, breng op smaak met peper en zout en bestrooi met peterselie. Serveer met rijst of aardappelpuree."]},{"id":366,"name":"Ossobuco met gremolata","type":"Vlees","time":200,"emoji":"🍖","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/ossobuco","season":"winter","ingredients":[["kalfsschenkel","250","g"],["bleekselderij","1","stuk"],["wortel","0.5","stuk"],["ui","0.5","stuk"],["knoflook","1","teen"],["rode wijn","75","ml"],["runderbouillon","200","ml"],["peterselie","0.25","bosje"]],"steps":["Bestuif de kalfsschenkel met bloem en bestrooi met peper en zout. Laat een klontje boter schuimen in een braadpan op hoog vuur en bak het vlees 3 minuten per kant bruin. Haal het uit de pan en zet het vuur middelhoog.","Hak bleekselderij, wortel, ui en de helft van de knoflook fijn. Bak ze 5 minuten in de pan met 1 eetlepel tomatenpuree.","Leg het vlees terug, schenk de rode wijn erbij en laat 5 minuten koken zodat de alcohol verdampt.","Voeg de bouillon en een takje salie toe. Laat een half uur zonder deksel pruttelen, leg dan het deksel erop en stoof nog 2 tot 2,5 uur op laag vuur, tot het vlees van het bot valt.","Hak voor de gremolata de peterselie fijn en meng die met de rest van de fijngehakte knoflook en de rasp van een kwart citroen.","Breng de saus op smaak met peper en zout en serveer de ossobuco met de gremolata erover en een risotto of polenta erbij."]},{"id":367,"name":"Tartiflette met spitskool, spek en reblochon","type":"Vlees","time":65,"emoji":"🧀","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/tartiflette-spek-kaas","season":"winter","ingredients":[["aardappelen","190","g"],["spitskool","125","g"],["ui","0.25","stuk"],["knoflook","0.5","teen"],["spekblokjes","40","g"],["witte wijn","25","ml"],["crème fraîche","50","ml"],["reblochon","40","g"]],"steps":["Verwarm de oven voor op 220°C. Schil de aardappelen, snijd ze in plakjes van 0,5 cm en kook ze 7 minuten in water met zout tot ze net gaar zijn. Laat uitlekken.","Snijd de ui in ringen, hak de knoflook fijn en snijd de spitskool in dunne reepjes. Bak de spekblokjes 4 minuten krokant in een koekenpan op middelhoog vuur, voeg ui, knoflook en kool toe en bak 7 minuten tot de kool zacht en goudbruin is.","Kook de witte wijn in een steelpan tot de helft in. Roer de crème fraîche erdoor, laat 2 minuten koken en breng op smaak met tijmblaadjes, peper en zout.","Leg de helft van de aardappelplakjes in een ingevette ovenschaal, verdeel het kool-spekmengsel erover en lepel de helft van de saus erop. Dek af met de rest van de aardappelen en de rest van de saus.","Bak 30 minuten in de oven. Leg dan plakken reblochon (de korst mag blijven) over de schotel en bak nog 10 minuten tot de kaas gesmolten en goudbruin is.","Laat 5 minuten staan en serveer met een scherpe groene salade."]},{"id":368,"name":"Rendang van rundvlees met kokos en citroengras","type":"Vlees","time":180,"emoji":"🍛","cuisine":"Indonesisch","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/indonesische-rendang","season":"altijd","ingredients":[["runderriblappen","125","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["gember","5","g"],["citroengras","0.25","stuk"],["sambal","0.5","tl"],["kokosmelk","100","ml"],["limoenblad","0.5","stuk"]],"steps":["Snijd het vlees in blokjes van 3 cm. Verhit 1 eetlepel olie in een stoofpan op hoog vuur en bak het vlees rondom bruin.","Snipper de ui en hak de knoflook fijn. Voeg ze met de sambal en een kwart theelepel elk van komijn, korianderzaad, kurkuma en laos toe en bak 3 minuten op middelhoog vuur tot de specerijen geuren.","Schenk de kokosmelk erbij en voeg het limoenblad, het gekneusde citroengras en de in plakjes gesneden gember toe. Breng aan de kook.","Zet het vuur laag en laat 2 tot 2,5 uur zonder deksel sudderen, af en toe roerend, tot de saus dik en donker is en de olie zich afscheidt.","Bak het laatste kwartier op middelhoog vuur, al roerend, zodat de rendang bijna droog wordt en het vlees karamelliseert. Breng op smaak met zout.","Verwijder limoenblad, citroengras en gember en serveer met witte rijst en pittige sperziebonen."]},{"id":369,"name":"Kipbiryani met saffraan en kardemom","type":"Vlees","time":60,"emoji":"🍚","cuisine":"Indiaas","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/biryani-met-kip","season":"altijd","ingredients":[["basmatirijst","75","g"],["kippenpoot","1","stuk"],["sjalot","1","stuk"],["knoflook","0.5","teen"],["yoghurt","1.5","el"],["kippenbouillon","110","ml"],["garam masala","1","tl"],["amandelschaafsel","5","g"]],"steps":["Dep de kippenpoot droog en bestrooi met peper en zout. Meng de yoghurt met driekwart van de garam masala, wrijf de kip ermee in en laat minstens 20 minuten marineren in de koelkast.","Verwarm 15 ml melk in een steelpannetje, roer er een snufje saffraan door en zet apart.","Snipper de sjalot en hak de knoflook fijn. Bak ze met de rest van de garam masala, 2 kardemompeulen en een stukje kaneelstok 3 minuten op laag vuur in 1 eetlepel olie in een pan met deksel. Leg de kip erbij en bak 7 minuten op middelhoog vuur rondom bruin.","Spoel de rijst, roer de saffraanmelk erdoor en verdeel de rijst rond de kip. Schenk de bouillon erbij en breng zachtjes aan de kook.","Leg het deksel op de pan en kook 15 minuten op laag vuur. Zet het vuur uit en laat nog 15 minuten afgedekt staan zonder te roeren.","Rooster het amandelschaafsel 2 minuten in een droge koekenpan tot het lichtbruin is en strooi het over de biryani. Serveer met raita en naan."]},{"id":370,"name":"Kip à la normande met cider, appel en knolselderijpuree","type":"Vlees","time":80,"emoji":"🍏","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kip-a-la-normande","season":"herfst","ingredients":[["kippenpoot","1","stuk"],["champignons","75","g"],["prei","0.5","stuk"],["appel","0.5","stuk"],["appelcider","50","ml"],["slagroom","40","ml"],["knolselderij","100","g"],["kruimige aardappelen","100","g"]],"steps":["Schil de aardappelen en de knolselderij, snijd ze in gelijke stukken en kook ze 20 minuten in water met zout. Giet af en stamp met een scheut van de slagroom, peper en zout tot een gladde puree.","Bestrooi de kippenpoot met peper en zout. Verhit 1 eetlepel olijfolie met een klontje boter in een stoofpan op middelhoog vuur en bak de kip 10 minuten rondom goudbruin. Haal uit de pan.","Snijd de prei in ringen en halveer de champignons. Bak ze 4 minuten in het bakvet. Blus af met de cider en laat in 5 minuten tot de helft inkoken.","Roer de rest van de slagroom, 1 theelepel mosterd en 100 ml kippenbouillon erdoor. Leg de kip terug in de saus en stoof 35 minuten met het deksel op de pan op laag vuur, tot het vlees gaar is.","Snijd de appel in parten en bak ze 4 minuten in een klontje boter op middelhoog vuur tot ze bruin en zacht zijn. Bak desgewenst ook een plakje ontbijtspek krokant.","Serveer de kip met de romige saus, de appelpartjes en de puree en bestrooi met peterselie of dragon."]},{"id":371,"name":"Tiroler Gröstl met spek, paprika en spiegelei","type":"Vlees","time":35,"
