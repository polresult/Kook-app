emoji":"🍳","cuisine":"Oostenrijks","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/tiroler-grostl","season":"winter","ingredients":[["kruimige aardappelen","200","g"],["ui","0.25","stuk"],["rode paprika","0.5","stuk"],["kastanjechampignons","75","g"],["spekblokjes","50","g"],["ei","1","stuk"],["peterselie","0.25","bosje"],["karwijzaad","0.25","tl"]],"steps":["Was de aardappelen en kook ze met schil in 12 minuten net gaar. Giet af, laat uitstomen en snijd ze in plakjes.","Bak de spekblokjes in een grote koekenpan op middelhoog vuur 4 minuten krokant en schep ze eruit. Voeg een klontje boter toe en bak de aardappelplakjes 8 minuten op hoog vuur goudbruin; keer ze niet te vaak.","Snijd de ui in halve ringen, de paprika in stukjes en de champignons in plakjes. Voeg ze toe en bak 5 minuten mee tot alles kleurt.","Doe het spek terug in de pan en breng op smaak met het karwijzaad, peper en zout. Houd warm op laag vuur.","Bak het ei in een aparte pan in een scheutje olie op middelhoog vuur 3 minuten tot het wit gestold is en de dooier nog zacht.","Schep de gröstl op een bord, leg het spiegelei erop en bestrooi met fijngehakte peterselie."]},{"id":372,"name":"Limburgs zuurvlees met appel-perenstroop","type":"Vlees","time":180,"emoji":"🍐","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/limburgs-zuurvlees","season":"winter","ingredients":[["rundersukade","200","g"],["ui","1","stuk"],["witte azijn","50","ml"],["appel-perenstroop","1","el"],["ontbijtkoek","0.5","plak"],["laurierblad","1","stuk"],["kruidnagel","1","stuk"]],"steps":["Snijd de sukade in blokjes van 3 cm en leg ze in een kom met de azijn, 50 ml water, het laurierblad, de kruidnagel, peper en zout. Laat minstens 1 uur en liefst een nacht marineren in de koelkast.","Snijd de ui in halve ringen en bak hem 8 minuten zacht in een klontje boter in een stoofpan op middelhoog vuur.","Haal het vlees uit de marinade (bewaar de marinade) en dep het droog. Schuif de ui opzij, zet het vuur hoog en bak het vlees rondom bruin.","Schenk de marinade erbij, roer de stroop erdoor en breng aan de kook. Laat 2 uur met het deksel op de pan stoven op het laagste vuur, tot het vlees zacht is.","Verkruimel de ontbijtkoek erover, roer door en laat nog 10 minuten pruttelen zodat de saus bindt. Proef: te zuur? Voeg dan nog wat stroop toe.","Verwijder laurier en kruidnagel en serveer met aardappelpuree of friet en appelmoes."]},{"id":373,"name":"Zoeteaardappelgratin met chorizo en paddenstoelen","type":"Vlees","time":70,"emoji":"🍠","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/zoete-aardappelgratin","season":"herfst","ingredients":[["zoete aardappel","200","g"],["chorizo","50","g"],["paddenstoelen","50","g"],["slagroom","125","ml"],["geraspte belegen kaas","50","g"],["knoflook","1","teen"],["rucola","10","g"]],"steps":["Verwarm de oven voor op 200°C en vet een kleine ovenschaal in met boter.","Hak de knoflook fijn en breng hem met de slagroom in een steelpan zachtjes aan de kook. Haal van het vuur, laat 15 minuten trekken en kruid met peper en zout.","Schil de zoete aardappel en snijd hem met een mandoline in plakjes van 4 mm. Snijd de chorizo in blokjes en de paddenstoelen in dunne plakjes.","Leg een laag zoete aardappel in de schaal, bestrooi met zout en peper, schenk er wat room over en verdeel er kaas, chorizo en paddenstoelen over. Herhaal tot alles op is en eindig met room en kaas.","Dek af met aluminiumfolie en bak 35 minuten. Haal de folie eraf en bak nog 20 minuten tot de bovenkant goudbruin is en een mes makkelijk door de lagen gaat.","Laat 5 minuten rusten en serveer met de rucola en een scheutje olijfolie erover."]},{"id":374,"name":"Tagliatelle met boerenkool, pancetta en walnootkruim","type":"Vlees","time":25,"emoji":"🍝","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/boerenkool-recept","season":"winter","ingredients":[["tagliatelle","100","g"],["boerenkool","75","g"],["pancetta","40","g"],["walnoten","20","g"],["zuurdesembrood","25","g"],["knoflook","0.5","teen"]],"steps":["Breng een ruime pan water met zout aan de kook en kook de tagliatelle volgens de verpakking beetgaar. Bewaar een kopje kookvocht.","Bak de pancetta in een droge koekenpan op middelhoog vuur 4 minuten krokant. Voeg de fijngehakte knoflook toe en bak 1 minuut mee. Schep alles uit de pan.","Scheur het brood in stukken en bak het met de walnoten 3 minuten in het pancettavet tot ze kleuren. Hak grof tot een kruim en meng met de pancetta.","Roerbak de boerenkool in dezelfde pan met 1 eetlepel olijfolie 3 minuten op hoog vuur tot hij net geslonken is; langer maakt hem bitter. Kruid met peper en zout.","Giet de pasta af en meng hem met de boerenkool en een scheut kookvocht.","Verdeel over de borden, strooi het pancetta-walnootkruim erover en besprenkel met olijfolie."]},{"id":375,"name":"Skrei met chermoula uit de oven","type":"Vis","time":30,"emoji":"🐟","cuisine":"Marokkaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/skrei-chermoula","season":"winter","ingredients":[["skreifilet","150","g"],["krieltjes","250","g"],["citroen","0.25","stuk"],["knoflook","0.5","teen"],["peterselie","0.25","bosje"],["koriander","0.25","bosje"],["komijn","0.25","tl"],["gerookt paprikapoeder","0.25","tl"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes, meng ze met 1 eetlepel olijfolie en zout op een bakplaat en rooster ze 25 minuten.","Maal voor de chermoula de peterselie, koriander, knoflook, komijn, paprikapoeder, een snuf chilivlokken, het citroensap, 3 eetlepels olijfolie en zout in een keukenmachine tot een grove groene saus.","Dep de vis droog, leg hem in een ingevette ovenschaal en bestrijk hem dik met de chermoula.","Schuif de vis na 12 minuten bij de krieltjes in de oven en bak 12 tot 15 minuten, afhankelijk van de dikte, tot het visvlees net ondoorzichtig is en in vlokken uiteenvalt.","Serveer de skrei met de krieltjes, een partje citroen en een frisse salade."]},{"id":376,"name":"Spaanse mosselen met chorizo en tomaat","type":"Vis","time":25,"emoji":"🦪","cuisine":"Spaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/spaanse-mosselen","season":"herfst","ingredients":[["mosselen","750","g"],["chorizo","25","g"],["ui","0.25","stuk"],["knoflook","0.5","teen"],["rode peper","0.25","stuk"],["bleekselderij","0.25","stuk"],["tomatenblokjes","100","g"],["witte wijn","25","ml"]],"steps":["Spoel de mosselen onder koud water en gooi kapotte exemplaren en mosselen die open blijven staan weg.","Snipper de ui, hak knoflook en rode peper (zonder zaadlijsten) fijn en snijd chorizo en bleekselderij in blokjes.","Verhit 1 eetlepel olijfolie in een grote pan met deksel op middelhoog vuur en fruit ui, knoflook en peper 3 minuten. Voeg chorizo en bleekselderij toe en bak 3 minuten tot de chorizo zijn rode olie loslaat.","Blus af met de witte wijn, voeg de tomatenblokjes toe en breng op smaak met peper en zout. Laat 3 minuten pruttelen.","Voeg de mosselen toe, leg het deksel op de pan en kook 5 tot 6 minuten op hoog vuur; schud de pan tussendoor. Ze zijn klaar als de schelpen open staan. Dichte schelpen gooi je weg.","Bestrooi met peterselie en serveer met brood en aioli."]},{"id":377,"name":"Gewokte mosselen met oestersaus en zeekraal","type":"Vis","time":20,"emoji":"🥢","cuisine":"Aziatisch","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/gewokte-mosselen","season":"herfst","ingredients":[["mosselen","750","g"],["zeekraal","25","g"],["ui","0.25","stuk"],["knoflook","0.5","teen"],["rode peper","0.25","stuk"],["sojasaus","0.5","el"],["oestersaus","0.25","el"],["limoen","0.25","stuk"]],"steps":["Spoel de mosselen onder koud water, verwijder de baarden en gooi kapotte of openstaande exemplaren weg.","Snipper de ui en hak knoflook en rode peper (zonder zaadlijsten) fijn.","Verhit 1 eetlepel olie in een wok op hoog vuur en roerbak ui, knoflook en peper 2 minuten.","Voeg sojasaus, oestersaus en een scheutje water toe en laat kort bubbelen.","Doe de mosselen en de zeekraal erbij, schep om en leg het deksel op de wok. Laat 5 tot 6 minuten garen en schud de wok tussendoor, tot alle schelpen open staan.","Serveer met partjes limoen en witte rijst of brood om de saus mee op te scheppen."]},{"id":378,"name":"Vispastei met garnalen, zalm en bladerdeeg","type":"Vis","time":70,"emoji":"🥧","cuisine":"Brits","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/vispastei","season":"winter","ingredients":[["garnalen","100","g"],["zalmfilet","50","g"],["kabeljauwfilet","90","g"],["prei","0.25","stuk"],["ui","0.25","stuk"],["bladerdeeg","1","plak"],["slagroom","50","ml"],["visbouillon","150","ml"]],"steps":["Verwarm de oven voor op 200°C. Snipper de ui en snijd de prei in dunne ringen. Pel de garnalen als ze ongepeld zijn en bewaar de schalen.","Fruit ui en prei met een snuf venkelzaad 3 minuten in 1 eetlepel olijfolie op laag vuur. Voeg eventuele garnalenschalen toe en bak 5 minuten op hoog vuur, roer 1 theelepel tomatenpuree erdoor en schenk de visbouillon erbij. Laat 15 minuten koken en zeef de bouillon.","Smelt 15 g boter in een pan, roer 15 g bloem erdoor en bak 2 minuten. Schenk de bouillon er al roerend bij, voeg de slagroom toe en kook in 5 minuten tot een dikke saus. Roer er fijngehakte dille door en kruid met peper en zout.","Snijd de zalm en kabeljauw in stukken van 3 cm. Schenk de saus in een ovenschaal en leg vis en garnalen erin.","Leg het bladerdeeg over de schaal, druk de randen aan en snijd een paar stoomgaatjes in het deeg. Bestrijk met losgeklopt ei.","Bak 35 tot 40 minuten tot het deeg hoog en goudbruin is. Laat 5 minuten staan en serveer met doperwten."]},{"id":379,"name":"Zalm en croûte met geitenkaas en kruiden","type":"Vis","time":45,"emoji":"🥐","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/recept-zalm-en-croute","season":"winter","ingredients":[["zalmfilet","200","g"],["bladerdeeg","2","plak"],["zachte geitenkaas","60","g"],["citroen","0.25","stuk"],["peterselie","0.25","bosje"],["dille","0.25","bosje"],["ei","0.25","stuk"]],"steps":["Verwarm de oven voor op 200°C. Hak peterselie en dille fijn en roer ze met het citroensap, peper en zout door de geitenkaas tot een smeuïge vulling.","Leg de plakken bladerdeeg overlappend op bakpapier en rol ze tot één lap, ruim twee keer zo groot als de zalm.","Dep de zalm droog, kruid met peper en zout en leg hem op de ene helft van het deeg. Verdeel de geitenkaasvulling over de bovenkant.","Klop het ei los en bestrijk de deegranden. Vouw het deeg over de zalm, druk de randen dicht met een vork en snijd de bovenkant drie keer licht in. Bestrijk met de rest van het ei.","Bak 20 tot 25 minuten op een voorverwarmde bakplaat tot het deeg goudbruin is en de zalm net gaar.","Laat 5 minuten rusten, snijd in plakken en serveer met geroosterde wortels of een salade."]},{"id":380,"name":"Venkelrisotto met gerookte zalm en kappertjes","type":"Vis","time":50,"emoji":"🍚","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/venkel-risotto-gerookte-zalm","season":"altijd","ingredients":[["risottorijst","75","g"],["gerookte zalm","50","g"],["venkel","0.5","stuk"],["ui","0.25","stuk"],["witte wijn","25","ml"],["groentebouillon","250","ml"],["citroen","0.5","stuk"],["kappertjes","0.5","el"]],"steps":["Snijd de venkel schoon. Schaaf een kwart in flinterdunne plakjes en meng die met 1 theelepel olijfolie, een scheut citroensap, peper en zout; zet koud weg. Snijd de rest in kleine blokjes. Snipper de ui. Verwarm de bouillon.","Verhit 1 eetlepel olijfolie in een hapjespan op laag vuur en bak ui en venkelblokjes 6 minuten zacht zonder te kleuren.","Voeg de rijst toe en bak 2 minuten op middelhoog vuur tot de korrels glazig zijn. Blus af met de witte wijn en roer tot hij is opgenomen.","Voeg de hete bouillon soeplepel voor soeplepel toe en roer regelmatig; wacht steeds tot het vocht is opgenomen. Na 18 tot 20 minuten is de risotto romig en beetgaar.","Roer 20 g parmezaan, een klontje boter en de rasp en het sap van de rest van de citroen erdoor. Breng op smaak met peper.","Snijd de gerookte zalm in reepjes en schep die er luchtig door. Serveer met de rauwe venkelplakjes en de kappertjes erbovenop."]},{"id":381,"name":"Kabeljauw in pancetta met geroosterde cherrytomaten","type":"Vis","time":25,"emoji":"🐟","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kabeljauw-met-pancetta","season":"altijd","ingredients":[["kabeljauwfilet","150","g"],["pancetta","3","plak"],["cherrytomaten","125","g"],["knoflook","0.5","teen"],["krieltjes","200","g"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 200°C. Halveer de krieltjes, meng ze met 1 eetlepel olijfolie en zout en rooster ze 25 minuten op een bakplaat.","Leg de plakken pancetta licht overlappend naast elkaar op een snijplank. Kruid de kabeljauw met peper en een beetje zout, leg hem erop en vouw de pancetta strak om de vis.","Halveer de cherrytomaten en leg ze met de gekneusde knoflook in een ingevette ovenschaal. Leg de vis met de naad naar beneden ertussen en besprenkel alles met olijfolie en peper.","Schuif de schaal de laatste 12 minuten bij de krieltjes in de oven en bak tot de pancetta krokant is en de vis net ondoorzichtig.","Serveer de kabeljauw met de zachte tomaten, het braadvocht, de krieltjes en een partje citroen."]},{"id":382,"name":"Zalmfilet met dukkah en citroen","type":"Vis","time":30,"emoji":"🥜","cuisine":"Midden-Oosters","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/hele-zalm-met-dukkah","season":"altijd","ingredients":[["zalmfilet met huid","170","g"],["zuurdesembrood","15","g"],["amandelen","12","g"],["pistachenoten","7","g"],["sesamzaad","0.25","el"],["korianderzaad","0.25","tl"],["komijnzaad","0.25","tl"],["citroen","0.5","stuk"]],"steps":["Verwarm de oven voor op 180°C en bekleed een bakplaat met bakpapier.","Rooster amandelen, pistachenoten, sesamzaad, korianderzaad en komijnzaad met een snuf chilivlokken 3 minuten in een droge koekenpan op middelhoog vuur tot de noten kleuren.","Hak de noten en zaden met het brood in een hakmolen grof. Kneed er 1 eetlepel olijfolie en een snuf zout door tot een kruimige dukkah.","Leg de zalm met de huid naar beneden op de bakplaat, bestrooi met zout, rasp de schil van de citroen erover en besprenkel met het sap van de helft.","Druk de dukkah in een dikke laag op de zalm en bak 12 tot 15 minuten in het midden van de oven tot de zalm glazig is en in vlokken uiteenvalt.","Strooi er grof gehakte dille, peterselie en munt over en serveer met de rest van de citroen en een bulgursalade."]},{"id":383,"name":"Witte-aspergelasagne met citroen en pijnboompitten","type":"Vegetarisch","time":60,"emoji":"🍝","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/witte-asperge-lasagne","season":"lente","ingredients":[["witte asperges","375","g"],["lasagnebladen","4","stuk"],["melk","190","ml"],["bloem","20","g"],["roomboter","20","g"],["geraspte belegen kaas","25","g"],["citroen","0.75","stuk"],["pijnboompitten","15","g"]],"steps":["Verwarm de oven voor op 200°C. Schil de asperges, snijd het houtige uiteinde eraf en kook ze 5 minuten in ruim water met zout. Giet af en laat uitlekken.","Smelt de boter in een steelpan op laag vuur en fruit een kwart gesnipperde ui met een snuf venkelzaad 4 minuten. Roer de bloem erdoor en bak 2 minuten. Schenk de melk er in scheutjes bij en roer tot een gladde, dikke bechamel. Breng op smaak met peper en zout.","Schep een dun laagje saus in een ingevette ovenschaal. Leg er een lasagneblad op, dan saus, wat kaas, een laag asperges en citroenrasp. Herhaal tot alles op is en eindig met saus, kaas en een rijtje asperges.","Bak de lasagne 30 tot 35 minuten in het midden van de oven. Zet de laatste 5 minuten de grill aan zodat de bovenkant goudbruin kleurt.","Rooster intussen de pijnboompitten 3 minuten in een droge koekenpan op middelhoog vuur.","Laat de lasagne 5 minuten rusten. Strooi er de pijnboompitten, 1 eetlepel kappertjes en wat basilicumblaadjes over en serveer met een partje citroen."]},{"id":384,"name":"Plaattaart met groene asperges, ricotta en doperwten","type":"Vegetarisch","time":35,"emoji":"🥧","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/plaattaart-groene-asperges","season":"lente","ingredients":[["bladerdeeg","2","plak"],["groene asperges","125","g"],["doperwten","60","g"],["ricotta","125","g"],["parmezaan","15","g"],["citroen","0.25","stuk"],["basilicum","0.25","bosje"]],"steps":["Verwarm de oven voor op 200°C en bekleed een bakplaat met bakpapier. Leg de plakken bladerdeeg tegen elkaar op de plaat en druk de naad aan.","Kerf met de achterkant van een mes een rand van 1 cm in het deeg zonder erdoorheen te snijden en prik het binnenvlak in met een vork.","Meng de ricotta met de geraspte parmezaan en de rasp van de citroen. Breng op smaak met peper en zout en smeer driekwart ervan binnen de rand over het deeg.","Snijd het houtige uiteinde van de asperges en halveer dikke exemplaren in de lengte. Hussel ze met de ontdooide doperwten, 1 eetlepel olijfolie, peper en zout en verdeel ze over de ricotta.","Bak de plaattaart 20 tot 25 minuten in het midden van de oven tot het deeg goudbruin en knapperig is.","Schep de rest van de ricotta in toefjes op de taart, strooi er basilicumblaadjes over en serveer meteen."]},{"id":385,"name":"Green goddess salade met geroosterde broccoli en asperges","type":"Vegetarisch","time":40,"emoji":"🥦","cuisine":"Amerikaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/green-goddess-salade","season":"lente","ingredients":[["broccoli","125","g"],["groene asperges","50","g"],["doperwten","25","g"],["little gem","0.5","stuk"],["spinazie","10","g"],["cashewnoten","10","g"],["basilicum","0.25","bosje"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 200°C. Snijd de broccoli in kleine roosjes en het houtige uiteinde van de asperges af. Hussel ze op een bakplaat met 1 eetlepel olijfolie, peper en zout en rooster ze 15 tot 20 minuten tot de randjes bruin kleuren. Schep halverwege om.","Week de cashewnoten 10 minuten in heet water. Overgiet de doperwten in een kom met kokend water, laat 4 minuten staan en giet af.","Pureer voor de dressing de uitgelekte cashewnoten met de spinazie, de basilicum, een halve teen knoflook, een halve sjalot, de rasp en het sap van de citroen, 1 eetlepel rijstazijn en 2 eetlepels olijfolie met een staafmixer glad. Voeg een scheut water toe als de dressing te dik is en breng op smaak met peper en zout.","Haal de blaadjes van de little gem los en snijd een kwart rode ui in dunne halve ringen.","Meng de sla, ui, doperwten en de geroosterde groenten in een schaal. Schep de groene dressing erdoor of serveer hem apart en strooi er wat extra basilicum over."]},{"id":386,"name":"Artisjoksalade met linzen en geitenkaas","type":"Vegetarisch","time":25,"emoji":"🥗","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/artisjok-salade","season":"lente","ingredients":[["artisjokharten (pot)","140","g"],["linzen (blik)","100","g"],["rode ui","0.5","stuk"],["bleekselderij","1","stuk"],["komkommer","0.25","stuk"],["gemengde sla","30","g"],["zachte geitenkaas","40","g"],["balsamicoazijn","2","el"]],"steps":["Laat de linzen uitlekken en spoel ze af in een vergiet. Laat ook de artisjokharten uitlekken en halveer ze.","Snipper de rode ui zo fijn mogelijk. Verwarm in een steelpan de balsamicoazijn met 1 eetlepel olijfolie en de ui en laat 3 minuten zachtjes pruttelen op laag vuur. Breng op smaak met peper en zout.","Schep de linzen en artisjokharten door de warme dressing en laat ze minstens 15 minuten marineren, langer mag.","Snijd intussen de bleekselderij in dunne boogjes en de komkommer in blokjes.","Verdeel de gemarineerde linzen en artisjokken over een bord, schep de sla, komkommer en bleekselderij erdoor en verkruimel de geitenkaas erover. Maak af met 1 theelepel kappertjes en wat basilicumblaadjes en serveer direct."]},{"id":387,"name":"Fattoush met krokant platbrood, radijs en granaatappel","type":"Vegetarisch","time":25,"emoji":"🥗","cuisine":"Midden-Oosters","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/fattoush-salade","season":"lente","ingredients":[["platbrood","0.5","stuk"],["romaine sla","0.5","stuk"],["komkommer","0.25","stuk"],["radijs","2","stuk"],["bosui","1","stuk"],["granaatappelpitten","20","g"],["Griekse yoghurt","2","el"],["peterselie","0.25","bosje"]],"steps":["Scheur het platbrood in stukken van een paar centimeter. Verhit een laag zonnebloemolie van 1 cm in een koekenpan op middelhoog vuur en frituur het brood in 1 tot 2 minuten goudbruin en knapperig. Laat uitlekken op keukenpapier en bestrooi direct met zout en 1 theelepel za'atar.","Snijd de sla in repen, de komkommer in halve plakjes en de radijsjes in parten. Snijd de bosui in ringetjes en hak de peterselie grof.","Roer voor de dressing de yoghurt los met 1 eetlepel citroensap, 1 eetlepel olijfolie, een halve geperste teen knoflook, peper en zout.","Verdeel de sla, komkommer, radijs, bosui en peterselie over een bord en leg het krokante brood erop.","Besprenkel met de yoghurtdressing, strooi er de granaatappelpitten en een snuf chilivlokken over en serveer meteen, voordat het brood zacht wordt."]},{"id":388,"name":"Aardappelsalade met sperziebonen, ei en kruidenmayonaise","type":"Vegetarisch","time":25,"emoji":"🥔","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/aardappel-salade-met-kruidendressing","season":"lente","ingredients":[["krieltjes","125","g"],["sperziebonen","50","g"],["ei","1","stuk"],["sjalot","0.5","stuk"],["mayonaise","1.5","el"],["mosterd","1","tl"],["witte wijnazijn","1.5","el"],["dille","0.25","bosje"]],"steps":["Boen de krieltjes schoon en halveer ze. Kook ze in water met zout in 12 tot 15 minuten gaar en giet af.","Snipper de sjalot fijn en laat hem 7 minuten trekken in een halve eetlepel witte wijnazijn, zo wordt hij mild en licht ingelegd.","Maak de sperziebonen schoon en kook ze 4 minuten beetgaar. Spoel ze direct koud zodat ze felgroen blijven.","Kook het ei 7 minuten, laat het schrikken onder koud water en pel het.","Pureer de dille met wat peterselie en bieslook, de mayonaise, de mosterd en de rest van de azijn tot een groene kruidenmayonaise. Breng op smaak met peper en zout.","Hussel de lauwwarme krieltjes en sperziebonen door de kruidenmayonaise. Schep de salade op een bord, leg het ei in kwarten erop en strooi de ingelegde sjalot erover."]},{"id":389,"name":"Kisir: Turkse bulgursalade met granaatappelmelasse","type":"Vegetarisch","time":25,"emoji":"🍅","cuisine":"Turks","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kisir","season":"zomer","ingredients":[["bulgur","50","g"],["groentebouillon","100","ml"],["tomaat","1","stuk"],["cherrytomaten","50","g"],["bosui","0.5","stuk"],["tomatenpuree","1","el"],["granaatappelmelasse","0.5","el"],["peterselie","0.25","bosje"]],"steps":["Breng de bouillon aan de kook, voeg de bulgur toe en kook hem met de deksel op de pan in 12 tot 15 minuten op laag vuur gaar. Roer de korrels los met een vork.","Snijd de tomaat in kleine blokjes en halveer de cherrytomaten. Snijd de bosui in ringen en hak de peterselie en een paar blaadjes munt fijn.","Fruit een kwart gesnipperde ui met een halve teen knoflook 3 minuten in 1 eetlepel olijfolie op middelhoog vuur. Voeg de tomatenpuree, een halve theelepel komijn, een snuf paprikapoeder en een snuf chilivlokken toe en bak 2 minuten mee.","Schep het uienmengsel door de warme bulgur en breng op smaak met de granaatappelmelasse en zout.","Roer de tomaten, bosui, munt en peterselie erdoor en laat de kisir lauw worden. Serveer met een partje citroen en, voor een complete maaltijd, met wat yoghurt en platbrood."]},{"id":390,"name":"Teriyaki-courgette met taugé en pinda's","type":"Vegetarisch","time":20,"emoji":"🥒","cuisine":"Japans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/teriyaki-courgette","season":"zomer","ingredients":[["courgette","0.75","stuk"],["rode peper","0.25","stuk"],["taugé","50","g"],["pindanoten","20","g"],["sojasaus","25","ml"],["gember","5","g"],["basilicum","0.25","bosje"],["rijst","75","g"]],"steps":["Kook de rijst volgens de verpakking. Hak een halve teen knoflook fijn en rasp de gember.","Doe de sojasaus met 25 ml water, 1 theelepel bruine suiker, de knoflook en de gember in een steelpan en verwarm op laag vuur tot de suiker is opgelost. Roer 1 theelepel maizena los met een scheutje water, voeg toe en laat 5 minuten zachtjes koken tot de saus dikker wordt. Roer er van het vuur af 1 theelepel sesamolie door.","Snijd de courgette in grove stukken en de rode peper in fijne ringetjes, zonder zaadjes als je het milder wilt.","Verhit 1 eetlepel olie in een wok op hoog vuur. Bak een kwart gesnipperde ui met de peper 2 minuten en bak dan de courgette 5 minuten rondom bruin.","Schenk de teriyakisaus erbij en schep 1 minuut om tot de saus aan de courgette plakt.","Serveer de courgette op de rijst met de taugé, grof gehakte pinda's en gescheurde basilicum en munt."]},{"id":391,"name":"Panzanella: Italiaanse broodsalade met tomaat en basilicum","type":"Vegetarisch","time":20,"emoji":"🍅","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/makkelijke-maaltijd-italiaanse-broodsalade","season":"zomer","ingredients":[["turks brood","90","g"],["tomaat","125","g"],["rode ui","0.25","stuk"],["knoflook","0.5","teen"],["parmezaan","10","g"],["basilicum","0.25","bosje"],["olijfolie","2","el"]],"steps":["Verwarm de oven voor op 200°C. Scheur het brood in stukken van 2 cm en leg ze in een ovenschaal.","Snijd de rode ui in dunne parten en halveer de grote tomaten of laat kleine heel. Voeg ze bij het brood.","Pers de knoflook erboven uit, besprenkel royaal met de olijfolie en strooi er de blaadjes van een takje tijm, peper en zout over. Hussel alles door elkaar.","Rooster 10 tot 15 minuten in de oven tot het brood krokant is en de tomaten beginnen te barsten en sap afgeven.","Schep de lauwwarme salade om zodat het brood het tomatensap opneemt. Maak af met gescheurde basilicum, parmezaanschaafsel en een scheutje olijfolie."]},{"id":392,"name":"Courgetterolletjes met spinazie en feta in tomatensaus","type":"Vegetarisch","time":40,"emoji":"🫑","cuisine":"Grieks","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/courgette-rolletjes","season":"zomer","ingredients":[["courgette","0.5","stuk"],["spinazie","75","g"],["feta","50","g"],["tomatenblokjes (blik)","200","g"],["ui","0.5","stuk"],["knoflook","1","teen"],["pijnboompitten","10","g"],["rozijnen","6","g"]],"steps":["Snijd de courgette in de lengte in plakken van een halve centimeter, het liefst met een mandoline. Grill ze in een hete grillpan op hoog vuur 2 minuten per kant tot er strepen op staan.","Rooster de pijnboompitten 2 minuten in een droge koekenpan. Snipper de ui en hak de knoflook fijn.","Fruit de helft van de ui en knoflook 2 minuten in 1 eetlepel olijfolie op middelhoog vuur. Voeg de spinazie toe en laat hem al omscheppend slinken. Roer de rozijnen en pijnboompitten erdoor en breng op smaak met peper en zout.","Snijd de feta in dunne staafjes. Verdeel het spinaziemengsel over de courgetteplakken, leg op elk een staafje feta en een paar naaldjes rozemarijn, rol op en zet vast met een prikker.","Fruit de rest van de ui en knoflook in dezelfde pan, voeg de tomatenblokjes en 1 theelepel gedroogde oregano toe en kook 10 minuten op hoog vuur in tot een dikke saus. Breng op smaak met peper en zout.","Leg de rolletjes in de saus, zet het vuur laag en warm ze afgedekt 5 tot 7 minuten door. Serveer met orzo, rijst of knapperig brood."]},{"id":393,"name":"Salade Lyonnaise met krieltjes, spek en zachtgekookt ei","type":"Vlees","time":30,"emoji":"🥓","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/salade-lyonnaise","season":"lente","ingredients":[["krieltjes","100","g"],["spekreepjes","60","g"],["ei","1","stuk"],["little gem","1","stuk"],["rode ui","0.25","stuk"],["ansjovis","2","filet"],["mosterd","1","tl"],["witte wijnazijn","0.5","el"]],"steps":["Klop voor de dressing de mosterd met de witte wijnazijn en 1,5 eetlepel olijfolie. Roer er een halve fijngesneden sjalot, een kwart teen knoflook en wat gehakte peterselie en dragon door.","Kook het ei 6,5 minuut zodat de dooier nog zacht is. Laat het schrikken onder koud water en pel het.","Boen de krieltjes schoon, snijd ze in parten en kook ze in 12 minuten gaar in water met zout. Giet af en schep ze warm door de dressing, zo trekt de smaak erin.","Bak de spekreepjes in een droge koekenpan op middelhoog vuur in 5 minuten knapperig.","Halveer de little gem en haal de blaadjes los. Snijd de rode ui in flinterdunne ringen.","Leg de slablaadjes op een bord, verdeel de krieltjes, spekjes en ansjovis erover en leg het gehalveerde ei erbij. Garneer met de rode ui en wat extra kruiden en maal er peper over."]},{"id":394,"name":"Carpaccio met basilicummayonaise, rucola en pijnboompitten","type":"Vlees","time":20,"emoji":"🥩","cuisine":"Italiaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/carpaccio-met-basilicummayonaise","season":"lente","ingredients":[["rundercarpaccio","60","g"],["zongedroogde tomaten","20","g"],["parmezaan","20","g"],["rucola","15","g"],["pijnboompitten","10","g"],["mayonaise","1","el"],["basilicum","0.25","bosje"],["citroen","0.25","stuk"]],"steps":["Pureer de mayonaise met de basilicumblaadjes en 1 theelepel citroensap met een staafmixer tot een felgroene basilicummayonaise. Breng op smaak met peper en zout.","Rooster de pijnboompitten 2 tot 3 minuten in een droge koekenpan op middelhoog vuur tot ze goudbruin zijn.","Leg de flinterdunne plakjes carpaccio dakpansgewijs op een groot bord en bestrooi met peper en een snuf zout.","Lepel de basilicummayonaise in dunne slierten over het vlees.","Snijd de zongedroogde tomaten in reepjes en verdeel ze met de rucola en de pijnboompitten over de carpaccio.","Schaaf er royaal parmezaan over en serveer met een partje citroen en knapperig brood, als lichte maaltijd op een warme avond."],"course":"voor"},{"id":395,"name":"Kip tandoori spiesjes met naan en raita","type":"Vlees","time":25,"emoji":"🍗","cuisine":"Indiaas","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kip-tandoori-spiesjes","season":"lente","ingredients":[["kipfilet","125","g"],["paprika","1","stuk"],["yoghurt","3","el"],["tandoorikruiden","2","tl"],["naan","1","stuk"],["rode ui","0.25","stuk"],["komkommer","0.25","stuk"],["munt","0.25","bosje"]],"steps":["Snijd de kipfilet in blokken van 3 cm. Meng 1 eetlepel yoghurt met de tandoorikruiden en een snuf zout, schep de kip erdoor en laat minstens 10 minuten marineren. Rijg de kip op 2 spiesjes.","Rasp een kwart van de komkommer, knijp het vocht eruit en roer het met de rest van de yoghurt, gehakte munt, een snuf komijn en zout tot een raita.","Snijd de paprika in grove stukken. Verhit een grillpan op hoog vuur, grill de paprika 5 minuten tot hij geblakerde randjes heeft en haal hem uit de pan.","Grill de kipspiesjes 10 tot 12 minuten in dezelfde pan op middelhoog vuur, regelmatig draaiend, tot de kip gaar is en donkere grillstrepen heeft. In een airfryer op 180°C duurt dit 12 tot 15 minuten.","Warm het naanbrood 1 minuut per kant in de grillpan. Schaaf de rest van de komkommer in linten en snijd de rode ui in dunne halve ringen.","Leg het naan op een bord met de paprika en de kipspiesjes erop. Verdeel komkommer en ui erover en serveer met de raita en wat gehakte peterselie."]},{"id":396,"name":"Char siu: Chinese varkenshaasspiesjes met honing en hoisin","type":"Vlees","time":75,"emoji":"🍖","cuisine":"Chinees","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/char-siu","season":"lente","ingredients":[["varkenshaas","150","g"],["honing","1.5","el"],["sojasaus","1.5","el"],["hoisinsaus","1.5","el"],["rijstazijn","1","el"],["knoflook","1","teen"],["pindanoten","15","g"],["koriander","0.25","bosje"]],"steps":["Doe de honing, sojasaus, hoisinsaus en rijstazijn met een halve theelepel vijfkruidenpoeder en de geperste knoflook in een steelpan. Breng zachtjes aan de kook en laat 3 tot 4 minuten pruttelen tot een glanzende marinade. Breng op smaak met peper en zout en laat afkoelen.","Snijd de varkenshaas in blokken van 2 cm en meng ze in een afsluitbaar bakje met de marinade. Laat minstens 30 minuten, liever 2 uur, in de koelkast marineren.","Rijg het vlees op een spies en bewaar de marinade. Kook intussen een portie rijst volgens de verpakking.","Verhit de barbecue of een grillpan op hoog vuur. Grill de spies in 6 tot 8 minuten rondom bruin en net gaar, draai regelmatig en kwast tussendoor met de marinade zodat een plakkerig, licht geblakerd laagje ontstaat.","Hak de pinda's en koriander grof. Serveer de char siu op de rijst, bestrooid met pinda's en koriander en eventueel wat gestoomde paksoi."]},{"id":397,"name":"Kip in yoghurtmarinade met kikkererwtensalade en tahin","type":"Vlees","time":50,"emoji":"🥙","cuisine":"Midden-Oosters","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kip-in-yoghurt-marinade","season":"lente","ingredients":[["kipdijfilet","100","g"],["Griekse yoghurt","60","g"],["tahin","1.5","el"],["kikkererwten (blik)","100","g"],["feta","25","g"],["cherrytomaten","30","g"],["komkommer","0.25","stuk"],["platbrood","1","stuk"]],"steps":["Meng 40 g yoghurt met een halve eetlepel tahin, 1 theelepel baharat, peper en zout. Schep de kipdijfilet erdoor en laat minstens 30 minuten marineren.","Halveer de cherrytomaten, snijd de komkommer in blokjes en verkruimel de feta. Meng dit met de afgespoelde kikkererwten, wat fijngesneden ingelegde citroen of citroenrasp en geplukte koriander en munt. Besprenkel met olijfolie en breng op smaak met peper en zout.","Verhit een grillpan op middelhoog vuur met een beetje olijfolie. Bak de kip 8 tot 10 minuten, regelmatig kerend, tot hij goudbruin is met donkere randjes en gaar. Laat kort rusten en snijd in repen.","Roer voor de saus de rest van de tahin met de rest van de yoghurt en 1 eetlepel citroensap glad. Verdun met een scheutje water en breng op smaak met zout.","Warm het platbrood kort in de grillpan. Schep de kikkererwtensalade op een bord, leg de kip erop en serveer met het platbrood en de tahinsaus."]},{"id":398,"name":"Spiesjes met chorizo, halloumi, krieltjes en paprika","type":"Vlees","time":25,"emoji":"🍢","cuisine":"Spaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/vleesspiesjes-met-chorizo","season":"lente","ingredients":[["chorizo","60","g"],["halloumi","60","g"],["krieltjes","75","g"],["champignons","30","g"],["rode paprika","0.25","stuk"],["ui","0.25","stuk"],["rode wijnazijn","1","el"],["peterselie","0.25","bosje"]],"steps":["Kook de krieltjes 10 minuten voor in water met zout en laat ze uitlekken. Haal het vel van de chorizo en snijd hem in stukken van 3 cm. Snijd de halloumi en paprika in even grote stukken en de ui in parten.","Rijg chorizo, halloumi, paprika, ui, champignons en krieltjes om en om op 2 spiesen en bestrijk ze dun met olijfolie.","Verhit de barbecue of een grillpan op middelhoog vuur. Grill de spiesen 10 tot 12 minuten, regelmatig draaiend, tot de chorizo krokant is en de halloumi goudbruine strepen heeft.","Hak intussen de peterselie en wat basilicum fijn. Klop de rode wijnazijn met 2 eetlepels olijfolie, roer de kruiden erdoor en breng op smaak met peper en zout.","Lepel de kruidenolie over de warme spiesen en serveer met een groene salade of brood."]},{"id":399,"name":"Shaslick van de bbq met varkenshaas, spek en paprika","type":"Vlees","time":180,"emoji":"🍢","cuisine":"Oost-Europees","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/shashlick","season":"zomer","ingredients":[["varkenshaas","150","g"],["gerookt spek","60","g"],["rode ui","0.5","stuk"],["paprika","1","stuk"],["tomatenpuree","0.5","el"],["sojasaus","1","el"],["gerookt paprikapoeder","0.5","tl"],["platbrood","1","stuk"]],"steps":["Fruit een kwart gesnipperde ui met een halve teen knoflook 2 minuten in een scheutje olijfolie op middelhoog vuur. Roer de tomatenpuree en een halve theelepel bruine suiker erdoor, schenk de sojasaus en 25 ml water erbij en voeg het gerookte paprikapoeder en een halve theelepel gedroogde oregano toe. Laat 2 minuten zachtjes koken en laat de marinade afkoelen.","Snijd de varkenshaas in blokken van 2 cm, schep ze door de marinade en laat minstens 2 uur, liefst een halve dag, afgedekt in de koelkast marineren.","Snijd de paprika in stukken van 2 cm, het spek in dikke plakjes van 1 cm en de rode ui in kwarten die je uit elkaar haalt.","Rijg vlees, paprika, spek en ui om en om op 2 metalen spiesen.","Grill de spiesen op een hete barbecue of in een grillpan op middelhoog vuur in 8 tot 10 minuten gaar. Draai ze om de 2 minuten zodat het spek krokant wordt en de paprika blakert.","Roer wat Griekse yoghurt met geperste knoflook, zout en citroensap tot een frisse saus. Serveer de shaslick met de knoflooksaus en warm platbrood."]},{"id":400,"name":"Merguez met couscous, granaatappel en pistache","type":"Vlees","time":20,"emoji":"🌭","cuisine":"Marokkaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/couscous-met-merguez","season":"zomer","ingredients":[["merguez","2","stuk"],["couscous","75","g"],["geroosterde paprika uit pot","60","g"],["granaatappelpitten","20","g"],["pistachenoten","10","g"],["citroen","0.25","stuk"],["munt","0.25","bosje"],["peterselie","0.25","bosje"]],"steps":["Doe de couscous in een kom en schenk er 125 ml kokend water op, tot 1 cm boven de korrels. Dek af met een bord en laat 10 minuten staan.","Bak de merguez in een koekenpan met een scheutje olijfolie op middelhoog vuur in 8 tot 10 minuten rondom bruin en gaar. Draai ze regelmatig.","Hak intussen de pistachenoten grof, snijd de geroosterde paprika in reepjes en hak de munt en peterselie grof.","Roer de couscous los met een vork en breng op smaak met het citroensap, een snuf chilivlokken en zout.","Schep de paprika, pistache en kruiden door de couscous en strooi er de granaatappelpitten over. Maak af met een scheut olijfolie en serveer met de merguez."]},{"id":401,"name":"Bavette van de bbq met bang bang saus","type":"Vlees","time":40,"emoji":"🥩","cuisine":"Aziatisch","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/bavette-van-de-bbq","season":"zomer","ingredients":[["bavette","150","g"],["sojasaus","0.5","el"],["knoflook","1","teen"],["sriracha","1","tl"],["gembersiroop","1","tl"],["citroen","0.25","stuk"],["mayonaise","1","el"],["bosui","1","stuk"]],"steps":["Hak een halve teen knoflook fijn en meng met de sojasaus, een halve theelepel sriracha, de gembersiroop, het citroensap en een halve eetlepel olie tot een marinade.","Snijd de bavette in blokken van 3 cm, schep ze door de marinade en laat minstens 30 minuten, liever langer, marineren.","Roer voor de bang bang saus de mayonaise met een halve theelepel sriracha, een kwart theelepel ahornsiroop, de rest van de knoflook fijngehakt en een kwart theelepel gerookt paprikapoeder tot een gladde saus.","Rijg het vlees op een spies. Grill op een hete barbecue of in een gloeiend hete grillpan in ongeveer 5 minuten rondom bruin en vanbinnen rosé, draai elke minuut.","Laat de spies 3 minuten rusten. Serveer met de bang bang saus, de in ringetjes gesneden bosui, wat chilipeper en koriander en bijvoorbeeld rijst of een frisse salade."]},{"id":402,"name":"Flat iron steak spiesjes met champignons en maïsmole","type":"Vlees","time":45,"emoji":"🌽","cuisine":"Mexicaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/flat-iron-steak-spiesjes","season":"zomer","ingredients":[["flat iron steak","115","g"],["champignons","40","g"],["knoflook","1","teen"],["limoen","0.25","stuk"],["paprikapoeder","0.5","tl"],["maïs (blik)","75","g"],["avocado","0.25","stuk"],["rode ui","0.25","stuk"]],"steps":["Meng het paprikapoeder met een snuf gerookt paprikapoeder, een snuf kaneel, een snuf chilivlokken, een kwart theelepel gedroogde oregano, een snuf komijn en zout. Pers een halve teen knoflook erbij en roer 1 eetlepel olijfolie erdoor.","Dep de steak droog en snijd hem in plakken van 1 cm. Masseer de marinade in het vlees en laat 30 minuten marineren.","Pureer voor de maïsmole de uitgelekte maïs met de fijngesnipperde rode ui, het vruchtvlees van de avocado en de rest van de knoflook tot een grove, smeuïge massa. Breng op smaak met limoensap, peper en zout.","Snijd de champignons in dikke plakken en rijg ze om en om met de plakjes steak strak op een spies.","Grill de spies in een gloeiend hete grillpan of op de barbecue 3 tot 4 minuten, elke minuut draaiend, tot het vlees bruin is en vanbinnen nog rosé.","Strijk de maïsmole uit over een bord, leg de spies erop en bestrooi met gehakte koriander en chilivlokken. Geef er een partje limoen bij."]},{"id":403,"name":"Picanha uit de oven met paprikasalsa","type":"Vlees","time":120,"emoji":"🥩","cuisine":"Braziliaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/picanha-uit-de-oven","season":"zomer","ingredients":[["picanha","300","g"],["venkelzaad","0.5","tl"],["paprikapoeder","0.5","tl"],["knoflook","1","teen"],["limoen","0.5","stuk"],["rode paprika","0.25","stuk"],["tomaat","0.5","stuk"],["rode ui","0.25","stuk"]],"steps":["Stamp het venkelzaad in een vijzel met een halve teen knoflook en een halve theelepel grof zeezout tot een pasta. Meng er het paprikapoeder, een snufje cayennepeper en de rasp van de limoen door.","Dep de picanha droog en snijd de vetlaag kruislings in. Wrijf het vlees rondom in met de kruidenpasta en het vet extra met zoutvlokken. Laat 1 uur op kamertemperatuur staan en dep daarna droog.","Verwarm de oven voor op 100°C hetelucht. Verhit 1 eetlepel olijfolie in een ovenbestendige koekenpan en bak het vlees op de vetkant 8 tot 10 minuten op middelhoog vuur goudbruin. Keer om en bak nog 2 minuten.","Zet de pan 40 tot 45 minuten in de oven tot een kerntemperatuur van 57°C voor medium. Bedruip het vlees elke 15 minuten met het bakvet.","Snijd intussen de paprika en tomaat in blokjes van een halve centimeter en snipper de rode ui en de rest van de knoflook. Meng met het limoensap, wat fijngesneden rode peper, peper en zout tot een salsa.","Laat het vlees losjes onder folie 10 minuten rusten. Snijd het in plakken, schep de salsa erover en strooi er gehakte peterselie, koriander en basilicum over. Lekker met gebakken aardappeltjes."]},{"id":404,"name":"Spareribs van de bbq met soja-honingmarinade","type":"Vlees","time":180,"emoji":"🍖","cuisine":"Aziatisch","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/spareribs-marinade","season":"zomer","ingredients":[["spareribs","375","g"],["sojasaus","1","el"],["gember","5","g"],["knoflook","1","teen"],["mirin","0.5","el"],["honing","0.5","el"],["sriracha","1","tl"],["limoen","0.25","stuk"]],"steps":["Hak de knoflook en gember fijn en meng ze met de sojasaus, mirin, honing, sriracha en het limoensap tot een marinade.","Trek het vlies van de botkant van de spareribs, spoel het vlees af en dep het droog. Kwast de ribs royaal in met de marinade en bewaar de rest. Laat ze minstens 1 uur, liefst een nacht, afgedekt in de koelkast marineren.","Verwarm de oven voor op 130°C. Leg de ribs met de holle kant naar beneden op een bakplaat met bakpapier, schenk een laagje water op de plaat voor stoom en kwast nogmaals met marinade.","Dek af met aluminiumfolie en gaar de ribs 2 uur in de oven. Smeer ze halverwege nog eens in met de resterende marinade.","Verhit de barbecue tot 180°C of een grillpan op middelhoog vuur. Grill de ribs 20 tot 30 minuten, regelmatig kerend en kwastend, tot het vlees plakkerig en geblakerd is en bijna van het bot valt.","Snijd de ribs tussen de botten door en serveer met koolsalade en een maïskolf."]},{"id":405,"name":"Plaattaart met witte asperges, gerookte zalm en ei","type":"Vis","time":40,"emoji":"🥧","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/plaattaart-met-asperges","season":"lente","ingredients":[["bladerdeeg","2","plak"],["witte asperges","200","g"],["crème fraîche","50","g"],["gerookte zalm","50","g"],["ei","1","stuk"],["dille","0.25","bosje"],["peterselie","0.25","bosje"],["citroen","0.25","stuk"]],"steps":["Schil de asperges, snijd het houtige uiteinde eraf en kook ze 5 minuten in water met zout. Laat uitlekken en dep droog.","Verwarm de oven voor op 200°C. Hak de peterselie en de helft van de dille fijn en roer ze door de crème fraîche met peper, zout en wat citroenrasp.","Leg de plakken bladerdeeg tegen elkaar op een bakplaat met bakpapier. Kerf een rand van 1 cm in en prik het midden in met een vork.","Smeer driekwart van de crème fraîche binnen de rand over het deeg en leg de asperges er netjes naast elkaar op. Bak de plaattaart 20 tot 25 minuten tot het deeg hoog en goudbruin is.","Kook intussen het ei 7 minuten, laat het schrikken, pel en halveer het.","Beleg de warme taart met de gerookte zalm en het ei, lepel de rest van de crème fraîche erover en strooi er dille over. Serveer met een partje citroen."]},{"id":406,"name":"Asperge-zalmspiesjes met spinaziestamp","type":"Vis","time":30,"emoji":"🐟","cuisine":"Nederlands","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/asperges-met-zalm","season":"lente","ingredients":[["zalmfilet","100","g"],["kruimige aardappelen","200","g"],["groene asperges","3","stuk"],["witte asperges","2","stuk"],["spinazie","25","g"],["dille","0.25","bosje"],["crème fraîche","60","g"],["citroen","0.5","stuk"]],"steps":["Schil de aardappelen, snijd ze in grove stukken en kook ze in 15 minuten gaar in water met zout.","Schil de witte asperges en snijd van alle asperges het houtige uiteinde af. Snijd ze in stukken van 4 cm en kook ze 4 minuten. Giet af.","Snijd de zalm in blokken van 3 cm en rijg ze om en om met de asperges op 2 spiesen. Bestrooi met peper en zout en bestrijk dun met olijfolie.","Giet de aardappelen af en stamp ze met de crème fraîche en de fijngehakte dille tot een smeuïge puree. Schep de spinazie erdoor tot hij slinkt en breng op smaak met peper en zout. Houd warm onder een deksel.","Verhit een grillpan op hoog vuur en grill de spiesen 2 minuten per kant tot de zalm net gaar is en grillstrepen heeft.","Verdeel de spinaziestamp over een bord, leg de spiesen erop en knijp er citroensap over."]},{"id":407,"name":"Salade met gerookte zalm, gegrilde asperges en ingelegde biet","type":"Vis","time":35,"emoji":"🥗","cuisine":"Europees","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/salade-met-gerookte-zalm","season":"lente","ingredients":[["gerookte zalm","50","g"],["rode biet","0.5","stuk"],["groene asperges","90","g"],["gemengde sla","75","g"],["mayonaise","1","el"],["mierikswortel","0.5","tl"],["appelazijn","50","ml"],["kappertjes","0.5","el"]],"steps":["Boen de biet schoon en schaaf hem in flinterdunne plakjes. Breng de appelazijn met 50 ml water en 10 g suiker aan de kook, laat 2 minuten koken en schenk het lauw over de biet. Laat minstens 15 minuten inleggen.","Klop de mayonaise met de mierikswortel, 1 theelepel crème fraîche, een halve eetlepel olijfolie en een scheutje van het bietenvocht tot een gladde dressing.","Snijd het houtige uiteinde van de asperges, bestrijk ze met olijfolie en grill ze 1 tot 2 minuten rondom in een hete grillpan. Bestrooi met peper en zout.","Meng de sla met de asperges, de uitgelekte biet en de kappertjes op een bord.","Verdeel de gerookte zalm erover, zigzag de mierikswortelsaus eroverheen en strooi er gehakte dille over. Serveer met knapperig stokbrood."]},{"id":408,"name":"Kabeljauw van de bbq met tomatentapenade en courgette","type":"Vis","time":20,"emoji":"🐟","cuisine":"Mediterraan","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/kabeljauw-van-de-bbq","season":"zomer","ingredients":[["kabeljauwfilet","150","g"],["courgette","0.25","stuk"],["tomatentapenade","1","el"],["kappertjes","0.5","el"],["gedroogde oregano","0.25","tl"],["olijfolie","1","el"],["citroen","0.25","stuk"]],"steps":["Snijd de kabeljauw in grote stukken en schep ze door de tomatentapenade tot ze rondom bedekt zijn. Laat marineren terwijl je de rest voorbereidt.","Snijd de courgette in plakjes van een halve centimeter. Meng de olijfolie met de oregano, peper en zout en hussel de plakjes erdoor.","Verhit de barbecue tot middelhoog of zet de oven op grillstand 220°C. Leg de vis en de courgette in een aluminium bakje of op een stuk bakpapier en leg er een takje verse oregano tussen.","Zet het bakje op het rooster en gril 8 tot 10 minuten tot de vis glazig en net gaar is. Schep halverwege de courgette om.","Bestrooi met de kappertjes en serveer met een partje citroen en brood of krieltjes."]},{"id":409,"name":"Langoustines van de bbq met kruidenolie","type":"Vis","time":25,"emoji":"🦐","cuisine":"Frans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/langoustine-met-kruidenolie","season":"zomer","ingredients":[["langoustines","250","g"],["citroen","0.25","stuk"],["peterselie","0.25","bosje"],["bieslook","0.25","bosje"],["dille","0.25","bosje"],["olijfolie","2","el"],["stokbrood","0.25","stuk"]],"steps":["Leg de langoustines met de buik naar beneden en snijd ze met een scherp mes over de rug in de lengte doormidden. Verwijder het darmkanaal en het maagzakje in de kop, spoel kort af en dep droog.","Hak de peterselie, bieslook en dille fijn. Meng ze met de rasp en het sap van de citroen, de olijfolie, peper en zout tot een kruidenolie.","Verhit de barbecue of een grillpan op hoog vuur. Het rooster moet gloeiend heet zijn zodat de schalen niet plakken.","Bestrijk het vlees van de langoustines royaal met de kruidenolie en leg ze met de schaalkant op het rooster. Grill 2 tot 3 minuten tot het vlees net wit kleurt en loslaat van de schaal. Keer eventueel 30 seconden om voor extra rooksmaak, maar grill niet te lang.","Serveer direct met de rest van de kruidenolie, een partje citroen en het stokbrood of een frisse salade."]},{"id":410,"name":"Pulpo met krieltjes, chorizo en citroenaioli","type":"Vis","time":110,"emoji":"🦑","cuisine":"Spaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/pulpo","season":"zomer","ingredients":[["pulpo","200","g"],["krieltjes","125","g"],["chorizo","50","g"],["knoflook","1","teen"],["citroen","0.5","stuk"],["Griekse yoghurt","40","g"],["mayonaise","40","g"],["gerookt paprikapoeder","0.25","tl"]],"steps":["Spoel de pulpo af en leg hem in een ruime pan met water tot 2 cm boven de tentakels. Voeg een kwart citroen, een laurierblad en 40 ml witte wijn toe, breng aan de kook en laat op het laagste vuur 60 minuten zachtjes trekken tot een mes makkelijk in het dikke deel glijdt. Laat afkoelen in het kookvocht. Voorgekookte pulpo kun je direct grillen.","Verwarm de oven voor op 200°C. Halveer de krieltjes en snijd de chorizo in blokjes. Hussel de krieltjes met het gerookte paprikapoeder en 1 eetlepel olijfolie en rooster ze 30 minuten op een bakplaat. Schep halverwege om en bak de chorizo de laatste 10 minuten mee.","Roer de mayonaise en yoghurt glad met de rasp van de citroen en de geperste knoflook. Breng op smaak met peper en zout en zet koud.","Dep de tentakels droog, bestrijk ze met olijfolie en grill ze in een gloeiend hete grillpan 2 tot 3 minuten per kant tot ze knapperige, geblakerde randjes hebben.","Serveer de pulpo op de krieltjes met chorizo, met de citroenaioli, gehakte peterselie en dille en een partje citroen."]},{"id":411,"name":"Grote garnalen met chermoula en harissadip","type":"Vis","time":30,"emoji":"🍤","cuisine":"Marokkaans","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/grote-garnalen","season":"zomer","ingredients":[["garnalen","125","g"],["knoflook","0.5","teen"],["citroen","0.25","stuk"],["peterselie","0.25","bosje"],["koriander","0.25","bosje"],["harissa","0.5","tl"],["Griekse yoghurt","1","el"],["platbrood","1","stuk"]],"steps":["Maak de chermoula: pureer de peterselie en koriander met de knoflook, een kwart theelepel komijn, een snuf gerookt paprikapoeder, een snuf chilivlokken, zout, het sap van de citroen en 2 eetlepels olijfolie tot een grove kruidenpasta.","Pel de garnalen als dat nog nodig is en haal het darmkanaal eruit. Meng ze met de chermoula en laat ze het liefst 1 uur afgedekt in de koelkast marineren.","Roer de yoghurt met een halve eetlepel mayonaise en de harissa tot een pittige dip.","Verhit een grillpan of koekenpan op hoog vuur. Bak de garnalen 2 minuten per kant tot ze oranje en net gaar zijn.","Warm het platbrood kort in de pan. Serveer de garnalen met de harissadip, het brood en een partje citroen."]},{"id":412,"name":"Gewokte garnalen met noedels, groene asperges en watermeloen","type":"Vis","time":20,"emoji":"🍜","cuisine":"Aziatisch","source":"UPK","sourceUrl":"https://uitpaulineskeuken.nl/recept/noedels-met-garnalen","season":"zomer","ingredients":[["noedels","65","g"],["garnalen","75","g"],["groene asperges","2","stuk"],["watermeloen","40","g"],["edamame","25","g"],["komkommer","0.25","stuk"],["hoisinsaus","1","el"],["sriracha","0.5","el"]],"steps":["Kook de noedels volgens de verpakking, giet af en spoel ze koud zodat ze niet aan elkaar plakken.","Verhit 1 eetlepel olie in een wok op hoog vuur en wok de garnalen in 2 tot 3 minuten tot ze oranje en gaar zijn. Breng op smaak met peper en zout.","Schaaf de asperges met een dunschiller in lange linten. Snijd de watermeloen en komkommer in blokjes van 1 cm.","Meng de hoisinsaus door de noedels en schep de asperges, garnalen, komkommer en watermeloen erdoor.","Schep de noedels in een kom, leg de edamame en eventueel wat zeewiersalade ernaast, drizzle de sriracha erover en maak af met gescheurde Thaise basilicum."]},{"id":413,"name":"Strapatsada: Griekse roereieren met tomaat en feta","type":"Vegetarisch","time":20,"emoji":"🍳","cuisine":"Grieks","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/strapatsada/","ingredients":[["tomaat","2","stuk"],["ei","2","stuk"],["feta","50","g"],["knoflook","1","teen"],["brood","1","snee"],["olijfolie","1","el"],["oregano","0.5","tl"]],"steps":["Verhit de olijfolie in een koekenpan en bak de fijngehakte knoflook kort aan op middelhoog vuur.","Snijd de tomaten in blokjes, voeg ze toe en laat ze 10 minuten inkoken. Plet ze zodra ze zacht zijn tot een vuurrode saus.","Klop de eieren los en schenk ze al roerend bij de tomatensaus.","Blijf roeren tot de eieren net gestold zijn, verkruimel dan de feta erdoor en breng op smaak met peper en zout.","Rooster intussen het brood met één kant in olijfolie krokant in een hete pan.","Strooi de oregano over de strapatsada en serveer meteen met het geroosterde brood."],"photo":"photos/culy-413.webp","season":"zomer"},{"id":414,"name":"Gesmoorde halloumi met tomaat en bonen uit de oven","type":"Vegetarisch","time":45,"emoji":"🧀","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/gesmoorde-halloumi-recept-ottolenghi/","ingredients":[["halloumi","125","g"],["cherrytomaten","175","g"],["zwartoogbonen","120","g"],["knoflook","2","teen"],["citroen","0.5","stuk"],["tijm","3","takje"],["olijfolie","2","el"],["zaatar","0.5","tl"]],"steps":["Verwarm de oven voor op 180 graden.","Doe de cherrytomaten met de uitgelekte bonen, plakjes knoflook, de tijm, een paar repen citroenschil en het meeste van de olijfolie in een ovenschaal. Breng op smaak met peper en zout en meng.","Snijd de halloumi in plakken en leg ze tussen de bonen, zodat de kaas bovenop blijft. Besprenkel met de rest van de olijfolie.","Bak het geheel 30 tot 35 minuten tot de tomaten zijn ingestort en de halloumi goudbruin kleurt.","Meng intussen de rasp van de citroen met wat fijngehakte tijm en de zaatar.","Roer dit kruidenmengsel na het bakken voorzichtig door het gerecht en serveer met brood om de sappen op te deppen."],"photo":"photos/culy-414.webp"},{"id":415,"name":"Siciliaanse caponata met aubergine, olijven en kappertjes","type":"Vegetarisch","time":60,"emoji":"🍆","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/caponata-recept-aubergine-toscanini/","ingredients":[["aubergine","0.5","stuk"],["rode ui","0.5","stuk"],["tomatenblokjes","65","g"],["groene olijven","15","g"],["kappertjes","1","el"],["ansjovis","1","filet"],["rodewijnazijn","1","el"],["pijnboompitten","10","g"]],"steps":["Verwarm de oven voor op 200 graden. Snijd de aubergine in blokjes van 2 cm, bestrooi met zout en laat 20 minuten uitlekken op keukenpapier.","Dep de aubergine droog, hussel met olijfolie en rooster 25 minuten op een bakplaat tot de blokjes goudbruin en gaar zijn.","Fruit intussen de rode ui in een brede pan 15 minuten zacht en zoet. Voeg de tomatenblokjes toe en laat 15 minuten zachtjes koken.","Roer de olijven, kappertjes, fijngehakte ansjovis, rodewijnazijn en de geroosterde pijnboompitten erdoor en stoof een paar minuten door.","Haal van het vuur en schep de geroosterde aubergine erdoor. Besprenkel met wat goede olijfolie.","Proef en breng op smaak tot de caponata zoet en zuur tegelijk is. Serveer lauwwarm met brood."],"photo":"photos/culy-415.webp","season":"zomer"},{"id":416,"name":"Bulgursalade met geroosterde pompoen en granaatappel","type":"Vegetarisch","time":30,"emoji":"🥗","cuisine":"Midden-Oosters","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/bulgur-salade-met-pompoen-uit-arabia-bij-je-thuis/","ingredients":[["bulgur","75","g"],["flespompoen","150","g"],["granaatappelpitten","20","g"],["lente-ui","1","stuk"],["peterselie","0.25","bosje"],["pistachenoten","20","g"],["citroen","0.25","stuk"],["olijfolie","1","el"]],"steps":["Verwarm de oven voor op 200 graden. Kook de bulgur volgens de verpakking en meng met wat citroensap en olijfolie.","Snijd de flespompoen in dunne halve plakken, hussel met olijfolie en zout en rooster 10 tot 15 minuten goudbruin.","Rooster de pistachenoten kort mee in de oven, laat afkoelen en hak ze grof.","Snijd de lente-ui en peterselie fijn en pel de granaatappelpitten.","Meng de bulgur met de pompoen, lente-ui, peterselie, pistache en granaatappel.","Breng op smaak met extra citroensap, olijfolie en zout en serveer lauw of koud."],"photo":"photos/culy-416.webp","season":"herfst"},{"id":417,"name":"Ratatouille uit de oven met geroosterde paprikasaus","type":"Vegetarisch","time":90,"emoji":"🥘","cuisine":"Frans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/ratatouille-uit-de-oven-met-geroosterde-paprikasaus/","ingredients":[["rode paprika","0.5","stuk"],["aubergine","0.25","stuk"],["courgette","0.4","stuk"],["tomaat","1","stuk"],["ui","0.25","stuk"],["knoflook","0.5","teen"],["tomatenblokjes","80","g"],["olijfolie","1","el"]],"steps":["Verwarm de oven voor op 230 graden. Rooster de paprika 25 minuten tot de schil zwart is, laat afgedekt stomen en verwijder dan de schil en zaadlijsten.","Fruit de gesnipperde ui 5 minuten zacht in olijfolie en bak de knoflook 1 minuut mee.","Voeg de tomatenblokjes, de geroosterde paprika en een snuf suiker toe en kook 15 minuten. Pureer glad en breng op smaak met peper en zout.","Schep de saus op de bodem van een ovenschaal.","Snijd de aubergine, courgette en tomaat in flinterdunne plakjes en leg ze dakpansgewijs in een spiraal op de saus. Besprenkel met olijfolie, peper en zout.","Dek af met bakpapier en bak 1 uur op 135 graden tot de groenten zacht zijn maar hun vorm houden."],"photo":"photos/culy-417.webp"},{"id":418,"name":"Romige polenta met gebakken radijs, doperwten en pecorino","type":"Vegetarisch","time":25,"emoji":"🌽","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/polenta-radijsjes-doperwten/","ingredients":[["polenta","50","g"],["groentebouillon","250","ml"],["pecorino","20","g"],["radijs","0.5","bosje"],["doperwten","50","g"],["roomboter","20","g"],["melk","25","ml"]],"steps":["Breng de groentebouillon met de melk aan de kook en zet het vuur laag.","Strooi al roerend de polenta in een dun straaltje erbij om klontjes te voorkomen en laat hem al roerend dik en romig worden.","Roer de helft van de boter en de geraspte pecorino erdoor en breng op smaak met peper en zout. Houd warm onder een deksel.","Smelt de rest van de boter in een koekenpan en bak de gehalveerde radijsjes tot ze licht goudbruin en zacht worden.","Voeg de doperwten toe en bak 2 tot 3 minuten mee tot ze net gaar en felgroen zijn. Breng op smaak met peper en zout.","Schep de polenta op een bord, verdeel de radijs en doperwten erover en maak af met verse kruiden en extra pecorino."],"photo":"photos/culy-418.webp","season":"lente"},{"id":419,"name":"Griekse gebakken feta uit de oven met olijven","type":"Vegetarisch","time":25,"emoji":"🧀","cuisine":"Grieks","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/griekse-gebakken-feta-uit-de-oven/","ingredients":[["feta","100","g"],["olijfolie","2","el"],["kalamata olijven","25","g"],["cherrytomaten","50","g"],["rode ui","0.25","stuk"],["knoflook","1","teen"],["oregano","0.5","tl"],["citroen","0.25","stuk"]],"steps":["Verwarm de oven voor op 175 graden.","Leg de feta in het midden van een kleine ovenschaal en giet de olijfolie en het citroensap eromheen.","Verdeel de olijven, geplette knoflook en cherrytomaten rondom de feta en stop er stukjes rode ui tussen.","Bestrooi met de oregano, een snuf chilivlokken en zwarte peper.","Bak 20 minuten tot de olie bubbelt, en zet eventueel de laatste 5 minuten de grill aan voor een geblakerd randje.","Serveer de gebakken feta direct in de schaal met brood om te dippen."],"photo":"photos/culy-419.webp"},{"id":420,"name":"Pasta met chili crisp en boter","type":"Vegetarisch","time":20,"emoji":"🍝","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/pasta-met-chili-crisp/","ingredients":[["rigatoni","125","g"],["roomboter","30","g"],["chili crisp","1.5","el"],["basilicum","0.25","bosje"],["parmezaan","15","g"]],"steps":["Kook de rigatoni al dente in ruim gezouten water en bewaar een kopje pastawater.","Smelt de boter in een ruime pan op laag vuur tot hij net begint te schuimen.","Roer de chili crisp erdoor en laat heel kort warm worden zonder te bakken.","Voeg de pasta met een scheut pastawater toe en hussel tot alles glanst van de saus.","Snijd de basilicum in fijne sliertjes en roer die erdoor.","Serveer direct met geraspte parmezaan erover."],"photo":"photos/culy-420.webp"},{"id":421,"name":"Krokante tostadas met zwarte bonen en ingelegde ui","type":"Vegetarisch","time":40,"emoji":"🌮","cuisine":"Mexicaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/tostadas-met-zwarte-bonen/","ingredients":[["tortilla","2","stuk"],["zwarte bonen","200","g"],["ui","0.5","stuk"],["knoflook","2","teen"],["komijn","0.5","tl"],["radijs","75","g"],["zure room","1","el"],["limoen","0.5","stuk"]],"steps":["Verwarm de oven voor op 220 graden. Bestrijk de tortillas aan beide kanten met olie en bak ze 5 tot 8 minuten knapperig.","Bak de gesnipperde ui 8 minuten zacht in olie op laag vuur, voeg de knoflook en komijn toe en bak 2 minuten mee.","Doe de uitgelekte zwarte bonen erbij met een scheut bouillon en laat 10 minuten pruttelen tot bijna droog.","Pureer de bonen glad en bak ze nog 5 minuten in om in te dikken. Breng op smaak met zout en peper.","Besmeer de tostadas met een dikke laag bonenpuree en beleg met plakjes radijs en de ingelegde rode ui.","Druppel er wat zure room over en serveer met een partje limoen en verse koriander."],"photo":"photos/culy-421.webp"},{"id":422,"name":"Jukut urab: Balinese groentesalade met kokos","type":"Vegetarisch","time":30,"emoji":"🥗","cuisine":"Indonesisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/jukut-urab/","ingredients":[["spinazie","100","g"],["tauge","25","g"],["snijbonen","100","g"],["geschaafde kokos","15","g"],["sjalot","0.5","stuk"],["limoen","0.25","stuk"],["kurkuma","0.25","tl"],["gember","0.25","tl"]],"steps":["Maal voor de bumbu de sjalot, een teentje knoflook, de kurkuma, gember, een stukje rode peper en het limoensap met wat palmsuiker tot een pasta.","Bak de bumbu 5 minuten op middelhoog vuur tot hij geurt en laat volledig afkoelen.","Kook de spinazie, de tauge en de snijbonen apart kort in kokend water en schrik ze in ijswater.","Knijp het vocht uit de spinazie en hak die fijn. Snijd de snijbonen klein.","Meng de groenten met de geschaafde kokos, wat gebakken uitjes en 1 eetlepel van de bumbu.","Breng op smaak met extra zout, peper of bumbu en strooi er nog wat kokos over."],"photo":"photos/culy-422.webp"},{"id":423,"name":"Shepherd's pie met lamsgehakt en krokante aardappelpuree","type":"Vlees","time":80,"emoji":"🥧","cuisine":"Brits","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/shepherds-pie-recept/","ingredients":[["lamsgehakt","100","g"],["aardappelen","200","g"],["ui","0.25","stuk"],["wortel","0.25","stuk"],["doperwten","40","g"],["rode wijn","50","ml"],["runderbouillon","60","ml"],["cheddar","15","g"]],"steps":["Bak het lamsgehakt in olijfolie goudbruin en laat het vocht in ongeveer 10 minuten verdampen.","Voeg de gesnipperde ui, wortel in blokjes en wat bleekselderij toe en bak 3 minuten. Roer tomatenpuree, tijm en een laurierblad erdoor.","Blus af met de rode wijn, schraap de bodem los en laat inkoken. Voeg de bouillon toe en stoof de saus ongeveer 1 uur dik. Roer de doperwten er aan het eind door.","Verwarm de oven voor op 200 graden. Kook de aardappelen gaar en stamp ze met de cheddar, een scheut melk, boter en een eidooier tot een romige puree.","Schep het gehaktmengsel in een ovenschaal en verdeel de puree erover. Trek er met een vork een patroon in.","Bak de shepherd's pie 30 minuten tot de bovenkant goudbruin en krokant is."],"photo":"photos/culy-423.webp","season":"herfst"},{"id":424,"name":"Bang bang chicken met pittige sesamsaus","type":"Vlees","time":30,"emoji":"🍗","cuisine":"Chinees","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/bang-bang-chicken-met-pittige-sesamsaus/","ingredients":[["kipdijfilet","150","g"],["komkommer","0.25","stuk"],["tahin","1","el"],["chili crisp","0.5","el"],["sojasaus","0.5","el"],["knoflook","0.25","teen"],["sesamzaad","0.5","el"],["bosui","0.5","stuk"]],"steps":["Pocheer de kipdijfilet met een snuf zout 12 tot 15 minuten in zachtjes kokend water tot hij gaar is.","Haal de kip eruit, laat iets afkoelen en trek hem met twee vorken in grove slierten.","Meng de tahin, chili crisp, sojasaus, geraspte knoflook en een snuf suiker tot een saus. Roer er een paar eetlepels warm water door tot hij dik maar schenkbaar is.","Sla de komkommer met de platte kant van een mes kapot en snijd in dunne reepjes.","Verdeel de komkommer over een bord en leg de kip erop. Lepel de bang bang-saus er royaal overheen.","Bestrooi met fijngesneden bosui, sesamzaad en wat koriander."],"photo":"photos/culy-424.webp"},{"id":425,"name":"Mexicaans stoofvlees barbacoa met polenta","type":"Vlees","time":120,"emoji":"🥩","cuisine":"Mexicaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/mexicaans-stoofvlees-barbacoa/","ingredients":[["runderriblappen","250","g"],["chipotlepeper","0.5","el"],["rode ui","0.25","stuk"],["knoflook","1","teen"],["limoen","0.5","stuk"],["polenta","35","g"],["kippenbouillon","200","ml"],["koriander","0.25","bosje"]],"steps":["Verwarm de oven voor op 160 graden. Pureer de chipotlepeper met de rode ui, knoflook, een snuf komijn, wat koriander en het limoensap tot een saus.","Giet de saus in een ovenbestendige stoofpan, leg het vlees erop en giet er net genoeg kippenbouillon bij tot het vlees bijna onderstaat. Steek er een laurierblad bij.","Zet de pan ongeveer 5 uur in de oven tot het vlees uit elkaar valt, en trek het dan met twee vorken uiteen.","Kook intussen de polenta volgens de verpakking in bouillon tot hij gaar en romig is en roer er een klont boter door.","Leg een paar ringen rode ui in wat witte wijnazijn tot ze roze kleuren.","Smeer de polenta op een bord, schep het stoofvlees erop en garneer met koriander en de ingelegde rode ui."],"photo":"photos/culy-425.webp"},{"id":426,"name":"Turkse traybake met rijst en kip (tavuk kapama)","type":"Vlees","time":80,"emoji":"🍗","cuisine":"Turks","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/turkse-traybake-met-kip/","ingredients":[["kippendij","125","g"],["rijst","50","g"],["ui","0.75","stuk"],["puntpaprika","0.75","stuk"],["tomaat","40","g"],["knoflook","0.5","teen"],["kippenbouillon","100","ml"],["tomatenpuree","0.5","tl"]],"steps":["Verwarm de oven voor op 200 graden en was de rijst tot het water helder is.","Meng olijfolie met pul biber, gerookt paprikapoeder, oregano, komijn, de tomatenpuree, peper en zout tot een marinade.","Doe de uien in partjes, de knoflook en de kippendijen in een ovenschaal, schep de marinade erdoor en leg de puntpaprika's erbij. Bak 30 minuten.","Haal de kip en paprika's eruit, schep de gewassen rijst door de sappen in de schaal.","Leg de kip terug op de rijst met de tomaten en wat schijfjes citroen, giet de bouillon erover en bak nog 30 minuten tot de rijst en kip gaar zijn.","Bestrooi met grof gehakte peterselie en serveer."],"photo":"photos/culy-426.webp"},{"id":427,"name":"Snelle biefstuk met koffie- en chiliboter","type":"Vlees","time":15,"emoji":"🥩","cuisine":"Zuid-Amerikaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/snelle-biefstuk-met-koffie/","ingredients":[["biefstuk","1","stuk"],["roomboter","15","g"],["limoen","0.5","stuk"],["koriander","0.25","bosje"],["bosui","1","stuk"],["ahornsiroop","0.25","el"],["gemalen koffie","0.25","tl"],["chilivlokken","0.25","tl"]],"steps":["Laat de biefstuk op kamertemperatuur komen, dep droog en bestrooi beide kanten met flink zeezout.","Roer de olie, ahornsiroop, gemalen koffie, chilivlokken en veel peper tot een marinade en bestrijk het vlees met een deel ervan.","Verhit een koekenpan op hoog vuur en bak de biefstuk 2,5 minuut, keer om en bak de andere kant 2 minuten.","Leg de biefstuk op een plank en laat 8 minuten rusten.","Doe de boter, fijne bosui, koriander, het sap van een halve limoen en de rest van de marinade in de warme pan en draai rond tot de boter smelt.","Snijd de biefstuk dwars op de draad, bestrooi met zout en schep de boter erover."],"photo":"photos/culy-427.webp"},{"id":428,"name":"Romige orzo met prei en kipgehaktballetjes","type":"Vlees","time":30,"emoji":"🍝","cuisine":"Mediterraan","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/orzo-met-prei/","ingredients":[["kippengehakt","100","g"],["orzo","60","g"],["prei","0.5","stuk"],["parmezaan","10","g"],["paneermeel","10","g"],["kippenbouillon","190","ml"],["slagroom","15","ml"],["salie","0.25","el"]],"steps":["Meng het kippengehakt met geraspte ui, parmezaan, paneermeel en een ei en draai er kleine balletjes van.","Bak de balletjes in wat olie rondom goudbruin en gaar en schep ze uit de pan.","Smelt boter met fijngehakte knoflook en salie, voeg de dungesneden prei toe en bak 10 minuten tot hij zacht en licht gekarameliseerd is.","Roer de orzo erdoor en schenk de bouillon erbij. Kook 10 minuten zachtjes en roer regelmatig.","Voeg citroenrasp, slagroom en parmezaan toe en roer tot een romige saus.","Schep de gehaktballetjes erdoor en maak af met extra citroenrasp en salie."],"photo":"photos/culy-428.webp"},{"id":429,"name":"Risotto met aardpeer en krokante serranoham","type":"Vlees","time":40,"emoji":"🍚","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/risotto-aardpeer-krokante-ham/","ingredients":[["risottorijst","100","g"],["aardpeer","125","g"],["serranoham","1","plak"],["sjalot","0.25","stuk"],["knoflook","0.25","teen"],["parmezaan","20","g"],["witte wijn","1","el"],["roomboter","12","g"]],"steps":["Verwarm de groentebouillon en houd die warm op het vuur.","Fruit de sjalot en knoflook glazig in olijfolie en bak de schijfjes aardpeer een paar minuten mee tot ze zacht zijn.","Voeg de risottorijst toe en bak kort tot de korrels glazig zijn. Blus af met de witte wijn en laat verdampen.","Schep steeds een soeplepel bouillon erbij en laat die opnemen terwijl je roert, tot de rijst in 20 tot 30 minuten gaar en romig is.","Roer de boter en parmezaan erdoor en verkruimel wat van de ham mee. Laat even rusten onder een deksel.","Bak de rest van de ham krokant in een droge pan en leg die op de risotto bij het serveren."],"photo":"photos/culy-429.webp","season":"herfst"},{"id":430,"name":"Gnocchi met worst, spinazie en krokante rozemarijn","type":"Vlees","time":25,"emoji":"🥔","cuisine":"Italiaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/gnocchi-worstvlees-spinazie/","ingredients":[["gnocchi","95","g"],["verse worst","60","g"],["spinazie","50","g"],["pecorino","25","g"],["hazelnoten","10","g"],["rozemarijn","1","takje"],["witte wijn","2","el"],["rode peper","0.25","stuk"]],"steps":["Pers de worst uit het vel in een hete pan met olijfolie en bak het vlees rul en goudbruin. Schep uit de pan.","Bak de rozemarijn een paar minuten krokant in dezelfde pan en leg apart.","Kook de gnocchi 1 minuut in kokend water en giet af; zouten hoeft niet door de zoute worst en pecorino.","Bak de fijne rode peper kort in de pan, blus af met de witte wijn en een scheut pastawater en laat iets indikken.","Voeg de gnocchi toe en laat de spinazie er beetje bij beetje in slinken. Schep het worstvlees en wat boter erdoor.","Roer de pecorino erdoor tot een romige saus en garneer met hazelnoten en de krokante rozemarijn."],"photo":"photos/culy-430.webp"},{"id":431,"name":"Gebakken schol met spinazie, krieltjes en tartaarsaus","type":"Vis","time":35,"emoji":"🐟","cuisine":"Nederlands","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/gebakken-schol/","ingredients":[["scholfilet","1","stuk"],["krieltjes","125","g"],["spinazie","200","g"],["sjalot","1","stuk"],["roomboter","20","g"],["kappertjes","0.5","el"],["cornichons","0.5","el"],["witte wijn","25","ml"]],"steps":["Fruit de fijngehakte sjalot in de helft van de boter zacht, voeg de witte wijn en wat bouillon toe en kook tot de helft in.","Roer de kappertjes, fijngehakte cornichons en de rest van de boter erdoor voor de tartaarsaus en houd warm.","Stoom of kook de krieltjes in 12 tot 15 minuten gaar.","Laat de spinazie in een ruime pan met wat boter slinken en houd warm.","Haal de schol door wat met peper en zout gekruide bloem en bak hem in boter aan beide kanten in ongeveer 5 minuten goudbruin en gaar.","Roer peterselie door de warme tartaarsaus en serveer bij de schol, spinazie en krieltjes."],"photo":"photos/culy-431.webp"},{"id":432,"name":"Indonesische mosselen met kokosmelk, sambal en limoen","type":"Vis","time":30,"emoji":"🦪","cuisine":"Indonesisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/indonesische-mosselen-met-kokosmelk-sambal-en-limoen/","ingredients":[["mosselen","500","g"],["sjalot","1","stuk"],["knoflook","1","teen"],["kokosmelk","100","ml"],["sambal","0.25","el"],["gember","5","g"],["limoen","0.25","stuk"],["kurkuma","0.5","tl"]],"steps":["Spoel de mosselen en gooi exemplaren weg die na een tik open blijven.","Maal de sjalot, knoflook, gember, een stukje citroengras en de kurkuma tot een boemboe.","Bak de boemboe 4 tot 5 minuten in wat olie op middelhoog vuur tot hij geurt.","Schenk de kokosmelk erbij met de sambal en een paar limoenblaadjes en breng aan de kook. Laat een paar minuten doorkoken.","Voeg de mosselen toe, doe het deksel op de pan en kook ze in 5 tot 7 minuten open op hoog vuur. Schud de pan tussendoor.","Knijp de limoen erboven uit, bestrooi met koriander en serveer met brood of rijst."],"photo":"photos/culy-432.webp"},{"id":433,"name":"Seafood boil van de bakplaat met garnalen en mais","type":"Vis","time":75,"emoji":"🦐","cuisine":"Amerikaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/seafood-boil-van-de-bakplaat/","ingredients":[["garnalen","120","g"],["aardappel","120","g"],["maiskolf","0.5","stuk"],["cajunkruiden","0.5","el"],["knoflook","0.5","teen"],["andouilleworst","40","g"],["peterselie","0.25","bosje"],["citroen","0.5","stuk"]],"steps":["Verwarm de oven voor op 220 graden.","Hussel de aardappelen, stukken maiskolf, partjes citroen, knoflook en cajunkruiden met gesmolten boter op een bakplaat.","Doe er een scheut water bij, dek af met folie en stoom 45 minuten in de oven.","Haal de folie eraf, voeg de stukken andouilleworst toe en bak nog 30 minuten.","Pel intussen de garnalen en voeg ze de laatste 10 minuten toe; zet eventueel de grill aan.","Bestrooi met peterselie en serveer met extra partjes citroen."],"photo":"photos/culy-433.webp"},{"id":434,"name":"Po'boy met krokante garnalen en remouladesaus","type":"Vis","time":30,"emoji":"🥪","cuisine":"Amerikaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/poboy-met-krokante-garnalen-en-remouladesaus/","ingredients":[["gepaneerde garnalen","125","g"],["broodje","1","stuk"],["ijsbergsla","1","blad"],["tomaat","0.5","stuk"],["augurk","1","stuk"],["mayonaise","1.5","el"],["mosterd","0.25","el"],["hot sauce","0.25","tl"]],"steps":["Bak de gepaneerde garnalen in de airfryer of oven goudbruin en krokant en houd ze warm.","Meng de mayonaise met de mosterd, een snuf paprikapoeder, wat fijngehakte augurk en augurkenvocht en de hot sauce tot een remouladesaus.","Snijd de ijsbergsla in fijne reepjes en de tomaat in plakjes.","Snijd het broodje open en rooster het kort zodat het warm maar zacht blijft.","Besmeer de binnenkant royaal met de remouladesaus en vul met sla, tomaat, augurk en de krokante garnalen.","Knijp er wat citroen over en serveer meteen."],"photo":"photos/culy-434.webp"},{"id":435,"name":"Crispy rice met spicy zalm en avocado","type":"Vis","time":40,"emoji":"🍣","cuisine":"Japans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/crispy-rice-met-zalm-krokante-rijst/","ingredients":[["sushirijst","85","g"],["zalmfilet","50","g"],["avocado","0.3","stuk"],["jalapeno","0.25","stuk"],["japanse mayonaise","0.5","el"],["sriracha","0.5","tl"],["sojasaus","0.5","tl"],["bosui","0.3","stuk"]],"steps":["Kook de sushirijst en meng met rijstazijn, suiker en sesamolie.","Druk de rijst stevig aan in een rechthoekige vorm en laat minstens een uur opstijven in de koelkast.","Meng de zalmblokjes met de japanse mayonaise, bosui, sojasaus en sriracha en zet koud.","Snijd de rijst in blokjes en frituur ze op 190 graden in ongeveer 5 minuten goudbruin en krokant.","Leg op elk blokje een plakje avocado en een flinke lepel spicy zalm.","Maak af met een plakje jalapeno en geroosterd sesamzaad en serveer met sojasaus om te dippen."],"photo":"photos/culy-435.webp"},{"id":436,"name":"Gegrilde Oosterscheldekreeft met chipotlesaus en mais","type":"Vis","time":25,"emoji":"🦞","cuisine":"Mexicaans","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/oosterscheldekreeft-mexicaans/","ingredients":[["kreeft","0.5","stuk"],["maiskolf","1","stuk"],["knoflook","2","teen"],["kippenbouillon","40","ml"],["chipotlepeper","0.5","stuk"],["limoen","0.25","stuk"],["koriander","0.25","bosje"],["mayonaise","1","el"]],"steps":["Verwarm de grill van de oven voor en laat de halve kreeft op kamertemperatuur komen.","Bak de knoflook 2 minuten zacht in olijfolie op middelhoog vuur.","Pureer de knoflook met de kippenbouillon, de chipotlepeper en wat zout en peper tot een gladde saus en houd warm.","Wrijf de maiskolf in met olie en bak hem in een grillpan rondom tot hij licht geblakerd is.","Bestrijk het kreeftenvlees met een deel van de saus en gril het ongeveer 3 minuten tot het gaar is.","Serveer de kreeft met de mais, koriander, partjes limoen, de mayonaise en de rest van de saus."],"photo":"photos/culy-436.webp"},{"id":437,"name":"Deense smorrebrod met haring en curry-eiersalade","type":"Vis","time":20,"emoji":"🐟","cuisine":"Scandinavisch","source":"Culy","sourceUrl":"https://www.culy.nl/recepten/smorrebrod-met-haring/","ingredients":[["roggebrood","1","snee"],["haringfilet","0.75","stuk"],["ei","1","stuk
